# ⚠ 本文件是线上 /www/server/panel/vhost/nginx/tryon_limit.conf 的「实况镜像」，由 scripts/cloud_sync_nginx.py 回拉生成。
# 不要把它当模板推回服务器：服务器上那份还包含本仓从未写过的 location（如 /museum/api/），
# 部署脚本 cloud_deploy_tryon.py 的 nginx 阶段用的是「备份 + 锚点插入」，从不整体覆盖。
# 改完线上记得重跑本脚本，否则这份参照就会继续漂移。
# 虚拟试穿限流区：本目录被 include 进 nginx 的 http{}，所以 limit_req_zone 能写在这
# （它不能出现在 server{} 里）。删掉本文件后 nginx -t 会因 zone 未定义而失败。
limit_req_zone $binary_remote_addr zone=tryon:10m rate=20r/m;
