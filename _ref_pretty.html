Zk2eyEC", "caption": "故宫博物院藏·清乾隆蓝色地福寿三多龟背纹锦"}, {"url": "https://aka.doubaocdn.com/s/w2GOqkTblX", "caption": "故宫博物院藏·清同治红色地龟背如意纹织金锦"}, {"url": "https://aka.doubaocdn.com/s/EvdKY2wEYZ", "caption": "新疆博物馆藏·唐龟背王字锦（阿斯塔那墓出土）"}, {"url": "https://aka.doubaocdn.com/s/wT1t2bnDOz", "caption": "中国丝绸博物馆藏·元代龟背地团花锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["唐龟背王字锦（新疆维吾尔自治区博物馆藏，阿斯塔那墓出土）", "元代青地织金吉祥龟背纹锦（中国丝绸博物馆藏）", "清乾隆蓝地福寿三多龟背纹锦（故宫博物院藏）"], "朝代脉络": [{"period": "宋代", "desc": "龟背纹已进入格子门格眼和织锦地纹体系，常与万字纹、方胜纹、球纹等组合，构成理性而繁复的几何骨架。"}, {"period": "元代", "desc": "织金织物中龟背纹地位较高，故宫藏元代红地龟背纹龙凤披肩即以片金线织出龟背地纹，再配龙凤主纹。"}, {"period": "明代", "desc": "龟背纹继续用于织锦、家具和建筑装饰，常作为锦地或格心骨架，内部再填花卉、瑞兽等小纹样。"}, {"period": "清代", "desc": "应用更细密华丽，织金锦中可见金地龟背团龙纹等组合；家具、文房器物上也常以深浅木料拼出龟背锦地。"}], "寓意分条": ["龟背纹已进入格子门格眼和织锦地纹体系，常与万字纹、方胜纹、球纹等组合，构成理性而繁复的几何骨架。", "织金织物中龟背纹地位较高，故宫藏元代红地龟背纹龙凤披肩即以片金线织出龟背地纹，再配龙凤主纹。", "龟背纹继续用于织锦、家具和建筑装饰，常作为锦地或格心骨架，内部再填花卉、瑞兽等小纹样。", "应用更细密华丽，织金锦中可见金地龟背团龙纹等组合；家具、文房器物上也常以深浅木料拼出龟背锦地。", "六边形连续排列，无内填主纹。", "六边形格内填折枝花、宝相花、团花等。", "六边形格内填卍字，寓意万寿无疆。", "龟背纹作满地纹的织锦组织。", "龟为四灵之一，象征长寿、祥瑞。", "六边形结构稳定，寓意基业稳固、家宅安定。", "连续延展的网格结构象征福运连绵、子孙相继。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩；织物中红、金、蓝、绿多色。", "常用布料": "妆花缎、织金缎、缂丝、锦；也用于木雕、砖雕、瓷器、建筑窗棂。", "适用衣物": "袍料、裙料、披肩、帐幔、椅披。", "应用部位": "满地纹、窗棂格心、家具雕花、建筑彩画边饰。", "使用场景": "宫廷陈设、寿庆、婚嫁、日常服饰、建筑装饰。"}, "常见搭配": ["折枝花纹", "宝相花纹", "卍字纹", "盘长纹", "云纹", "缠枝纹。"]}, {"编号": 105, "类别": "动物瑞兽", "类别内序号": 38, "纹样名称": "兔纹", "盛行朝代": "明—清", "文化寓意": "兔纹属于吉庆祥瑞类纹样，以兔为表现对象。兔在中国传统文化中兼具长寿、祥瑞与月亮象征三重意涵。葛洪《抱朴子》称“虎及鹿、兔皆寿千岁，满五百岁者，其毛色白”，白兔自古被视为祥瑞长寿之兆。玉兔捣药的神话更使兔与月亮、长生紧密关联。服饰中兔纹常以口衔灵芝的形象出现，明代更以玉兔作为中秋节吉庆服饰的代表图案。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/CX2pbTZGVo", "caption": "清光绪绿色缎绣桂花玉兔金皮球花纹八月花神衣"}, {"url": "https://aka.doubaocdn.com/s/gsdxUneyHf", "caption": "明代月兔补子"}, {"url": "https://aka.doubaocdn.com/s/JJkFlAbHIL", "caption": "明代玉兔纹补子"}, {"url": "https://aka.doubaocdn.com/s/xXQuzoiAaA", "caption": "明代玉兔方补"}, {"url": "https://aka.doubaocdn.com/s/OQK5uGnZFo", "caption": "明代玉兔补子"}, {"url": "https://aka.doubaocdn.com/s/rxRK5qFHqA", "caption": "明万历刺绣卍寿玉兔纹方补"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉至南北朝", "desc": "白兔被视为祥瑞，往往进献给帝王。马王堆一号汉墓帛画所绘月纹中已有玉兔与蟾蜍并存。"}, {"period": "唐宋", "desc": "唐代织锦中常出现猎物形象的兔纹。宋代兔纹趋于写实，宋人《三兔图》为代表。"}, {"period": "明代", "desc": "兔纹在服饰上达到高峰。明宣德黄地桂兔纹妆花纱以三列口衔灵芝或桂花的白兔穿行于菊花牡丹间，兔身以白、灰、黑三色丝线表现毛皮质感。定陵出土“兔”“寿”女夹衣，兔纹与寿字组合，寓意长寿。万历时期因皇帝万寿节与中秋重合，形成“玉兔万寿”纹，奔兔口衔灵芝，灵芝上托卍字、团鹤、团寿，共同组成“万万寿”。"}, {"period": "清代", "desc": "兔纹在宫廷与民间吉服中均有使用，常与桂花、菊花组合，寓意“长寿富贵”。"}], "寓意分条": ["长寿安康：白兔为祥瑞长寿之兆，“兔”“寿”组合寓意万寿无疆。", "科举及第：桂兔纹暗含“蟾宫折桂”，祈愿科举高中。", "中秋吉庆：玉兔为中秋节令代表图案，明代宫廷在中秋与万寿节期间穿用。", "祥瑞降临：白兔自古为帝王祥瑞，象征太平盛世。"], "属性": {"常用颜色": "白兔以白、灰、黑三色丝线表现毛皮质感，灵芝以赭黄、金色绣出，桂花以金黄、橙黄点缀，菊花以黄、白、浅粉呈现。底色常用黄色、红色、墨绿。明宣德黄地桂兔纹妆花纱以黄色经、纬线织平纹纱地，以圆金、圆银线及棕、墨绿、桔黄、白、蓝、浅粉等色线织出纹样。", "常用布料": "妆花纱、织金纱、缎、绸。明宣德黄地桂兔纹妆花纱以平纹纱为基础组织结构，纹纬通过挖梭工艺使花纹凸起于地子表面，形成立体效果。奔兔纹织金纱以织金工艺织出兔纹，金线显花。", "适用衣物": "吉服袍、女夹衣、经面。定陵出土“兔”“寿”女夹衣为明代宫廷吉服。", "应用部位": "衣身、经面。兔纹以四排或三排循环排列，兔首朝向一致或回首，间饰灵芝、桂花、菊花、牡丹。", "使用场景": "中秋节令、皇帝万寿圣节、吉庆典礼。"}, "常见搭配": ["桂花纹", "灵芝纹", "菊花纹", "牡丹纹", "寿字纹", "卍字纹"]}, {"编号": 78, "类别": "动物瑞兽", "类别内序号": 11, "纹样名称": "凤穿牡丹纹", "盛行朝代": "", "文化寓意": "凤穿牡丹纹属于组合类吉祥纹样，将凤纹与牡丹纹组合使用。凤为百鸟之王，牡丹为百花之王，二者结合寓意高贵、吉祥、如意。“凤穿牡丹”纹样历史悠久，起源于唐朝，经过历朝历代的发展，于清代达到鼎盛。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "凤穿牡丹纹样起源于唐朝。"}, {"period": "宋代", "desc": "南宋黄昇墓出土“双凤穿牡丹”褶裥裙，展现了南宋女装的精湛技艺及宋代人对美学的极致追求。"}, {"period": "明清", "desc": "明代缂丝凤穿牡丹方补原缀明代内命妇吉服，穿用于庆典朝会。清代凤穿牡丹达到鼎盛，广泛用于服饰。"}], "寓意分条": ["高贵吉祥：凤为百鸟之王，牡丹为百花之王，二者结合寓意高贵、吉祥、如意。", "花开富贵：以表花开富贵，幸福美满。", "四季长春：与四时花卉组合，寓意四季长春。"], "属性": {"常用颜色": "牡丹多用大红、玫粉，叶片青绿。凤纹以五彩丝线绣制，凤身金线勾边。底色常用大红、青缎、香色。", "常用布料": "妆花缎、缂丝、绸、缎。明代缂丝凤穿牡丹方补以“通经断纬”工艺织出，细腻生动。", "适用衣物": "婚嫁吉服、命妇吉服、女袄、霞帔。", "应用部位": "衣身、方补、袖口、大襟、霞帔。", "使用场景": "婚嫁大典、庆典朝会、命妇朝会、吉庆典礼。"}, "常见搭配": ["太湖石", "四季花卉", "蝴蝶纹", "祥云纹"]}, {"编号": 75, "类别": "动物瑞兽", "类别内序号": 8, "纹样名称": "凤纹", "盛行朝代": "商周—清（明清吉祥化）", "文化寓意": "凤纹属于祥禽类纹样，凤为百鸟之王。凤纹喜牡丹、鸾凤和鸣、游龙戏凤，这些耳熟能详的凤纹题材在日常生活中彰显着吉祥寓意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/UeLOu13vsA", "caption": "明·刺绣凤纹床单"}, {"url": "https://aka.doubaocdn.com/s/BwYOQQhgdi", "caption": "明·红地织金凤穿花纹"}, {"url": "https://aka.doubaocdn.com/s/ntFJ4g97Q8", "caption": "明·红绫地绣五彩凤穿花纹经皮"}, {"url": "https://aka.doubaocdn.com/s/AcccdAA6kb", "caption": "明·凤穿牡丹刺绣"}, {"url": "https://aka.doubaocdn.com/s/Uu3ecCalVQ", "caption": "明·缂丝凤穿牡丹团花"}, {"url": "https://aka.doubaocdn.com/s/hoslkUEOI4", "caption": "明晚期·缂丝百鸟朝凤图屏"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "江陵马山一号楚墓出土的大量丝织品服饰文物上都有各种或变形或写实的凤鸟，头上长有巨大花冠的凤鸟站立在花丛之间。"}, {"period": "汉", "desc": "汉代是凤纹样发展兴盛的重要时期，凤纹样造型变化繁多，呈现出和谐大气、灵动飘逸的时代风貌。"}, {"period": "隋唐", "desc": "隋、唐以来，千姿百态的凤纹配上不同花卉，或穿行花间，或衔花降瑞，受到民众青睐。"}, {"period": "宋", "desc": "“对凤”从唐代开始逐渐流行，至宋代经历雌雄分化，逐渐产生了“鸾凤”之称。今藏台北故宫博物院的宋缂丝《鸾凤和鸣图轴》即是代表作。"}, {"period": "元", "desc": "具有异域风格的“鸾凤穿花”在元代被运用得更为广泛。"}, {"period": "明清", "desc": "明清时期，羽翼华丽的凤凰从遥远的天上下降凡间。这一时期织物上常见以缠枝花卉纹样搭配鸾凤、对凤之装饰手法。明人缂丝凤穿牡丹方补原缀明代内命妇吉服。"}], "寓意分条": ["鸾凤和鸣：指夫妻恩爱、家庭和睦、子孙繁盛、家业兴旺。", "凤凰朝阳：既有光明美好的吉祥寓意，也昭示着夫妇相爱、家庭和睦。", "高贵吉祥：凤为百鸟之王，象征高贵与吉祥。"], "属性": {"常用颜色": "凤纹以五彩丝线绣制，羽翼华丽。凤身以金线勾边，凤羽以红、蓝、绿、紫、黄等色退晕。底色常用暗绿、香色、大红。", "常用布料": "妆花缎、缂丝、绸、缎。命妇吉服方补多用缂丝，以“通经断纬”工艺织出凤纹。", "适用衣物": "命妇吉服、女夹袍、婚嫁吉服、霞帔、后妃龙袍。", "应用部位": "衣身、方补、霞帔。", "使用场景": "庆典朝会、婚嫁大典、命妇朝会、后妃吉服。"}, "常见搭配": ["牡丹纹", "莲花纹", "祥云纹", "花卉纹"]}, {"编号": 76, "类别": "动物瑞兽", "类别内序号": 9, "纹样名称": "凰纹", "盛行朝代": "", "文化寓意": "凰纹属于祥禽类纹样，与凤纹同属凤凰体系。在传统文化中，凤为雄、凰为雌，凰纹多与凤纹组合使用，形成“凤凰”整体意象。颜色是赤色的多为“凤”，颜色为青色的多为“鸾”，象征夫妻恩爱、家庭和睦、家业兴旺。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦至汉", "desc": "凤凰作为整体意象已见于楚墓绣品。"}, {"period": "唐宋", "desc": "凤纹经历雌雄分化，逐渐产生了“鸾凤”之称。"}, {"period": "明清", "desc": "凰纹多与凤纹组合出现于婚嫁服饰，象征夫妻和谐。"}], "寓意分条": ["夫妻恩爱：凰为雌性，与凤组合象征夫妻恩爱。", "家庭和睦：寓意家庭和睦、家业兴旺。"], "属性": {"常用颜色": "凰纹与凤纹相近，以五彩丝线绣制。凰身以金线勾边，凰羽以红、蓝、绿、紫、黄等色退晕。", "常用布料": "妆花缎、绸、缎。", "适用衣物": "婚嫁吉服、女袍、霞帔。", "应用部位": "衣身、方补、霞帔。", "使用场景": "婚嫁大典、吉庆典礼、命妇朝会。"}, "常见搭配": ["凤纹", "牡丹纹", "祥云纹"]}, {"编号": 72, "类别": "动物瑞兽", "类别内序号": 5, "纹样名称": "升龙纹", "盛行朝代": "", "文化寓意": "升龙纹属于龙纹姿态的一种，龙头在上，尾在下，头为侧面，朝向宝珠，四肢两上两下，其中一只爪抓住或者抓向宝珠。升龙纹呈上升动势，意为“承天意”。周代天子用升龙，公爵用降龙，以体现等级的差别。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "周代", "desc": "天子用升龙，公爵用降龙，以体现等级差别。"}, {"period": "明清", "desc": "升龙纹广泛应用于龙袍、绵甲等服饰。清代绵甲全身各部位用五彩丝线绣升龙、降龙和正面团龙，间饰祥云、海水、如意、寿石等纹样。"}], "寓意分条": ["承天意：升龙呈上升动势，意为“承天意”。", "飞龙在天：象征帝王如飞龙在天，居高临下。"], "属性": {"常用颜色": "升龙纹以金线织出龙身，底色用明黄、石青。升龙周围以五彩祥云环绕，宝珠以红色或金色绣出，火焰纹以红、黄二色呈现。", "常用布料": "妆花缎、织金锦、缂丝。龙袍升龙以妆花缎织出，金线勾边，彩绒填色。绵甲升龙以缎地彩绣，质地厚实，适合军事礼仪。", "适用衣物": "龙袍、绵甲、朝袍、吉服袍。", "应用部位": "与降龙纹配合使用，分布于衣身各部位。", "使用场景": "宫廷朝会、军事礼仪、祭祀典礼。"}, "常见搭配": ["降龙纹", "云纹", "海水江崖纹", "如意纹"]}, {"编号": 88, "类别": "动物瑞兽", "类别内序号": 21, "纹样名称": "喜鹊登梅纹", "盛行朝代": "", "文化寓意": "喜鹊登梅纹是以喜鹊立于梅花枝头为核心构图的装饰纹样，又称“喜上眉梢”。喜鹊在民间被视为报喜之鸟，梅花谐音“眉”，二者组合寓意喜上眉梢、喜事临门。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "喜鹊与梅花组合的图案在绘画和器物装饰中已有出现。"}, {"period": "明清", "desc": "喜鹊登梅纹在服饰中广泛流行。米白地彩绣喜上梅梢纹菱形肚兜为典型实例。"}, {"period": "近现代", "desc": "喜鹊登梅纹在传统服饰中延续使用，成为婚嫁吉庆场合的经典纹样。"}], "体系组成": "喜鹊登梅单独纹：喜鹊立于梅梢。喜鹊登梅配盘长纹：喜鹊、梅梢与盘长纹组合。喜鹊登梅配花卉纹：喜鹊、梅梢与花卉组合。", "寓意分条": ["喜上眉梢：喜鹊立于梅梢，梅与眉谐音。", "团圆相聚：古人将鹊叫和客至联系起来。", "双喜临门：两只喜鹊即双喜之意。"], "属性": {"常用颜色": "以白、蓝、红等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "肚兜、女褂、袍服、童褂、袖口。", "应用部位": "围腹口袋、衣身通身纹饰、袖口。", "使用场合": "日常穿着、婚嫁吉庆。"}, "常见搭配": ["盘长纹", "花卉纹", "蝴蝶纹", "凤凰纹"], "相似纹样说明": "喜鹊登梅纹以喜鹊立于梅梢为核心；三阳开泰纹以三只羊为核心。"}, {"编号": 87, "类别": "动物瑞兽", "类别内序号": 20, "纹样名称": "喜鹊纹", "盛行朝代": "明—清", "文化寓意": "喜鹊纹属于吉庆祥瑞类纹样，喜鹊是一种吉祥鸟。两只喜鹊即双喜之意。“梅”与“眉”同音，借喜鹊登上梅花枝头，寓意“喜上眉梢”“双喜临门”“喜报春先”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/cT0GSUsFm1", "caption": "清·纳纱绣练雀纹补"}, {"url": "https://aka.doubaocdn.com/s/mJuJSSlX2T", "caption": "清·牡丹喜鹊纹丝绸上衣"}, {"url": "https://aka.doubaocdn.com/s/CNpT8J5L0t", "caption": "清·红色缎绣鹊梅竹纹花神衣"}, {"url": "https://aka.doubaocdn.com/s/ckUWbP1sr2", "caption": "清·蓝底金丝彩绣喜鹊登梅图"}, {"url": "https://aka.doubaocdn.com/s/4SMrexo58A", "caption": "清·拉锁绣喜鹊登梅图"}, {"url": "https://aka.doubaocdn.com/s/RcF1OqwrW1", "caption": "清·刺绣鹊上枝头"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清至民国", "desc": "喜鹊纹广泛应用于民间刺绣。米白地彩绣喜上梅梢纹菱形肚兜，围颈部分绣有蝶纹，肚兜两侧绣喜鹊立于梅梢上。"}], "寓意分条": ["喜上眉梢：喜鹊登梅寓意喜上眉梢。", "双喜临门：两只喜鹊即双喜之意。", "喜报春先：预示春天的临近或喜讯的到来。"], "属性": {"常用颜色": "喜鹊以黑白为主，喜鹊头、背、翅以黑色丝线绣出，腹部以白色丝线绣出，翅上蓝白斑纹以浅蓝、白色丝线点缀。梅花以红、粉为主，枝干以赭褐丝线绣出。底色常用米白、红缎。", "常用布料": "绸、缎、棉布。肚兜以米白布为地，以辫绣工艺绣制喜鹊登梅纹。", "适用衣物": "肚兜、童褂、婚嫁吉服、女袄、荷包。", "应用部位": "肚兜、衣身、大襟、袖口、荷包正面。", "使用场景": "婚嫁、春节、日常吉庆。"}, "常见搭配": ["梅花纹", "蝴蝶纹", "牡丹纹", "盘长纹", "钱币纹"]}, {"编号": 70, "类别": "动物瑞兽", "类别内序号": 3, "纹样名称": "团龙纹", "盛行朝代": "", "文化寓意": "团龙纹属于龙纹的一种构图形式，将龙的形体处理为圆形或团状。团龙纹起源于唐代，其特点是将龙的形态处理为圆形构图，表现形式多样，有“坐龙团”“升龙团”“降龙团”等，圆内常辅以水波、如意等纹饰。团龙纹形式感强，轮廓周正饱满，龙形完整，因此适用性强，运用广泛。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "团龙纹起源于唐代，新疆吐鲁番阿斯塔那地区出土的联珠对龙纹绮，龙纹被巧妙安排在圆形团花中，构图丰满华丽，展现了波斯织锦风格与中国传统龙纹的结合。"}, {"period": "宋元", "desc": "团龙纹的应用得到发展，除唐代流行的四团龙外，还盛行起通身遍体的大龙，称为“缠身龙”。"}, {"period": "明代", "desc": "团龙纹多出现在龙袍上，明代龙纹有猪嘴龙特征。"}, {"period": "清代", "desc": "团龙纹达到鼎盛，清代将团龙纹正式纳入冠服制度。“四团龙”“八团龙”最为尊贵，其中四团龙袍极为罕见，清顺治香黄缎暗云龙织金团龙龙袍是目前发现的孤例。清初八团龙纹样男女皆可用，清中期后成为后妃龙袍的专属款式。"}], "寓意分条": ["权势尊荣：团龙纹是权势、高贵、尊荣的象征。", "攘除灾难：团龙纹有攘除灾难、带来吉祥的寓意。", "圆满和谐：圆形构图象征圆满与和谐。"], "属性": {"常用颜色": "团龙纹底色常用石青、香色、明黄。龙纹以金线织出，团龙内以五彩云纹环绕。清代八团龙袍石青地，金龙彩云，下摆海水江崖，色彩层次丰富。", "常用布料": "妆花缎、织金锦、缂丝。妆花缎团龙纹以通经断纬工艺织出，金线勾边，彩色绒线填色，是清代后妃吉服袍的主要面料。", "适用衣物": "龙袍、吉服袍、吉服褂、衮服、后妃龙袍。皇帝衮服绣五爪正面金龙四团，前胸、后背及两肩各一团。后妃龙袍绣八团金龙。", "应用部位": "前胸、后背、两肩及前后下摆，以团花形式均匀分布。", "使用场景": "宫廷朝会、吉庆典礼、后妃吉服、皇帝衮服祭祀。"}, "常见搭配": ["云纹", "蝙蝠纹", "十二章纹", "八吉祥纹", "海水江崖纹"]}, {"编号": 112, "类别": "动物瑞兽", "类别内序号": 45, "纹样名称": "天马纹", "盛行朝代": "", "文化寓意": "天马纹属于吉庆祥瑞类纹样，图案为生有双翼的飞马。该纹样流行于元明清时期，其形象可能受到古希腊神话珀伽索斯等外来文化影响，经丝绸之路东传后与中国本土的天马传说融合。清代天马纹被纳入武职官服纹样体系。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "天马纹最早出现于汉朝，汉武帝将西域进献的良马誉为“天马”，使其成为力量、神性与皇家威仪的象征。"}, {"period": "南北朝至隋唐", "desc": "唐代翼马纹成为代表性纹样，红地翼马纹锦融合希腊、波斯、粟特文化元素。"}, {"period": "宋元", "desc": "宋代《营造法式》记载天马纹与海马纹的区分。元代帝王仪仗旗帜上的白马纹为天马纹前身。"}, {"period": "清代", "desc": "天马纹纳入武职官服纹样体系，为五品武官补子。"}], "寓意分条": ["交流互鉴：天马纹是丝绸之路中外文明交流互鉴的视觉符号。", "力量与威仪：天马象征力量、神性与皇家威仪。", "天马行空：寓意超凡脱俗、奋进向上。", "龙马精神：象征奋发向上的精神面貌。"], "属性": {"常用颜色": "天马纹以红、米白为主色，补子以石青缎为地，天马以金线绣制。", "常用布料": "织锦、妆花缎、暗花绸、缎。", "适用衣物": "袍服、锦袍、补服。", "应用部位": "衣身、前胸、后背。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["联珠纹", "云纹", "海水江崖纹"]}, {"编号": 91, "类别": "动物瑞兽", "类别内序号": 24, "纹样名称": "孔雀纹", "盛行朝代": "明—清", "文化寓意": "孔雀纹属于文官补子禽纹，孔雀为文官三品补子。孔雀不仅羽毛美丽，而且有品性。在古人看来，孔雀是一种大德大贤、具有文明品质的“文禽”，象征着吉祥、富贵。三品补服缀孔雀，寓意三品文官能像孔雀一样，知道自爱，对朝廷忠诚。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/yOSq3CvTvf", "caption": "清康熙文官三品孔雀纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/lV1pqOoNIW", "caption": "清纳纱绣文官三品孔雀补子"}, {"url": "https://aka.doubaocdn.com/s/LsLTVq0hal", "caption": "明末清初织锦三品文官孔雀纹补子"}, {"url": "https://aka.doubaocdn.com/s/LegociV8PU", "caption": "清黑地彩绣孔雀三品补子"}, {"url": "https://aka.doubaocdn.com/s/QU21sPJ7Pz", "caption": "清黑地钉线绣孔雀三品补子"}, {"url": "https://aka.doubaocdn.com/s/bDYItWVHqV", "caption": "南京云锦清朝官服补子三品孔雀"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "明代孔雀图案代表的是文官正三品，泰州明代徐蕃墓出土三品文官孔雀补服。清代文官三品补服绣孔雀。"}], "寓意分条": ["大德大贤：孔雀为大德大贤、具有文明品质的“文禽”。", "自爱忠诚：三品补服缀孔雀，寓意三品文官能像孔雀一样，知道自爱，对朝廷忠诚。", "吉祥富贵：孔雀象征吉祥、富贵。"], "属性": {"常用颜色": "补子底色为石青，孔雀以五彩丝线绣制。孔雀头、颈以翠蓝、深蓝丝线绣出，尾羽以金线勾勒，翎眼以蓝、绿、紫、金等色丝线退晕，五彩斑斓。", "常用布料": "暗花绸、绫、缎。明代孔雀补子以平纹绢作底，运用多种针法刺绣出两只上下对飞的孔雀。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀方形补子。补子中间孔雀，立于海中岩石，望日而舞。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["祥云纹", "海水江崖纹", "八吉祥纹"]}, {"编号": 98, "类别": "动物瑞兽", "类别内序号": 31, "纹样名称": "年年有余纹", "盛行朝代": "", "文化寓意": "年年有余纹是以鱼和莲花组合为核心构图的装饰纹样。因“鱼”与“余”同音，象征“富贵有余”的幸福愿望。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "鱼纹样的应用更为普遍，用“如鱼得水”形容夫妻爱情和美。"}, {"period": "明清", "desc": "年年有余纹在服饰中广泛使用。"}], "体系组成": "年年有余单独纹：鱼与莲花组合。年年有余配童子纹：童子抱鱼。年年有余配水波纹：鱼、莲花与水波纹组合。", "寓意分条": ["年年有余：寓意年年有余、富贵吉祥。", "富贵有余：因“鱼”与“余”同音。", "爱情和美：用“如鱼得水”形容夫妻爱情和美。"], "属性": {"常用颜色": "以红、蓝、绿等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、肚兜、荷包。", "应用部位": "衣身通身纹饰、肚兜围腹部分。", "使用场合": "日常穿着、吉庆典礼。"}, "常见搭配": ["莲花纹", "童子纹", "水波纹"], "相似纹样说明": "鱼与莲花为年年有余纹，鱼与磬为吉庆有余纹。"}, {"编号": 127, "类别": "动物瑞兽", "类别内序号": 60, "纹样名称": "彪纹", "盛行朝代": "明—清", "文化寓意": "彪纹属于武官补子兽纹，彪为小虎。武官六品、七品补子用彪。此组方补以石青色缎为面，其上以平金针法绣如意云与花卉纹为地，正中金彪一只，望日而哮，意态威武。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/Y0apyb0PUC", "caption": "清代六品武官彪纹补子"}, {"url": "https://aka.doubaocdn.com/s/r0nw92Ecyn", "caption": "清代武官六品彪纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/id3VI3tvFY", "caption": "明代四品武官补子豹纹"}, {"url": "https://aka.doubaocdn.com/s/OalVoVxjMe", "caption": "十七世纪彩绣三品武官虎纹补子"}, {"url": "https://aka.doubaocdn.com/s/8XfSkrWAUU", "caption": "明代四品武官补豹"}, {"url": "https://aka.doubaocdn.com/s/jZODVSSEVQ", "caption": "清代武官三品刺绣补子豹纹"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "明代武官六品、七品补子用彪。"}, {"period": "清代", "desc": "清代武官六品补服绣彪，七品由明代的彪改为与八品相同的犀牛。六品武官补服缀彪纹，寓意六品官员能够像彪一样忠心。"}], "寓意分条": ["威猛勇武：彪为小虎，象征威猛勇武。", "官阶标志：武官六品补子，象征官员的品级。", "忠心：彪昂首向日，追逐代表帝王的太阳，寓意“忠心”。"], "属性": {"常用颜色": "补子以石青色缎为面，彪以金线绣制。金彪以平金针法绣出，望日而哮，金光璀璨。", "常用布料": "暗花绸、缎。清代武官六品补子以石青缎为面，以平金针法绣制，平金绣为苏绣技法之一。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。补子正中为彪，望日而哮，上部为如意云与花卉纹，下部为海水江崖纹。", "使用场景": "官员常朝。"}, "常见搭配": ["祥云纹", "如意云纹", "海水江崖纹"]}, {"编号": 113, "类别": "动物瑞兽", "类别内序号": 46, "纹样名称": "海马纹", "盛行朝代": "明—清", "文化寓意": "海马纹属于武官补子兽纹，清代武官九品补服绣海马纹。海马身体像虾，全身包在硬壳中。海马纹饰寓意吉祥，在元明清瓷器制造中非常常见。九品武官的官服就是海马补服，在前胸后背会贴上一块标记海马的织物，以明确等级。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/ru2UITidlA", "caption": "中国传统云锦织造的九品武官补子"}, {"url": "https://aka.doubaocdn.com/s/NlBFK3yCAJ", "caption": "清海马纹补子"}, {"url": "https://aka.doubaocdn.com/s/VeOj7aM2KU", "caption": "清代刺绣补子海水纹衣服"}, {"url": "https://aka.doubaocdn.com/s/PpdWjHx29w", "caption": "清代宫廷文武官用海水祥云纹打籽花奔补子"}, {"url": "https://aka.doubaocdn.com/s/h76xfBQFdU", "caption": "明代刺绣九品海马方补"}, {"url": "https://aka.doubaocdn.com/s/c9cPBvUdec", "caption": "海马清代补子海水江崖特色礼品手工绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "海马纹在元青花瓷上常见，常与江崖海水纹组合，寓意“江山永固、风调雨顺”。"}, {"period": "明代", "desc": "明代武官九品补子用海马。"}, {"period": "清代", "desc": "清代武官九品补服绣海马纹，补子边缘绣回纹，其他纹饰有祥云、蝙蝠、八吉祥、如意、福山、寿海、红日、灵芝等。"}], "寓意分条": ["官阶标志：武官九品补子，象征官员的品级。", "吉祥如意：八吉祥、如意纹寓意吉祥如意。", "福寿双全：蝙蝠、寿海寓意福寿双全。", "忠勇吉祥：海马忠勇吉祥，护卫主人平安。"], "属性": {"常用颜色": "补子以黑缎为底布，海马以金线绣制。", "常用布料": "暗花绸、缎。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["祥云纹", "蝙蝠纹", "八吉祥纹", "如意纹"]}, {"编号": 126, "类别": "动物瑞兽", "类别内序号": 59, "纹样名称": "熊罴纹", "盛行朝代": "明—清", "文化寓意": "熊罴纹属于武官补子兽纹，熊罴为武官五品补子。罴是棕熊。武职补子上绣兽，五品绣熊罴。此补主纹为一头熊昂首向日，造型优美。周围饰以云纹、蝙蝠纹、佛教八宝纹等。下方的海水江崖纹中立水纹已经演变为斜直线。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/zeSpKUSdw3", "caption": "清晚期青色缎绣五品熊纹补子"}, {"url": "https://aka.doubaocdn.com/s/1lU9k2Za8n", "caption": "清武五品官熊纹补子"}, {"url": "https://aka.doubaocdn.com/s/GkUVDQgpS1", "caption": "清道光武官五品熊纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/82jRQ9cNxN", "caption": "清五品武官夫人熊纹补子"}, {"url": "https://aka.doubaocdn.com/s/Iz58aMST8Q", "caption": "清代石青地平金绣佛八宝熊纹武五品补子"}, {"url": "https://aka.doubaocdn.com/s/6GJqG2BCHp", "caption": "清代武官五品熊纹刺绣补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "明代武官五品补子用熊罴。"}, {"period": "清代", "desc": "清代武官五品补服绣熊罴，采用蓝色或白色为主色调。"}], "寓意分条": ["威猛有力：熊罴象征威猛有力。", "官阶标志：武官五品补子，象征官员的品级。"], "属性": {"常用颜色": "补子以石青为地，熊罴以金线、彩绒绣制，采用蓝色或白色为主色调。熊身以赭褐、灰色丝线绣出。", "常用布料": "暗花绸、缎。清代武官五品补子以石青缎为地，补子四边绣回纹边饰。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。补子正中为熊罴，昂首向日，周围饰以云纹、蝙蝠纹、佛教八宝纹等。", "使用场景": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹", "蝙蝠纹", "八吉祥纹"]}, {"编号": 107, "类别": "动物瑞兽", "类别内序号": 40, "纹样名称": "牛纹", "盛行朝代": "", "文化寓意": "牛纹属于传统纹样，在汉族服饰中主要以“斗牛纹”形式出现于明代赐服体系，在少数民族服饰中则以牛角纹、牛眼纹等形式广泛应用于彝族、苗族等民族的传统服饰。斗牛纹为蟒首牛角，双角下弯如牛状，是明代赐服“斗牛服”的核心纹样。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "斗牛服为皇帝特赐的官服，正德十三年被定为一品官服。斗牛纹样为蟒首牛角，与蟒服、飞鱼服同为赐服体系。孔府旧藏明代红色湖绸斗牛袍为现存重要实物。"}, {"period": "明清至近现代", "desc": "牛纹在少数民族服饰中延续使用。彝族服饰中常见牛角纹、牛眼纹、牛牙纹等，多以二方连续或四方连续形式装饰于领襟、环肩、袖口等部位。"}], "寓意分条": ["吉祥如意：斗牛作为似龙非龙的瑞兽，代表吉祥如意、福寿富贵。", "尊贵恩宠：斗牛服为皇帝赐服，代表极高的荣宠与身份。", "图腾崇拜：牛在苗族、彝族文化中为开天辟地的神兽，牛纹承载祖先崇拜与族群认同。", "力量财富：牛象征力量与财富，彝族牛角纹为全方位祝福。"], "属性": {"常用颜色": "明代斗牛服以红色湖绸为地，斗牛纹以金线盘绣。彝族牛纹以红、黄、黑等对比强烈的色彩为主。", "常用布料": "湖绸、妆花缎、棉布、毛织品。", "适用衣物": "赐服、斗牛袍、彝族传统服饰、苗族盛装。", "应用部位": "斗牛袍前胸、后背及两肩；彝族牛角纹用于领襟、环肩、袖、裤脚、裙边。", "使用场景": "官员常朝、赐服典礼、彝族火把节、苗族节日盛装。"}, "常见搭配": ["彩凤纹", "蟒纹", "飞鱼纹", "云纹", "火纹", "羊角纹"]}, {"编号": 111, "类别": "动物瑞兽", "类别内序号": 44, "纹样名称": "犀纹", "盛行朝代": "", "文化寓意": "犀纹属于武官补子兽纹，清代武官七品、八品的补纹为犀，以黑缎为底布。主要纹样为棕犀立在岩石上，下半部为水纹。周边围绕蝙蝠纹、桃纹，棕犀则面朝太阳。补子上绣有海水、岩石，象征江山永固，蝙蝠、桃纹寓意多福多寿。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "洪武禁令中以“犀”为特定文样。明代武官八品补子用犀牛。"}, {"period": "清代", "desc": "清代武官七品、八品补服绣犀牛纹，补子边缘绣回纹，其他纹饰有祥云、蝙蝠、八吉祥、如意、福山、寿海、红日、灵芝等。"}], "寓意分条": ["多福多寿：蝙蝠、桃纹寓意多福多寿。", "江山永固：海水、岩石象征江山永固。", "威猛有力：犀牛象征威猛有力。"], "属性": {"常用颜色": "补子以黑缎为底布。棕犀以赭褐、棕色丝线绣出，犀角以金色线勾勒。", "常用布料": "暗花绸、缎。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。", "使用场景": "官员常朝。"}, "常见搭配": ["蝙蝠纹", "桃纹", "海水江崖纹", "八吉祥纹"]}, {"编号": 80, "类别": "动物瑞兽", "类别内序号": 13, "纹样名称": "狮纹", "盛行朝代": "", "文化寓意": "狮纹属于武官补子兽纹，以现实狮子为原型，强调威猛雄健之态。狮亦作“师”，又名“狻猊”，一种猛兽，相传能辟不群，因用作装饰纹样，尤以武将服饰为常见。明代狮为武官一品、二品补子，清代狮子为武官二品补子。补子居中以打籽针法绣蓝色狮子一只，望日而哮，形态威武，四周祥云缭绕。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "狮纹经丝绸之路传入，以“团聚联珠对狮”样式织入锦缎，色彩明快，兼具异域风情与尊贵气象。狮子被用作武将官服上的装饰纹样。"}, {"period": "宋元", "desc": "宋代官员朝服以绶带的色彩和纹样来区别官品，其中第六等为黄狮子锦。"}, {"period": "明代", "desc": "明代武官补子序列为：一品、二品狮子。狮为武官最高等级的补子。"}, {"period": "清代", "desc": "清代武官二品补服绣狮纹，补子边缘绣回纹，其他纹饰有祥云、蝙蝠、暗八仙、如意、桃、牡丹、福山、寿海、红日、灵芝等。主纹狮子身上有火焰象征光明与飞腾，主纹下端彩绣翻滚水浪和山石，有江山一统、四海昇平寓意。"}], "寓意分条": ["威猛镇邪：狮为百兽之王，象征勇武与统御之力。", "江山一统：海水山石纹寓意江山一统、四海昇平。", "金玉满堂：四周布满佛家八宝和灵芝、寿桃、金鱼、蝙蝠等吉祥宝物，有金玉满堂、吉祥如意的太平盛世隐喻。"], "属性": {"常用颜色": "补子以石青缎为地，绣蓝色云纹，中间钉以平金绣狮子。狮身以金线盘绣，鬃毛以深蓝或黑色线勾勒。四周祥云以蓝、绿、紫、红等色退晕，蝙蝠纹以红色为主。", "常用布料": "暗花绸、绫、缎，彩绣兽纹。清代武官二品补子以石青缎为地，运用打籽针法绣蓝色狮子，补子四边绣回纹边饰。", "适用衣物": "补服、赐服。", "应用部位": "前胸、后背各缀补子。补子正中为狮子，望日而哮，上部为云纹，下部为海水、山石、八宝纹。前片补子因对襟设计分为左右两半。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["祥云纹", "蝙蝠纹", "莲花纹", "杂宝纹", "八吉祥纹"]}, {"编号": 116, "类别": "动物瑞兽", "类别内序号": 49, "纹样名称": "狻猊纹", "盛行朝代": "", "文化寓意": "狻猊纹属于瑞兽类纹样，狻猊是中国古代神话传说中龙生九子之一。古书记载狻猊能食虎豹凶猛之兽，狻猊图案用在武将服饰上取其威猛之意。在清朝，二品武官的补服上绣狻猊。明代规定为一至二品武官的补服纹样。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "狮亦名“狻猊”，明代规定为一至二品武官的补服纹样，取其威猛之意。"}, {"period": "清代", "desc": "狻猊从狮纹中独立出来，专门作为二品武官补子。狻猊形似狮子，平生喜静不喜动，好坐，又喜欢烟火。"}], "寓意分条": ["威猛之意：狻猊能食虎豹，用在武将服饰上取其威猛之意。", "辟邪镇恶：狻猊相传能辟不群。", "官阶标志：清代二品武官补子，象征官员的品级。"], "属性": {"常用颜色": "补子以石青缎为地，狻猊以金线绣制。", "常用布料": "暗花绸、缎。", "适用衣物": "补服、朝服。", "应用部位": "前胸、后背各缀补子。", "使用场景": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹"]}, {"编号": 109, "类别": "动物瑞兽", "类别内序号": 42, "纹样名称": "猴纹", "盛行朝代": "明—清", "文化寓意": "猴纹属于吉庆祥瑞类纹样，“猴”与“侯”谐音，成为象征升迁的吉祥物。猴纹在土家族织锦中广泛使用，猴子手纹为龙山地区流行的饰边纹样，勾花与猴子手纹组合构成土家锦的典型装饰。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/Ugv566s87Q", "caption": "清代白缎地绣猴戏花间门檐"}, {"url": "https://aka.doubaocdn.com/s/h7Mcs0CUbO", "caption": "清代黄色缎绣火云纹猴衣裤"}, {"url": "https://aka.doubaocdn.com/s/nM0IN9yEqx", "caption": "清代补子"}, {"url": "https://aka.doubaocdn.com/s/ygdBZzoegw", "caption": "清代官服补子"}, {"url": "https://aka.doubaocdn.com/s/haym874Pdg", "caption": "明代衮服"}, {"url": "https://aka.doubaocdn.com/s/MobVeG7rjL", "caption": "明代衮服"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "江苏无锡钱裕墓出土猴戏加绣妆金罗花边裙，为猴纹在服饰上的早期实物。"}, {"period": "明清至近现代", "desc": "猴纹见于土家族织锦、民间服饰。土家锦以六边形框的之字形连续构图，中心为二十四勾花纹，织锦上下方各有双排二方连续猴子手纹饰边。"}], "寓意分条": ["升迁封侯：“猴”与“侯”同音，象征仕途升迁、封侯拜相。", "吉祥如意：猴纹在土家锦中寓意吉祥。", "机智灵动：猴象征机智与灵巧。"], "属性": {"常用颜色": "土家锦猴纹以褐色丝织万字纹为底，织有黑、白、蓝三色猴纹。勾花采用红、蓝、黑配色，对比强烈。", "常用布料": "土家锦（西兰卡普）、罗、织锦。", "适用衣物": "花边裙、织锦、戏曲猴衣。", "应用部位": "边饰、衣身、裙摆。", "使用场景": "日常穿着、节日盛装、戏曲演出。"}, "常见搭配": ["卍字纹", "三角纹", "勾花纹"]}, {"编号": 114, "类别": "动物瑞兽", "类别内序号": 47, "纹样名称": "獬豸纹", "盛行朝代": "明—清", "文化寓意": "獬豸纹属于风宪官补子纹样，獬豸为传说中的神兽，能辨曲直。明清时期，獬豸纹通常以“补子”的形式出现在“补服”上。明代洪武二十六年确立规制。风宪官如都御史、副都御史、按察史、监察御史等，补服均绣獬豸。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/rZPnNZKQT7", "caption": "清嘉庆道光御史獬豸纹补子"}, {"url": "https://aka.doubaocdn.com/s/1xdcvY8uGi", "caption": "清嘉庆道光御史夫人獬豸纹补子"}, {"url": "https://aka.doubaocdn.com/s/mVPWOPZIFy", "caption": "清同治光绪御史獬豸纹补子"}, {"url": "https://aka.doubaocdn.com/s/y2pOm76rhj", "caption": "清同治光绪御史夫人獬豸纹补子"}, {"url": "https://aka.doubaocdn.com/s/6dc6DzVQgI", "caption": "清咸丰同治御史獬豸纹补子"}, {"url": "https://aka.doubaocdn.com/s/Re07mneXom", "caption": "清同治光绪御史獬豸纹补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "春秋战国", "desc": "从春秋战国的冠冕形制，到明清官员的补服纹样，獬豸始终以沉默而威严的姿态出现。"}, {"period": "汉代", "desc": "自汉代起，獬豸便与司法、监察制度紧密关联。执法者所戴的帽子称为“獬豸冠”。"}, {"period": "宋代", "desc": "自宋代起，獬豸的形象进一步从帽冠延伸至官服纹饰。"}, {"period": "明代", "desc": "洪武二十四年规定风宪官用獬豸补服，其独立于文武品级序列之外。"}, {"period": "清代", "desc": "獬豸以补子的形式列入风宪官的官服规制中。清代都御史、副都御史均用獬豸补服。"}], "寓意分条": ["忠直公正：獬豸性格特征“忠直”，象征公正执法。", "辨别曲直：獬豸能辨曲直，发现奸邪便用角将其触倒，是中国传统文化中司法公平与正义的象征。"], "属性": {"常用颜色": "补服以石青色为地，獬豸以金线、彩丝绣制。獬豸身以深蓝或黑色丝线绣出，独角以金线勾勒，双目以金线点睛，神态威猛。", "常用布料": "绸、缎、纱、缂丝。明代獬豸胸背以环编绣工艺绣制。", "适用衣物": "补服、大袖袍、圆领袍。", "应用部位": "前胸、后背各缀补子。风宪官不论品阶高低，补服胸前背后各一方形锦块，均绣獬豸纹样。", "使用场景": "官员常朝、风宪官执法、吉庆典礼。"}, "常见搭配": ["云鹤纹", "团寿纹"]}, {"编号": 119, "类别": "动物瑞兽", "类别内序号": 52, "纹样名称": "瑞兽纹", "盛行朝代": "", "文化寓意": "瑞兽纹是以麒麟、狮子、虎、豹等祥瑞兽类为核心的装饰纹样总称。不同瑞兽对应不同等级和寓意。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "商周", "desc": "青铜器上已有饕餮、夔龙等兽面纹饰。"}, {"period": "明清", "desc": "瑞兽纹在官服补子中形成严格等级制度。文官用禽，武官用兽。"}], "体系组成": "麒麟纹：武官一品补子。狮子纹：武官二品补子。虎纹：武官四品补子。豹纹：武官三品补子。熊纹：武官五品补子。彪纹：武官六品补子。犀牛纹：武官七品、八品补子。海马纹：武官九品补子。", "寓意分条": ["等级标识：不同瑞兽对应不同武官品级。", "辟邪护佑：瑞兽象征辟邪护佑、吉祥平安。", "威猛勇武：狮子、虎、豹象征威猛勇武。"], "属性": {"常用颜色": "以金、红、蓝等色为主。", "常用布料": "缎、妆花缎、缂丝。", "适用衣物": "官服补子、吉服袍。", "应用部位": "前胸、后背补子。", "使用场合": "宫廷礼仪、官员常朝。"}, "常见搭配": ["云纹", "海水江崖纹", "祥云纹", "蝙蝠纹", "牡丹纹"], "相似纹样说明": "兽类为瑞兽纹，禽鸟为祥禽纹。"}, {"编号": 120, "类别": "动物瑞兽", "类别内序号": 53, "纹样名称": "白鹇纹", "盛行朝代": "明—清", "文化寓意": "白鹇纹属于文官补子禽纹，白鹇为文官五品补子。补子中心纹样为展翅于海水之上的白鹇，周围满布祥云和佛家八宝。白鹇独立于碣石之上，其下海浪翻腾，其上以珊瑚米珠等绣八宝纹。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/vj6AmrU6Ub", "caption": "清代青地平金银绣白鹇补子"}, {"url": "https://aka.doubaocdn.com/s/qaCUD591fN", "caption": "清绣花蟠金银五品文官白鹇补子"}, {"url": "https://aka.doubaocdn.com/s/ks4RV5k4ud", "caption": "清平金绣白鹇补子"}, {"url": "https://aka.doubaocdn.com/s/wOfzMUOdKT", "caption": "清嘉庆打籽绣文官五品白鹇纹补子"}, {"url": "https://aka.doubaocdn.com/s/sJvhcSArzp", "caption": "清褐色地平金绣白鹇纹补子"}, {"url": "https://aka.doubaocdn.com/s/sB5V5pKGPW", "caption": "明代彩绣白鹇补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "清代补服等级制度进一步细化，文官五品用白鹇补。清康熙文官五品白鹇补子，白鹇展翅于海波，通身雪白，嘴、爪红，青色地子上满布祥云，另绣旭日和八宝。"}], "寓意分条": ["官阶标志：文官五品补子，象征官员的品级。", "吉祥如意：八宝纹寓意吉祥如意。"], "属性": {"常用颜色": "补子以石青缎为面，白鹇通身雪白，以白色龙抱柱线绣出白鹇，嘴、爪红色。补子以五彩绣线满铺地，作四合如意云纹与福山寿海图案。", "常用布料": "暗花绸、缎，彩绣禽纹。青缎地平金打子绣白鹇补子，以平金打子绣工艺绣制，做工精细。", "适用衣物": "补服、霞帔。", "应用部位": "前胸、后背各缀补子。补子中心为展翅于海水之上的白鹇，周围满布祥云和佛家八宝。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["祥云纹", "八吉祥纹", "海水江崖纹", "旭日纹"]}, {"编号": 125, "类别": "动物瑞兽", "类别内序号": 58, "纹样名称": "练鹊纹", "盛行朝代": "", "文化寓意": "练鹊纹是以练鹊鸟为核心的装饰纹样。练鹊为古代传说中的瑞鸟，羽毛洁白，尾羽修长。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "八、九品文官用黄鹂、鹌鹑、练鹊。"}, {"period": "清代", "desc": "九品绣练雀。"}], "体系组成": "练鹊单独纹：练鹊独立呈现。练鹊配祥云纹：练鹊与祥云组合。", "寓意分条": ["廉洁吉祥：练鹊羽毛洁白。", "等级标识：练鹊为未入流文官补子纹样。"], "属性": {"常用颜色": "以蓝、青、白等色为主。", "常用布料": "缎、缂丝。", "适用衣物": "官服补子。", "应用部位": "前胸、后背补子。", "使用场合": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹"], "相似纹样说明": "练鹊为未入流文官补子，鹭鸶为六品文官补子。"}, {"编号": 108, "类别": "动物瑞兽", "类别内序号": 41, "纹样名称": "羊纹", "盛行朝代": "明—清", "文化寓意": "羊纹属于传统纹样，“羊”与“祥”谐音，自古为吉祥瑞兽。羊纹在汉族服饰中以“绵羊太子”纹最为典型，在少数民族服饰中则以羊角纹形式广泛应用于彝族等民族。羊角纹是彝族应用最多、寓意最好的花纹，以三圈螺旋左右对称构图，是一种全方位的祝福。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/c5q0Rn8B4v", "caption": "清代三羊开泰缂丝绣片"}, {"url": "https://aka.doubaocdn.com/s/K4vn3cMC0U", "caption": "清乾隆三阳开泰绣片"}, {"url": "https://aka.doubaocdn.com/s/r21s2dk7st", "caption": "明代红缎地绣三羊开泰帐料"}, {"url": "https://aka.doubaocdn.com/s/Dy3BURAHUv", "caption": "苗族服饰中的羊纹样"}, {"url": "https://aka.doubaocdn.com/s/aUPceRYQfq", "caption": "清代刺绣三阳开泰"}, {"url": "https://aka.doubaocdn.com/s/az1m7SR0sz", "caption": "清代广绣三羊开泰图绣件"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "羊为“祥”的谐音，汉代器物上常见羊形装饰，寓意吉祥。"}, {"period": "宋代", "desc": "宋代锦袍上有双头鸟对羊纹。"}, {"period": "明代", "desc": "定陵出土膝袜上有绵羊口吐上升云气的纹样，利用谐音表现“阳生”二字。绵羊太子纹中太子骑大羊，肩扛梅枝，上挂鸟笼，笼内有喜鹊，寓意“喜上眉梢”。"}, {"period": "明清至近现代", "desc": "羊角纹在彝族服饰中广泛应用，是彝族财富和吉祥的象征，承载羊图腾崇拜的民风民俗。"}], "寓意分条": ["吉祥如意：“羊”与“祥”谐音，羊纹象征吉祥平安。", "阳生冬至：绵羊口吐云气表现“阳生”，寓意冬至阳气初生、新春将至。", "全方位祝福：羊角纹为彝族应用最多、寓意最好的花纹。", "财富与吉祥：彝族羊角纹是财富和吉祥的象征。"], "属性": {"常用颜色": "绵羊太子纹以白色绵羊为主体，彝族羊角纹以红、黄、黑等对比强烈的色彩为主。", "常用布料": "织锦、缎、棉布、毛织品。", "适用衣物": "膝袜、彝族传统服饰、锦袍。", "应用部位": "膝袜、领襟、环肩、袖、裙边。", "使用场景": "冬至节令、彝族节日盛装。"}, "常见搭配": ["喜鹊纹", "梅花纹", "云纹", "牛角纹", "火纹"]}, {"编号": 81, "类别": "动物瑞兽", "类别内序号": 14, "纹样名称": "虎纹", "盛行朝代": "明—清", "文化寓意": "虎纹属于武官补子兽纹。在先秦时期虎纹地位高于豹纹，虎代表“大人”，豹代表“君子”，虎纹代表王者，豹纹代表卿大夫。明代虎豹同为武官三品、四品补子，清代虎为武官四品补子。彩绣虎四品方补，中间虎纹，右上方彩云捧日，间杂有松枝、花卉、万字、灵芝、蝙蝠等纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/seWQyPyKVU", "caption": "清织锦绣虎纹补子"}, {"url": "https://aka.doubaocdn.com/s/JJZ7DwxI3Q", "caption": "清道光武官四品虎纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/H0dMaAWUEK", "caption": "清朝武官四品刺绣官服补子虎纹"}, {"url": "https://aka.doubaocdn.com/s/oQvBNZ2u0I", "caption": "清金银绣纳纱虎纹武官补子"}, {"url": "https://aka.doubaocdn.com/s/khzX3JsRgG", "caption": "清晚期青色缎绣四品虎纹补子"}, {"url": "https://aka.doubaocdn.com/s/9T7bHDqUjs", "caption": "清代武四品虎纹绣补"}, {"url": "https://aka.doubaocdn.com/s/seWQyPyKVU", "caption": "清织锦绣虎纹补子"}, {"url": "https://aka.doubaocdn.com/s/JJZ7DwxI3Q", "caption": "清道光武官四品虎纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/H0dMaAWUEK", "caption": "清朝武官四品刺绣官服补子虎纹"}, {"url": "https://aka.doubaocdn.com/s/oQvBNZ2u0I", "caption": "清金银绣纳纱虎纹武官补子"}, {"url": "https://aka.doubaocdn.com/s/khzX3JsRgG", "caption": "清晚期青色缎绣四品虎纹补子"}, {"url": "https://aka.doubaocdn.com/s/9T7bHDqUjs", "caption": "清代武四品虎纹绣补"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "虎纹在先秦时期地位高于豹纹，虎代表“大人”，虎纹代表王者。战国时期虎纹多见于楚墓绣品与器物装饰，带有神秘巫术色彩，虎守天门。"}, {"period": "明清", "desc": "明代虎豹为武官三品、四品补子。清代武官四品补服绣虎纹。"}], "寓意分条": ["勇猛迅捷：虎为百兽之王，象征勇猛与善战。", "守护辟邪：虎有守护辟邪之意。", "虎将之威：古人以“虎将”喻善战者。"], "属性": {"常用颜色": "补子以石青缎为地，虎纹以金线、彩绒绣制。虎身以赭黄、白色为主，黑色虎斑以深色线勾勒，双目以金线点睛。右上方彩云捧日，红日以红色丝线绣出。", "常用布料": "暗花绸、绫、缎。清代武官四品补子以石青缎为地，以金线、彩绒绣虎纹，补子四边绣回纹边饰。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。补子正中为虎纹，右上方彩云捧日，间杂松枝、花卉、万字、灵芝、蝙蝠等纹样。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["祥云纹", "松枝", "蝙蝠纹", "灵芝纹"]}, {"编号": 101, "类别": "动物瑞兽", "类别内序号": 34, "纹样名称": "虾纹", "盛行朝代": "", "文化寓意": "虾纹是以虾为核心的装饰纹样。虾取其节意味节操。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "虾纹作为水族纹样的组成部分出现。"}], "体系组成": "虾单独纹：虾独立呈现。虾配水波纹：虾与水波纹组合。虾配鱼蟹纹：虾与鱼、蟹组合。", "寓意分条": ["灵活吉祥：虾体态灵活。", "节操意味：虾取其节意味节操。"], "属性": {"常用颜色": "以青、绿、白等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "云肩、袍服。", "应用部位": "云肩外圈、衣身通身纹饰。", "使用场合": "日常穿着。"}, "常见搭配": ["鱼纹", "蟹纹", "水波纹"], "相似纹样说明": "长身为虾，扁圆为蟹。"}, {"编号": 103, "类别": "动物瑞兽", "类别内序号": 36, "纹样名称": "蛇纹", "盛行朝代": "", "文化寓意": "蛇纹是以蛇为核心的装饰纹样。蛇在中国传统文化中具有多重象征意义，既是十二生肖之一，也与龙的形象密切相关。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉唐", "desc": "蛇纹在画像石和器物装饰中已有出现。"}, {"period": "明清", "desc": "蛇纹在水族题材织物中延续使用，作为五毒纹样的组成部分。"}], "体系组成": "蛇单独纹：蛇独立呈现。蛇配祥云纹：蛇与祥云组合。蛇配五毒纹：蛇与蝎、蜈蚣、蟾蜍、壁虎组合。", "寓意分条": ["灵动吉祥：蛇体态灵动。", "龙蛇同源：蛇与龙同源。", "辟邪驱毒：蛇为五毒之一，具有避邪作用。"], "属性": {"常用颜色": "以青、绿、金等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "云肩、袍服。", "应用部位": "云肩饰片、衣身通身纹饰。", "使用场合": "端午节庆。"}, "常见搭配": ["祥云纹", "水波纹", "五毒纹"], "相似纹样说明": "无角无爪为蛇，有角有爪为龙。"}, {"编号": 94, "类别": "动物瑞兽", "类别内序号": 27, "纹样名称": "蝙蝠纹", "盛行朝代": "明—清（清代鼎盛）", "文化寓意": "蝙蝠纹是以蝙蝠为核心的装饰纹样。蝙蝠的“蝠”与“福”谐音，被视为福气、幸福的象征。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/jaVfo0vkth", "caption": "清·女式黑缎团花蝠纹马褂"}, {"url": "https://aka.doubaocdn.com/s/PLdIwKZw7N", "caption": "清代刺绣蝙蝠纹衣袖袖口绣片"}, {"url": "https://aka.doubaocdn.com/s/V4IEuaUWyo", "caption": "清·蝙蝠纹官服补子"}, {"url": "https://aka.doubaocdn.com/s/P4SlUSbexu", "caption": "清·黑缎团花蝠纹马褂背面"}, {"url": "https://aka.doubaocdn.com/s/Il5brqnBja", "caption": "清嘉庆·绛色缎绣八团云蝠花卉纹吉服袍"}, {"url": "https://aka.doubaocdn.com/s/HYiPWW0z4t", "caption": "清·织绣白地百蝠女式棉袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "蝙蝠纹得以大规模应用。清乾隆黄色缂丝云蝠寿袷袍通身织有约一百个团寿字和近100只红色的蝙蝠。"}, {"period": "清代", "desc": "清珊瑚腰结中镂雕相扣双钱纹，钱纹左右两侧雕饰蝙蝠，意为“福在眼前”。"}], "体系组成": "蝙蝠单独纹：蝙蝠独立呈现。五福捧寿纹：五只蝙蝠环绕寿字或寿桃。福在眼前纹：蝙蝠与铜钱组合。蝙蝠配寿字纹：蝙蝠与寿字组合。", "寓意分条": ["福气临门：蝙蝠谐音“福”。", "五福临门：五福捧寿则寓意“多福多寿”。", "福在眼前：蝙蝠与铜钱组合。", "洪福齐天：清乾隆黄色缂丝云蝠寿袷袍寓含“洪福齐天”。"], "属性": {"常用颜色": "以红、金、蓝等色为主。", "常用布料": "缎、绸、刺绣、漳绒、缂丝。", "适用衣物": "袍服、马褂、肚兜、荷包。", "应用部位": "衣身通身纹饰、团花单元。", "使用场合": "寿诞吉庆。"}, "常见搭配": ["团寿字纹", "铜钱纹", "如意纹", "卍字纹", "勾莲纹"], "相似纹样说明": "翼膜为蝙蝠，鳞翅为蝴蝶。"}, {"编号": 95, "类别": "动物瑞兽", "类别内序号": 28, "纹样名称": "蝴蝶纹", "盛行朝代": "明—清", "文化寓意": "蝴蝶纹是以蝴蝶为核心的装饰纹样。蝴蝶的“蝶”与“瓞”谐音，寓意子孙昌盛。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/wyPlkn7t8Q", "caption": "清·白缎地绣本色百蝶纹女褂"}, {"url": "https://aka.doubaocdn.com/s/TgHxJCGv5n", "caption": "清晚期·蓝地织锦花蝶纹汉式氅衣"}, {"url": "https://aka.doubaocdn.com/s/Xq4A9CBdNV", "caption": "清·红色暗花绸花蝶纹刺绣衬衣"}, {"url": "https://aka.doubaocdn.com/s/sQwHJdOVuu", "caption": "清·黑绸地彩绣花卉蝴蝶纹褂襕"}, {"url": "https://aka.doubaocdn.com/s/06YYsUuwGO", "caption": "清晚期·百蝶纹氅衣"}, {"url": "https://aka.doubaocdn.com/s/vK6XsFTsdJ", "caption": "清·靛蓝地织绣花卉蝴蝶纹女袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "蝴蝶纹在服饰中广泛使用。青色缎绣花卉瓜蝶纹女褂绣彩蝶、南瓜，寓意“子孙昌盛”。"}], "体系组成": "蝴蝶单独纹：蝴蝶独立呈现。瓜瓞绵绵纹：蝴蝶与瓜组合。蝶恋花纹：蝴蝶与各种花卉组合。喜相逢纹：双蝶相逐构成S形旋转状图纹。百蝶纹：百蝶相戏图案。", "寓意分条": ["子孙昌盛：蝴蝶与瓜组合，寓意瓜瓞绵绵。", "爱情美满：蝶恋花纹寓意爱情美满。", "捷报富贵：“蝶”与“捷”谐音。", "健康长寿：“百蝶”代指“百耋”。"], "属性": {"常用颜色": "以红、蓝、绿等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、女褂、肚兜、帕袋。", "应用部位": "衣身通身纹饰、袖缘绦边。", "使用场合": "日常穿着、婚嫁吉庆。"}, "常见搭配": ["花卉纹", "瓜纹", "葫芦纹", "南瓜纹"], "相似纹样说明": "鳞翅为蝴蝶，翼膜为蝙蝠。"}, {"编号": 117, "类别": "动物瑞兽", "类别内序号": 50, "纹样名称": "螭纹", "盛行朝代": "", "文化寓意": "螭纹属于龙纹类纹样，螭是无角小龙，形成穿插盘绕的饰纹。螭寓意“喜”，因而这种纹饰也出现在玉带板的图案中。清代官补中，夔龙纹、螭龙纹为清代官补的核心图案之一。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "战国", "desc": "战国中山国青铜器蟠螭纹为早期实物。"}, {"period": "明代", "desc": "螭纹不见于明初，至明中期才出现于工艺品的装饰图案中。螭寓意“喜”，出现在玉带板的图案中。"}, {"period": "清代", "desc": "清代官补中，夔龙纹、螭龙纹为官补核心图案之一。香色缀绣八团夔龙牡丹单袍缝缀直径纱地绣夔龙牡丹纹的补子八团，纹样的轮廓全部以金线勾边。"}], "寓意分条": ["喜：螭寓意“喜”。", "吉祥：螭纹为吉祥纹样，象征如意喜庆。", "合家美满：夔龙、夔凤组合有合家美满、子孙满堂之寓意。"], "属性": {"常用颜色": "以金线、彩线绣制。螭纹轮廓以金线勾边。", "常用布料": "织金锦、妆花缎、实地纱、绸、缎。", "适用衣物": "官服、吉服袍、玉带板。", "应用部位": "前胸、后背、两肩、衣襟、玉带板。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["夔龙纹", "牡丹纹", "云纹", "蝙蝠纹"]}, {"编号": 69, "类别": "动物瑞兽", "类别内序号": 2, "纹样名称": "蟒纹", "盛行朝代": "", "文化寓意": "蟒纹属于赐服瑞兽类纹样，整体造型与龙几乎一样，为四爪龙形。蟒原指大蛇，明代的“蟒”是仅次于“龙”的高级纹样，两者的区别在爪部（趾），蟒只有四爪。蟒袍以平金为主要针法刺绣出全部蟒纹，在蟒的四周用衣线刺绣出牵牛花、梅花、兰花等花朵，还有蝴蝶、犀角、方胜等各色杂宝。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "蟒服是皇帝对有功之臣的“赐服”，主要赏赐内使监宦官、宰辅等人员。赐服分等级，蟒服在赐服中的位置等级排第一位。蟒服分有“坐蟒”与“行蟒”两种，坐蟒尤贵。蟒衣列为“吉服”，凡文武百官，皆衬在补褂内穿用。"}, {"period": "清代", "desc": "蟒袍制度规定皇子蟒袍色用金黄，通绣九蟒；亲王、郡王蟒袍制同，惟色用蓝及石青；贝勒蟒袍通绣九蟒四爪。山东曲阜衍圣公府馆藏有明代衍圣公赐服蟒袍2件。"}], "寓意分条": ["位极人臣：蟒纹是臣子所能企及的纹饰极致，获得蟒服赐服被认为是极大的荣宠。", "恩宠殊荣：代表皇帝对臣下的特殊恩赏。"], "属性": {"常用颜色": "蟒纹赐服多用大红、藏蓝、石青，以金线织出蟒身。大红蟒袍常用于喜庆典礼与赏赐，石青蟒袍则用于较庄重的场合。四周配以牵牛花、梅花、兰花等花卉，以五彩丝线绣出。清代蟒袍依等级分别用杏黄、金黄、石青等色地。", "常用布料": "织金妆花工艺，采用罗绸为主。明代赐服蟒袍常用织金妆花罗、妆花缎，以金线织出蟒身，彩绒织花卉与杂宝。清代蟒袍多用妆花缎、织金锦，质地厚实。夏季蟒袍则用妆花纱、实地纱，轻薄透气。", "适用衣物": "蟒袍、赐服。蟒袍为圆领、大襟、宽袖，腋下缀带，下摆有海水江崖纹。清代蟒袍通身绣九蟒，前后左右分布均匀。", "应用部位": "云肩通袖膝襕式布局中，云肩内绣有两条蟒，袖子正面每边一条小蟒，膝襕处有两只相对戏珠的小行蟒。蟒袍前胸、后背及两肩各绣正蟒一条，前后下摆绣行蟒各两条。", "使用场景": "节庆活动、吉服场合、皇帝赏赐、官员朝会衬穿。"}, "常见搭配": ["四合如意连云纹", "杂宝纹", "牵牛花", "梅花", "兰花", "蝴蝶", "犀角", "方胜"]}, {"编号": 118, "类别": "动物瑞兽", "类别内序号": 51, "纹样名称": "蟠龙纹", "盛行朝代": "", "文化寓意": "蟠龙纹是以蟠曲的龙为核心的装饰纹样。蟠龙为龙的一种形态，盘曲环绕。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "商周", "desc": "蟠龙纹在青铜器上已有出现。"}, {"period": "明清", "desc": "蟠龙纹在服饰中广泛使用。"}], "体系组成": "蟠龙单独纹：蟠龙独立呈现。蟠龙配云纹：蟠龙与祥云组合。蟠龙配海水江崖纹：蟠龙与海水江崖组合。", "寓意分条": ["尊贵吉祥：蟠龙象征尊贵、吉祥。", "皇权象征：蟠龙为龙袍核心纹样。"], "属性": {"常用颜色": "以金、红、蓝等色为主。", "常用布料": "缎、妆花缎、缂丝。", "适用衣物": "龙袍、吉服袍。", "应用部位": "前胸、后背、两肩、下摆。", "使用场合": "宫廷礼仪。"}, "常见搭配": ["祥云纹", "海水江崖纹", "蝙蝠纹"], "相似纹样说明": "盘曲为蟠龙，团花为团龙。"}, {"编号": 100, "类别": "动物瑞兽", "类别内序号": 33, "纹样名称": "蟹纹", "盛行朝代": "", "文化寓意": "蟹纹是以螃蟹为核心的装饰纹样。“蟹”与“谐”谐音，寓意和谐。二甲传胪纹即以两只螃蟹和芦苇组合。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "蟹纹作为吉祥纹样元素应用于服饰装饰。"}, {"period": "清代", "desc": "清代嘉道年间后妃的蟹形簪设计灵感来源于民间吉祥纹样“二甲传胪”。"}], "体系组成": "二甲传胪纹：两只螃蟹以钳执芦苇。蟹单独纹：蟹独立呈现。蟹配水波纹：蟹与水波纹组合。", "寓意分条": ["科举高中：二甲传胪纹谐音“二甲传胪”。", "和谐吉祥：蟹谐音“谐”。", "金榜题名：蟹纹含有金榜题名的美好祝愿。"], "属性": {"常用颜色": "以青、绿、褐等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "荷包、挽袖、围腰、云肩。", "应用部位": "荷包袋面、挽袖主体。", "使用场合": "科举吉庆。"}, "常见搭配": ["芦苇纹", "花卉纹", "水波纹"], "相似纹样说明": "扁圆有螯为蟹，修长有须为虾。"}, {"编号": 104, "类别": "动物瑞兽", "类别内序号": 37, "纹样名称": "蟾蜍纹", "盛行朝代": "", "文化寓意": "蟾蜍纹是以蟾蜍为核心的装饰纹样。蟾蜍在传统文化中与月亮密切相关，月宫中有蟾蜍。金蟾为三足蟾蜍，被视为招财宝物。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉唐", "desc": "蟾蜍纹在画像石和器物装饰中已有出现，多与月亮组合。"}, {"period": "明清", "desc": "蟾蜍纹作为刘海戏金蟾纹样的组成部分。"}], "体系组成": "蟾蜍单独纹：蟾蜍独立呈现。刘海戏金蟾纹：刘海与金蟾组合。蟾宫折桂纹：蟾蜍与桂花组合。", "寓意分条": ["科举及第：蟾宫折桂寓意科举及第。", "招财进宝：金蟾被视为招财宝物。", "长寿吉祥：蟾蜍象征长寿吉祥。"], "属性": {"常用颜色": "以绿、金、褐等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "挽袖、荷包、袍服。", "应用部位": "挽袖主体、荷包袋面。", "使用场合": "日常穿着。"}, "常见搭配": ["铜钱纹", "莲花纹", "桂花纹"], "相似纹样说明": "疙瘩为蟾蜍，背甲为龟。"}, {"编号": 71, "类别": "动物瑞兽", "类别内序号": 4, "纹样名称": "行龙纹", "盛行朝代": "", "文化寓意": "行龙纹属于龙纹姿态的一种，又称“跑龙”。龙的造型特点是，龙头向前，尾在后，头为侧面，四肢两前两后、各为一蹬一伸。行龙纹很像是龙游动的状态，也被称为“游龙”，这种龙纹最为活泼，代表着朝气和活力。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "元代龙袍的两袖上部为行龙，袍的下摆也为一栏行龙。"}, {"period": "明清", "desc": "行龙纹广泛应用于龙袍、朝袍。清代朝袍前胸、后背、两肩、腰帷、衽、底襟、下摆、袖端共绣龙纹43条，分别为正龙、团正龙、行龙。蟒袍分男蟒、女蟒，纹饰有团龙、正龙、行龙，行龙下有海水江崖。"}], "寓意分条": ["朝气活力：行龙纹最为活泼，代表朝气和活力。", "巡游天下：龙游动的状态象征帝王巡游、威加四海。"], "属性": {"常用颜色": "行龙纹以金线织出龙身，底色用明黄、石青、香色。行龙周围以五彩云纹环绕，下摆海水江崖纹以蓝、白、金三色绣出。", "常用布料": "妆花缎、织金锦、缂丝。妆花缎行龙以金线织出龙身，彩绒织云纹与海水，是龙袍与朝袍的常用面料。", "适用衣物": "龙袍、蟒袍、朝袍、吉服袍。", "应用部位": "前后衣襟、袖端、下摆、腰帷。行龙多与正龙、团龙配合使用，形成动静结合、层次丰富的装饰效果。", "使用场景": "宫廷朝会、祭祀典礼、吉庆典礼。"}, "常见搭配": ["云纹", "海水江崖纹", "十二章纹"]}, {"编号": 110, "类别": "动物瑞兽", "类别内序号": 43, "纹样名称": "象纹", "盛行朝代": "明—清", "文化寓意": "象纹属于传统瑞兽纹样，明初官方器用、服饰文样的限制中，以“日、月、龙、凤、狮子、麒麟、犀、象”等特定文样为“禁”，申禁官民器服不许违禁僭越，特定文样专属于官民阶级以上的特定阶级。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/FOmaxv4P3b", "caption": "清光绪缎绣太平有象纹男蟒"}, {"url": "https://aka.doubaocdn.com/s/JHx9q92CKj", "caption": "清光绪年间的缎绣太平有象纹男蟒"}, {"url": "https://aka.doubaocdn.com/s/RRDZEhSxwt", "caption": "品月色缎绣彩云蝠折枝花银太平有象男蟒"}, {"url": "https://aka.doubaocdn.com/s/kptFUlhn8p", "caption": "明黄江绸五彩绣十二章龙袍"}, {"url": "https://aka.doubaocdn.com/s/PuxNaCvVMH", "caption": "南京江宁织造博物馆馆藏清代云锦服饰展品"}, {"url": "https://aka.doubaocdn.com/s/gdUQ5CqKSR", "caption": "石青花罗地刺绣对襟女褂"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明初", "desc": "洪武禁令中屡次以“日、月、龙、凤、狮子、麒麟、犀、象”等特定文样为“禁”，象纹为特定文样，象征等级与身份。"}, {"period": "明清", "desc": "象纹在官方服饰中作为等级标识使用，民间服饰中亦以“太平有象”题材广泛流传。"}], "寓意分条": ["等级象征：象纹为特定文样，专属于官民阶级以上的特定阶级。", "太平有象：象与宝瓶组合，寓意天下太平、吉祥如意。", "吉祥瑞兽：象为吉祥瑞兽，象征稳重与力量。"], "属性": {"常用颜色": "象纹以金线、彩线绣制，象身以灰白、浅褐丝线绣出。", "常用布料": "织金锦、绸、缎。", "适用衣物": "官服、贵族服饰。", "应用部位": "衣身、补子。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["狮纹", "麒麟纹", "犀纹", "宝瓶纹"]}, {"编号": 82, "类别": "动物瑞兽", "类别内序号": 15, "纹样名称": "豹纹", "盛行朝代": "明—清", "文化寓意": "豹纹属于武官补子兽纹。豹纹身形矫健，斑纹细密。先秦时期豹代表“君子”。明代虎豹同为武官三品、四品补子，清代豹为武官三品补子。盘金绣豹三品方补，绣有海水江崖、豹、日等纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/DzknqrrTKd", "caption": "清代黑缎地压金彩绣豹纹补"}, {"url": "https://aka.doubaocdn.com/s/cTBvJbX7zF", "caption": "明代四品武官补子云锦豹纹织金"}, {"url": "https://aka.doubaocdn.com/s/AvF6cgqzjd", "caption": "彩绣武官三品豹纹补子"}, {"url": "https://aka.doubaocdn.com/s/dg9LeQRkFj", "caption": "清康熙或雍正三品武官夫人豹纹补子"}, {"url": "https://aka.doubaocdn.com/s/6YG0uLCR9T", "caption": "清同治或光绪三品武官夫人豹纹补子"}, {"url": "https://aka.doubaocdn.com/s/JLEuUB9aVP", "caption": "清道光武官三品豹纹刺绣补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "豹代表“君子”，豹纹代表卿大夫。"}, {"period": "明清", "desc": "明代虎豹同为武官三品、四品补子。清代武官三品补服绣豹纹。"}], "寓意分条": ["勇猛迅捷：豹象征勇猛与迅捷。", "豹略之智：古人以“豹略”喻善战者，兼有智谋之意。"], "属性": {"常用颜色": "补子以石青缎为地，豹纹以金线绣制。豹身以赭黄、白色为主，黑色豹斑以深色线细密勾勒，矫健灵动。海水江崖纹以蓝、白、金三色绣出。", "常用布料": "暗花绸、绫、缎。清代武官三品补子以石青缎为地，以金线绣豹纹，补子四边绣回纹边饰。", "适用衣物": "补服。", "应用部位": "前胸、后背各缀补子。补子正中为豹纹，绣有海水江崖、日等纹样。", "使用场景": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹", "蝙蝠纹"]}, {"编号": 115, "类别": "动物瑞兽", "类别内序号": 48, "纹样名称": "貔貅纹", "盛行朝代": "", "文化寓意": "貔貅纹属于瑞兽类纹样，为传说中的猛兽。桃源刺绣瑞兽纹样中对麒麟纹、貔貅纹、狻猊纹的文化内涵进行解读。貔貅在民间信仰中为招财纳福、镇宅辟邪的瑞兽，外型凶猛，在公司开业或新居入伙时深受欢迎。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清至近现代", "desc": "貔貅纹见于桃源刺绣等民间刺绣，作为瑞兽纹样之一，与麒麟纹、狻猊纹并列。"}], "寓意分条": ["招财纳福：貔貅为招财纳福的瑞兽，民间认为其有口无肛，能吞万物而不泄。", "辟邪镇宅：貔貅外型凶猛，有镇宅辟邪之意。", "守护平安：貔貅为守护兽，寓意护卫主人平安。"], "属性": {"常用颜色": "貔貅纹以金、红为主色，貔貅身以金色丝线绣出。", "常用布料": "绸、缎、棉布。", "适用衣物": "女袄、肚兜、佩饰。", "应用部位": "衣身、肚兜、佩饰。", "使用场景": "日常吉服、开业庆典、新居入伙。"}, "常见搭配": ["麒麟纹", "狻猊纹", "铜钱纹", "元宝纹"]}, {"编号": 99, "类别": "动物瑞兽", "类别内序号": 32, "纹样名称": "金鱼纹", "盛行朝代": "", "文化寓意": "金鱼纹是以金鱼为核心的装饰纹样。金鱼谐音“金玉”，寓意金玉满堂。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "金鱼纹在服饰中广泛使用。红纱地戳纱金玉满堂女氅衣通身以红罗为底料，用“一丝串”绣出金鱼、莲花。"}], "体系组成": "金鱼单独纹：金鱼独立呈现。金鱼配水波纹：金鱼与水波纹组合。金鱼配莲花纹：金鱼与莲花组合。", "寓意分条": ["金玉满堂：金鱼谐音“金玉”。", "富贵吉祥：金鱼纹寓意富贵吉祥。", "前程似锦：对儿童未来前程仕途无限祝福。"], "属性": {"常用颜色": "以红、金、蓝等色为主。", "常用布料": "缎、绸、刺绣、罗、纱。", "适用衣物": "袍服、肚兜、荷包、童褂、氅衣。", "应用部位": "衣身通身纹饰。", "使用场合": "吉庆典礼。"}, "常见搭配": ["水波纹", "莲花纹", "铜钱纹", "牡丹纹"], "相似纹样说明": "短圆飘逸为金鱼，修长有须为鲤鱼。"}, {"编号": 90, "类别": "动物瑞兽", "类别内序号": 23, "纹样名称": "锦鸡纹", "盛行朝代": "", "文化寓意": "锦鸡纹是以锦鸡为核心的装饰纹样。锦鸡羽毛华丽，色彩斑斓。明代二品文官补子即为锦鸡。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "锦鸡纹用于二品文官补子。"}, {"period": "清代", "desc": "《钦定大清会典图》明确规定“文二品官补服绣锦鸡”。"}], "体系组成": "锦鸡单独纹：锦鸡独立呈现。锦鸡配祥云纹：锦鸡与祥云组合。锦鸡配牡丹纹：锦鸡与牡丹组合。", "寓意分条": ["显贵吉祥：锦鸡羽毛华丽。", "等级标识：锦鸡为二品文官补子纹样。", "前程似锦：锦鸡表示前程似锦。"], "属性": {"常用颜色": "以蓝、青、红等色为主。", "常用布料": "缎、缂丝、绸。", "适用衣物": "官服补子、肚兜。", "应用部位": "前胸、后背补子。", "使用场合": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹", "牡丹纹"], "相似纹样说明": "锦鸡为二品文官补子，雉为五品文官补子。"}, {"编号": 73, "类别": "动物瑞兽", "类别内序号": 6, "纹样名称": "降龙纹", "盛行朝代": "", "文化寓意": "降龙纹属于龙纹姿态的一种，按龙头的朝向，降龙分为正面和侧面两种。以侧面的为例，其特点是龙头在下，尾在上，头为侧面，朝向宝珠，处于下面的一只爪抓向宝珠。降龙纹呈下降动势，意为“察下民”。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "周代", "desc": "天子用升龙，公爵用降龙，以体现等级差别。"}, {"period": "明清", "desc": "降龙纹广泛应用于龙袍、绵甲等服饰，与升龙纹配合使用。"}], "寓意分条": ["察下民：降龙呈下降动势，意为“察下民”。", "恩泽下施：象征帝王恩泽遍施天下。"], "属性": {"常用颜色": "降龙纹以金线织出龙身，底色用明黄、石青。降龙周围以五彩祥云环绕，宝珠以红色或金色绣出。", "常用布料": "妆花缎、织金锦、缂丝。", "适用衣物": "龙袍、绵甲、朝袍、吉服袍。", "应用部位": "与升龙纹配合使用。", "使用场景": "宫廷朝会、军事礼仪、祭祀典礼。"}, "常见搭配": ["升龙纹", "云纹", "海水江崖纹"]}, {"编号": 86, "类别": "动物瑞兽", "类别内序号": 19, "纹样名称": "雁纹", "盛行朝代": "", "文化寓意": "雁纹属于文官补子禽纹，云雁为文官四品补子。辽代盘金绣团窠卷草对雁罗，以团窠卷草对雁纹为图案主体，中央饰有一对伫立、展翅昂首的大雁，口衔绶带，体现辽代刺绣艺术的高超技艺。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "《新唐书·车服志》记载官服章纹，有鹘衔瑞草、雁衔绶带、地黄交枝等名目。"}, {"period": "辽代", "desc": "辽代盘金绣团窠卷草对雁罗，以团窠卷草对雁纹为图案主体。"}, {"period": "明清", "desc": "明代文官四品补子用云雁，清代文官四品补服绣雁。云雁纹补子，雁立在浪花拍打的岩石上，周围绣有海水、岩石，象征江山永固。"}], "寓意分条": ["忠贞有序：雁为忠贞之鸟，象征忠贞与秩序。", "官阶标志：绶带为标志官阶的饰物，雁衔绶带寓意加官晋爵。", "江山永固：海水岩石象征江山永固。", "忠君高升：平金绣雁穿云向日，寓意“忠君”与“高升”。"], "属性": {"常用颜色": "雁纹以土黄色羽、白翅白尾为主。补子底色为石青色。补面满绣深蓝、浅蓝、月白三色过渡的四方连续云纹，左上角以盘针绣红日。海水江崖纹以蓝、白、金三色绣出。", "常用布料": "织锦、妆花缎、绸、缎。辽代对雁纹以罗为地，以盘金绣工艺绣制。清代补子以石青缎为地。", "适用衣物": "补服、官衣。", "应用部位": "前胸、后背各缀方形补子。补子正中为云雁，立在浪花拍打的岩石上。", "使用场景": "官员常朝、吉庆典礼。"}, "常见搭配": ["云纹", "海水江崖纹", "蝙蝠纹", "八吉祥纹"]}, {"编号": 92, "类别": "动物瑞兽", "类别内序号": 25, "纹样名称": "雉纹", "盛行朝代": "", "文化寓意": "雉纹是以雉鸡为核心的装饰纹样。雉鸡尾羽修长，色彩斑斓。明代五品文官补子即为雉。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "雉纹用于五品文官补子。"}, {"period": "清代", "desc": "五品文官白鹇。"}], "体系组成": "雉单独纹：雉独立呈现。雉配祥云纹：雉与祥云组合。", "寓意分条": ["吉祥显贵：雉鸡尾羽修长。", "等级标识：雉为五品文官补子纹样。"], "属性": {"常用颜色": "以蓝、青、绿等色为主。", "常用布料": "缎、缂丝。", "适用衣物": "官服补子。", "应用部位": "前胸、后背补子。", "使用场合": "官员常朝。"}, "常见搭配": ["祥云纹", "海水江崖纹"], "相似纹样说明": "雉为五品文官补子，锦鸡为二品文官补子。"}, {"编号": 106, "类别": "动物瑞兽", "类别内序号": 39, "纹样名称": "马纹", "盛行朝代": "明—清", "文化寓意": "马纹属于吉庆祥瑞类纹样，以马为表现对象。马与人类关系紧密，民间流传“千里马”“老马识途”“一马当先”等典故，马纹具有忠诚、信义、高贵、勇敢等象征意义。天马纹为生有双翼的飞马，海马纹为马身鱼尾，二者同属马纹体系，分别纳入清代武职官服补子。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/UmYGraFnyH", "caption": "清代骏马纹老绣品"}, {"url": "https://aka.doubaocdn.com/s/0NXVaYW9ZV", "caption": "明代武官马纹补子"}, {"url": "https://aka.doubaocdn.com/s/hGypyVKLX3", "caption": "清代骏马纹绣片"}, {"url": "https://aka.doubaocdn.com/s/lK5iUBQDPc", "caption": "清代骏马纹老绣品"}, {"url": "https://aka.doubaocdn.com/s/engWedEgmi", "caption": "清代文官补子"}, {"url": "https://aka.doubaocdn.com/s/RNiHMskKri", "caption": "清代武职马纹补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉魏", "desc": "汉武帝将西域进献的良马誉为“天马”，使其成为力量、神性与皇家威仪的象征。汉代翼马纹造型雄健朴拙，青铜牌饰与空心砖上均有出现。"}, {"period": "南北朝至隋唐", "desc": "联珠对马纹锦以联珠圆环构成骨架，环内对称分布双翼对马纹。唐代“红地翼马纹锦”中“中西合璧”的天马，融合古希腊、波斯、粟特文化元素，为丝路文化交流的视觉见证。"}, {"period": "宋元", "desc": "宋代锦袍上有双头鸟对羊纹，元代帝王仪仗旗帜上的白马纹为天马纹前身。"}, {"period": "明清", "desc": "天马纹与海马纹纳入武职官服补子体系。清代海马为九品武官补子，天马为五品武官补子。海马纹在元明清瓷器上极为常见，常与江崖海水纹组合，寓意“江山永固、风调雨顺”。"}], "寓意分条": ["交流互鉴：天马纹是丝绸之路中外文明交流互鉴的视觉符号。", "忠勇吉祥：海马忠勇吉祥，智慧与威德通天入海，畅达四方，护卫主人平安。", "逢凶化吉：海马为九品武官补子，寓意主人在水中或困境中可逢凶化吉。", "力量与威仪：天马象征力量、神性与皇家威仪。"], "属性": {"常用颜色": "天马纹以红、米白为主色，联珠环由红、白、藏青三色圆珠排列。海马纹以金线绣制，马身金光闪耀，火焰以红、黄二色呈现，海水江崖纹以蓝、白、金三色绣出。补子底色以石青、黑缎为地。", "常用布料": "织锦、妆花缎、暗花绸、缎。唐代翼马纹锦以织锦工艺织成，联珠环与对马纹色彩鲜明。清代武官补子以石青缎或黑缎为地，以金线、彩绒绣海马纹。", "适用衣物": "袍服、锦袍、补服。海马补服为九品武官常服，前胸后背各缀一方补子。", "应用部位": "衣身、前胸、后背。天马纹多用于袍服衣身，以联珠团窠形式循环排列。海马补子正中为海马，周围祥云、海水、八宝纹环绕。", "使用场景": "官员常朝、吉庆典礼、丝绸之路贸易织物。"}, "常见搭配": ["联珠纹", "云纹", "海水江崖纹", "八吉祥纹", "蝙蝠纹"]}, {"编号": 96, "类别": "动物瑞兽", "类别内序号": 29, "纹样名称": "鱼纹", "盛行朝代": "新石器—清", "文化寓意": "鱼纹是以鱼为核心的装饰纹样。鱼纹是中国传统纹样中最为悠久的纹样之一，自新石器时代彩陶上就已出现。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/537V7qgW3I", "caption": "明·鲤鱼八宝流水织金妆花缎"}, {"url": "https://aka.doubaocdn.com/s/GMLCgjh4n6", "caption": "清·织锦鱼跃龙门刺绣"}, {"url": "https://aka.doubaocdn.com/s/iTacmYVHQx", "caption": "清光绪·黄地鲤鱼跳龙门纹刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/4uAiNjSlZn", "caption": "清·鲤鱼戏水纹金宝地"}, {"url": "https://aka.doubaocdn.com/s/gVb3VotMBV", "caption": "清·蓝地鲤鱼纹刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/5VLJtnLZAc", "caption": "清·黄底鲤鱼蝴蝶绣片"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "新石器时代", "desc": "鱼纹在彩陶上已出现。"}, {"period": "汉代", "desc": "鱼纹样的应用更为普遍。"}, {"period": "明清", "desc": "鱼纹在服饰中广泛使用。"}], "体系组成": "鱼单独纹：鱼独立呈现。双鱼纹：两条鱼组合。鱼配莲花纹：鱼与莲花组合，寓意连年有余。", "寓意分条": ["年年有余：鱼谐音“余”。", "富贵有余：鱼纹象征富贵有余。", "爱情和美：用“如鱼得水”形容夫妻爱情和美。"], "属性": {"常用颜色": "以红、蓝、绿等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、肚兜、荷包、云肩。", "应用部位": "衣身通身纹饰、云肩外圈。 鸡为五德之禽，寓意文、武、勇、仁、信。"], "属性": {"常用颜色": "以红、金、蓝等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、肚兜。", "应用部位": "衣身通身纹饰。", "使用场合": "日常穿着。"}, "常见搭配": ["花卉纹", "祥云纹", "牡丹纹"], "相似纹样说明": "家鸡为鸡纹，锦鸡为锦鸡纹。"}, {"编号": 89, "类别": "动物瑞兽", "类别内序号": 22, "纹样名称": "鸳鸯纹", "盛行朝代": "唐—清", "文化寓意": "鸳鸯纹属于吉庆祥瑞类纹样，古人视鸳鸯为爱情的象征。鸳鸯纹图案为鸳鸯戏水，一直被人们用来寓意夫妻恩爱、夫妇永和，是传统纹样中极富喜庆之气的吉祥图案。南宋金帔坠上面刻着一对鸳鸯，是南宋婚礼上的时尚。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/nSABxPdDJL", "caption": "清·平金鸳鸯纹七品文官补子"}, {"url": "https://aka.doubaocdn.com/s/rqyD8qQGzt", "caption": "清·四品鸳鸯织锦文官补子"}, {"url": "https://aka.doubaocdn.com/s/PGKNkhZw8Z", "caption": "清·鸳鸯纹补子装裱"}, {"url": "https://aka.doubaocdn.com/s/5c7y4law56", "caption": "清·鸳鸯纹补子局部"}, {"url": "https://aka.doubaocdn.com/s/JjUbxtac0h", "caption": "清·六品鸳鸯云锦织绣"}, {"url": "https://aka.doubaocdn.com/s/TtnyhAT9c2", "caption": "清光绪·蓝色团龙纹鸳鸯缎氅衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "元代服饰即已盛行以荷叶鸳鸯为纹样。元青花上的鸳鸯纹都成双成对出现，并与大片莲池相配。"}, {"period": "明清", "desc": "鸳鸯纹广泛应用于婚嫁服饰与嫁妆绣品。明清两代的刺绣题材中，鸳鸯象征夫妻恩爱。"}], "寓意分条": ["夫妻恩爱：鸳鸯象征夫妻恩爱、爱情至死不渝。", "夫妇永和：寓意夫妇永和、美满幸福。", "爱情忠贞：源于《搜神记》中韩凭夫妇的传说。"], "属性": {"常用颜色": "鸳鸯以五彩丝线绣制。雄鸳羽色绚丽，以红、蓝、绿、紫等色退晕；雌鸯羽色灰褐。底色常用红、青、蓝。莲池以青绿、蓝、白等色绣出，莲花以红、粉、白呈现。", "常用布料": "绸、缎、锦。婚嫁吉服鸳鸯纹以妆花缎织出，金线勾边，彩绒填色。", "适用衣物": "婚嫁吉服、霞帔、女袄、荷包。", "应用部位": "衣身、霞帔坠、荷包。鸳鸯纹多绣于荷包正中、嫁衣门襟两侧、霞帔坠金饰之上。", "使用场景": "婚嫁大典、吉庆典礼、日常佩饰。"}, "常见搭配": ["莲花纹", "荷叶纹", "蜂蝶纹"]}, {"编号": 77, "类别": "动物瑞兽", "类别内序号": 10, "纹样名称": "鸾纹", "盛行朝代": "", "文化寓意": "鸾纹属于祥禽类纹样，鸾是古代传说中凤凰一类的神鸟，颜色为青色的多为“鸾”。“鸾凤和鸣”本是《左传·庄公二十二年》“凤凰于飞，和鸣锵锵”之合称。鸾凤和鸣指夫妻恩爱、家庭和睦、子孙繁盛、家业兴旺。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "唐代染织上常见“舞凤”与“对凤”等纹饰，至宋代经历雌雄分化，逐渐产生了“鸾凤”之称。今藏台北故宫博物院的宋缂丝《鸾凤和鸣图轴》应为婚礼祝贺之用。"}, {"period": "元", "desc": "具有异域风格的“鸾凤穿花”在元代被运用得更为广泛。"}, {"period": "明清", "desc": "明清时期织物上常见以缠枝花卉纹样搭配鸾凤、对凤之装饰手法。"}], "寓意分条": ["鸾凤和鸣：指夫妻恩爱、家庭和睦、子孙繁盛、家业兴旺。", "荣华富贵：与芙蓉、牡丹等花卉组合，寓意荣华富贵。"], "属性": {"常用颜色": "鸾纹以金线、五彩丝线绣制。鸾身为青色，以蓝、绿丝线为主，金线勾边。", "常用布料": "缂丝、妆花缎、绸。", "适用衣物": "婚嫁吉服、女袍、霞帔。", "应用部位": "衣身、方补、霞帔。", "使用场景": "婚嫁大典、吉庆典礼、命妇朝会。"}, "常见搭配": ["牡丹纹", "芙蓉纹", "祥云纹"]}, {"编号": 124, "类别": "动物瑞兽", "类别内序号": 57, "纹样名称": "鹌鹑纹", "盛行朝代": "明—清", "文化寓意": "鹌鹑纹是以鹌鹑为核心的装饰纹样。鹌鹑的“鹌”与“安”谐音，寓意平安。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/pR9OWSnkfU", "caption": "清代彩绣文官鹌鹑补子"}, {"url": "https://aka.doubaocdn.com/s/DkQUVILGNu", "caption": "清道光文官八品鹌鹑纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/UZcvlzwgQv", "caption": "清代八品文官鹌鹑补子"}, {"url": "https://aka.doubaocdn.com/s/KH8UJmAKp6", "caption": "清同治光绪八品文官鹌鹑纹补子"}, {"url": "https://aka.doubaocdn.com/s/dS5KC4raxV", "caption": "清代文八品鹌鹑方补"}, {"url": "https://aka.doubaocdn.com/s/vIGGP06dQq", "caption": "清代八品文官鹌鹑纹补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "鹌鹑纹用于九品文官补子。"}, {"period": "清代", "desc": "八品改明代黄鹂为鹌鹑，九品及未入流绣练雀。"}], "体系组成": "鹌鹑单独纹：鹌鹑独立呈现。鹌鹑配菊花纹：鹌鹑与菊花组合，寓意安居乐业。鹌鹑配竹纹：鹌鹑与竹组合，寓意竹报平安。", "寓意分条": ["平安如意：鹌鹑谐音“安”。", "安居乐业：鹌鹑与菊花组合。", "竹报平安：鹌鹑与竹组合。"], "属性": {"常用颜色": "以褐、绿、白等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "官服补子、袍服。", "应用部位": "前胸、后背补子。", "使用场合": "日常穿着。"}, "常见搭配": ["菊花纹", "竹纹", "花卉纹"], "相似纹样说明": "短圆尾短为鹌鹑，敦厚尾长为鸡。"}, {"编号": 84, "类别": "动物瑞兽", "类别内序号": 17, "纹样名称": "鹤纹", "盛行朝代": "明—清", "文化寓意": "鹤纹属于文官补子禽纹，仙鹤为文官一品补子。在明清两代，一品文官的补服上缀仙鹤补子。《诗经》云“鹤鸣九皋，声闻于天”，象征忠君与洪福齐天。中心均绣一白色仙鹤，双翅展开，回头上扬，空中有红蝠与云气纹，脚下是海中的礁石、蓝色的海水和翻腾的白色浪花。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/YhIiQ4Ek9c", "caption": "清·刺绣团鹤纹女式长袍"}, {"url": "https://aka.doubaocdn.com/s/IM2WSW7HHP", "caption": "明嘉靖·云鹤纹绸折褶大袖袍"}, {"url": "https://aka.doubaocdn.com/s/LCrV2da50p", "caption": "清晚期·红地鹤纹图案"}, {"url": "https://aka.doubaocdn.com/s/v9Jvk1SXca", "caption": "明·曲水地团凤织金双鹤胸背大袖衫"}, {"url": "https://aka.doubaocdn.com/s/tOXBh75TW2", "caption": "明·蓝织花纱缀绣仙鹤补服"}, {"url": "https://aka.doubaocdn.com/s/1wdsLTpcNR", "caption": "清·一品仙鹤丝绸织锦"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "鹤纹受道教升仙思想影响，开始出现于服饰，姿态飘逸。"}, {"period": "宋元", "desc": "鹤纹在瓷器、绘画中蔚为大观，宋徽宗《瑞鹤图》为一时之盛。"}, {"period": "明代", "desc": "明代一品文官圆领补子纹样为仙鹤纹，多采用双禽造型，一翔于天，一立于地。"}, {"period": "清代", "desc": "清代文官一品补服绣鹤。清康熙文官一品团鹤纹刺绣补子，金线铺地、色彩华美、刺绣工艺精湛。"}], "寓意分条": ["忠君洪福：仙鹤象征忠君与洪福齐天。", "高洁长寿：鹤为高洁长寿之鸟，与松、云、石组合成“松鹤延年”。", "一品当朝：鹤为一品鸟，寓意第一，一品是古代最高官阶的名称。"], "属性": {"常用颜色": "鹤纹以白色为主，补子以石青缎为地。仙鹤通身雪白，以白色丝线平绣，双翅展开处以浅灰、淡蓝丝线退晕，鹤顶以红色丝线点缀。补子上部为五彩祥云及红日，下部为海水江崖纹。", "常用布料": "暗花绸、绫、缎，彩绣禽纹。一品文官补子以立鹤为核心，补子的制作方法有织锦、刺绣和缂丝三种。", "适用衣物": "补服、官衣。", "应用部位": "前胸、后背各缀方形补子。补子中心绣一白色仙鹤，双翅展开，回头上扬，空中有红蝠与云气纹，脚下是海中的礁石。", "使用场景": "官员常朝、吉庆典礼、祭祀典礼。"}, "常见搭配": ["云纹", "蝙蝠纹", "海水江崖纹", "松石纹"]}, {"编号": 121, "类别": "动物瑞兽", "类别内序号": 54, "纹样名称": "鹭鸶纹", "盛行朝代": "明—清", "文化寓意": "鹭鸶纹是以鹭鸶为核心的装饰纹样。鹭鸶通体洁白，古人视其为“清介”之禽。明代六品文官补子即为鹭鸶。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/CyVGRqqcQU", "caption": "清中期文官六品鹭鸶纹纳纱绣补子"}, {"url": "https://aka.doubaocdn.com/s/kUnit3pEyX", "caption": "清道光文官六品鹭鸶纹缂丝补子"}, {"url": "https://aka.doubaocdn.com/s/J5Xnbwx3gm", "caption": "清康熙文官六品鹭鸶纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/szW9XqJV5w", "caption": "清乾隆文官六品鹭鸶纹刺绣补子"}, {"url": "https://aka.doubaocdn.com/s/RoFAz6eSv6", "caption": "清代鹭鸶纹补子"}, {"url": "https://aka.doubaocdn.com/s/XsLk8CFVxt", "caption": "清代大红色缎绣鹭鸶纹吉服"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "文官六品补子纹样为鹭鸶。"}, {"period": "清代", "desc": "发展出“一路连科”变体。"}], "体系组成": "鹭鸶单独纹：鹭鸶独立呈现。一路连科纹：鹭鸶与莲花组合，寓意一路连科。鹭鸶配水波纹：鹭鸶与水波纹组合。", "寓意分条": ["廉洁吉祥：鹭鸶羽毛洁白。", "等级标识：鹭鸶为六品文官补子纹样。", "一路连科：取“鹭”与“路”、“莲”与“连”的谐音。"], "属性": {"常用颜色": "以蓝、青、白等色为主。", "常用布料": "缎、缂丝、纱、绸。", "适用衣物": "官服补子。", "应用部位": "前胸、后背补子。", "使用场合": "官员常朝。"}, "常见搭配": ["莲花纹", "芦苇纹", "水波纹"], "相似纹样说明": "鹭鸶为六品文官补子，练鹊为未入流文官补子。"}, {"编号": 85, "类别": "动物瑞兽", "类别内序号": 18, "纹样名称": "鹰纹", "盛行朝代": "", "文化寓意": "鹰纹属于猛禽类纹样，以鹰为表现对象。在蒙古族服饰中，鹰图腾纹样是蒙古族文化的视觉语言。鹰在萨满传说中是天的神鸟使者。自元代起，官服上开始出现绣着不同纹样的补子以区分身份与地位，其中就包括“鹰逐兔纹”。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "赤地鹰联珠纹锦残片以鹰为主体图案，由联珠纹与散点结构连续，整体造型既体现了佛教内涵，又呈现出中西文化交融的显著特征。"}, {"period": "辽代", "desc": "辽代丝织物中“鹰隼”形象以行云流水之线条、惟妙惟肖之姿态成为极具时代特征的装饰纹样。"}, {"period": "元代", "desc": "鹰逐兔纹是元代官服补子上常见的装饰纹样，用于区分官员的身份与地位。"}], "寓意分条": ["勇猛善猎：鹰象征勇猛与善猎。", "神鸟使者：鹰在萨满传说中是天的神鸟使者。", "区分身份：元代官服补子上的鹰纹用于区分官员身份与地位。"], "属性": {"常用颜色": "以金线、彩线绣制。鹰身以赭褐、灰白为主，鹰羽以深色线细密勾勒，鹰目以金线点睛。底色常用红、青、藏蓝。", "常用布料": "织金锦、绸、缎、绫。元代鹰逐兔纹以织金锦为地，鹰纹以金线织出。", "适用衣物": "官服、蒙古族传统服饰。", "应用部位": "补子、衣身。辽代鹰隼纹饰多用于袍服的前胸、后背及袖部。", "使用场景": "官员常朝、狩猎活动、蒙古族节日盛装。"}, "常见搭配": ["兔纹", "鹅雁纹", "云纹", "联珠纹"]}, {"编号": 83, "类别": "动物瑞兽", "类别内序号": 16, "纹样名称": "鹿纹", "盛行朝代": "唐—清", "文化寓意": "鹿纹属于吉庆祥瑞类纹样，常被运用在服饰品中，不仅体现出吉祥福禄的美好意蕴。鹿在中国传统文化中对繁衍、长寿、仕途、神圣、祥瑞等具有不同寓意表达。两只鹿一起出现寓意“路路（鹿鹿）顺利”。因“绶”与“寿”同音，带有绶带的大角鹿被赋予了“长寿”的寓意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/Rm4I2U9Qw0", "caption": "明·驼色暗花缎地织金鹿纹补女袄"}, {"url": "https://aka.doubaocdn.com/s/duVuSxUFpw", "caption": "明·织金鹿纹补子局部"}, {"url": "https://aka.doubaocdn.com/s/NbjUphfRtq", "caption": "清同治·鹿纹补子"}, {"url": "https://aka.doubaocdn.com/s/OxEedFqj1e", "caption": "清·彩绣鹿纹吉服袍"}, {"url": "https://aka.doubaocdn.com/s/ND14VwPafm", "caption": "清·刺绣梅花鹿纹长绣片"}, {"url": "https://aka.doubaocdn.com/s/jLY3vCZ83d", "caption": "清咸丰·紫红缎边梅花鹿纹"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "联珠团窠环花树对鹿纹织锦，两只鹿一起出现寓意“路路顺利”。唐代诸王袍饰以盘龙及鹿。"}, {"period": "宋代", "desc": "宋朝道教广为流行，道教把鹿视为祥瑞长寿之兽，所以鹿纹样在宋代仍得以流传。"}, {"period": "辽金元", "desc": "辽金元时期的鹿纹艺术创作手法特殊，传递出北方游牧民族勇往直前、崇竞尚武、自由豪迈的民族精神。"}, {"period": "明清", "desc": "松鹿纹织金绫胸背等鹿纹织物见于传世收藏。"}], "寓意分条": ["福禄双全：鹿谐音“禄”，象征仕途腾达与长寿。鹿和蝙蝠在一起，表示“福禄双全”。", "路路顺利：两只鹿并出寓意“路路顺利”。", "长寿安康：带绶带的大角鹿被赋予了“长寿”的寓意。", "六合同春：鹿与鹤在一起，表示“六合同春”。"], "属性": {"常用颜色": "鹿纹多用赭黄、白色，配以青绿、赭褐。鹿身以赭黄丝线绣出，白色梅花斑以白色丝线点缀，鹿角以赭褐或金色线勾勒。底色常用米白、淡黄、青绿。", "常用布料": "织锦、妆花缎、绸、缎。联珠团窠环花树对鹿纹以织锦工艺织成，松鹿纹织金绫胸背以织金绫为地。", "适用衣物": "吉服、袄裙、云肩、肚兜、荷包、锦袍。", "应用部位": "衣身、裙摆、云肩、肚兜、荷包。", "使用场景": "吉庆典礼、婚嫁、寿诞、日常吉服。"}, "常见搭配": ["鹤纹", "松树纹", "蝙蝠纹", "灵芝纹", "盘长纹"]}, {"编号": 79, "类别": "动物瑞兽", "类别内序号": 12, "纹样名称": "麒麟纹", "盛行朝代": "明—清", "文化寓意": "麒麟纹属于武官补子兽纹，麒麟为龙首鹿身牛蹄狮尾的传说瑞兽，是“不折生草，不杀生灵”的仁兽。明清服装所绣麒麟一般多作两角，其首似龙，其尾似狮。作武官补寓意“以德服人”。明代公侯、驸马、伯用绣麒麟、白泽，清代武官一品补服绣麒麟纹。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/1YCEUJX6f6", "caption": "清·麒麟祥云纹补子"}, {"url": "https://aka.doubaocdn.com/s/ubUIxzcTnU", "caption": "清·宫廷满打籽老绣补子麒麟"}, {"url": "https://aka.doubaocdn.com/s/5qPs70MYKr", "caption": "清十八/十九世纪·石青地打籽绣麒麟武一品补子"}, {"url": "https://aka.doubaocdn.com/s/HlNDyBTM8p", "caption": "清·麒麟祥云纹饰补子"}, {"url": "https://aka.doubaocdn.com/s/LtgoxFiiaT", "caption": "清十九世纪·元青地绣麒麟武一品补子"}, {"url": "https://aka.doubaocdn.com/s/3MAdece7av", "caption": "清康熙·武官一品麒麟纹刺绣补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "洪武二十四年定公、侯、驸马、伯用绣麒麟、白泽。明代织物补子纹样之一种，原定为公、侯、伯、驸马所服，但实际使用颇滥。锦衣卫指挥侍卫者，得衣麒麟。1956年广州梅花村明代广东南海县人戴缙夫妻墓出土金线绣麒麟补子，麒麟侧身而坐，狮身鹿角，圆目尖耳，背飘火焰，四周簇拥如意祥云。"}, {"period": "清代", "desc": "清代武官一品补服绣麒麟纹，补子边缘绣回纹，其他纹饰有祥云、蝙蝠、暗八仙、如意、桃、牡丹、福山、寿海、红日、灵芝等。"}], "寓意分条": ["仁德祥瑞：麒麟为仁兽，象征仁德与祥瑞。", "以德服人：作武官补，希望武官“以德服人”，以智慧、智谋战胜敌人。", "麒麟送子：民间衍生“麒麟送子”之说，祈愿子嗣贤良。"], "属性": {"常用颜色": "补子底色以石青、浅玉色为主，麒麟以金线、彩绒绣制。金线绣麒麟身，鳞甲金光闪耀，鹿角以赭褐或金色线勾勒，背飘火焰以红、黄二色呈现，如意祥云以蓝、绿、紫等色退晕。", "常用布料": "暗花绸、绫、缎，彩绣兽纹。明代麒麟补子以平纹绢作底，运用金线平绣等针法绣制。清代补子多用石青缎为地，以金线、彩绒绣麒麟，补子四边绣回纹边饰。", "适用衣物": "补服、赐服、妆花纱衫。明代麒麟补子缀于常服前胸后背，清代武官一品补服为石青色对襟褂。", "应用部位": "前胸、后背各缀补子，补子边长约32厘米。补子正中为麒麟，上部为云纹，下部为海水、山峰、双胜、如意云、银锭等纹样。前片补子因对襟设计分为左右两半。", "使用场景": "官员常朝、吉庆典礼、祭祀典礼。"}, "常见搭配": ["云纹", "海水江崖纹", "蝙蝠纹", "杂宝纹"]}, {"编号": 123, "类别": "动物瑞兽", "类别内序号": 56, "纹样名称": "黄鹂纹", "盛行朝代": "", "文化寓意": "黄鹂纹是以黄鹂为核心的装饰纹样。黄鹂羽毛金黄，鸣声悦耳。明代八品文官补子即为黄鹂。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "文官八品绣黄鹂。"}, {"period": "清代", "desc": "八品黄鹂。"}], "体系组成": "黄鹂单独纹：黄鹂独立呈现。黄鹂配花卉纹：黄鹂与花卉组合。", "寓意分条": ["吉祥美好：黄鹂羽毛金黄。", "等级标识：黄鹂为八品文官补子纹样。", "春意盎然：黄鹂象征春天。"], "属性": {"常用颜色": "以黄、绿、蓝等色为主。", "常用布料": "缎、缂丝。", "适用衣物": "官服补子、袍服。", "应用部位": "前胸、后背补子。", "使用场合": "官员常朝。"}, "常见搭配": ["花卉纹", "柳纹", "祥云纹"], "相似纹样说明": "金黄羽毛为黄鹂，短圆体态为鹌鹑。"}, {"编号": 74, "类别": "动物瑞兽", "类别内序号": 7, "纹样名称": "龙凤纹", "盛行朝代": "", "文化寓意": "龙凤纹属于组合类吉祥纹样，将龙与凤两种神兽组合使用。龙凤形象集多种不同动物元素组合而成，象征着风调雨顺、天下安宁。龙凤纹样是各民族共同创造形成的传统吉祥纹样，上古时代，在人们的观念中，龙为鳞虫之长，凤为百鸟之王。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦至汉", "desc": "龙凤纹已见于楚墓绣品，江陵马山一号楚墓出土的丝织品服饰文物上有各种或变形或写实的凤鸟，与龙虎纹样相斗。"}, {"period": "唐宋", "desc": "唐代染织、铜镜、壁画上常见“舞凤”与“对凤”等纹饰。“对凤”从唐代开始逐渐流行，至宋代经历雌雄分化，逐渐产生了“鸾凤”之称。"}, {"period": "明清", "desc": "龙凤纹样广泛应用于婚嫁服饰。清代至民国时期的汉族平金银龙凤纹女嫁衣上，龙凤呈祥纹样呈现出一派喜庆祥和的景象。嫁衣上身为青缎平金银迭绣龙凤纹女褂，下装配大红缎平金绣龙凤纹马面裙。"}], "寓意分条": ["风调雨顺：龙为鳞虫之长，凤为百鸟之王，象征风调雨顺、天下安宁。", "夫妻和谐：寓意夫妻和谐，幸福长寿。", "喜庆祥和：婚嫁服饰上龙凤呈祥纹样呈现喜庆祥和的景象。"], "属性": {"常用颜色": "婚嫁服饰常用大红、青缎为地。大红缎地以金线盘绣龙凤，喜庆热烈；青缎地以金银线迭绣龙凤，沉稳华贵。龙凤之间以五彩祥云、牡丹、莲花等纹样填充。", "常用布料": "平金银绣、迭绣，绸、缎。嫁衣女褂多用青缎，以平金、平银绣龙凤。马面裙多用大红缎，平金绣龙凤。", "适用衣物": "婚嫁吉服、女褂、马面裙、龙袍、霞帔。", "应用部位": "衣身、门襟、裙摆、霞帔。女褂门襟左右对称绣对龙对凤，前胸后背绣团龙凤纹。", "使用场景": "婚嫁大典、吉庆典礼、命妇朝会。"}, "常见搭配": ["鸳鸯纹", "牡丹纹", "莲花纹", "祥云纹"]}, {"编号": 68, "类别": "动物瑞兽", "类别内序号": 1, "纹样名称": "龙纹", "盛行朝代": "战国—清（明代成为皇权专用）", "文化寓意": "龙纹属于神兽类纹样，以传说中的龙为表现对象，集鹿角、蛇身、鹰爪、鱼鳞等多种动物特征于一体。龙纹是中国传统服饰纹样中等级最高、规制最严的纹饰，其核心特征在于“纹以别等”——五爪为龙，四爪为蟒，龙纹为帝王专属，是皇权天授的视觉符号。龙纹应用于帝王袍服最早可追溯至《尚书》中舜帝与大禹的对话，龙列于十二章纹之中，装饰于袍服。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/OOBw5tt7lX", "caption": "明·御制刺绣水波游龙纹补子（特写）"}, {"url": "https://aka.doubaocdn.com/s/Y2DDzpN9Uw", "caption": "明·石青地织金锦团龙纹圆补"}, {"url": "https://aka.doubaocdn.com/s/jtfEk9wqxu", "caption": "明万历·行龙纹织金妆花缎"}, {"url": "https://aka.doubaocdn.com/s/ivP0vm1QAc", "caption": "明万历·定陵皇帝龙袍复制品"}, {"url": "https://aka.doubaocdn.com/s/OqGtHZKr9O", "caption": "明万历·藏青地织金龙纹锦"}, {"url": "https://aka.doubaocdn.com/s/I8ysqhVtwT", "caption": "明·织锦盘龙纹黄缎袍"}, {"url": "https://aka.doubaocdn.com/s/YbTTAHAXwe", "caption": "清·龙纹织锦局部"}, {"url": "https://aka.doubaocdn.com/s/vIq7BvFtSN", "caption": "明·红地云龙纹织金妆花纱龙袍料"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦至秦汉", "desc": "龙纹已列入帝王冕服“十二章”之一。周代把绘有龙纹的冕服称为衮冕，天子和公爵皆可穿着，但天子用升龙，公爵用降龙，以体现等级差别。战国时期龙纹由严谨的单独纹样发展为连续纹样，马山楚墓出土的“舞人动物纹锦”以波折线为骨架，填充对龙、对凤和对舞人物。"}, {"period": "唐代", "desc": "龙纹在织物上应用渐广，团龙纹已见于织物，新疆吐鲁番阿斯塔那出土的联珠对龙纹绮将龙纹安排在圆形团花中，构图丰满华丽。武则天首创诸王袍衫饰以盘龙。"}, {"period": "宋元", "desc": "龙纹使用虽未完全垄断，但“戏龙罗”已“唯供御服”。元代龙袍的纹样为过肩盘龙式，前胸和后背皆以大型柿蒂窠作过肩龙，两袖上部为行龙。"}, {"period": "明代", "desc": "龙纹使用采取高度管制，龙纹只能应用于皇室服饰，并禁止官民擅用。明代皇帝常服为黄色窄袖盘领袍，前后及两肩各织一金盘龙。赐服制度形成“蟒—飞鱼—斗牛—麒麟”序列，蟒与龙形似而减一爪。"}, {"period": "清代", "desc": "乾隆皇帝下令编纂《皇朝礼器图式》，以精美详细的图示说明各等级冠服形制，明确规范龙纹服饰的使用者与场合。八团彩云金龙纹样被认定为清代后妃吉服上的专用纹样。"}], "寓意分条": ["皇权天授：龙为帝王象征，寓意君权神授、至尊无上。", "江山永固：正龙稳坐江山，下摆海水江崖纹寓意江山永固、万世升平。", "子孙繁衍：子孙龙通常以小龙围绕大龙构成图纹，寓意龙子龙孙、江山永固。"], "属性": {"常用颜色": "龙纹以明黄、金黄为正色，帝王专用。龙身以金线织出，鳞甲闪烁。底色除明黄外，依场合与等级另有杏黄、金黄、石青、香色等。龙袍上五彩云纹为不可缺少的装饰图案，红、蓝、绿、紫等色穿插其间，红色蝙蝠纹即红蝠，发音与“洪福”相同。清代龙袍下摆海水江崖纹以蓝、白、金三色为主。龙纹刺绣还常用孔雀羽线捻入，使龙身在不同光线下呈现翠蓝光泽。", "常用布料": "高端龙纹用妆花缎、织金锦、妆花纱、缂丝。妆花缎以通经断纬、挖花盘织工艺织出龙纹，色彩可多达十余种，是龙袍最常用的面料；织金锦以金线显花，多用于蟒袍与吉服；妆花纱质地轻薄透气，适合夏季龙袍；缂丝以“一寸缂丝一寸金”著称，多用于宫廷赏赐与重要典仪。普通龙纹织物则用暗花绸、绫、罗等。", "适用衣物": "龙袍、蟒袍、朝袍、吉服袍、衮服、龙褂。皇帝龙袍为明黄色，皇子蟒袍用金黄色，亲王、郡王蟒袍用蓝及石青色。", "应用部位": "龙袍胸背正中绣正龙各一，两肩绣正龙各一，前后衣襟绣行龙各二，下摆绣行龙及海水江崖纹，袖端绣小行龙。前后望去皆见五条龙，寓意九五至尊。", "使用场景": "宫廷朝会、祭祀天地、太庙荐享、大婚盛典、万寿节、元旦、冬至等重大典礼。"}, "常见搭配": ["云纹", "海水江崖纹", "蝙蝠纹", "十二章纹", "八吉祥纹"]}, {"编号": 102, "类别": "动物瑞兽", "类别内序号": 35, "纹样名称": "龟纹", "盛行朝代": "", "文化寓意": "龟纹是以龟为核心的装饰纹样。龟在中国传统文化中象征长寿，龟鹤齐龄、龟龄鹤算均为祝寿之辞。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "龟鹤共现象征长寿的实例已见于薄太后陵。"}, {"period": "宋辽", "desc": "仙人龟鹤齐寿纹镜最为典型。"}, {"period": "明代", "desc": "朱檀墓出土“龟龄鹤算”纹二色绫巾。"}], "体系组成": "龟单独纹：龟独立呈现。龟鹤齐龄纹：龟与鹤组合。龟鹿纹：龟与鹿组合，寓意长寿得禄。龟背纹：六角形连续称为龟甲纹。", "寓意分条": ["长寿安康：龟象征长寿。", "龟龄鹤算：寓意长寿。", "道教长生：体现道教神仙思想。", "福禄寿全：龟鹿纹象征长寿、得禄。"], "属性": {"常用颜色": "以青、绿、白等色为主。", "常用布料": "绫、缎、绸。", "适用衣物": "袍服、绫巾、肚兜。", "应用部位": "衣身通身纹饰、肚兜围腹部分。", "使用场合": "寿诞吉庆。"}, "常见搭配": ["仙鹤纹", "松纹", "祥云纹", "鹿纹", "蝙蝠纹"], "相似纹样说明": "背甲为龟，疙瘩为蟾蜍。"}, {"编号": 224, "类别": "器物文字", "类别内序号": 11, "纹样名称": "书纹", "盛行朝代": "宋—明清", "文化寓意": "书纹是以书籍为核心形象的装饰纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/JJZ6ZVWnXQ", "caption": "清代白地纳纱绣琴棋书画袖口（孔子博物馆藏）"}, {"url": "https://aka.doubaocdn.com/s/0eGrvPMFoA", "caption": "清代金缎刺绣琴棋书画八团补子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "作为博古纹组成元素。"}], "寓意分条": ["书香门第：书纹象征学识。", "清雅高洁：书籍为文人雅器。", "金榜题名：书纹寓意科举及第。"], "属性": {"常用颜色": "以仿古色为主。", "常用布料": "缎、绸、直经纱。", "适用衣物": "袍服、女帔、女衫。", "应用部位": "博古纹饰组合。", "使用场合": "宫廷吉庆、文人雅集。"}, "常见搭配": ["画卷纹", 迦陵频伽纹样在服饰织物中广泛出现。"}], "寓意分条": ["妙音说法：迦陵频伽以美妙音声宣扬佛法。", "净土往生：象征西方极乐世界的美好。", "吉祥护佑：作为佛教护法形象。"], "属性": {"常用颜色": "以石绿色卷草与金色、红色为主。", "常用布料": "丝绸织物、绫绮等。", "适用衣物": "佛教法衣、供养人服饰。", "应用部位": "裙边、衣身边饰。", "使用场合": "佛教礼仪。"}, "常见搭配": ["莲花纹", "卷草纹", "石榴纹", "飞天纹"]}, {"编号": 49, "类别": "天象云水", "类别内序号": 10, "纹样名称": "云凤纹", "盛行朝代": "", "文化寓意": "云凤纹是凤纹与云纹组合的复合纹样，以凤凰翱翔于云层之中或栖立于云头之上为主要构图形式。云凤纹将凤凰的华美祥瑞与云的飘逸吉祥完美结合，是中国传统纹样中最为优美的组合之一，历代广泛应用于织锦、瓷器、家具和建筑彩画，象征吉祥如意、凤鸣朝阳、天下太平。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["绛红独幅大凤莲妆花缎", "黑地龙凤纹库锦", "云凤纹地织锦"], "朝代脉络": [{"period": "商周时期", "desc": "凤鸟纹在青铜器上已有出现，但尚未与云纹形成明确组合。"}, {"period": "汉代", "desc": "云气纹与凤鸟纹组合增多，画像石和织锦中常见凤鸟穿云的构图，体现升仙思想。"}, {"period": "魏晋南北朝", "desc": "云凤纹继续发展，佛教艺术中飞天与凤鸟组合出现，凤形更加灵动飘逸。"}, {"period": "隋唐时期", "desc": "云凤纹在织锦和金银器上盛行，唐代凤纹更加丰满华丽，云凤构图更加成熟，常见于宫廷织物。"}, {"period": "宋代", "desc": "云凤纹在宋锦和瓷器上广泛应用，宋代凤纹趋于秀雅，云凤构图更加精致。"}, {"period": "元代", "desc": "云凤纹在织金锦和青花瓷上继续发展，凤形更加豪放。"}, {"period": "明清时期", "desc": "云凤纹在宫廷织绣和官窑瓷器中大量使用，常与龙纹组合为”龙凤呈祥”，成为婚嫁和庆典的专用纹样。"}], "寓意分条": ["凤凰为百鸟之王，云为祥瑞之兆，云凤纹寓意吉祥如意、好运降临。", "凤凰在朝阳云中鸣叫，象征贤才出世、盛世太平。", "凤凰出现象征太平盛世，云凤纹寓意国泰民安、社会和谐。", "云凤纹常与龙纹组合为”龙凤呈祥”，象征夫妻和睦、婚姻美满。", "凤凰为高洁之鸟，居云端之上，象征品格高洁、地位尊贵。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色妆花，以金色和红色最为常见；瓷器青花蓝白、五彩、粉彩、斗彩；家具雕刻木本色或髹漆描金；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、家具雕刻、建筑彩画、金银器。", "适用衣物": "袍料、裙料、披肩、霞帔、靠垫织物。", "应用部位": "衣身主体纹样、裙料满地纹、器物腹部、家具装饰、建筑梁枋彩画。", "使用场景": "日常服饰、礼仪服饰、婚嫁织物、宫廷陈设、建筑装饰。"}, "常见搭配": ["龙纹", "花卉纹", "蝙蝠纹", "八宝纹", "卷草纹", "宝相花纹。"]}, {"编号": 42, "类别": "天象云水", "类别内序号": 3, "纹样名称": "云头纹", "盛行朝代": "", "文化寓意": "云头纹是以云朵头部形态为基本单元的装饰纹样，云头通常呈圆润团状或如意头形，常作为边饰、角花或开光边框使用。它既可单独出现，也可作为其他云纹的构成元素。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["云头纹织锦", "云头纹地锦", "云头纹边饰缎（清代氅衣/马褂可补充）"], "朝代脉络": [{"period": "汉代", "desc": "云气纹中已出现云头与云尾的结构区分，云头形态开始被单独强调。"}, {"period": "唐代", "desc": "云头更加圆润饱满，常作为主体纹样的边框或辅助装饰。"}, {"period": "宋代", "desc": "云头形态更精致，常用于瓷器、织锦的开光边框。"}, {"period": "元代", "desc": "云头受外来纹样和蒙古审美影响，出现多瓣团状云头。"}, {"period": "明代", "desc": "如意头形云头成熟，成为边饰、角花和开光的重要元素。"}, {"period": "清代", "desc": "云头纹高度程式化，广泛用于宫廷织绣、瓷器、家具和建筑彩画。"}], "寓意分条": ["云头源自云纹体系，天然带有祥瑞、吉庆的含义。", "云头多呈团状、心形或如意形，视觉上饱满完整，象征圆满无缺。", "云居高处，云头纹用于服饰和器物时，也含平步青云之意。", "当云头呈灵芝形时，兼具长寿、安康的寓意。", "云头纹常作边框和角花，起到稳定构图、烘托主体的作用，象征秩序与和谐。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；家具雕刻木本色或髹漆描金；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、家具雕刻、建筑彩画、金银器。", "适用衣物": "袍料、裙料、披肩、靠垫织物。", "应用部位": "边饰、角花、开光边框、器物口沿装饰。", "使用场景": "日常服饰、礼仪服饰、宫廷陈设、家具装饰、建筑装饰。"}, "常见搭配": ["花卉纹", "龙纹", "凤纹", "蝙蝠纹", "八宝纹", "卷草纹。"]}, {"编号": 47, "类别": "天象云水", "类别内序号": 8, "纹样名称": "云气纹", "盛行朝代": "", "文化寓意": "云气纹是中国古代最早期的云纹形态之一，以流畅飘逸、纵横交错的云气线条为特征，常呈S形、C形或卷曲形连续排列，充满动感和神秘气息。云气纹盛行于汉代，是汉代装饰艺术中最具代表性的纹样，广泛应用于漆器、织锦、铜器、瓦当和画像石，体现了汉代人对神仙世界和宇宙气韵的想象。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["绛紫色“长寿绣”丝绵袍（马王堆出土）", "乘云绣残片（马王堆出土）", "云气纹地锦"], "朝代脉络": [{"period": "商周时期", "desc": "云气纹的远源可追溯至商周青铜器上的云雷纹，但彼时云纹多为几何化、规整化的装饰，尚未形成自由流动的”气”的意象。"}, {"period": "春秋战国", "desc": "随着审美由庄严转向灵动，云纹逐渐摆脱几何束缚，出现流畅舒展的云气线条，南方楚文化影响下尤为明显，云气纹开始具有独立的装饰意义。"}, {"period": "汉代", "desc": "云气纹达到第一个高峰，成为汉代装饰的绝对主流。马王堆汉墓出土的”乘云绣”“长寿绣”中，云气纹与凤鸟、蔓草、瑞兽组合，构成完整的升仙图景。云气纹广泛用于漆器、织锦、铜器、瓦当、画像石等，形态丰富多变，有卷云式、穗状、钩连云等。"}, {"period": "魏晋南北朝", "desc": "云气纹继续与佛教艺术结合，逐渐抽象化、意境化，为后世云纹体系奠定基础。"}, {"period": "隋唐以后", "desc": "云气纹逐渐被更加程式化的祥云纹、如意云纹等取代，不再作为主流纹样，但其流动飘逸的美学精神深刻影响了后世云纹的发展。"}], "寓意分条": ["汉代神仙思想盛行，云气被视为神仙乘御之气，云气纹因此带有超凡脱俗、升仙飞升的深层含义。", "云气纹强调”气”的流动，体现古人”天地之气”的哲学观念，象征宇宙生命的流动与变化。", "马王堆汉墓云气纹常与”长寿”“吉祥”等文字组合，直接寄托长寿吉祥的愿望。", "云气弥漫天地之间，象征天地交泰、阴阳和合、万物生长。", "云气无拘无束、飘忽不定，象征精神自由、超脱尘世的理想境界。"], "属性": {"常用颜色": "漆器以朱红、黑为主，间以金彩；织锦多色妆花；铜器以本色或绿锈为效果；画像石以刻划线条为主。", "常用布料": "主要见于汉代织锦（如马王堆出土织物），也用于漆器、铜器、瓦当、画像石等。", "适用衣物": "汉代袍服、帷帐、披风等。", "应用部位": "器物通体装饰、织锦满地纹、漆器表面、瓦当面、画像石背景。", "使用场景": "宫廷与贵族服饰、丧葬器物、建筑装饰、宗教祭祀。"}, "常见搭配": ["凤鸟纹", "龙纹", "蔓草纹", "瑞兽纹", "仙人纹", "花卉纹。"]}, {"纹样名称": "云纹", "分类": "天象云水", "文化寓意": "云纹是以云气、云朵、云头云尾为母题的装饰纹样总称，不是单一纹样。它从原始漩涡纹、商周云雷纹发展而来，历代形态变化很大，常与龙、凤、瑞兽、花卉、寿字组合。", "朝代脉络": [{"period": "新石器—商周", "desc": "陶器漩涡纹为雏形；商周青铜器上形成云雷纹，多作地纹烘托主纹。"}, {"period": "战国—汉", "desc": "卷云纹、云气纹流行，线条舒展流动。马王堆汉墓“乘云绣”“长寿绣”可见云气与凤鸟、花叶结合。"}, {"period": "魏晋南北朝", "desc": "受佛教影响，出现勾云纹、带云纹，并常与莲花、忍冬组合。"}, {"period": "隋唐", "desc": "朵云、卷云更具体，云头云尾加强；盛唐以后与卷草、宝相花、龙凤结合更密。"}, {"period": "宋元", "desc": "风格转向清雅，如意云、叠云增多，构图更写实。"}, {"period": "明清", "desc": "团云、四合如意云、叠云广泛用于官服、织物、瓷器；常与龙纹、蝙蝠、寿字组合。"}], "体系组成": "云雷纹：回字形连续构图，圆形为云、方形为雷，多见于商周青铜器。卷云纹：由卷曲线条构成，汉魏常见。云气纹：流动带状云纹，汉代丝织品中常见。朵云：独立成团的云形，隋唐以后成熟。如意云/云肩纹：形似如意头，元明以后常见。团云：云头聚合为团，明代流行。叠云：多层弧旋勾卷叠加，清代尤盛。", "寓意分条": ["高升腾达：云有上升之意，常用于“平步青云”“飞黄腾达”。", "祥瑞降临：云气被视为天降吉兆，常与龙凤、瑞兽组合。", "长寿福寿：与蝙蝠、寿字、桃纹组合，寓意福寿绵长。", "仙境与升仙：汉代云气纹常表现升仙思想。", "流动不息：云纹连绵舒展，象征气运流转、生生不息。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩；织物中多见金地、红地、蓝地、绿地配彩绒。", "常用布料": "妆花缎、织金缎、缂丝、锦、绫、罗。", "适用衣物": "龙袍、吉服、补服、披风、帐幔、椅披、轿衣。", "应用部位": "衣身满地纹、袖口、领缘、下摆、开光边、边饰带、角隅。", "使用场合": "宫廷礼仪、寿庆、婚嫁、陈设、宗教与日常装饰。"}, "常见搭配": ["龙纹", "凤纹", "蝙蝠纹", "团寿字纹", "海水江崖纹", "缠枝纹", "八吉祥纹", "宝相花纹"], "相似纹样说明": "云纹常与卷草纹、如意纹、水纹相近。卷草纹以植物藤蔓为主，云纹以云气团块为主；如意云是云纹的一种，形似如意头；水纹多表现波浪、鱼鳞状水波，云纹则更强调升腾与祥瑞。", "图片": "", "实物图": "", "线稿图": ""}, {"编号": 50, "类别": "天象云水", "类别内序号": 11, "纹样名称": "云鹤纹", "盛行朝代": "", "文化寓意": "云鹤纹是鹤纹与云纹组合的复合纹样，以仙鹤翱翔于云层之中或栖立于云头之上为主要构图形式。云鹤纹将仙鹤的清逸高洁与云的飘逸祥瑞完美结合，是中国传统纹样中最具文人气质和道教意蕴的组合之一，历代广泛应用于织锦、瓷器、家具和建筑彩画，象征长寿吉祥、超凡脱俗、一品高升。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["红色绸绣金双喜万字地五彩云蝠鹤八团龙凤纹女棉袍（故宫藏）", "云鹤纹织锦", "云鹤纹地锦"], "朝代脉络": [{"period": "唐代", "desc": "鹤纹在金银器和织锦上已有出现，常与云纹、花卉组合，体现唐代人对仙鹤的喜爱和道教神仙思想的向往。"}, {"period": "宋代", "desc": "云鹤纹在宋锦和瓷器上开始流行，宋代鹤纹形态写实优雅，云鹤构图清雅脱俗，深受文人审美影响。"}, {"period": "元代", "desc": "云鹤纹在青花瓷和织金锦上继续发展，鹤形更加灵动。"}, {"period": "明清时期", "desc": "云鹤纹达到鼎盛，在宫廷织绣、官窑瓷器和家具雕刻中大量使用。明代官服中一品文官补子即为仙鹤，云鹤纹成为一品高升的象征；清代云鹤纹广泛用于宫廷陈设和官窑瓷器，构图更加丰富多样。"}], "寓意分条": ["鹤为长寿之鸟，云为祥瑞之兆，云鹤纹寓意健康长寿、吉祥如意。", "明代一品文官补子为仙鹤，云鹤纹象征官居一品、仕途显达。", "仙鹤为道教仙禽，乘云而行，象征超脱尘世、清高脱俗的精神境界。", "云鹤纹常与松树组合，构成”松鹤延年”的经典意象，寓意长寿安康。", "鹤飞云端，象征志向高远、前程远大。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色妆花；瓷器青花蓝白、五彩、粉彩、斗彩；家具雕刻木本色或髹漆描金；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、家具雕刻、建筑彩画、金银器。", "适用衣物": "袍料、补服、披肩、靠垫织物。", "应用部位": "衣身主体纹样、补子、器物腹部、家具装饰、建筑梁枋彩画。", "使用场景": "官服补子、日常服饰、宫廷陈设、文人书房装饰、祝寿礼品。"}, "常见搭配": ["松树纹", "灵芝纹", "花卉纹", "蝙蝠纹", "八宝纹", "太阳纹。"]}, {"编号": 48, "类别": "天象云水", "类别内序号": 9, "纹样名称": "云龙纹", "盛行朝代": "", "文化寓意": "云龙纹是龙纹与云纹组合的复合纹样，以龙身盘绕于云层之中或穿梭于云气之间为主要构图形式。云龙纹将龙的威猛雄健与云的飘逸祥瑞完美结合，是中国传统纹样中最为经典和尊贵的组合之一，历代广泛应用于宫廷服饰、官窑瓷器、建筑彩画和宗教器物，象征皇权天授、龙腾云海、祥瑞天降。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["明黄缎绣云龙纹吉服袍（故宫藏）", "宝蓝缎彩绣平金云龙纹朝袍（故宫藏）", "蓝色缂丝云龙纹单朝袍（故宫藏）"], "朝代脉络": [{"period": "商周时期", "desc": "龙纹与云雷纹在青铜器上已有组合使用的雏形，但龙与云尚未形成明确的”云龙”构图。"}, {"period": "汉代", "desc": "云气纹与龙纹组合增多，画像石和织锦中常见龙穿云气的构图，体现升仙思想。"}, {"period": "魏晋南北朝", "desc": "云龙纹继续发展，佛教艺术中飞天与云龙组合出现，龙形更加灵动。"}, {"period": "隋唐时期", "desc": "云龙纹在织锦和金银器上盛行，唐代龙纹更加雄健，云龙构图更加成熟，常见于宫廷织物和寺庙装饰。"}, {"period": "宋代", "desc": "云龙纹在官窑瓷器和织锦上广泛应用，宋代龙纹趋于秀雅，云龙构图更加精致严谨。"}, {"period": "元代", "desc": "云龙纹受蒙古审美影响，龙形更加粗犷豪放，云龙构图气势磅礴，常见于织金锦和青花瓷。"}, {"period": "明清时期", "desc": "云龙纹达到鼎盛，成为宫廷专属纹样，明代龙袍、清代龙袍均以云龙纹为主要装饰，五爪龙穿云纹为皇帝专用，等级森严。"}], "寓意分条": ["龙象征帝王，云象征天意，云龙纹寓意帝王受命于天、统治合法。", "龙在云中腾飞，象征事业腾达、权势显赫、前程万里。", "龙穿云出，寓意祥瑞从天降临、福泽广布。", "龙为司雨之神，云龙纹寄托风调雨顺、五谷丰登的期盼。", "龙能大能小、能升能隐，云变幻莫测，二者组合象征变化无穷、神通广大。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色妆花，以金色和红色最为尊贵；瓷器青花蓝白、五彩、粉彩、斗彩；建筑彩画以青绿为主调间以金彩。", "常用布料": "妆花缎、织金缎、缂丝、云锦；也广泛用于官窑瓷器、建筑彩画、金银器。", "适用衣物": "龙袍、官服、朝服、补服。", "应用部位": "衣身主体纹样、袍服下摆海水江崖上方、器物腹部、建筑梁枋、藻井。", "使用场景": "宫廷服饰、礼仪服饰、皇家建筑、宗教场所、祭祀器物。"}, "常见搭配": ["海水江崖纹", "火焰纹", "宝珠纹", "花卉纹", "八宝纹。"]}, {"编号": 43, "类别": "天象云水", "类别内序号": 4, "纹样名称": "卷云纹", "盛行朝代": "", "文化寓意": "卷云纹是以云尾卷曲形态为特征的装饰纹样，云形舒展流畅，云尾呈螺旋状或波浪状卷曲，线条优美灵动。它可单独使用，也可作为辅助纹样。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["绛紫色“长寿绣”丝绵袍（马王堆汉墓出土）", "明黄缎绣云龙纹吉服袍", "月白色缂丝彩云蓝龙袷龙袍"], "朝代脉络": [{"period": "春秋战国", "desc": "卷云纹由商周云雷纹简化、打散演变而来，线条更灵动，南方楚文化影响下出现流线型卷云。"}, {"period": "秦汉时期", "desc": "卷云纹发展成熟，广泛用于瓦当、青铜器、漆器和织锦，形态丰富生动。"}, {"period": "魏晋南北朝", "desc": "卷云纹逐渐抽象化，常与佛教装饰结合。"}, {"period": "隋唐时期", "desc": "卷云纹更加丰满圆润，常与花卉、鸟兽组合。"}, {"period": "宋元时期", "desc": "卷云纹线条更细腻，宋代云头变化增多，元代卷曲形态更豪放。"}, {"period": "明清时期", "desc": "卷云纹程式化增强，常作为地纹、边饰或与龙纹、凤纹组合。"}], "寓意分条": ["卷云源自云纹体系，象征祥瑞和吉庆。", "卷曲线条富有动感，象征自由洒脱、气韵流动。", "云居高天，卷云纹也含仕途顺利、平步青云之意。", "卷云回旋往复，线条连绵不断，象征福泽延续。", "卷云纹曲线柔和，体现东方装饰中”气韵生动”的审美。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩、斗彩；建筑彩绘青绿、金红；漆器朱黑配金。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、建筑彩画、金银器、漆器。", "适用衣物": "袍料、裙料、披肩、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰、建筑梁枋彩画。", "使用场景": "日常服饰、礼仪服饰、宫廷陈设、建筑装饰、宗教器物。"}, "常见搭配": ["花卉纹", "龙纹", "凤纹", "蝙蝠纹", "卷草纹", "八宝纹。"]}, {"编号": 62, "类别": "天象云水", "类别内序号": 23, "纹样名称": "叠石纹", "盛行朝代": "", "文化寓意": "叠石纹是以多块石头堆叠为主要构图的装饰纹样，石头错落有致、层次分明，常以连续方式排列形成装饰带。叠石纹是中国传统纹样中常见的石纹之一，历代广泛应用于陶瓷、织锦、家具雕刻和建筑彩画，象征基业稳固、层叠有序。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["叠石纹织锦", "叠石纹地锦", "叠石纹边饰缎（清代织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "叠石纹的雏形已在金银器和陶瓷上出现，以简单的石块堆叠表现山石景观。"}, {"period": "宋代", "desc": "叠石纹在瓷器和绘画上开始流行，形态写实细腻，深受文人画影响，常作为主题纹样的配景。"}, {"period": "元代", "desc": "叠石纹在青花瓷上继续发展，常与花卉、鸟兽组合构成完整画面。"}, {"period": "明清时期", "desc": "叠石纹在瓷器、家具和建筑彩画上广泛使用，构图更加丰富多样，叠石形态更加程式化，常与花卉、鸟兽组合。"}], "寓意分条": ["石头堆叠稳固，象征基业长青、传承不息。", "石头错落有致，象征秩序井然、有条不紊。", "石质坚硬，象征意志坚定、不可动摇。", "石象征永恒，叠石纹寓意福寿绵长、安康永驻。"], "属性": {"常用颜色": "织锦中蓝、绿、金多色；瓷器青花蓝白、五彩、粉彩；家具雕刻木本色或髹漆描金；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、云锦；也用于陶瓷、家具雕刻、建筑彩画。", "适用衣物": "袍料、裙料、披肩。", "应用部位": "衣身主体纹样、器物腹部、家具装饰、建筑梁枋彩画。", "使用场景": "日常服饰、宫廷陈设、文人书房装饰。"}, "常见搭配": ["花卉纹", "鸟纹", "兽纹", "云纹", "水纹。"]}, {"编号": 61, "类别": "天象云水", "类别内序号": 22, "纹样名称": "太湖石纹", "盛行朝代": "", "文化寓意": "太湖石纹是以太湖石为主要构图的装饰纹样，太湖石形态奇特、孔洞玲珑、姿态万千。太湖石纹是中国传统纹样中最具文人气质的石纹之一，宋代以来广泛应用于织锦、瓷器、家具雕刻和园林建筑，象征文人雅趣、品格高洁。太湖石因产于太湖地区而得名，以”瘦、皱、漏、透”四美著称，历来为文人雅士所珍爱。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["太湖石纹织锦", "太湖石纹地锦", "太湖石纹边饰缎（清代织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "太湖石已开始被文人雅士收藏，但尚未形成固定的纹样构图。"}, {"period": "宋代", "desc": "太湖石纹在瓷器和绘画上开始流行，形态写实细腻，深受文人审美影响，成为宋代文人雅士喜爱的纹样之一。宋徽宗曾在全国范围内征集太湖石，修建艮岳。"}, {"period": "元代", "desc": "太湖石纹在青花瓷上继续发展，常作为主题纹样的配景。"}, {"period": "明清时期", "desc": "太湖石纹在瓷器、家具和园林建筑上广泛使用，构图更加丰富多样，常与花卉、鸟兽组合构成完整画面。明代园林艺术兴盛，太湖石成为园林造景的重要元素。"}], "寓意分条": ["太湖石是文人雅士珍爱的赏石，象征文人高洁的品格和雅致的生活情趣。", "太湖石”瘦、皱、漏、透”，象征品格高洁、超凡脱俗。", "石质坚硬，象征意志坚定、不可动摇。", "石象征永恒，太湖石纹寓意福寿绵长、安康永驻。"], "属性": {"常用颜色": "织锦中蓝、绿、金多色；瓷器青花蓝白、五彩、粉彩；家具雕刻木本色或髹漆描金。", "常用布料": "妆花缎、织金缎、缂丝、云锦；也用于陶瓷、家具雕刻、园林建筑。", "适用衣物": "袍料、裙料、披肩。", "应用部位": "衣身主体纹样、器物腹部、家具装饰、园林造景。", "使用场景": "文人服饰、日常陈设、文人书房装饰、园林建筑。"}, "常见搭配": ["花卉纹", "鸟纹", "竹纹", "兰草纹", "云纹。"]}, {"编号": 64, "类别": "天象云水", "类别内序号": 25, "纹样名称": "太阳纹", "盛行朝代": "", "文化寓意": "太阳纹是以太阳为原型构成的装饰纹样，通常以圆形为中心，周围放射出光芒线条，表现太阳的光辉和温暖。太阳纹是中国最古老的装饰纹样之一，源于先民对太阳的崇拜，历代广泛应用于陶瓷、织锦、铜器、建筑和金银器，象征光明、生命、权威和永恒。太阳纹在不同时期形态各异，有简单的光点、放射线、火焰状光芒等多种表现方式。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["明万历黄缂丝十二章福寿如意衮服（定陵藏）", "清乾隆月白地云龙纹缂丝单朝袍", "太阳纹地织锦"], "朝代脉络": [{"period": "新石器时代", "desc": "太阳纹的雏形已在彩陶和岩画上出现，以圆圈加放射线表现太阳，是先民太阳崇拜的直接体现。"}, {"period": "商周时期", "desc": "太阳纹在青铜器上作为装饰元素出现，常与神鸟（金乌）组合，表现”日中有乌”的古老神话。"}, {"period": "汉代", "desc": "太阳纹在画像石和瓦当中广泛使用，常与月亮纹（玉兔、蟾蜍）对举，构成阴阳对称的装饰图案，体现汉代阴阳哲学。"}, {"period": "唐代", "desc": "太阳纹在织锦和金银器上流行，光芒形态更加华丽丰富，常与花卉、鸟兽组合，体现唐代开放包容的审美。"}, {"period": "宋代", "desc": "太阳纹在瓷器和织锦上继续发展，形态更加典雅精致，常作为辅助纹样或边饰使用。"}, {"period": "明清时期", "desc": "太阳纹在宫廷织绣和官窑瓷器中广泛使用，形态高度程式化，常与月亮纹、星辰纹组合构成”日月星辰”天象图案，象征皇权统御天地。"}], "寓意分条": ["太阳是光明的源泉，太阳纹寓意前途光明、希望无限、黑暗驱散。", "太阳滋养万物生长，太阳纹象征生命力旺盛、生机勃勃、万物繁荣。", "太阳象征帝王，太阳纹寓意帝王如日中天、统治天下、皇权永固。", "太阳每日升起落下，周而复始，象征永恒不变、长生不老。", "太阳与月亮对举构成阴阳对称，太阳纹在组合中象征阳刚、温暖、主动的宇宙力量。"], "属性": {"常用颜色": "织锦中红、金、黄多色为主，间以蓝绿；瓷器青花蓝白、五彩、粉彩；铜器本色或绿锈；建筑彩绘金红为主。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、铜器、建筑彩画、金银器。", "适用衣物": "龙袍、官服、袍料、裙料。", "应用部位": "衣身主体纹样、器物腹部、建筑藻井、铜器表面。", "使用场景": "宫廷服饰、礼仪服饰、皇家建筑、祭祀器物、宫廷陈设。"}, "常见搭配": ["月亮纹", "星辰纹", "云纹", "龙纹", "凤纹", "花卉纹。"]}, {"编号": 41, "类别": "天象云水", "类别内序号": 2, "纹样名称": "如意云纹", "盛行朝代": "", "文化寓意": "如意云纹是云纹的一种变体，云头呈如意头形，云尾舒展飘逸，整体形态如同如意。它将云的祥瑞寓意与如意的吉祥寓意结合，是宋元以后逐渐成熟、明清极为流行的装饰纹样，广泛用于织锦、瓷器、家具、建筑和金银器。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["香色凤纹漳绒女夹袍（故宫博物院藏）", "明黄缎绣云龙纹吉服袍（故宫博物院藏）", "黄色缂丝云蝠寿袷袍（故宫博物院藏）"], "朝代脉络": [{"period": "唐代", "desc": "云纹云头逐渐饱满，出现更接近自然云朵的形态，为后世如意云头奠定基础。"}, {"period": "宋代", "desc": "云纹趋向质朴内敛，如意云纹开始具有代表性，宋代以后工艺品上的云朵常绘成如意头形，称为”如意云”。"}, {"period": "元代", "desc": "云纹更加复杂，如意云 纹样，源于古人对夜空的观察和想象，历代广泛应用于陶瓷、织锦、铜器、建筑和金银器，象征光明指引、宇宙浩瀚、永恒不变。星辰纹常与太阳纹、月亮纹组合构成”日月星辰”完整天象图案，也常单独使用或作为地纹填充。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["明黄色缎绣彩云蝠寿字金龙纹男夹龙袍", "明万历黄缂丝十二章福寿如意衮服", "清乾隆月白地云龙纹缂丝单朝袍"], "朝代脉络": [{"period": "新石器时代", "desc": "星象纹的雏形已在彩陶和岩画上出现，以点状或十字形表现星辰，反映先民对星空的原始观察。"}, {"period": "商周时期", "desc": "星辰纹在青铜器上作为辅助纹样出现，常与云雷纹组合，表现天象与神权的结合。"}, {"period": "汉代", "desc": "星辰纹在画像石和瓦当中广泛使用，常与太阳、月亮组合，构成完整的宇宙图式，体现汉代天人感应思想。"}, {"period": "唐代", "desc": "星辰纹在织锦和金银器上流行，形态更加丰富多样，有五点星、四角星、圆点星等多种形式，常与花卉、云纹组合。"}, {"period": "宋代", "desc": "星辰纹在瓷器和织锦上继续发展，形态更加精致细腻，常作为辅助纹样或地纹使用，也见于天文仪器和星图。"}, {"period": "明清时期", "desc": "星辰纹在宫廷织绣和官窑瓷器中广泛使用，形态高度程式化，常与日月组合构成”日月星辰”天象图案，用于皇家服饰和祭祀器物，象征皇权统御天地万物。"}], "寓意分条": ["星辰在夜空中发光指引方向，星辰纹象征人生指引、前途明灯、智慧之光。", "星辰漫天象征宇宙的广阔无垠，星辰纹寓意胸怀天下、视野开阔、志向高远。", "星辰亘古长存，星辰纹象征永恒不变、天长地久、基业永固。", "星辰闪烁如宝石，星辰纹寓意吉祥璀璨、福泽满天、星光护佑。", "星辰运行有度、各司其职，星辰纹象征天地秩序、纲常伦理、有条不紊。"], "属性": {"常用颜色": "织锦中金、银、蓝、白多色；瓷器青花蓝白、五彩、粉彩；铜器本色；建筑彩绘金蓝为主。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、铜器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、霞帔。", "应用部位": "衣身主体纹样、器物腹部、建筑藻井、织锦地纹。", "使用场景": "宫廷服饰、礼仪服饰、皇家建筑、祭祀器物、宫廷陈设。"}, "常见搭配": ["太阳纹", "月亮纹", "云纹", "花卉纹", "龙纹", "凤纹。"]}, {"编号": 59, "类别": "天象云水", "类别内序号": 20, "纹样名称": "曲水纹", "盛行朝代": "宋—明", "文化寓意": "曲水纹是以蜿蜒曲折的溪流为主要构图的装饰纹样，溪水潺潺、蜿蜒流淌，常以连续方式排列形成装饰带。曲水纹是中国传统纹样中最具文人气质的水纹之一，宋代以来广泛应用于织锦、瓷器和建筑彩画，象征文人雅趣、岁月静好。“曲水”之名取自”曲水流觞”的典故，源自东晋王羲之《兰亭集序》中记载的文人雅集活动。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/zt1Oaf3GwI", "caption": "清同治·蓝色曲水地四合如意杂宝纹暗花缎马褂"}, {"url": "https://aka.doubaocdn.com/s/OVolK1ReFg", "caption": "清晚期·驼黄色曲水八宝纹暗花缎马褂"}, {"url": "https://aka.doubaocdn.com/s/ckq0tqXdof", "caption": "清·万字曲水纹服饰"}, {"url": "https://aka.doubaocdn.com/s/VlIL7n8qSn", "caption": "清同治·蓝色曲水地四合如意杂宝纹马褂"}, {"url": "https://aka.doubaocdn.com/s/Lxn2RionTH", "caption": "明·万字曲水纹绸对襟上衣"}, {"url": "https://aka.doubaocdn.com/s/UrI3EOA1F7", "caption": "明万历·万字曲水纹绸对襟上衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "曲水纹的雏形已在绘画和金银器上出现，但尚未形成固定的纹样构图。"}, {"period": "宋代", "desc": "曲水纹在宋锦和瓷器上开始流行，构图清雅脱俗，深受文人审美影响，成为宋代文人雅士喜爱的纹样之一。"}, {"period": "元代", "desc": "曲水纹在青花瓷上继续发展，溪流形态更加生动。"}, {"period": "明清时期", "desc": "曲水纹在织锦和瓷器上广泛使用，构图更加丰富多样，常与落花、鱼纹组合。"}], "寓意分条": ["曲水流觞是文人雅集的经典场景，曲水纹象征文人高洁的品格和雅致的生活情趣。", "溪水潺潺流淌，象征生活安宁、岁月静好。", "溪流蜿蜒不绝，象征文脉延续、传承不息。", "水善利万物而不争，象征品格高洁、谦逊包容。"], "属性": {"常用颜色": "织锦中蓝、绿、金多色；瓷器青花蓝白、五彩、粉彩。", "常用布料": "宋锦、云锦、缂丝；也用于瓷器、建筑彩画。", "适用衣物": "袍料、裙料、披肩。", "应用部位": "衣身主体纹样、器物腹部、建筑梁枋彩画。", "使用场景": "文人服饰、日常陈设、书院装饰。"}, "常见搭配": ["落花纹", "鱼纹", "水草纹", "云纹", "蝴蝶纹。"]}, {"编号": 65, "类别": "天象云水", "类别内序号": 26, "纹样名称": "月亮纹", "盛行朝代": "", "文化寓意": "月亮纹是以月亮形态为原型构成的装饰纹样，有新月形、满月形、半月形等多种表现方式，常与玉兔、蟾蜍、桂树等元素组合。月亮纹是中国传统装饰中重要的天象纹样，源于古人对月亮的观察和神话想象，历代广泛应用于陶瓷、织锦、铜器、建筑和金银器，象征团圆美满、温柔宁静、阴柔之美。月亮纹常与太阳纹对举，构成阴阳对称的装饰格局。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["明万历黄缂丝十二章福寿如意衮服（定陵藏）", "清乾隆月白地云龙纹缂丝单朝袍", "月亮纹地织锦"], "朝代脉络": [{"period": "新石器时代", "desc": "月亮纹的雏形已在彩陶上出现，以弧形或新月形表现月亮，反映先民对月相变化的观察。"}, {"period": "商周时期", "desc": "月亮纹在青铜器上作为装饰元素出现，常与太阳纹对举，表现阴阳观念。"}, {"period": "汉代", "desc": "月亮纹在画像石和瓦当中广泛使用，常与玉兔、蟾蜍、桂树组合，构成完整的月宫意象，与太阳纹的日中金乌形成阴阳对偶。"}, {"period": "唐代", "desc": "月亮纹在织锦和金银器上流行，形态更加优美细腻，常与花卉、云纹组合，体现唐代人对月亮的诗意想象。"}, {"period": "宋代", "desc": "月亮纹在瓷器和织锦上继续发展，形态更加典雅精致，深受文人审美影响，常作为绘画和器物的装饰元素。"}, {"period": "明清时期", "desc": "月亮纹在宫廷织绣和官窑瓷器中广泛使用，形态高度程式化，常与太阳纹、星辰纹组合构成”日月星辰”图案，也常单独用于表现中秋、团圆等主题。"}], "寓意分条": ["月圆象征团圆，月亮纹寓意家庭团聚、亲人相聚、婚姻美满。", "月光柔和清冷，月亮纹象征温柔恬静、安宁祥和的心境。", "月亮属阴，月亮纹象征女性之美、阴柔之德、含蓄内敛。", "古人望月思人，月亮纹寄托对远方亲人和故乡的思念之情。", "月光洁白无瑕，月亮纹象征品格高洁、清白无瑕、超凡脱俗。"], "属性": {"常用颜色": "织锦中白、银、蓝、绿多色为主，间以金色；瓷器青花蓝白、五彩、粉彩；铜器本色；建筑彩绘蓝白为主。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、铜器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、披肩、霞帔。", "应用部位": "衣身主体纹样、器物腹部、建筑藻井、铜器表面。", "使用场景": "日常服饰、礼仪服饰、宫廷陈设、建筑装饰、中秋庆典用品。"}, "常见搭配": ["太阳纹", "星辰纹", "云纹", "花卉纹", "玉兔纹", "桂花纹。"]}, {"编号": 44, "类别": "天象云水", "类别内序号": 5, "纹样名称": "朵云纹", "盛行朝代": "", "文化寓意": "朵云纹是以团状云朵为基本单元的装饰纹样，云形圆润饱满如花朵，常以散点或连续方式排列。它形态独立完整，可作地纹，也可作辅助纹样。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["宋代米色罗地朵云纹女衫（福建省博物馆藏）", "明代月白暗花朵云纹文人袍（孔子博物馆藏）", "清代淡蓝朵云纹刺 料"}, {"url": "https://aka.doubaocdn.com/s/i7BzTcv2gA", "caption": "明清·缂丝海水江崖纹龙袍"}, {"url": "https://aka.doubaocdn.com/s/53sIxxZNJL", "caption": "清·织锦海水江崖云龙纹绣片"}, {"url": "https://aka.doubaocdn.com/s/YLTGMLZsWK", "caption": "清·宫廷绣海水江崖小片"}], "线稿图": [], "复原设计图": [], "对应文物": ["明黄缎绣云龙纹吉服袍（故宫藏）", "宝蓝缎彩绣平金云龙纹朝袍（故宫藏）", "黄色缂丝云蝠寿袷袍（故宫藏）"], "朝代脉络": [{"period": "宋代", "desc": "海水纹和山石纹在瓷器上已有单独使用，但尚未形成固定的”海水江崖”组合构图。"}, {"period": "元代", "desc": "海水江崖纹开始出现在青花瓷上，海浪和山崖的组合构图逐渐成熟，气势磅礴。"}, {"period": "明代", "desc": "海水江崖纹成为宫廷服饰的固定纹样，龙袍下摆必饰海水江崖，寓意”江山永固”。明代官窑瓷器也大量使用海水江崖纹，构图严谨、浪涛汹涌。"}, {"period": "清代", "desc": "海水江崖纹达到鼎盛，在龙袍、官服、官窑瓷器和宫廷家具中广泛使用。清代海水江崖纹构图更加繁复精致，浪花中常加入”万寿”“卍字”等吉祥符号，寓意更加丰富。"}], "寓意分条": ["海水江崖纹达到鼎盛，在龙袍、官服、官窑瓷器和宫廷家具中广泛使用。清代海水江崖纹构图更加繁复精致，浪花中常加入”万寿”“卍字”等吉祥符号，寓意更加丰富。", "海浪翻腾、山崖耸立，构图完整。", "仅海浪部分，浪花飞溅、波涛汹涌。", "仅山崖部分，岩石嶙峋、山峰耸立。", "海水江崖中垂直向下的浪涛线条。", "海水江崖中水平展开的波浪线条。", "浪花中加入”万寿”“卍字”“蝙蝠”等符号。", "海象征疆域辽阔，崖象征江山稳固，海水江崖纹寓意国家江山永固、政权稳固。", "山象征福寿绵长，海象征福泽深远，寓意福如东海、寿比南山。", "海水环绕山崖，象征天下一统、四海归心。", "海浪翻腾、气势磅礴，象征事业兴旺、前程远大。", "山崖陡峭坚固，象征意志坚定、基业稳固。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色妆花，以金色和蓝色为主；瓷器青花蓝白、五彩、粉彩、斗彩；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、云锦；也广泛用于官窑瓷器、建筑彩画、家具雕刻。", "适用衣物": "龙袍、官服、朝服、补服。", "应用部位": "龙袍和官服下摆、器物腹部和底部、建筑台基和栏杆、家具裙板。", "使用场景": "宫廷服饰、礼仪服饰、皇家建筑、官窑瓷器、宫廷家具。"}, "常见搭配": ["云龙纹", "云凤纹", "火焰纹", "宝珠纹", "蝙蝠纹", "卍字纹。"]}, {"编号": 63, "类别": "天象云水", "类别内序号": 24, "纹样名称": "火珠纹", "盛行朝代": "", "文化寓意": "火珠纹是以火焰和火珠为主要构图的装饰纹样，火焰向上腾跃、火珠圆润饱满，常以连续方式排列形成装饰带。火珠纹是中国传统装饰中重要的火元素纹样，源于古代对火的崇拜和观察，历代广泛应用于陶瓷、织锦、金银器和建筑彩画，象征光明温暖、兴旺发达。火珠纹常与龙纹、凤纹组合出现，位于龙首或凤喙之中，象征宝珠献瑞。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["明黄缎绣云龙纹吉服袍", "宝蓝缎彩绣平金云龙纹朝袍", "火珠纹地织锦"], "朝代脉络": [{"period": "新石器时代", "desc": "火焰纹的雏形已在彩陶上出现，以简单的三角形或锯齿形表现火焰。"}, {"period": "商周时期", "desc": "火焰纹在青铜器上作为辅助纹样出现，常位于器身底部或口沿边缘，形态较为抽象。"}, {"period": "汉代", "desc": "火珠纹开始成型，火珠形象征太阳和光明，常与龙纹、瑞兽组合，出现在画像石和织锦上。"}, {"period": "唐代", "desc": "火珠纹在金银器和陶瓷上广泛使用，火焰形态更加生动华丽，火珠常作宝珠状，位于龙首或摩羯鱼口中有”戏珠”之意。"}, {"period": "宋代", "desc": "火珠纹在瓷器和织锦上继续发展，形态更加精致典雅，常作为辅助纹样装饰器物边缘。"}, {"period":
