": 19, "纹样名称": "喜上眉梢纹", "盛行朝代": "明—清", "文化寓意": "喜上眉梢纹是以喜鹊立于梅梢为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。古人将鹊叫和客至联系起来，或以鹊叫为喜，示团圆相聚。鹊和梅的组合，示喜上眉梢，梅与眉谐音，此为吉祥图案常用艺术手法，多见于明清工艺美术的纹样中。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/MttVUWGGTd", "caption": "清代刺绣喜上眉梢纹绣品"}, {"url": "https://aka.doubaocdn.com/s/PHSwCDGe34", "caption": "清代蓝地绣喜上眉梢图缂丝挂帐"}, {"url": "https://aka.doubaocdn.com/s/15AeOHCtLV", "caption": "清代蓝地绣喜上眉梢图缂丝挂帐"}, {"url": "https://aka.doubaocdn.com/s/UXQ0CrLymV", "caption": "清代刺绣喜上眉梢"}, {"url": "https://aka.doubaocdn.com/s/l2GW2sB6zz", "caption": "清代蓝地绣喜上眉梢图缂丝挂帐"}, {"url": "https://aka.doubaocdn.com/s/iEepaiATHs", "caption": "清代喜上眉梢纹长绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "辽宋金元", "desc": "禽鸟类动物纹样题材被大量运用到器物中，种类丰富，形色美艳，姿态生动，与花卉、璎珞、绶带等组合，生趣盎然。"}, {"period": "明清", "desc": "喜上眉梢纹多见于明清工艺美术的纹样中。米白地彩绣喜上梅梢纹下端宽形肚兜上，主要纹饰为围腹口袋上的喜上梅梢纹。"}], "寓意分条": ["喜上眉梢：喜鹊立于梅梢，寓意喜上眉梢。", "团圆相聚：古人将鹊叫和客至联系起来，或以鹊叫为喜，示团圆相聚。", "喜庆意涵：喜鹊立于梅梢寓意喜上眉梢，充满喜庆意涵。"], "属性": {"常用颜色": "以白、蓝、红等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "肚兜、女褂、袍服。", "应用部位": "围腹口袋、衣身通身纹饰。", "使用场景": "日常穿着、吉庆典礼。"}, "常见搭配": ["盘长纹", "花卉纹", "蝴蝶纹"]}, {"编号": 286, "类别": "组合吉祥", "类别内序号": 18, "纹样名称": "四君子纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "四君子纹是以梅、兰、竹、菊组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。梅兰竹菊为文人所颂，人称“花中四君子”，其品质分别为“傲、幽、坚、淡”，象征着自强不息，清华其外，澹泊其中，不作媚世之态。在中国传统文化中，“四君子”用来引喻圣人的高尚的内在品德、处事原则。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/VVhqRJCg8j", "caption": "清代石青地金竹兰褂襕样"}, {"url": "https://aka.doubaocdn.com/s/zDCVQ8zzPz", "caption": "清代织锦梅兰竹菊四君子花边"}, {"url": "https://aka.doubaocdn.com/s/ValwdWfJk3", "caption": "清代织锦梅兰竹菊四君子花边"}, {"url": "https://aka.doubaocdn.com/s/idTdV6vhUp", "caption": "清代四君子纹宫廷服饰"}, {"url": "https://aka.doubaocdn.com/s/BZN0TISCYl", "caption": "清代四君子纹宫廷服饰"}, {"url": "https://aka.doubaocdn.com/s/wDm330eaSc", "caption": "清末双面绣梅兰竹菊四君子纹绣片"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "四君子纹受士大夫“比德”审美影响，竹纹成为女性服饰新宠，纹样摒弃唐代繁复，转向写实清雅，多以单枝折枝形式绣于襦衫袖口、衣襟。"}, {"period": "明清", "desc": "四君子纹在服饰中广泛使用。清代服饰的纹样使用讲究“图必有意，意必吉祥”，四君子所蕴含的美好寓意正是人们所追求的。"}], "寓意分条": ["高洁品德：四君子用来引喻圣人的高尚的内在品德、处事原则。", "自强不息：象征自强不息，清华其外，澹泊其中，不作媚世之态。", "君子之风：梅兰竹菊为文人所颂，人称“花中四君子”。"], "属性": {"常用颜色": "以青、绿、白、墨等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "挽袖、女衫、袍服。", "应用部位": "袖口、衣襟、挽袖主体。", "使用场景": "日常穿着、文人雅集。"}, "常见搭配": ["诗文纹", "博古纹", "花卉纹"]}, {"编号": 297, "类别": "组合吉祥", "类别内序号": 29, "纹样名称": "天官赐福纹", "盛行朝代": "明清（盛行于明清）", "文化寓意": "天官赐福纹是以道教天官为核心构图的装饰纹样，属于组合吉祥纹样中的神仙人物类。天官为道教三官之一，全称“上元一品赐福天官紫微大帝”，每逢正月十五日，即下人间，校定人之罪福，故称“天官赐福”。天官赐福纹在传统服饰中常用于吉服、袍服装饰，寓意天官赐福、吉祥如意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/3rn3oFUK7L", "caption": "清乾隆苏绣天官赐福"}, {"url": "https://aka.doubaocdn.com/s/cgqU6t4VT7", "caption": "清缎绣天官赐福条幅"}, {"url": "https://aka.doubaocdn.com/s/VasFXsCZ8B", "caption": "灰色绸地绣天官赐福纹童褂"}, {"url": "https://aka.doubaocdn.com/s/6s1znlwUx6", "caption": "清代手工刺绣天官赐福人物"}, {"url": "https://aka.doubaocdn.com/s/AkP3wK3LV6", "caption": "清代宫廷巨幅刺绣天官赐福"}, {"url": "https://aka.doubaocdn.com/s/ZVFaFqv6w4", "caption": "清代手工刺绣天官赐福人物"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "道教三官信仰盛行，天官赐福题材在绘画和器物装饰中已有出现。"}, {"period": "明清", "desc": "天官赐福纹在服饰中广泛使用。天官赐福纹常与福禄寿三星、八仙等组合，用于吉服袍、寿幛装饰。"}], "寓意分条": ["天官赐福：天官赐福纹寓意天官赐福、吉祥如意。", "校定罪福：天官每逢正月十五日，即下人间，校定人之罪福。", "福气临门：天官赐福纹寓意福气临门、福运亨通。"], "属性": {"常用颜色": "以红、蓝、金等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "吉服袍、袍服、挂屏。", "应用部位": "衣身通身纹饰、团花单元。", "使用场景": "吉庆典礼、寿诞吉庆。"}, "常见搭配": ["福禄寿三星纹", "八仙纹", "祥云纹"]}, {"编号": 272, "类别": "组合吉祥", "类别内序号": 4, "纹样名称": "太师少师纹", "盛行朝代": "明—清", "文化寓意": "太师少师纹是以一大一小两只狮子为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。古代官制有太师、少师。太师位列三公，少师则位列三孤，均为指导、辅弼天子执政的显宦。大狮子小狮子，“大”与“太”通，“小”与“少”通，“狮”则与“师”谐音，大狮、小狮即太师、少师，寓为高官厚禄。太师少师成为汉族传统寓意富贵吉祥的纹样，大小狮子喻太师、少师，寓世世代代高官厚禄。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/xbO38aVXA3", "caption": "清代白缎地平金打籽绣太师少师"}, {"url": "https://aka.doubaocdn.com/s/PUIwpCMxWC", "caption": "清代白色缎绣太狮少狮纹桌屏"}, {"url": "https://aka.doubaocdn.com/s/KQXuYQseYj", "caption": "清代三蓝打籽绣太狮少狮镜心"}, {"url": "https://aka.doubaocdn.com/s/qXLIrKMvz5", "caption": "清代盘金绣太狮少狮"}, {"url": "https://aka.doubaocdn.com/s/OdFUG5EBcz", "caption": "金线绣太师少师"}, {"url": "https://aka.doubaocdn.com/s/bsOwbVV9to", "caption": "清代盘锦绣太师少保纹桌围子"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "西周", "desc": "太师、少师官名始置。"}, {"period": "元代", "desc": "元代青花八棱狮球纹玉壶春瓶为太师少师纹的早期实例。"}, {"period": "明清", "desc": "太师少师纹广泛应用于各类艺术品和建筑装饰，如明清官服补子、清代沈铨《太师少师图》等。黄色缎绣太狮少狮百鸟朝凤活计为清光绪皇帝御用佩饰。"}], "寓意分条": ["高官厚禄：太师少师纹寓意世世代代高官厚禄。", "官禄相传：象征官禄代代相传之意。", "财源滚滚：滚绣球代表财源滚滚。", "事事如意：太师少师纹代表仕途顺利且事事如意的寓意。"], "属性": {"常用颜色": "以石青、黄、红等色为主。黄色缎绣太狮少狮百鸟朝凤活计以黄色缎为地，彩绣太狮、少狮、百鸟朝凤等纹样，色彩富丽。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、佩饰活计、桌围。", "应用部位": "衣身通身纹饰、佩饰主体、桌围主体。", "使用场景": "吉庆典礼、日常穿着、宫廷佩饰。"}, "常见搭配": ["百鸟朝凤纹", "滚绣球纹", "祥云纹"]}, {"编号": 285, "类别": "组合吉祥", "类别内序号": 17, "纹样名称": "岁寒三友纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "岁寒三友纹是以松、竹、梅组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。松竹梅是高洁坚韧的象征。岁寒三友是中华民族传统吉祥纹样，常被用于家具、瓷器、织绣的装饰中。松、竹、梅这三种耐严寒的植物合画在一起，比喻经得起考验的友谊，取名为“岁寒三友”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/B4aJxVVDZi", "caption": "清代五彩三蓝绣岁寒三友"}, {"url": "https://aka.doubaocdn.com/s/dMMU2nhKAG", "caption": "清代五彩三蓝老绣古董绣岁寒三友"}, {"url": "https://aka.doubaocdn.com/s/tYT2rosUTq", "caption": "清十九世纪绿地岁寒三友纹女袍"}, {"url": "https://aka.doubaocdn.com/s/urd5E0zUer", "caption": "清代五彩三蓝绣岁寒三友"}, {"url": "https://aka.doubaocdn.com/s/s3Lx8KA8Mx", "caption": "清代五彩三蓝绣岁寒三友"}, {"url": "https://aka.doubaocdn.com/s/LGYk9SN7Ih", "caption": "清代五彩三蓝绣岁寒三友"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋以后", "desc": "人们常将几种不同形状的图案配合在一起，或寄于“寓意”。如将松、竹、梅这三种耐严寒的植物合画在一起，比喻经得起考验的友谊。"}, {"period": "明代", "desc": "“岁寒三友”纹作为中国传统文化中的重要视觉符号，其组合的形成经历了从自然物象到文化意象的历时性建构过程。"}, {"period": "清代", "desc": "岁寒三友纹在服饰中广泛使用。清乾隆香色地八团喜相逢纹织金缎袷袍下幅为凤戏牡丹，并有松、竹、梅，寓意“岁寒三友”。"}], "寓意分条": ["高洁坚韧：松竹梅是高洁坚韧的象征。", "友谊长存：比喻经得起考验的友谊。", "正直坚忍：象征正直坚忍、高风亮节等超群品格。", "长寿延年：除寓意高寿之外，亦象征正直坚忍、高风亮节。"], "属性": {"常用颜色": "以青、绿、白等色为主。", "常用布料": "缎、缂丝、刺绣。", "适用衣物": "袷袍、袍服、织物。", "应用部位": "衣身通身纹饰、下幅装饰。", "使用场景": "日常穿着、吉庆典礼。"}, "常见搭配": ["玉兰纹", "海棠纹", "牡丹纹", "灵芝纹", "水仙纹"]}, {"编号": 303, "类别": "组合吉祥", "类别内序号": 35, "纹样名称": "平安如意纹", "盛行朝代": "明清（盛行于清）", "文化寓意": "平安如意纹是以瓶和如意组合为核心构图的装饰纹样，属于组合吉祥纹样中的器物类。瓶谐音“平”，寓意平安；如意象征称心如意。平安如意纹在传统服饰中常用于袍服、女褂装饰，寓意平安如意、吉祥美满。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/tHSRxGk4T3", "caption": "清代红色地龟背如意纹织金锦"}, {"url": "https://aka.doubaocdn.com/s/PwO32bkfCK", "caption": "明黄色纱绣八团富贵平安如意纹女单袍"}, {"url": "https://aka.doubaocdn.com/s/dVX598ysUr", "caption": "清代沉香色地龟背如意瑞花纹锦"}, {"url": "https://aka.doubaocdn.com/s/5XJGO0k3z0", "caption": "清代兰地万寿如意锦"}, {"url": "https://aka.doubaocdn.com/s/vdSov4Mt1G", "caption": "清代如意纹服饰"}, {"url": "https://aka.doubaocdn.com/s/q2AXxmSUXs", "caption": "清代吉祥如意绣件"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "平安如意纹在服饰中广泛使用。瓶花纹广泛流行，成为博古纹的核心元素，以瓶子为主题的图案普遍存在于传统服饰及荷包、腰包等服饰品中。"}], "寓意分条": ["平安如意：瓶谐音“平”，如意象征称心如意，寓意平安如意。", "吉祥美满：平安如意纹寓意吉祥美满、万事如意。", "平安富贵：瓶花纹因瓶与平安的平谐音，花又有富贵之意，故瓶花纹寓意平安富贵。"], "属性": {"常用颜色": "以蓝、红、金等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、女褂、荷包。", "应用部位": "衣身通身纹饰、荷包袋面。", "使用场景": "日常穿着、吉庆典礼。"}, "常见搭配": ["花卉纹", "杂宝纹", "如意纹"]}, {"编号": 273, "类别": "组合吉祥", "类别内序号": 5, "纹样名称": "松鹤延年纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "松鹤延年纹是以松树和仙鹤组合为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。鹤相传为长寿的一种禽鸟，又因传为长寿，故与松相组合，称为“松鹤延年”，象征长寿。在明代，鹤的形象被广泛应用于官服制度，一品官员的官服上饰以仙鹤。松树与仙鹤纹饰寓意福寿绵长。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/dD1Ez7pvNE", "caption": "清乾隆·松鹤纹老旦帔"}, {"url": "https://aka.doubaocdn.com/s/bnSGYhVNqV", "caption": "清乾隆·松鹤纹老旦帔"}, {"url": "https://aka.doubaocdn.com/s/xe4CMU2kR3", "caption": "清乾隆·松鹤纹老旦帔"}, {"url": "https://aka.doubaocdn.com/s/PVx6JnPVTk", "caption": "清代咸丰吉服褂圆形松鹤图案"}, {"url": "https://aka.doubaocdn.com/s/O88EBv2Lm6", "caption": "清乾隆·松鹤纹老旦帔局部"}, {"url": "https://aka.doubaocdn.com/s/UWSFeM7GBZ", "caption": "清代松鹤延年一品当朝官袍刺绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "汉代是较早在服饰当中运用鹤纹的朝代。"}, {"period": "明代", "desc": "鹤的形象被广泛应用于官服制度，一品文官官服补子即为仙鹤纹样，仙鹤因此被称为“一品之尊”的贵鸟。云鹤纹寓意延年益寿，鹤与松树纹的结合则寓意松鹤延年。"}, {"period": "清代", "desc": "松鹤延年纹广泛应用于工艺品及织物装饰。南通蓝印花布将“鹤寿延年”与“福寿双全”等纹样组合。清乾隆年间的戏服松鹤纹老旦帔为典型实例。"}], "寓意分条": ["长寿延年：松鹤延年纹象征长寿。", "福寿绵长：松树与仙鹤纹饰寓意福寿绵长。", "一品高官：明代一品文官补子为仙鹤，仙鹤被称为“一品之尊”的贵鸟。"], "属性": {"常用颜色": "以青、绿、白、金等色为主。松鹤纹老旦帔以青、绿色丝线绣制松树，白色丝线绣制仙鹤，金色丝线勾边，色彩雅致。", "常用布料": "缎、绸、刺绣、蓝印花布。", "适用衣物": "袍服、女帔、荷包。", "应用部位": "衣身通身纹饰、补子、荷包袋面。", "使用场景": "寿诞吉庆、宫廷庆典、日常穿着。"}, "常见搭配": ["鹿纹", "蝙蝠纹", "祥云纹", "寿字纹"]}, {"编号": 305, "类别": "组合吉祥", "类别内序号": 37, "纹样名称": "榴开百子纹", "盛行朝代": "明清（盛行于明清）", "文化寓意": "榴开百子纹是以石榴绽开、露出籽粒为核心构图的装饰纹样。石榴一果多籽，古人以“榴开百子”寓喻“百子同室”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/amahfXXJhS", "caption": "清代榴开百子纹刺绣"}, {"url": "https://aka.doubaocdn.com/s/H3YdmQUxMU", "caption": "明代百子衣复原"}, {"url": "https://aka.doubaocdn.com/s/lKBVmWDz5D", "caption": "明代红素罗绣平金龙百子花卉方领女夹衣"}, {"url": "https://aka.doubaocdn.com/s/yJHJso4DlY", "caption": "定陵出土百子衣"}, {"url": "https://aka.doubaocdn.com/s/Tme0fsTdWr", "caption": "明定陵出土刺绣百子衣复制"}, {"url": "https://aka.doubaocdn.com/s/58qwlc54WY", "caption": "19世纪蓝地百子图织锦女褂"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "六朝", "desc": "石榴自六朝起便被赋予多子多福的吉祥寓意。"}, {"period": "明清", "desc": "榴开百子纹在服饰中广泛使用。"}], "体系组成": "榴开百子单独纹：石榴绽开露出籽粒。榴开百子配童子纹：石榴与童子组合。榴开百子配蝴蝶纹：石榴与蝴蝶组合。", "寓意分条": ["多子多福：榴开百子纹寓意多子多福。", "子孙众多：石榴绽开寓意子孙众多。", "家族兴旺：榴开百子纹承载家族兴旺的美好愿景。"], "属性": {"常用颜色": "以红、绿、蓝等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "肚兜、袍服、被褥、童服。", "应用部位": "衣身通身纹饰、肚兜围腹部分。", "使用场合": "婚嫁吉庆。"}, "常见搭配": ["童子纹", "蝴蝶纹", "花卉纹"], "相似纹样说明": "石榴绽开为榴开百子纹，瓜与蝴蝶为瓜瓞绵绵纹。"}, {"编号": 288, "类别": "组合吉祥", "类别内序号": 20, "纹样名称": "玉堂富贵纹", "盛行朝代": "明清（盛行于明中晚期至清）", "文化寓意": "玉堂富贵纹是以玉兰、海棠、牡丹组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。玉堂是翰林院榜眼的雅称，亦指嫔妃所居之处或神仙居处，因与玉兰花之“玉”、海棠之“棠”谐音，而牡丹寓意富贵，所以此三种花组合的图案寓意玉堂富贵，多用于绘画、器物的装饰图案。该纹样自五代形成固定范式后，在清代逐步从精英阶层的身份象征泛化为民间普适的吉祥符号。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/JHUU2XB8hH", "caption": "清打籽绣玉堂富贵挽袖"}, {"url": "https://aka.doubaocdn.com/s/fsIlUOmUh7", "caption": "清乾隆蓝缎地彩绣玉堂富贵图"}, {"url": "https://aka.doubaocdn.com/s/xO94gRFCgO", "caption": "清代五彩绣玉堂富贵"}, {"url": "https://aka.doubaocdn.com/s/ZH9qkcNLaZ", "caption": "清代五彩绣玉堂富贵"}, {"url": "https://aka.doubaocdn.com/s/jBpaHt8pXN", "caption": "清蓝地彩绣玉堂富贵图"}, {"url": "https://aka.doubaocdn.com/s/D1sJ2xneML", "caption": "清晚期蓝色缎绣玉堂富贵纹夹氅衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "五代", "desc": "玉堂富贵纹形成固定范式。五代徐熙的《玉堂富贵图》描绘了玉兰、牡丹、海棠等花卉，寓意吉祥。"}, {"period": "明清", "desc": "玉堂富贵纹在服饰和织物中广泛使用。元明清时期，牡丹纹进一步与民俗文化深度融合，缠枝牡丹、凤穿牡丹、玉堂富贵等经典组合应运而生。"}], "寓意分条": ["玉堂富贵：玉兰、海棠、牡丹组合，寓意玉堂富贵。", "富贵吉祥：牡丹寓意富贵，玉兰、海棠谐音“玉堂”。", "身份象征：玉堂富贵纹自五代形成固定范式后，在清代逐步从精英阶层的身份象征泛化为民间普适的吉祥符号。"], "属性": {"常用颜色": "以绿、红、蓝、金等色为主。", "常用布料": "缎、缂丝、刺绣。", "适用衣物": "袷袍、女衬衣、女褂。", "应用部位": "领、袖边、衣身通身纹饰。", "使用场景": "宫廷吉庆、日常穿着。"}, "常见搭配": ["牡丹纹", "玉兰纹", "海棠纹", "寿桃纹"]}, {"编号": 291, "类别": "组合吉祥", "类别内序号": 23, "纹样名称": "瓜瓞绵绵纹", "盛行朝代": "明清（盛行于清）", "文化寓意": "瓜瓞绵绵纹是以瓜和蝴蝶组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。瓜瓞绵绵出自《诗经·大雅·绵》：“绵绵瓜瓞，民之初生，自土沮漆。”绵绵：延续不断的样子。大者曰瓜，小者曰瓞，比喻子孙昌盛，人丁兴旺。在实际运用中，“瓞”多被代之以同音的“蝶”，用飞舞于瓜蔓间的蝴蝶表达子孙延绵不绝的祈愿。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/3nBSi5nDfs", "caption": "清代深蓝缎地绣瓜瓞绵绵团花纹对襟夹褂"}, {"url": "https://aka.doubaocdn.com/s/RPNcwE3Gl8", "caption": "清代光绪石青色缎绣瓜蝶纹女马褂"}, {"url": "https://aka.doubaocdn.com/s/jDdsv5ntqo", "caption": "清代蓝色缎地三蓝绣瓜瓞绵绵纹褂"}, {"url": "https://aka.doubaocdn.com/s/w99I8oHr5K", "caption": "清代瓜瓞绵绵纹刺绣长褂"}, {"url": "https://aka.doubaocdn.com/s/sNuUF5pClZ", "caption": "清代光绪石青色缎绣瓜蝶纹女马褂"}, {"url": "https://aka.doubaocdn.com/s/HoX6eIlxky", "caption": "清代光绪品月色缎盘金绣瓜瓞绵绵纹男帔"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "瓜瓞绵绵纹流行于明清时期。清光绪绛色缂金瓜蝶纹袷坎肩是在绛色平纹地上运用平缂、构缂等技法以圆金线缂织瓜瓞绵绵纹样，取子孙万代延绵不断之意。"}], "寓意分条": ["子孙昌盛：瓜瓞绵绵比喻子孙昌盛，人丁兴旺。", "子孙万代：取子孙万代延绵不断之意。", "家族兴旺：大瓜小瓞藤缠蔓绕，寓意子孙万代，后继有人，家族兴旺。"], "属性": {"常用颜色": "以青、绛、金等色为主。", "常用布料": "缎、缂丝、绸。", "适用衣物": "坎肩、女褂、女袍、帕袋、童坎肩。", "应用部位": "衣身通身纹饰、袖缘绦边。", "使用场景": "日常穿着、吉庆典礼。"}, "常见搭配": ["蝴蝶纹", "南瓜纹", "葫芦纹", "牡丹纹", "菊花纹"]}, {"编号": 269, "类别": "组合吉祥", "类别内序号": 1, "纹样名称": "百鸟朝凤纹", "盛行朝代": "元—清，盛于明清", "文化寓意": "百鸟朝凤纹是以凤凰居中、群鸟环绕朝拜为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。“百鸟朝凤”典出自宋代李昉等《太平御览》：“海州言凤见于城上，群鸟数百随之，东北飞向苍梧山。”其图案纹饰以凤凰居中，群禽满布于周边，朝向中央凤凰。这种中心显赫的图案常常用在宫廷装饰纹样中，正是宣扬统治秩序的象征。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/NS0GbVd9q5", "caption": "控弦司翼柿蒂窠百鸟朝凤纹织锦明制汉服圆领袍"}, {"url": "https://aka.doubaocdn.com/s/3NUUtBzUOL", "caption": "控弦司翼柿蒂窠百鸟朝凤纹织锦明制汉服圆领袍"}, {"url": "https://aka.doubaocdn.com/s/gZFpsLQCNA", "caption": "清光绪雪青缎地广绣百鸟朝凤纹紧身料"}, {"url": "https://aka.doubaocdn.com/s/Ktx9J35heZ", "caption": "清代百鸟朝凤刺绣"}, {"url": "https://aka.doubaocdn.com/s/MH0xnzeeeN", "caption": "清雪青缎地彩绣百鸟朝凤紧身料"}, {"url": "https://aka.doubaocdn.com/s/3Lkxv9Skl2", "caption": "雪青缎地广绣百鸟朝凤纹紧身料"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "典出自《太平御览》，百鸟朝凤的传说广泛流传。"}, {"period": "明清", "desc": "百鸟朝凤纹广泛应用于宫廷服饰和织物。明晚期缂金百鸟朝凤纹衣为典型实例，凤凰居中，群禽满布于周边，朝向中央凤凰。清代针黹活计中常见此类题材，黄色缎绣太狮少狮百鸟朝凤活计为清光绪皇帝御用佩饰。"}, {"period": "近现代", "desc": "百鸟朝凤纹在现代云锦吉服中延续使用。红地织金百鸟朝凤柿蒂妆花吉服纹样灵感来源于明代百鸟朝凤织锦图屏，衣身绘仙鹤、锦鸡等九种鸟禽，每种都成双成对且朝向凤凰，暗喻“长长久久、双喜临门、十全十美”。"}], "寓意分条": ["君主圣明：百鸟朝凤泛喻君主圣明，河晏海清，天下归附。", "太平盛世：表达人们对太平盛世的无限期盼。", "事事如意：以柿蒂纹为底，寓意“事事如意”。", "长长久久：九种鸟禽成双成对朝向凤凰，暗喻“长长久久、双喜临门、十全十美”。"], "属性": {"常用颜色": "以红、金、蓝、绿等色为主，配色富丽。红地织金百鸟朝凤柿蒂妆花吉服以红地为底，织金显花，金线勾边，富丽堂皇。", "常用布料": "缂丝、妆花缎、织锦。明晚期缂金百鸟朝凤纹衣为缂丝工艺织造，采用“通经断纬”技法，正反两面纹样一致。", "适用衣物": "吉服、袍服、佩饰活计。", "应用部位": "衣身通身纹饰、佩饰主体。多用于袍服前胸、后背及两肩，形成团花或通身布局。", "使用场景": "宫廷庆典、吉庆典礼、日常佩饰。"}, "常见搭配": ["凤纹", "牡丹纹", "柿蒂纹", "祥云纹"]}, {"编号": 278, "类别": "组合吉祥", "类别内序号": 10, "纹样名称": "福在眼前纹", "盛行朝代": "明—清", "文化寓意": "福在眼前纹是以蝙蝠和铜钱组合为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。一只蝙蝠飞在眼前，称为“福在眼前”，蝙蝠和马组成了“马上得福”，到了明清，蝙蝠纹更是得以大规模应用。福（蝠）在眼（孔）前（钱），吉（戟）祥如意（灵芝纹）。清代文物中可见“福在眼前”吉祥图案的实例，例如咸阳博物院收藏的清代“福在眼前”纹玉佩。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/G4Hzlnvljz", "caption": "清代盘锦绣福在眼前中国结纹长绣品"}, {"url": "https://aka.doubaocdn.com/s/DiW4O2IEmG", "caption": "清代盘锦绣福在眼前中国结纹长绣品"}, {"url": "https://aka.doubaocdn.com/s/TocmW20qUM", "caption": "清代盘锦绣福在眼前中国结纹长绣品"}, {"url": "https://aka.doubaocdn.com/s/BOVXb2TBsG", "caption": "清代盘锦绣福在眼前中国结纹长绣品"}, {"url": "https://aka.doubaocdn.com/s/PopCV5TO98", "caption": "清代白缎地福在眼前纹刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/kG4U9EmUwO", "caption": "清代盘锦绣福在眼前中国结纹长绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "蝙蝠纹得以大规模应用，下到平民百姓家的“五福”。四川羌族地区清代土司官服通身绣有八龙三凤，还有“必定如意”“福在眼前”等吉祥纹样。"}, {"period": "清代", "desc": "清代“福在眼前”纹玉佩为典型实例，青玉质，半圆形，上半部透雕蝙蝠纹，下部透雕三个相交的圆形方孔钱。"}], "寓意分条": ["福在眼前：蝙蝠与铜钱组合，谐音“福在眼前”，寓意福气就在眼前。", "吉庆如意：福在眼前配如意纹，寓意吉庆如意。", "马上得福：蝙蝠和马组成了“马上得福”。"], "属性": {"常用颜色": "以红、金、蓝等色为主。", "常用布料": "缎、绸、刺绣、玉、珊瑚。", "适用衣物": "袍服、官服、腰结、玉佩。", "应用部位": "衣身通身纹饰、腰结主体、玉佩主体。", "使用场景": "吉庆典礼、日常穿着。"}, "常见搭配": ["如意纹", "戟纹", "祥云纹"]}, {"编号": 304, "类别": "组合吉祥", "类别内序号": 36, "纹样名称": "福禄寿喜纹", "盛行朝代": "明清（盛行于清）", "文化寓意": "福禄寿喜纹属于组合类吉祥纹样，并非单一纹饰，而是由福、禄、寿、喜四种纹样单独或组合而成的一类纹样的统称。其核心特征在于以谐音与象征手法，将蝙蝠（福）、鹿（禄）、仙鹤或寿桃（寿）、喜鹊（喜）等物象组合使用，形成“有图必有意，有意必吉祥”的装饰体系。服饰中常用于吉服、婚嫁盛装、寿庆礼服及童服，是使用频率极高的吉祥纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/FlnBGUV2ki", "caption": "藏族金丝织锦花缎福禄寿喜上衣"}, {"url": "https://aka.doubaocdn.com/s/SLtAEjchUT", "caption": "19世纪湖蓝色缎绣花蝶福寿纹女褂"}, {"url": "https://aka.doubaocdn.com/s/voiD2VfnX7", "caption": "清织锦螭龙送福禄福寿万年挽袖"}, {"url": "https://aka.doubaocdn.com/s/H81uK1WEgf", "caption": "清红色地织锦刺绣狮戏锦球花桃褔贵长寿百褶裙"}, {"url": "https://aka.doubaocdn.com/s/NaRwZYlVfd", "caption": "清湖色提花缎彩绣寿字八宝花卉纹夹袄"}, {"url": "https://aka.doubaocdn.com/s/XeDxvzATBH", "caption": "黄色地绣福寿纹女吉服袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "吉祥文字纹已初见端倪，瓦当、砖块上常见“延年益寿”“长乐未央”等吉祥文字，福字纹、寿字纹、喜字纹的图案装饰性已初步显现。"}, {"period": "唐宋", "desc": "福禄寿喜题材在民间美术中广泛流行，蝙蝠、鹿、仙鹤等物象逐渐与吉祥寓意结合，广泛应用于织绣、瓷器、壁画等载体。"}, {"period": "明清", "desc": "福禄寿喜纹达到鼎盛。清代服装纹样以写生手法为主，福禄寿喜题材与龙狮麒麟、凤凰仙鹤等同列，领口、袖头、前开襟下摆等处镶有鲜艳花边纹样。明末宫廷万寿圣节袍服上织金龙与寿字组合。土家锦将“福”“禄”“寿”“囍”四字以八边形方块为基本纹样，以四方连续形式织造于织锦中。"}], "寓意分条": ["福：蝙蝠谐音“福”，红蝠飞天寓意“洪福齐天”，五只蝙蝠环绕寿字寓意“五福捧寿”。", "禄：鹿谐音“禄”，象征仕途腾达、功名利禄；仙鹤与鹿同行，寓意“鹿鹤同春”（六合同春）。", "寿：仙鹤、松树、寿桃、忍冬纹等象征长寿，蝴蝶谐音“耋”，寓意长寿安康。", "喜：喜鹊象征喜事临门，喜鹊登梅寓意“喜上眉梢”“双喜临门。", "综合：整体寓意多福多寿、富贵吉祥、幸福美满，是民间求吉心理最集中的表达。"], "属性": {"常用颜色": "福字纹多用红色与金色，蝙蝠纹常见红色与金色，红蝠代表“洪福”；禄字纹以绿色、金色为主，鹿纹用赭黄、白色；寿字纹用金色或红色，寿桃以粉红、大红绣出；喜字纹以大红、金色为主。底色常用大红、石青、深绿、藏蓝。红金搭配最为常见，大气喜庆。", "常用布料": "织锦（土家锦、蜀锦）、妆花缎、缂丝、绸、缎、棉布。婚嫁吉服多用妆花缎、红绸，荷包多用蓝布、缎地绣花。", "适用衣物": "吉服袍、袄裙、马面裙、霞帔、肚兜、童服、荷包、帽花、挽袖、云肩。", "应用部位": "衣身、裙摆、领口、袖口、前开襟、下摆、荷包正面、帽饰正中、挽袖。", "使用场景": "婚嫁大典、寿诞吉庆、新生儿庆贺（满月、周岁）、春节吉庆、日常吉服。"}, "常见搭配": ["万字纹", "祥云纹", "如意纹", "蝴蝶纹", "暗八仙纹", "八吉祥纹", "瓜瓞绵绵纹"]}, {"编号": 292, "类别": "组合吉祥", "类别内序号": 24, "纹样名称": "竹报平安纹", "盛行朝代": "唐宋至明清（盛行于明清）", "文化寓意": "竹报平安纹是以竹和太平花组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。竹报平安为汉族传统寓意纹样，唐代《酉阳杂俎续集·支植下》载：北都（即晋阳）只有童子寺里有一丛竹子，刚数尺高，主管寺院事务的纲维和尚每日都向寺院有关人员报告，竹子没有枯萎，很平安。后以“竹报平安”指平安家信，也简称“竹报”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/vBWwBdHriT", "caption": "清织绣竹纹夏天女服饰"}, {"url": "https://aka.doubaocdn.com/s/6qMEDy38Zl", "caption": "清红色缎绣鹊梅竹纹正月花神衣"}, {"url": "https://aka.doubaocdn.com/s/0E3mmaFpMK", "caption": "清末月白缂丝竹石紧身"}, {"url": "https://aka.doubaocdn.com/s/3c5sV7QqB0", "caption": "月白缎织彩百花飞蝶袷袍"}, {"url": "https://aka.doubaocdn.com/s/CtbrWRE90M", "caption": "清红色缎绣鹊梅竹纹花神衣"}, {"url": "https://aka.doubaocdn.com/s/GvV6fWqUGp", "caption": "绿地织金缠纹花缎衫"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "竹报平安典故出自唐代《酉阳杂俎续集·支植下》。"}, {"period": "南宋", "desc": "南宋印金罗襟褐色长安竹纹纱衫表明该纹样在当时已作为服饰纹样出现。"}, {"period": "明清", "desc": "竹报平安纹流行于清至民国时期。瓷器上的竹报平安图在清至民国时期尤为流行。"}], "寓意分条": ["平安家信：竹报平安指平安家信。", "平安如意：竹报平安寓意平安如意。", "长寿和平安：竹报平安与传统纹饰相连，代表了长辈对晚辈的期望。"], "属性": {"常用颜色": "以青、绿、白等色为主。", "常用布料": "缎、绸、刺绣、银。", "适用衣物": "袍服、腰带、织物。", "应用部位": "衣身通身纹饰、腰带主体。", "使用场景": "日常穿着、吉庆典礼。"}, "常见搭配": ["鹌鹑纹", "爆竹纹", "梅花纹"]}, {"编号": 289, "类别": "组合吉祥", "类别内序号": 21, "纹样名称": "芝兰玉树纹", "盛行朝代": "明清（尤盛于清）", "文化寓意": "芝兰玉树纹是以芝兰和玉树组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。典出《晋书·谢安传》：谢玄答曰：“譬如芝兰玉树，欲使其生于庭阶耳。”。世称佳子弟如芝兰玉树，本谢家语也。芝兰玉树纹寓意家族子弟优秀、人才辈出，是传统服饰中表达对后代美好期许的吉祥纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/v2GlUpZV7x", "caption": "清中期绣衣"}, {"url": "https://aka.doubaocdn.com/s/5XvyVXZUpk", "caption": "清代织绣龙袍"}, {"url": "https://aka.doubaocdn.com/s/zqwjRyNDpD", "caption": "晚清黄缎绣兰花纹背心"}, {"url": "https://aka.doubaocdn.com/s/uk9aX2M7bZ", "caption": "明绿地织金缠枝花缎衫"}, {"url": "https://aka.doubaocdn.com/s/cgJbnETBlx", "caption": "清蓝缎暗花织锦上衣"}, { hyEO", "caption": "打籽绣挽袖鱼跃龙门"}, {"url": "https://aka.doubaocdn.com/s/clxFo6VcDd", "caption": "清光绪黄地鲤鱼跳龙门纹刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/6GGthJ8R6s", "caption": "清中期龙纹刺绣鱼跃龙门"}, {"url": "https://aka.doubaocdn.com/s/USf42cnqAC", "caption": "清鱼跃龙门补服"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "仰韶文化", "desc": "龙鱼互变的图案早在六千多年前的仰韶文化彩陶壶中就已出现。"}, {"period": "隋唐", "desc": "随科举制度确立，鲤鱼跃龙门逐渐演变为象征科举及第的吉祥图案。"}, {"period": "明清", "desc": "鱼跃龙门纹在服饰中广泛使用。明黄色缎打籽绣龙凤纹褂、绛色打籽绣鱼跃龙门马面裙中，前后裙门以打籽之法绣鱼跃龙门图案，褶间空地装饰五彩花蝶纹。"}], "寓意分条": ["科举及第：鱼跃龙门象征科举及第、金榜题名。", "梦想实现：寓意年轻人在成长过程中学会勇敢、坚持、自信，最终实现梦想。", "吉祥欢乐：锦鲤寓意吉祥欢乐、繁荣幸福。"], "属性": {"常用颜色": "以红、蓝、金等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "马面裙、云肩、袍服。", "应用部位": "裙门主体、云肩主体。", "使用场景": "科举吉庆、婚嫁吉庆、日常穿着。"}, "常见搭配": ["花蝶纹", "春燕纹", "祥云纹", "水波纹"]}, {"编号": 276, "类别": "组合吉祥", "类别内序号": 8, "纹样名称": "鸳鸯戏水纹", "盛行朝代": "唐—清，盛于明清", "文化寓意": "鸳鸯戏水纹是以鸳鸯在水中嬉戏为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。鸳鸯莲池纹是元代最流行的装饰图案之一，古人视鸳鸯为爱情的象征，元青花上的鸳鸯纹都成双成对出现。“满池娇”在元代中期以后成为服饰上的常见题材，以莲花、荷叶、藕、鸳鸯、蜂蝶之类为题材建构成池塘小景，是非常富有诗意和情景感的。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/JGMa5BhqYo", "caption": "白缎地掺针绣莲池鸳鸯门檐"}, {"url": "https://aka.doubaocdn.com/s/8q92tFfvaw", "caption": "清代苏绣鸳鸯戏莲飘带"}, {"url": "https://aka.doubaocdn.com/s/HlcvUroIDw", "caption": "清代刺绣鸳鸯戏水一对"}, {"url": "https://aka.doubaocdn.com/s/JArjRqH45S", "caption": "老织锦太太服荷花鸳鸯图"}, {"url": "https://aka.doubaocdn.com/s/8eoXdl2gYU", "caption": "晚清民国鸳鸯莲花绸缎面刺绣"}, {"url": "https://aka.doubaocdn.com/s/iWroBVFuJZ", "caption": "清缂丝鸳鸯戏莲挂毯"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南宋", "desc": "鸳鸯莲池纹已出现。南宋末年的黄昇墓中出土了一件贴花刺绣莲花鸳鸯纹香囊。"}, {"period": "元代", "desc": "鸳鸯莲池纹成为最流行的装饰图案之一，元人称之为“池塘小景”，包含人间爱情、家庭、团圆之意境。元代中期以后“满池娇”成为服饰上的常见题材，盛行一时。"}, {"period": "明清", "desc": "鸳鸯戏水纹在服饰中延续使用。米白丝缎人物彩绣袖口上持扇蓝衣红裙仕女望着戏水鸳鸯，池内莲花盛开。"}], "寓意分条": ["爱情美满：古人视鸳鸯为爱情的象征。", "家庭团圆：鸳鸯莲池纹包含人间爱情、家庭、团圆之意境。", "幸福和谐：鸳鸯象征幸福和谐。"], "属性": {"常用颜色": "以红、蓝、绿等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "香囊、袖口、袍服、肚兜。", "应用部位": "衣身通身纹饰、袖口、香囊主体。", "使用场景": "婚嫁吉庆、日常穿着。"}, "常见搭配": ["莲花纹", "荷叶纹", "蜂蝶纹", "垂柳纹"]}, {"编号": 275, "类别": "组合吉祥", "类别内序号": 7, "纹样名称": "鹤鹿同春纹", "盛行朝代": "明—清", "文化寓意": "鹤鹿同春纹是以鹤和鹿组合为核心构图的装饰纹样，又称“六合同春”，属于组合吉祥纹样中的祥禽瑞兽类。以“鹿”取“陆”之音，“鹤”取“合”之音，寓意天下皆春，万物欣欣向荣。六合是指天地四方（天地和东南西北），亦泛指天下。这些形象组合起来构成“六合同春”吉祥图案，有国泰民安之意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/iWWcDVOYww", "caption": "明代万历刺绣鹿鹤同春"}, {"url": "https://aka.doubaocdn.com/s/79J952jHqu", "caption": "明代万历刺绣鹿鹤同春"}, {"url": "https://aka.doubaocdn.com/s/J6oUeV1eMA", "caption": "清中期鹤鹿同春刺绣"}, {"url": "https://aka.doubaocdn.com/s/dYCsHhTKOJ", "caption": "清手工刺绣鹤鹿同春"}, {"url": "https://aka.doubaocdn.com/s/gVXJYwAPna", "caption": "清道光红呢地五彩线秀鹤鹿同春祝寿帐幔"}, {"url": "https://aka.doubaocdn.com/s/wh8H2Tuw8T", "caption": "明代万历刺绣鹿鹤同春"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "明代也有用六鹤表现这一纹样的。杨慎《升庵外集》记载：“北之语合鹤迥然不分”。"}, {"period": "清代", "desc": "鹤鹿同春纹广泛应用于服饰和织物。晚清民国蓝缎地彩绣鹤鹿同春纹暖耳为典型实例。"}], "寓意分条": ["天下皆春：以“鹿”取“陆”之音，“鹤”取“合”之音，寓意天下皆春，万物欣欣向荣。", "国泰民安：六合同春有国泰民安之意。", "太平盛世：借象征不老的鹿、鹤同“六合”谐音，组成“六合同春”，是一幅普天之下、太平盛世的吉祥壁挂。"], "属性": {"常用颜色": "以蓝、绿、白等色为主。晚清民国蓝缎地彩绣鹤鹿同春纹暖耳以蓝缎为地，彩绣鹿、鹤、松树、椿树等纹样，色彩雅致。", "常用布料": "缎、绸、刺绣。", "适用衣物": "暖耳、袍服、壁挂。", "应用部位": "衣身通身纹饰、织物主体。", "使用场景": "日常穿着、年节吉庆。"}, "常见搭配": ["松树纹", "椿树纹", "祥云纹"]}, {"编号": 271, "类别": "组合吉祥", "类别内序号": 3, "纹样名称": "麒麟送子纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "麒麟送子纹是以麒麟驮载童子为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。民间有麒麟送子、麒麟吐书生孔子的传说。作为服饰纹样，麒麟通常被用在赐服和吉服上。“麒麟送子”最早典故出自晋朝传说孔子诞生之前，他的母亲梦见麒麟吐书，孔子遂诞生。后世以麒麟送子寓意早生贵子、多子多福。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/Wftcw0yJ10", "caption": "清代刺绣五子登科麒麟送子"}, {"url": "https://aka.doubaocdn.com/s/VaGVAWfwaA", "caption": "清红缎地金银彩绣麒麟送子纹夹里大襟童上衣"}, {"url": "https://aka.doubaocdn.com/s/0meA2JBjca", "caption": "清代宫廷刺绣麒麟送子万事如意"}, {"url": "https://aka.doubaocdn.com/s/DR3DGfpPYr", "caption": "清代丝绸刺绣麒麟送子门帘"}, {"url": "https://aka.doubaocdn.com/s/TxkCyAq9nb", "caption": "清代刺绣五子登科麒麟送子"}, {"url": "https://aka.doubaocdn.com/s/v81fbFPEAp", "caption": "清代麒麟送子图绣片"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "晋代", "desc": "麒麟送子典故出自晋朝传说孔子诞生之前，其母梦见麒麟吐书。"}, {"period": "明代", "desc": "麒麟纹样用于赐服和吉服。明代只有五品大员才可以身着麒麟纹样，但正德皇帝非常喜欢给百官赏赐贵重的服饰，导致没有获赐的官员和民间的富商大贾们纷纷仿效。"}, {"period": "清代", "desc": "麒麟送子纹广泛应用于服饰和织物。清代麒麟送子绣片为典型实例。清连生贵子内衣胸前主体纹饰采用麒麟送子纹饰，寓意早生贵子，多子多福。"}], "寓意分条": ["早生贵子：麒麟送子纹寓意早生贵子、多子多福。", "子孙繁盛：麒麟有祈祷子嗣繁盛的吉祥寓意。", "仁厚吉祥：麒麟在神话传说中为仁厚和吉祥的象征。"], "属性": {"常用颜色": "以红、蓝、绿等色为主。清连生贵子内衣以红色牡丹花暗纹绸面料为地，彩绣麒麟、童子、莲花等纹样，色彩鲜艳。", "常用布料": "绸、缎、刺绣。清连生贵子内衣内衬碎花棉布，滚花绦边，采用平针、套针、钉线等刺绣针法。", "适用衣物": "内衣、肚兜、荷包、吉服、赐服。", "应用部位": "胸前主体纹饰、荷包袋面、补子。", "使用场景": "婚嫁吉庆、日常穿着、宫廷赐服。"}, "常见搭配": ["莲花纹", "祥云纹", "蝴蝶纹", "杂宝纹"]}, {"编号": 296, "类别": "组合吉祥", "类别内序号": 28, "纹样名称": "麻姑献寿纹", "盛行朝代": "明清（盛行于明清）", "文化寓意": "麻姑献寿纹是以麻姑向西王母献寿为核心构图的装饰纹样，属于组合吉祥纹样中的神仙人物类。“麻姑献寿”是传统吉祥题材，麻姑为道教女仙，传说其能掷米成珠，且“三见沧海桑田”，象征长寿不朽，故而成为祝寿文化的经典符号。据《神仙传》记载，麻姑修道于牟州东南畲姑山上，年十八九，貌美，然自谓“已见东海三次变为桑田”，故古时以麻姑喻高寿。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/mGICPHFNDN", "caption": "清乾隆苏绣麻姑献寿织锦"}, {"url": "https://aka.doubaocdn.com/s/BCtl2cmt2B", "caption": "清19世纪麻姑献寿刺绣"}, {"url": "https://aka.doubaocdn.com/s/JcOnpk8Cu8", "caption": "清早期麻姑祝寿图苏绣织锦"}, {"url": "https://aka.doubaocdn.com/s/yEPXgAJvZb", "caption": "清代刺绣麻姑献寿"}, {"url": "https://aka.doubaocdn.com/s/Ujm8GB9A2P", "caption": "清代丝绣麻姑献寿图"}, {"url": "https://aka.doubaocdn.com/s/W3ceg1kjfh", "caption": "清刺绣麻姑献寿图"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "麻姑献寿纹已见于铜镜。"}, {"period": "明代", "desc": "以麻姑献寿为题材向女性长者祝寿的习俗始于明代。"}, {"period": "清代", "desc": "麻姑献寿纹在清代更为盛行。绘于瓷器则始于清康熙朝，并在清代一直流行。"}], "寓意分条": ["长寿不朽：麻姑为道教女仙，传说其能掷米成珠，且“三见沧海桑田”，象征长寿不朽。", "高寿：古时以麻姑喻高寿。", "祝寿文化：麻姑献寿成为祝寿文化的经典符号。"], "属性": {"常用颜色": "以蓝、红、白等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "寿帐、挂屏、女帔。", "应用部位": "寿帐主体、挂屏主体。", "使用场景": "寿诞吉庆、女性长者祝寿。"}, "常见搭配": ["梅花鹿纹", "灵芝纹", "寿桃纹", "青鸾纹"]}, {"编号": 300, "类别": "组合吉祥", "类别内序号": 32, "纹样名称": "龙凤呈祥纹", "盛行朝代": "元明清（盛行于明清）", "文化寓意": "龙凤呈祥纹是以龙和凤组合为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。龙为鳞虫之长，凤为百鸟之王，龙凤组合是中国传统纹样中最具代表性的吉祥图式之一。龙凤呈祥纹在传统服饰中常用于婚嫁吉庆场合的袍服、女褂、吉服装饰，寓意婚姻美满、吉祥如意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.co let currentCat = '全部';
let currentImgs = [];
let currentIdx = 0;
let scale = 1, tx = 0, ty = 0, isDragging = false, startX, startY;
let pageStack = [];
const cats = ['全部', ...new Set(data.map(p => p['分类'] || p['类别']).filter(Boolean))];

cats.forEach(c => {
  const tag = document.createElement('div');
  tag.className = 'filter-tag' + (c === '全部' ? ' active' : '');
  tag.innerText = c;
  tag.onclick = () => {
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    currentCat = c;
    render();
  };
  document.getElementById('filter').appendChild(tag);
});

function render() {
  const kw = document.getElementById('search').value.trim();
  const list = data.filter(p => {
    const cat = p['分类'] || p['类别'] || '';
    if (currentCat !== '全部' && cat !== currentCat) return false;
    if (kw && !p['纹样名称'].includes(kw)) return false;
    return true;
  }).sort((a, b) => {
    const na = parseInt(a['编号']) || 99999;
    const nb = parseInt(b['编号']) || 99999;
    return na - nb;
  });
  document.getElementById('grid').innerHTML = list.map(p => {
    let coverUrl = '';
    if (p['实物文物图'] && p['实物文物图'].length > 0) coverUrl = p['实物文物图'][0]['url'];
    const cat = p['分类'] || p['类别'] || '';
    const num = p['编号'] || '';
    return `<div class="card" onclick="openModal('${p['纹样名称']}', false)">
      <div class="card-img">${coverUrl ? `<img src="${coverUrl}">` : p['纹样名称']}</div>
      <div class="card-body">
        <div class="card-name">${p['纹样名称']}</div>
        <div class="card-meta">${cat} · ${num}</div>
      </div>
    </div>`;
  }).join('');
}

function openModal(name, isPush = true) {
  if (isPush) pageStack.push(name);
  else pageStack = [name];
  renderModal(name);
  document.getElementById('modal').classList.add('show');
}

    ${meaningHtml}
    ${attrHtml}
    ${partnerHtml}
  `;
}

function closeModal() {
  pageStack.pop();
  if (pageStack.length > 0) renderModal(pageStack[pageStack.length-1]);
  else document.getElementById('modal').classList.remove('show');
}
function openLb(idx) {
  if (currentImgs.length === 0) return;
  currentIdx = idx;
  scale = 1; tx = 0; ty = 0;
  updateLb();
  document.getElementById('lb').classList.add('show');
}
function updateLb() {
  document.getElementById('lbImg').src = currentImgs[currentIdx]['url'];
  document.getElementById('lbImg').style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  document.getElementById('lbCaption').innerText = currentImgs[currentIdx]['caption'] || (currentImgs[currentIdx]['type']||'图片');
}
function closeLb() { document.getElementById('lb').classList.remove('show'); }
function prevImg() {
  currentIdx = (currentIdx - 1 + currentImgs.length) % currentImgs.length;
  scale = 1; tx = 0; ty = 0;
  updateLb();
}
function nextImg() {
  currentIdx = (currentIdx + 1) % currentImgs.length;
  scale = 1; tx = 0; ty = 0;
  updateLb();
}
document.getElementById('lbImg').addEventListener('wheel', (e) => {
  e.preventDefault();
  scale += e.deltaY < 0 ? 0.1 : -0.1;
  scale = Math.max(0.5, Math.min(3, scale));
  updateLb();
});
document.getElementById('lbImg').addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - tx;
  startY = e.clientY - ty;
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx = e.clientX - startX;
  ty = e.clientY - startY;
  updateLb();
});
document.addEventListener('mouseup', () => { isDragging = false; });
document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
