url": "https://aka.doubaocdn.com/s/rjP7sNiRLT", "caption": "明代红素罗绣平金百子衣"}, {"url": "https://aka.doubaocdn.com/s/TdIZYbes5v", "caption": "明定陵金龙百子衣"}, {"url": "https://aka.doubaocdn.com/s/7jEeRUxk5S", "caption": "明代百子衣"}, {"url": "https://aka.doubaocdn.com/s/aE5KibER8h", "caption": "明代定陵百子衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "受佛教化生观影响，童子与莲花的组合造型开始流行，纺织品中已出现比较具象的孩童图样。日本正仓院收藏的唐代彩绘花毡上描绘了孩童花间玩耍的生动图景。"}, {"period": "宋代", "desc": "宫廷皇室对子嗣愈加重视，书画领域的婴戏图走向创作高峰，画中孩童踢球、扑蝶、学画、吹奏乐器等形象繁多。"}, {"period": "明清", "desc": "成为婚嫁服饰的重要装饰，是童子纹样的另一个高峰期。由于在中国传统中多子多孙是一种福的表现，童子攀花、童子擎莲、童子戏耍等各种题材均有，最多的是一百个童子一起游玩，被称为百子图。"}], "寓意分条": ["多子多福：婴戏纹寓意多子多福、子孙昌盛。", "家族兴旺：满饰婴戏纹的百子衣寓意百子千孙，新婚夫妻借此祈求家族人丁兴旺、子孙昌盛。", "吉祥喜瑞：承载了对吉祥喜瑞的期盼，也包含了人们对美好生活的向往。", "母凭子贵：明定陵出土的金龙百子衣不仅承载着“祈子求福”的儒家文化，还暗含着“母凭子贵”的封建女权意识。"], "属性": {"常用颜色": "以正色为主，在朱红色的地上配以枣红、水红、粉红、普蓝、藏青、浅蓝等多种色彩。", "常用布料": "缎、罗、缂丝、刺绣。明定陵孝靖皇后百子衣采用穿丝针、抢针等针法。", "适用衣物": "女夹衣、袄裙、肚兜、被褥、门帘。", "应用部位": "衣身通身纹饰、团花单元、领襟缘边。", "使用场合": "婚嫁吉庆、寿诞、日常穿着。"}, "常见搭配": ["花卉纹", "杂宝纹", "龙纹", "蝴蝶纹", "葫芦纹"]}, {"编号": 194, "类别": "人物神仙", "类别内序号": 12, "纹样名称": "嫦娥奔月纹", "盛行朝代": "汉发源，唐宋明清沿用", "文化寓意": "嫦娥奔月纹是以嫦娥飞向月宫传说为主题的装饰纹样，属于人物纹样中的神话传说类。嫦娥奔月是中国古代著名神话传说，嫦娥服下仙药后飞向月宫，成为月宫仙子。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/KQH9yHV9pm", "caption": "明代月宫图刺绣"}, {"url": "https://aka.doubaocdn.com/s/I7v9UzrBiq", "caption": "南京云锦嫦娥奔月织锦"}, {"url": "https://aka.doubaocdn.com/s/37BF9ehQkc", "caption": "明嫦娥玉兔纹妆花缎"}, {"url": "https://aka.doubaocdn.com/s/bMXQWtvgZU", "caption": "明嫦娥玉兔纹妆花缎局部"}, {"url": "https://aka.doubaocdn.com/s/ZuJ7KR05UA", "caption": "清代老刺绣嫦娥像"}, {"url": "https://aka.doubaocdn.com/s/jU9oqhnSX2", "caption": "清代嫦娥奔月刺绣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉唐", "desc": "嫦娥奔月传说在画像石和壁画中已有表现。"}, {"period": "明清", "desc": "嫦娥奔月纹在织物和服饰中延续使用，常与玉兔、月亮组合。"}, {"period": "近现代", "desc": "嫦娥奔月纹在刺绣、云锦等织物中延续使用。"}], "寓意分条": ["中秋团圆：嫦娥奔月纹寓意中秋团圆、阖家欢聚。", "美丽吉祥：嫦娥为月宫仙子，寓意美丽吉祥。", "长生不老：嫦娥服仙药奔月，寓意长生不老。"], "属性": {"常用颜色": "以蓝、白、银等色为主，配以金色点缀。", "常用布料": "缎、绸、刺绣。", "适用衣物" a.doubaocdn.com/s/YXcm4aYWJU", "caption": "清代织锦缎"}, {"url": "https://aka.doubaocdn.com/s/DWzrVVfC9Y", "caption": "明红地艾虎五毒回回锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["马家窑文化彩陶三角纹彩陶罐（中国国家博物馆藏）", "战国对龙对凤三色锦（湖南长沙子弹库楚墓出土，湖南博物院藏）", "清代土家族织锦三角纹被面（西南民族博物馆藏）"], "朝代脉络": [{"period": "新石器时代", "desc": "三角纹雏形见于仰韶文化、马家窑文化彩陶，以连续三角形构成装饰带。"}, {"period": "商周", "desc": "三角纹在青铜器上作为辅助纹样出现，常位于器口或器足边缘。"}, {"period": "汉代", "desc": "三角纹在漆器和画像石上广泛应用，常作为边饰或填充纹样。"}, {"period": "唐宋", "desc": "三角纹在织锦和瓷器上继续使用，常作为辅助性边饰。"}, {"period": "明清", "desc": "三角纹在织锦和建筑彩画上仍有使用，多作为辅助纹样出现在边饰中。"}], "寓意分条": ["三角形是最稳定的图形，寓意根基稳固、意志坚定。", "正三角形尖角向上，寓意积极向上、步步高升。", "三角形尖角锋利，寓意锐气十足、勇往直前。", "三角三边象征三方合力、团结协作。", "尖锐形状有驱邪之意，寓意辟邪护身、平安吉祥。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑彩绘多色。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、边饰。", "应用部位": "边饰、器物口沿或底部装饰带、建筑彩画边饰。", "使用场景": "日常服饰、礼仪服饰、陈设器物、建筑装饰。"}, "常见搭配": ["云纹", "卷草纹", "几何纹", "花卉纹。"]}, {"编号": 12, "类别": "几何抽象", "类别内序号": 12, "纹样名称": "云雷纹", "盛行朝代": "商周—清", "文化寓意": "云雷纹是商周青铜器上最经典的地纹体系，圆形回旋为云、方形回旋为雷，合称云雷纹，是先民对云雷云雨自然现象的抽象表达。云雷纹象征上天垂象、风调雨顺，从青铜礼器延伸到织锦、瓷器，一直沿用至明清，是最古老的礼器类几何纹之一。", "服饰应用部位": "", "实物文物图": [], "对应文物": ["商代云雷纹青铜鼎（中国国家博物馆藏）", "汉代云雷纹锦残片（马王堆汉墓出土，湖南博物院藏）", "清代云雷纹暗花缎朝袍边饰（故宫博物院藏）"], "朝代脉络": [{"period": "商周起源", "desc": "商周青铜器上云雷纹作为兽面纹的地纹，圆形为云、方形为雷，是青铜礼器最核心的装饰体系。"}, {"period": "汉代服饰转化", "desc": "马王堆汉墓出土织锦中，云雷纹从青铜礼器延伸到服饰，作为衣缘边饰使用。"}, {"period": "唐宋仿古沿用", "desc": "宋代仿古织物中云雷纹作为复古纹样使用，多用于祭祀相关礼仪服饰。"}, {"period": "明清收尾", "desc": "明清仿古织锦中云雷纹作为礼服边饰、装裱面料使用，不再作为主流日常纹样。"}], "寓意分条": ["风调雨顺：云雷对应云雨雷电，象征上天降下瑞气、天下风调雨顺", "礼器传承：源自商周青铜礼器，寓意庄重威严、传承有序", "云雷动万物：春雷发动万物复苏，寓意生机勃发、万物生长"], "属性": {"常用颜色": "青铜褐、石青、赭黄、仿古铜绿色，配色庄重", "常用布料": "商周青铜器线刻、汉代织锦、明清仿古缎、妆花缎", "适用衣物": "祭祀礼服、仿古礼仪服饰、官服边饰", "应用部位": "衣身地纹、衣襟镶边、下摆边饰、装裱", "使用场景": "祭祀大典、仿古礼仪、庄重正式场合"}, "常见搭配": ["祥云纹", "龙纹", "回纹", "雷纹"], "线稿图": []}, {"编号": 19, "类别": "几何抽象", "类别内序号": 19, "纹样名称": "八答晕纹", "盛行朝代": "宋—清", "文化寓意": "八答晕纹是一种以八边形或八角形为核心、向八个方向放射出晕圈和装饰带的复杂几何纹样。“答”通”搭”，“晕”指晕圈、光环，八答晕即八个方向的晕圈交织展开，形成中心对称、层次丰富的骨架结构。它常以中心花为核心，向外辐射出多层几何边框，每层边框内填不同纹饰，整体如花朵绽放。八答晕纹结构严谨、气势恢宏，宋元时期在织锦和瓷器上达到高峰，是传统几何纹样中最为华贵的骨架纹样之一。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/19oMfuI2o5", "caption": "清乾隆·明黄色织锦八达晕龙纹宝座靠背套"}, {"url": "https://aka.doubaocdn.com/s/Hy183pe1dD", "caption": "清·沉香地八达晕锦样片"}, {"url": "https://aka.doubaocdn.com/s/TQsifkHtcF", "caption": "清中期·蟒纹八达晕宋式锦"}, {"url": "https://aka.doubaocdn.com/s/Z18gEZG0OU", "caption": "非遗宋锦六重纬八达晕纹琵琶襟马甲"}, {"url": "https://aka.doubaocdn.com/s/ufPoO5tzga", "caption": "清初·织金八答晕膝围"}, {"url": "https://aka.doubaocdn.com/s/ew37ghEvHo", "caption": "清代·黄地五彩八达晕锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["金地牡丹团花八达晕纹织锦", "蓝地莲花团花八达晕纹织锦", "八达晕纹地锦"], "朝代脉络": [{"period": "唐代", "desc": "八答晕纹的雏形可见于唐代金银器和铜镜的八角形构图，中心对称、放射状布局已具规模。"}, {"period": "宋代", "desc": "八答晕纹在宋锦中高度成熟，故宫藏宋代八答晕纹锦以丝织工艺精确呈现多层晕圈和几何边框，构图理性而华丽。宋代瓷器上也常见八答晕开光装饰。"}, {"period": "元代", "desc": "八答晕纹继续用于织金锦和瓷器，元代织锦中八答晕骨架更趋复杂，常与龙凤、花卉组合，气势更加宏大。"}, {"period": "明代", "desc": "八答晕纹成为宫廷织锦的重要纹样，明锦中八答晕结构更加程式化，层次分明，色彩富丽，常用于袍料和靠垫。"}, {"period": "清代", "desc": "八答晕纹在宫廷织物和建筑彩画中仍有使用，但逐渐被更繁复的缠枝团花、云肩团花取代，多作为辅助性装饰骨架。"}], "寓意分条": ["八个方向放射象征四方来朝、天下归心。", "八答晕结构精巧复杂，寓意处事圆融、聪明伶俐。", "多层晕圈和丰富装饰象征富贵叠加、荣华至极。", "中心对称、八方放射的构图暗合古代宇宙观，象征天地有序、万物和谐。", "晕圈如光芒放射，寓意光明普照、福泽四方。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄、白多色妆花，色彩极为丰富；瓷器中青花蓝白、五彩、粉彩、斗彩皆有；建筑彩画以青绿为主调，间以金彩。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、锦；也广泛用于瓷器、漆器、建筑彩画、金银器、铜镜。", "适用衣物": "袍料、靠垫织物、被面、帐幔、佛事织物。", "应用部位": "衣身团窠中心、满地地纹、器物腹部开光、建筑藻井、家具装饰。", "使用场景": "宫廷服饰、礼仪服饰、陈设织物、宗教场所装饰、建筑内部装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "卷草纹", "云纹", "龙凤纹"]}, {"编号": 20, "类别": "几何抽象", "类别内序号": 20, "纹样名称": "六答晕纹", "盛行朝代": "宋—清", "文化寓意": "六答晕纹是以圆形为中心、向六个方向放射延伸构成网架的几何纹样，又称”六达晕”“六通”，元代称”六搭韵”。“六达”指天、地、东、西、南、北六个方位，“晕”指以微妙色阶表现浓淡层次和节奏的形式。它以圆形为单元核心，骨架线向六方延伸交织成网，网架内填充花卉、鸟兽或几何纹样，形成满地规矩纹中最为精巧的一类。六答晕结构严谨、节奏分明，唐代初见雏形，宋代在蜀锦和宋锦中达到高峰，是宋式理性美学的典型代表。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/bn1Qky4B9W", "caption": "清十八世纪明黄缎万字锦地绣金龙八吉祥吉服袍"}, {"url": "https://aka.doubaocdn.com/s/Hnu4oBsGy2", "caption": "清汉族锦地缂丝女式外套"}, {"url": "https://aka.doubaocdn.com/s/WnRBnGAahN", "caption": "清蓝色地织锦刺绣祥云百褔万花仙释鱼鳞百褶裙"}, {"url": "https://aka.doubaocdn.com/s/X60k7YA3YV", "caption": "清代服饰镶黄双龙戏珠八吉祥锦地男袍"}, {"url": "https://aka.doubaocdn.com/s/iLh32Y51AC", "caption": "清盘金银丝织锦百花凤凰绣花凤"}, {"url": "https://aka.doubaocdn.com/s/uxwBjruNTL", "caption": "明定陵出土孝靖皇后百子衣复制品"}], "线稿图": [], "复原设计图": [], "对应文物": ["六答晕纹织锦", "六答晕纹地锦", "六答晕纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "六答晕纹的雏形可见于唐代织锦的六方放射构图，中心圆形向六方延伸的骨架已具规模，但尚未形成成熟的”晕”式层次。"}, {"period": "宋代", "desc": "六答晕纹在蜀锦和宋锦中高度成熟，成为满地规矩纹中最精工的纹样之一，常与花卉、鸟兽组合，层次丰富、节奏鲜明。宋代织锦中六答晕骨架精确严谨，体现宋人对几何秩序的极致追求。"}, {"period": "元代", "desc": "元代称其为”六搭韵”，继续用于织金锦和建筑装饰，骨架结构保持六方放射特征，填充纹样更加丰富。"}, {"period": "明清", "desc": "六答晕纹逐渐被八答晕纹取代，使用频率降低，但在仿宋织锦和建筑装饰中仍有保留，多作为辅助性骨架纹样。"}], "寓意分条": ["六方放射象征天地四方通达无阻，寓意六合同春、万事亨通。", "六方结构契合民间”六六大顺”的吉祥观念。", "多重晕圈象征人生层次递进、步步高升。", "六方对称结构体现宇宙秩序与天地和谐。", "六方延伸寓意福泽广布、恩泽天下。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄、白多色妆花，以色阶渐变表现”晕”的层次；瓷器青花蓝白、五彩、粉彩皆有。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、蜀锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、靠垫织物、被面、帐幔。", "应用部位": "满地地纹、衣身团窠中心、器物腹部装饰带、建筑藻井。", "使用场景": "宫廷服饰、礼仪服饰、陈设织物、建筑装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "卷草纹", "云纹", "鸟兽纹。"]}, {"编号": 26, "类别": "几何抽象", "类别内序号": 26, "纹样名称": "冰裂纹", "盛行朝代": "宋—清", "文化寓意": "冰裂纹又称”开片纹”“蟹爪纹”“百圾碎”，是陶瓷釉面因胎釉膨胀系数不同而自然形成的裂纹装饰效果。裂纹呈不规则网状或放射状分布，形似冰面破裂，故称冰裂纹。本是烧制过程中的”缺陷”，但宋代哥窑、官窑等将其发展为独特的装饰艺术，裂纹疏密有致、深浅交错，形成自然天成的美感。明清时期冰裂纹被刻意模仿，成为陶瓷装饰的重要纹样之一。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/DeWHCcqg2U", "caption": "清织锦缎镶冰裂梅纹边命妇霞帔"}, {"url": "https://aka.doubaocdn.com/s/qbzNUXj0Si", "caption": "清织锦缎镶冰裂梅纹边命妇霞帔"}, {"url": "https://aka.doubaocdn.com/s/DKWL9res9P", "caption": "清织锦缎镶冰裂梅纹边命妇霞帔"}, {"url": "https://aka.doubaocdn.com/s/4PSPVTw8WI", "caption": "清水田衣"}, {"url": "https://aka.doubaocdn.com/s/qxnk3BKSkf", "caption": "清代石青地织金冰梅纹缎料"}, {"url": "https://aka.doubaocdn.com/s/cNM2UqyYBa", "caption": "明代锦缎"}], "线稿图": [], "复原设计图": [], "对应文物": ["宋代哥窑冰裂纹青瓷碗（故宫博物院藏）", "明代冰裂纹暗花缎文人袍（孔子博物馆藏）", "清代月白冰裂纹纱面折扇（苏州博物馆藏）"], "朝代脉络": [{"period": "唐代", "desc": "冰裂纹的雏形可见于唐代青瓷，釉面开片现象已有出现，但尚未形成自觉的装饰追求。"}, {"period": "宋代", "desc": "冰裂纹在哥窑、官窑中达到艺术高峰，“金丝铁线”是哥窑冰裂纹的典型特征——粗黑裂纹为”铁线”，细黄裂纹为”金丝”。宋代文人推崇冰裂纹的自然天成之美，视为最高审美境界。"}, {"period": "元代", "desc": "元代陶瓷中冰裂纹继续使用，但艺术成就略逊于宋代。"}, {"period": "明清", "desc": "明清时期冰裂纹被刻意模仿，景德镇窑常以人工开片技法制作冰裂纹陶瓷，成为固定装饰纹样。清代仿哥窑、仿官窑器物中冰裂纹工艺精湛。"}], "寓意分条": ["冰裂纹本是自然形成，寓意顺应自然、不事雕琢。", "裂纹虽为”缺陷”，却成就独特美感，寓意化残缺为完美。", "冰面破裂仍保持完整，寓意坚韧不屈、历经磨难而不倒。", "开片随时间推移逐渐加深，寓意岁月沉淀、历久弥新。", "冰裂纹为宋代文人推崇，象征高雅品味和淡泊心境。"], "属性": {"常用颜色": "釉色以青釉、灰釉、米黄釉为主，裂纹呈黑色、黄色、褐色。", "常用布料": "不用于织物，专用于陶瓷装饰。", "适用衣物": "不用于衣物。", "应用部位": "陶瓷器物通体装饰，瓶、碗、盘、洗等各类器型。", "使用场景": "文房用品、陈设器物、茶器、宫廷御用。"}, "常见搭配": ["一般不与其他纹样搭配", "冰裂纹本身即为独立装饰。偶与弦纹", "凸棱纹组合。"]}, {"编号": 3, "类别": "几何抽象", "类别内序号": 3, "纹样名称": "卍字不到头纹", "盛行朝代": "唐—明清", "文化寓意": "卍字不到头纹是万字纹的连续延展形式，卍字首尾相接、无限延伸，无始无终，故名”不到头”。它明代已见，清代尤为盛行，广泛用于织锦、瓷器、家具窗棂和建筑彩画。其结构稳定且可无限铺展，寓意万福万寿绵延不绝、永无断绝，是吉祥纹样中”连绵”意象的典型代表。", "服饰应用部位": "衣身满铺地纹、裙摆、袖口边饰", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/K2DabeVxZS", "caption": "上海博物馆藏清光绪蓝地卍字纹织金缎"}, {"url": "https://aka.doubaocdn.com/s/cLNVIiJsmo", "caption": "清代湖色地正卍字织金缎"}, {"url": "https://aka.doubaocdn.com/s/415wy0ZdmY", "caption": "清代湖色地富贵不断头卍字锦缎"}, {"url": "https://aka.doubaocdn.com/s/wbHn3vNMqp", "caption": "清中期明黄缎绣万字绵地十二章金龙纹吉服袍"}], "线稿图": [], "复原设计图": [], "对应文物": ["明万历黄缂丝十二章福寿如意衮服（定陵博物馆藏）", "大红色绸绣金万字地八团彩云蝠龙凤双喜纹女棉龙袍（故宫博物院藏）", "清代万字织金缎边氅衣（故宫博物院藏）"], "朝代脉络": [{"period": "明代", "desc": "卍字连续排列形式出现，多见于织锦和瓷器边饰。"}, {"period": "清代", "desc": "卍字不到头纹高度程式化，广泛用于宫廷织绣、家具窗棂、建筑彩画，常与寿字、蝙蝠、盘长组合。故宫藏清代织锦、家具中可见大量卍字不到头纹应用。"}], "寓意分条": ["卍字连续排列形式出现，多见于织锦和瓷器边饰。", "卍字不到头纹高度程式化，广泛用于宫廷织绣、家具窗棂、建筑彩画，常与寿字、蝙蝠、盘长组合。故宫藏清代织锦、家具中可见大量卍字不到头纹应用。", "卍字沿一个方向连续延展。", "卍字纵横交错，形成网格状连续纹样。", "卍字与寿字交替排列，寓意万寿无疆。", "卍字与蝙蝠组合，寓意万福绵延。", "卍字象征万德吉祥，不到头结构寓意福运不断。", "与寿字组合时，强化长寿永恒之意。", "无限延展的视觉特征象征生命循环、福泽绵长。", "“不到头”之名直接点出连绵不绝、永无止境之意。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩；织物中红、金、蓝、绿多色。", "常用布料": "妆花缎、织金缎、缂丝、锦；也用于木雕、砖雕、瓷器、建筑窗棂。", "适用衣物": "袍料、裙料、披肩、帐幔、椅披。", "应用部位": "满地纹、边饰、窗棂格心、家具雕花、建筑彩画边饰。", "使用场景": "宫廷陈设、寿庆、婚嫁、日常服饰、建筑装饰。"}, "常见搭配": ["寿字纹", "蝙蝠纹", "盘长纹", "云纹", "缠枝纹", "团花纹。"]}, {"编号": 18, "类别": "几何抽象", "类别内序号": 18, "纹样名称": "古钱纹", "盛行朝代": "汉—明清", "文化寓意": "古钱纹是以历代古钱币为原型绘制的装饰纹样，不仅限于圆形方孔铜钱，还包括刀币、布币、蚁鼻钱、开元通宝、康熙通宝等各类历史钱币。古钱纹既保留钱币的实际形态和铭文，又加以艺术化提炼，形成具有历史厚重感的几何装饰。它多用于织锦、瓷器、玉器、家具和文房器物，寓意古韵悠长、财源不断、鉴古知今。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/9U8ozmd8EU", "caption": "传统铜钱纹服饰刺绣"}, {"url": "https://aka.doubaocdn.com/s/JvSBjmr8gl", "caption": "清代绣品钱腰带"}, {"url": "https://aka.doubaocdn.com/s/h8A62zNd7M", "caption": "白族铜钱纹拼布彩绣背扇"}, {"url": "https://aka.doubaocdn.com/s/kA5WAIADLy", "caption": "西阵织七宝铜钱纹锦"}, {"url": "https://aka.doubaocdn.com/s/vOFUGFhEWT", "caption": "西阵织铜钱纹锦"}, {"url": "https://aka.doubaocdn.com/s/njEkDobyep", "caption": "清代织金铜钱纹缎"}], "线稿图": [], "复原设计图": [], "对应文物": ["汉代古钱纹织锦残片（新疆尼雅遗址出土，新疆文物考古研究所藏）", "明代古钱纹织金襕裙（孔子博物馆藏）", "清代织金古钱纹缎（故宫博物院藏）"], "朝代脉络": [{"period": "先秦", "desc": "刀币、布币、蚁鼻钱等早期货币形态各异，其轮廓和纹饰可视为古钱纹的远古源头。"}, {"period": "汉代", "desc": "五铢钱形制统一，钱文精美，汉代织物和铜器上已见钱币纹装饰。"}, {"period": "唐代", "desc": "开元通宝铸行后，圆形方孔钱制确立，古钱纹开始规范化，唐代织锦和金银器中可见钱纹。"}, {"period": "宋元", "desc": "宋代铜钱文化鼎盛，钱文书法精美，古钱纹在瓷器、织锦和玉器上广泛使用，常与雅趣题材组合。"}, {"period": "明清", "desc": "古钱纹达到高峰，明代织锦中常见以历代名钱排列成锦地的做法；清代更将古钱与吉祥文字、花卉组合，如”金玉满堂”“日进斗金”等图案极为流行。康熙、乾隆等年号钱纹尤受宫廷喜爱。"}], "寓意分条": ["刀币、布币、蚁鼻钱等早期货币形态各异，其轮廓和纹饰可视为古钱纹的远古源头。", "五铢钱形制统一，钱文精美，汉代织物和铜器上已见钱币纹装饰。", "开元通宝铸行后，圆形方孔钱制确立，古钱纹开始规范化，唐代织锦和金银器中可见钱纹。", "宋代铜钱文化鼎盛，钱文书法精美，古钱纹在瓷器、织锦和玉器上广泛使用，常与雅趣题材组合。", "古钱纹达到高峰，明代织锦中常见以历代名钱排列成锦地的做法；清代更将古钱与吉祥文字、花卉组合，如”金玉满堂”“日进斗金”等图案极为流行。康熙、乾隆等年号钱纹尤受宫廷喜爱。", "单个古钱图案独立排列。", "多枚古钱以绳串连，形成”串钱”图案。", "古钱连续排列作满地纹。", "古钱与元宝、蝙蝠、铜钱、珊瑚、灵芝等组合成复合图案。", "以特定年号钱（如开元通宝、康熙通宝、乾隆通宝）为单元的装饰纹样。", "古钱象征财富，连续排列寓意财源不断。", "古钱承载历史，寓意以史为鉴、智慧深远。", "古钱本身即文物，带有文人雅士的鉴赏趣味。", "串钱纹寓意代代有钱、子孙富贵。", "古钱有辟邪招财双重功能，常用于家居装饰。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿多色；瓷器青花、五彩、粉彩；玉器多以原色为主；家具多为描金或木雕。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也广泛用于瓷器、玉器、家具、文房器物、建筑构件。", "适用衣物": "袍料、裙料、荷包、帐幔。", "应用部位": "满地地纹、边饰、器物腹部、文房陈设、窗棂格心。", "使用场景": "宫廷陈设、文人书房、商业场所、婚嫁器物、日常家居装饰。"}, "常见搭配": ["蝙蝠纹", "元宝纹", "珊瑚纹", "灵芝纹", "宝相花纹", "缠枝纹"]}, {"编号": 21, "类别": "几何抽象", "类别内序号": 21, "纹样名称": "四答晕纹", "盛行朝代": "宋—清", "文化寓意": "四答晕纹是以圆形为中心、向四个方向（上下左右）放射延伸构成网架的几何纹样，是”答晕”类纹样中最简洁的一种。“四答”指四个方向的晕圈交织，“晕”指层次渐变的色彩和装饰带。它以四方对称结构为核心，骨架线向四正方向延伸交织，网架内填充花卉、鸟兽或几何纹样，形成规整而均衡的装饰效果。四答晕纹结构简洁大方，唐宋时期在织锦和瓷器上广泛应用，是几何纹样中实用性强、适应性广的骨架纹样。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/bn1Qky4B9W", "caption": "清十八世纪明黄缎万字锦地绣金龙八吉祥吉服袍"}, {"url": "https://aka.doubaocdn.com/s/Hnu4oBsGy2", "caption": "清汉族锦地缂丝女式外套"}, {"url": "https://aka.doubaocdn.com/s/WnRBnGAahN", "caption": "清蓝色地织锦刺绣祥云百褔万花仙释鱼鳞百褶裙"}, {"url": "https://aka.doubaocdn.com/s/X60k7YA3YV", "caption": "清代服饰镶黄双龙戏珠八吉祥锦地男袍"}, {"url": "https://aka.doubaocdn.com/s/iLh32Y51AC", "caption": "清盘金银丝织锦百花凤凰绣花凤"}, {"url": "https://aka.doubaocdn.com/s/uxwBjruNTL", "caption": "明定陵出土孝靖皇后百子衣复制品"}], "线稿图": [], "复原设计图": [], "对应文物": ["四答晕纹织锦", "四答晕纹地锦", "四答晕纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "四答晕纹的雏形可见于唐代织锦和金银器的四方对称构图，中心圆形向四正方向延伸的骨架已具规模。"}, {"period": "宋代", "desc": "四答晕纹在宋锦中成熟，成为满地规矩纹的重要成员，常与花卉、鸟兽组合，结构简洁而装饰丰富。"}, {"period": "元代", "desc": "四答晕纹继续用于织金锦和瓷器，骨架结构保持四方放射特征，填充纹样更加多样化。"}, {"period": "明清", "desc": "四答晕纹在织锦和器物装饰中仍有使用，但逐渐被更复杂的八答晕纹取代，多作为辅助性骨架或边饰出现。"}], "寓意分条": ["四方放射象征东西南北四方平安、四海升平。", "四方对称结构寓意稳重均衡、行事稳妥。", "四正方向延伸寓意道路通达、事业顺利。", "四方对应四季，寓意四季平安、岁岁如意。", "四方结构体现方正有序的品格和宇宙秩序。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色妆花；瓷器青花蓝白、五彩、粉彩；建筑彩画以青绿为主。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、靠垫织物、被面。", "应用部位": "满地地纹、边饰、器物腹部装饰带、建筑藻井。", "使用场景": "宫廷服饰、礼仪服饰、陈设织物、建筑装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "卷草纹", "云纹", "鸟兽纹。"]}, {"编号": 1, "类别": "几何抽象", "类别内序号": 1, "纹样名称": "回纹", "盛行朝代": "商—清（贯穿全程）", "文化寓意": "回纹是以连续折线构成的几何纹样，形如”回”字，故得名。它源于新石器时代陶器上的几何刻划纹，商周青铜器上发展为云雷纹的一种，后世逐渐简化为规整的回字形连续纹样。回纹多用于边饰、框饰和满地纹，寓意富贵不断、连绵不绝，是传统装饰中最稳定的骨架纹样之一。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/e3A5RuFUbu", "caption": "清光绪·青色缎地织金枝梅花回纹绦"}, {"url": "https://aka.doubaocdn.com/s/eLPvBZukUE", "caption": "清乾隆·绿色回纹方棋朵花壮锦"}, {"url": "https://aka.doubaocdn.com/s/GwLKw6LYje", "caption": "清·红缎绣回纹怀表套"}, {"url": "https://aka.doubaocdn.com/s/6VWDtE8zfh", "caption": "清·黄地四合回纹锦残片"}, {"url": "https://aka.doubaocdn.com/s/5LiA2EoCfL", "caption": "清早期·红色纱地满绣回纹平金云龙袷褂"}, {"url": "https://aka.doubaocdn.com/s/M7tv7oIpda", "caption": "清·红色纱地满绣回纹平金云龙袷褂局部"}, {"url": "https://aka.doubaocdn.com/s/e3A5RuFUbu", "caption": "清光绪·青色缎地织金枝梅花回纹绦（故宫博物院藏）"}, {"url": "https://aka.doubaocdn.com/s/eLPvBZukUE", "caption": "清乾隆·绿色回纹方棋朵花壮锦"}, {"url": "https://aka.doubaocdn.com/s/GwLKw6LYje", "caption": "清·红缎绣回纹怀表套（孔子博物馆藏）"}, {"url": "https://aka.doubaocdn.com/s/6VWDtE8zfh", "caption": "清·黄地四合回纹锦残片"}, {"url": "https://aka.doubaocdn.com/s/5LiA2EoCfL", "caption": "清早期·红色纱地满绣回纹平金云龙袷褂"}, {"url": "https://aka.doubaocdn.com/s/M7tv7oIpda", "caption": "清·红色纱地满绣回纹平金云龙袷褂（局部）"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "新石器时代", "desc": "陶器上已出现折线几何纹，为回纹雏形。"}, {"period": "商周", "desc": "青铜器上云雷纹大量使用，回字形折线常作地纹衬托兽面纹、夔龙纹。"}, {"period": "汉唐", "desc": "回纹逐渐从青铜器转向织物、漆器、建筑构件，形态趋于规整。"}, {"period": "宋元明清", "desc": "广泛用于瓷器边饰、织锦、家具、建筑彩画，常作二方连续或四方连续排列。"}], "寓意分条": ["陶器上已出现折线几何纹，为回纹雏形。", "青铜器上云雷纹大量使用，回字形折线常作地纹衬托兽面纹、夔龙纹。", "回纹逐渐从青铜器转向织物、漆器、建筑构件，形态趋于规整。", "广泛用于瓷器边饰、织锦、家具、建筑彩画，常作二方连续或四方连续排列。", "单个回字连续排列。", "两个回字并列或嵌套。", "回纹作满地纹的织锦组织。", "作器物口沿、边框、衣缘装饰带。", "回纹首尾相接，象征福运、富贵、子孙绵延不绝。", "折线回转，寓意生生不息、周而复始。", "规整几何结构，象征礼制秩序与安定。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩；织物中红、绿、金、蓝多色妆花。", "常用布料": "妆花缎、织金缎、缂丝、锦；也用于瓷器、漆器、木雕、建筑彩画。", "适用衣物": "袍料、裙料、披肩、帐幔、椅披。", "应用部位": "口沿边饰、领缘、袖口、下摆、开光边框、满地纹。", "使用场景": "宫廷陈设、寿庆、婚嫁、日常服饰、宗教器物。"}, "常见搭配": ["云纹", "缠枝纹", "团花纹", "八吉祥纹", "寿字纹", "蝙蝠纹。"], "复原图": [{"url": "https://aka.doubaocdn.com/s/lYdrqE6Ml3", "caption": "衣襟镶边回纹刺绣特写"}, {"url": "https://aka.doubaocdn.com/s/OUrKvbirjB", "caption": "圆形补子回纹边饰特写"}, {"url": "https://aka.doubaocdn.com/s/pVaTuIFSWT", "caption": "棕黄满铺回纹面料特写"}], "对应文物": ["明黄缎绣云龙纹吉服袍（故宫博物院藏）", "宝蓝缎彩绣平金云龙纹朝袍（故宫博物院藏）", "大红色绸绣金万字地八团彩云蝠龙凤双喜纹女棉龙袍（故宫博物院藏）"]}, {"编号": 36, "类别": "几何抽象", "类别内序号": 36, "纹样名称": "圆点纹", "盛行朝代": "", "文化寓意": "圆点纹是以实心圆点为基本单元构成的几何装饰纹样。圆点纹是最简单、最原始的装饰元素之一，新石器时代彩陶上已大量出现，常以连续排列或散点分布构成装饰。圆点纹节奏感强、视觉效果明快，可单独使用形成满地纹，也可作为辅助纹样与其他图案组合， 物": ["方格纹织锦", "方格纹地锦", "方格纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "新石器时代", "desc": "方格纹雏形见于仰韶文化、龙山文化彩陶，以连续方格构成装饰带。"}, {"period": "商周", "desc": "方格纹在青铜器上作为辅助纹样出现，常位于器身腹部。"}, {"period": "汉代", "desc": "方格纹在织锦和漆器上广泛应用，常作为骨架填充云气纹、鸟兽纹。"}, {"period": "唐宋", "desc": "方格纹在织锦和瓷器上继续发展，宋代定窑、景德镇窑瓷器中常见刻花方格纹。"}, {"period": "明清", "desc": "方格纹在织锦和建筑彩画上广泛应用，常作为辅助性骨架纹样，填充花卉或吉祥纹样。"}], "寓意分条": ["方格规整有序，寓意为人方正、行事规矩。", "方形象征稳定，寓意四平八稳、根基牢固。", "网格排列象征秩序井然、有条不紊。", "方格可填充各种纹样，寓意包容万物、海纳百川。", "方格四角指向四方，寓意四方来财、八方聚宝。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑彩绘多色。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰带、建筑格眼。", "使用场景": "日常服饰、礼仪服饰、陈设织物、建筑装饰。"}, "常见搭配": ["花卉纹", "鸟兽纹", "云纹", "卷草纹", "几何纹。"]}, {"编号": 9, "类别": "几何抽象", "类别内序号": 9, "纹样名称": "方胜纹", "盛行朝代": "汉—清", "文化寓意": "方胜纹由两个大小相同的菱形或方形压角相叠而成，形成中心对称的几何骨架。它源自古代”胜”饰，最初见于妇女首饰和发饰，后逐渐演变为吉祥纹样。方胜纹线条简洁、结构稳定，常用于织锦、瓷器、家具、首饰和建筑装饰，明清时期尤为流行。它既可单独使用，也可与花卉、云纹、盘长纹、回纹等组合，寓意同心美满、吉祥连绵。", "服饰应用部位": "衣襟、裙摆、荷包、镜套表面", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/giK9X9QX2l", "caption": "清代青缎方胜纹经书封皮"}, {"url": "https://aka.doubaocdn.com/s/wvBiLlcO2x", "caption": "山东博物馆藏·清青色缎纳纱绣方胜卍字纹镜套"}, {"url": "https://aka.doubaocdn.com/s/BlH0baUV7P", "caption": "汉代方胜对鸟纹锦特写"}], "线稿图": [], "复原设计图": [], "对应文物": ["汉代方胜对鸟纹锦（新疆尼雅遗址出土，新疆博物馆藏）", "清代青缎方胜纹经书封皮（故宫博物院藏）", "清代青色缎纳纱绣方胜卍字纹镜套（山东博物馆藏）"], "朝代脉络": [{"period": "秦汉", "desc": "方胜作为首饰和饰物雏形出现，菱形压角相叠的形态初步定型。"}, {"period": "魏晋南北朝", "desc": "延续早期特征，仍以首饰、器物装饰为主，形态变化不大。"}, {"period": "宋元", "desc": "方胜纹趋于成熟，常以组合形式出现，宋代巾帽装饰中可见”二胜环”“双叠胜”等称呼，辽代也有”叠胜”器物。"}, {"period": "明清", "desc": "应用达到高峰，广泛用于织锦、家具、瓷器、漆器、窗格和首饰，常与花卉、云纹、盘长纹组合，吉祥寓意更突出。"}], "寓意分条": ["方胜作为首饰和饰物雏形出现，菱形压角相叠的形态初步定型。", "延续早期特征，仍以首饰、器物装饰为主，形态变化不大。", "方胜纹趋于成熟，常以组合形式出现，宋代巾帽装饰中可见”二胜环”“双叠胜”等称呼，辽代也有”叠胜”器物。", "应用达到高峰，广泛用于织锦、家具、瓷器、漆器、窗格和首饰，常与花卉、云纹、盘长纹组合，吉祥寓意更突出。", "两个菱形压角相叠，独立成纹。", "方胜单元二方或四方连续排列，形成连绵骨架。", "强调双菱交叠、心连心的构图，多用于婚嫁题材。", "方胜骨架内填花卉、云纹、杂宝等小纹样。", "双菱相叠，象征永结同心、夫妻和合。", "“胜”本身有祥瑞、优胜之意。", "连续排列时寓意福运连绵、周而复始。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿多色；瓷器青花、五彩、粉彩皆有；家具多为木色或描金。", "常用布料": "妆花缎、暗花缎、织金锦、缂丝；也用于木雕、砖雕、瓷器、漆器、首饰。", "适用衣物": "袍料、裙料、披肩、巾帽、婚嫁服饰。", "应用部位": "衣身地纹、边饰、窗格、家具卡子花、器物造型。", "使用场景": "婚嫁、寿庆、宫廷陈设、日常服饰、建筑装饰。"}, "常见搭配": ["花卉纹", "云纹", "盘长纹", "回纹", "杂宝纹", "如意纹。"]}, {"编号": 28, "类别": "几何抽象", "类别内序号": 28, "纹样名称": "曲水纹", "盛行朝代": "宋—明", "文化寓意": "曲水纹是模仿溪流蜿蜒曲折形态的装饰纹样，以S形或反S形曲线连续排列构成，表现水流的婉转流动感。曲水纹源于中国古代”曲水流觞”的文人雅集传统，象征文人雅趣和自然意趣。曲水纹形态柔和婉转，线条流畅优美，唐宋时期在织锦、陶瓷和金银器上广泛应用，常与花卉、鸟兽组合，增添灵动气息。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/zt1Oaf3GwI", "caption": "清同治·蓝色曲水地四合如意杂宝纹暗花缎马褂"}, {"url": "https://aka.doubaocdn.com/s/OVolK1ReFg", "caption": "清晚期·驼黄色曲水八宝纹暗花缎马褂"}, {"url": "https://aka.doubaocdn.com/s/ckq0tqXdof", "caption": "清·万字曲水纹服饰"}, {"url": "https://aka.doubaocdn.com/s/VlIL7n8qSn", "caption": "清同治·蓝色曲水地四合如意杂宝纹马褂"}, {"url": "https://aka.doubaocdn.com/s/Lxn2RionTH", "caption": "明·万字曲水纹绸对襟上衣"}, {"url": "https://aka.doubaocdn.com/s/UrI3EOA1F7", "caption": "明万历·万字曲水纹绸对襟上衣"}], "线稿图": [], "复原设计图": [], "对应文物": ["曲水纹织锦", "曲水纹地锦", "曲水纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "曲水纹随”曲水流觞”文人传统兴起，在器物装饰中初见雏形。"}, {"period": "唐代", "desc": "曲水纹在金银器和织锦上流行，唐代银器中常见錾刻曲水纹，与花卉、鸟兽组合。"}, {"period": "宋代", "desc": "曲水纹在宋锦和瓷器上广泛应用，宋代定窑、景德镇窑瓷器中常见刻花曲水纹。"}, {"period": "元明清", "desc": "曲水纹继续用于织锦和器物装饰，明清时期常作为辅助纹样出现在边饰或地纹中。"}], "寓意分条": ["源于”曲水流觞”传统，象征文人雅集、诗意生活。", "S形曲线象征行事婉转、处事圆融。", "溪流蜿蜒寓意源远流长、绵延不绝。", "曲线流动感强，寓意灵动活泼、生机盎然。", "水流顺势而流，寓意顺应自然、不强求。"], "属性": {"常用颜色": "织锦中蓝、绿、白为主；瓷器青花蓝白、五彩、粉彩。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、金银器。", "适用衣物": "袍料、裙料、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰带。", "使用场景": "文人用品、日常服饰、陈设织物。"}, "常见搭配": ["花卉纹", "鸟兽纹", "云纹", "卷草纹", "莲花纹。"]}, {"编号": 37, "类别": "几何抽象", "类别内序号": 37, "纹样名称": "月华纹", "盛行朝代": "唐—晚清", "文化寓意": "月华纹是模仿月光晕染效果的装饰纹样，以圆形为中心向外层层扩散，形成同心圆状的晕染效果，如同月光周围的光晕。月华纹源于古人对月亮的崇拜和观察，月光周围常有一圈或多圈光晕，古人将这一自然现象艺术化，形成月华纹。月华纹在唐宋时期在织锦和陶瓷上流行，常作为主体纹样或辅助纹样，象征光明、团圆和吉祥。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/8tNzwutH88", "caption": "清代月华裙"}, {"url": "https://aka.doubaocdn.com/s/Fj5ZmTwVSe", "caption": "清代五彩暗花绸月华裙"}, {"url": "https://aka.doubaocdn.com/s/r1aU5cKnU1", "caption": "明万历缎面袍服"}, {"url": "https://aka.doubaocdn.com/s/lmIhlnegRd", "caption": "清代彩色暗花绸月华马面裙"}, {"url": "https://aka.doubaocdn.com/s/wRWkOstgtn", "caption": "明清蜀锦月华纹"}, {"url": "https://aka.doubaocdn.com/s/fJbVLRp7BX", "caption": "明代锦缎"}], "线稿图": [], "复原设计图": [], "对应文物": ["清代月白地月华玉兔纹妆花缎（故宫博物院藏）", "清代中秋龙袍月轮纹织锦（故宫博物院藏）", "清代月华纹刺绣荷包（苏州博物馆藏）"], "朝代脉络": [{"period": "唐代", "desc": "月华纹在织锦和金银器上初见规模，以同心圆晕染效果表现月光。"}, {"period": "宋代", "desc": "月华纹在宋锦和瓷器上广泛应用，宋代定窑、景德镇窑瓷器中常见刻花月华纹。"}, {"period": "元代", "desc": "月华纹在织金锦和青花瓷上继续发展，元代青花中常见月华纹与花卉组合。"}, {"period": "明清", "desc": "月华纹在织锦和瓷器上仍有使用，常作为辅助纹样出现在边饰或地纹中。"}], "寓意分条": ["月光象征光明，寓意前途光明、希望无限。", "月圆象征团圆，寓意家庭美满、亲人团聚。", "月光清冷高洁，寓意品格高洁、心境清净。", "月华吉祥，寓意吉祥如意、福泽绵长。", "月光柔和，寓意温柔宁静、平和安详。"], "属性": {"常用颜色": "织锦中白、金、蓝、银为主；瓷器青花蓝白、五彩、粉彩。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、金银器。", "适用衣物": "袍料、裙料、靠垫织物。", "应用部位": "主体纹样、满地地纹、器物腹部装饰。", "使用场景": "日常服饰、陈设织物、礼仪服饰。"}, "常见搭配": ["花卉纹", "云纹", "鸟兽纹", "卷草纹。"]}, {"编号": 33, "类别": "几何抽象", "类别内序号": 33, "纹样名称": "条纹", "盛行朝代": "汉—清", "文化寓意": "条纹是以平行直线连续排列构成的几何装饰纹样。条纹是最简单、最基础的几何纹样之一，新石器时代彩陶上已见雏形。条纹可横向、纵向或斜向排列，粗细可变化，可单色也可多色交替，形成简洁明快的装饰效果。条纹在中国传统装饰中应用广泛，历代常用于织物、陶瓷、建筑和金银器的边饰或主体纹样，是最具现代感的传统纹样之一。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/J5OM25nV7Y", "caption": "清代云锦海水纹条纹"}, {"url": "https://aka.doubaocdn.com/s/j9A0mfpYvQ", "caption": "明万历缎面袍服"}, {"url": "https://aka.doubaocdn.com/s/exHCLqXGn1", "caption": "清代条纹织锦"}, {"url": "https://aka.doubaocdn.com/s/dDTgsh6Fus", "caption": "明代锦缎"}, {"url": "https://aka.doubaocdn.com/s/A7sx87dJXR", "caption": "唐代条纹锦残片"}, {"url": "https://aka.doubaocdn.com/s/5bI1mAvDzO", "caption": "明清条纹织品"}], "线稿图": [], "复原设计图": [], "对应文物": ["条纹织锦", "条纹地锦", "条纹边饰缎（历代织物可补充）"], "朝代脉络": [{"period": "新石器时代", "desc": "条纹雏形见于仰韶文化、马家窑文化彩陶，以平行直线构成装饰带。"}, {"period": "商周", "desc": "条纹在青铜器上作为辅助纹样出现，常位于器口或器足边缘。"}, {"period": "汉代", "desc": "条纹在织锦和漆器上广泛应用，常作为边饰或主体纹样。"}, {"period": "唐宋", "desc": "条纹在织锦和瓷器上继续发展，宋代定窑、景德镇窑瓷器中常见刻花条纹。"}, {"period": "明清", "desc": "条纹在织锦和建筑彩画上仍有使用，多作为辅助纹样出现在边饰中。"}], "寓意分条": ["条纹简洁大方，寓意行事干脆、不拖泥带水。", "平行排列象征条理清晰、思路明确。", "横条纹层层递进，寓意步步高升、循序渐进。", "竖条纹笔直向上，寓意正直不屈、顶天立地。", "规律排列象征和谐有序、节奏分明。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色交替；瓷器青花蓝白、五彩、粉彩；建筑彩绘多色。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、边饰。", "应用部位": "边饰、器物腹部装饰带、建筑彩画边饰。", "使用场景": "日常服饰、礼仪服饰、陈设器物、建筑装饰。"}, "常见搭配": ["云纹", "卷草纹", "几何纹", "花卉纹。"]}, {"编号": 14, "类别": "几何抽象", "类别内序号": 14, "纹样名称": "杯纹", "盛行朝代": "汉晋—唐宋", "文化寓意": "杯纹是以杯、碗等器皿的截面轮廓为原型抽象而来的几何纹样，常见八角形、圆形或多边形套叠结构，形如杯口俯视之态，故称杯纹。它多用于织锦、瓷器、建筑彩画和家具装饰，以规整的几何外框包裹中心花卉或瑞兽，形成”杯内套花”的构图。杯纹结构严谨、对称均衡，宋元时期开始流行，明清达到高峰，寓意杯盈福寿、圆满丰盛。", "服饰应用部位": "", "实物文物图": [], "对应文物": ["东汉杯纹夔纹锦（楼兰遗址出土，中国丝绸博物馆藏）", "汉晋长生无极杯纹锦（尼雅遗址出土，甘肃省博物馆藏）", "唐代对鸟杯纹锦残片（日本法隆寺藏）"], "朝代脉络": [{"period": "唐代", "desc": "杯、碗等器皿的装饰轮廓已见于金银器和铜镜，但尚未独立发展为几何纹样。"}, {"period": "宋代", "desc": "杯纹作为独立几何骨架进入织锦和瓷器装饰，常以八角形或圆形外框套叠，框内填折枝花或团花，构图理性而雅致，体现宋式审美。"}, {"period": "元代", "desc": "杯纹继续用于织金锦和瓷器，外框形态更趋丰富，出现八角杯、六角杯等多种变体，常与卷草、云纹组合。"}, {"period": "明代", "desc": "杯纹高度程式化，成为织锦地纹和瓷器开光的重要骨架，明锦中常见”杯内织宝相花”“杯内织缠枝莲”等组合，宫廷织物和民间织物均有应用。"}, {"period": "清代", "desc": "杯纹应用更加细密华丽，常与卍字、古钱、蝙蝠等吉祥符号组合，寓意更加世俗化；家具、建筑彩画中亦常见杯纹骨架内填复杂图案的做法。"}], "寓意分条": ["杯、碗等器皿的装饰轮廓已见于金银器和铜镜，但尚未独立发展为几何纹样。", "杯纹作为独立几何骨架进入织锦和瓷器装饰，常以八角形或圆形外框套叠，框内填折枝花或团花，构图理性而雅致，体现宋式审美。", "杯纹继续用于织金锦和瓷器，外框形态更趋丰富，出现八角杯、六角杯等多种变体，常与卷草、云纹组合。", "杯纹高度程式化，成为织锦地纹和瓷器开光的重要骨架，明锦中常见”杯内织宝相花”“杯内织缠枝莲”等组合，宫廷织物和民间织物均有应用。", "杯纹应用更加细密华丽，常与卍字、古钱、蝙蝠等吉祥符号组合，寓意更加世俗化；家具、建筑彩画中亦常见杯纹骨架内填复杂图案的做法。", "单一杯形轮廓独立排列。", "大小杯形轮廓嵌套，形成多层几何骨架。", "杯形框内填宝相花、团花、折枝花等主纹。", "杯形框内填龙、凤、麒麟、鹿等瑞兽。", "杯纹作为满地骨架的织锦组织。", "杯为盛器，象征福寿满盈、富贵盈门。", "圆形或八角形杯口轮廓寓意圆满、周全。", "杯与”备”谐音，有”具备”“齐全”之意，寓意万事俱备。", "连续排列的杯纹象征福杯不断、富贵永续。", "杯本为礼器原型，带有一定的庄重仪式感。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色妆花；瓷器中青花蓝白、五彩、粉彩、斗彩皆有；家具多为木色描金或彩绘。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、暗花缎；也广泛用于瓷器、漆器、家具、建筑彩画、金银器。", "适用衣物": "袍料、裙料、披肩、被面、帐幔。", "应用部位": "衣身团窠中心、满地地纹、器物腹部开光、建筑藻井、家具卡子花。", "使用场景": "宫廷服饰、礼仪服饰、寿庆陈设、婚嫁织物、宗教场所装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "卷草纹", "云纹", "蝙蝠纹"], "线稿图": []}, {"编号": 38, "类别": "几何抽象", "类别内序号": 38, "纹样名称": "柿蒂纹", "盛行朝代": "明", "文化寓意": "柿蒂纹是模仿柿子蒂部（花萼）形态的装饰纹样，以四瓣或五瓣放射状排列构成，形似柿子底部的蒂。柿蒂纹是中国传统装饰中常见的植物纹样，虽源于植物，但因形态规整、结构对称，常被归入几何化装饰纹样。柿蒂纹在汉代漆器和铜镜上大量出现，历代广泛应用于织物、陶瓷、建筑和金银器，象征事事如意、吉祥美满。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/YUN23fopwq", "caption": "明·绿织金妆花通袖过肩龙柿蒂缎立领女夹衣"}, {"url": "https://aka.doubaocdn.com/s/8VNH9bBJZm", "caption": "明·绿织金妆花通袖过肩龙柿蒂缎立领女夹衣"}, {"url": "https://aka.doubaocdn.com/s/2U0WKco5ej", "caption": "清·黄色柿蒂窠妆花缎蟒袍"}, {"url": "https://aka.doubaocdn.com/s/lDFfJeE04f", "caption": "控弦司·翼柿蒂窠百鸟朝凤纹织锦明制汉服圆领袍"}, {"url": "https://aka.doubaocdn.com/s/fdSN35aOiq", "caption": "控弦司·翼柿蒂窠百鸟朝凤纹织锦明制汉服圆领袍"}, {"url": "https://aka.doubaocdn.com/s/2gGFoOVYgc", "caption": "清·黄色柿蒂窠妆花缎蟒袍"}], "线稿图": [], "复原设计图": [], "对应文物": ["宝蓝缎彩绣平金云龙纹朝袍", "石青纱妆花云蟒纹单朝袍", "柿蒂纹地织锦"], "朝代脉络": [{"period": "汉代", "desc": "柿蒂纹在漆器和铜镜上大量出现，是汉代最具代表性的装饰纹样之一，常位于器物中心或四角。"}, {"period": "魏晋南北朝", "desc": "柿蒂纹继续用于铜镜和织物装饰，形态保持四瓣或五瓣放射状。"}, {"period": "唐代", "desc": "柿蒂纹在织锦和金银器上流行，唐代铜镜中常见柿蒂纹与花卉组合。"}, {"period": "宋元", "desc": "柿蒂纹在织锦和瓷器上继续发展，宋代定窑、景德镇窑瓷器中常见刻花柿蒂纹。"}, {"period": "明清", "desc": "柿蒂纹在织锦和建筑彩画上仍有使用，常作为辅助纹样出现在边饰中。"}], "寓意分条": ["“柿”谐音”事”，寓意事事如意、万事顺遂。", "柿蒂形态饱满，寓意吉祥美满、幸福安康。", "四瓣柿蒂指向四方，寓意四方平安、八方来财。", "柿蒂坚韧，寓意坚韧不屈、意志坚定。", "柿子象征丰收，寓意丰收富足、五谷丰登。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑彩绘多色。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、边饰。", "应用部位": "器物中心装饰、四角装饰、边饰、满地地纹。", "使用场景": "日常服饰、礼仪服饰、陈设器物、建筑装饰。"}, "常见搭配": ["云纹", "卷草纹", "花卉纹", "几何纹。"]}, {"编号": 27, "类别": "几何抽象", "类别内序号": 27, "纹样名称": "水波纹", "盛行朝代": "先秦—清", "文化寓意": "水波纹是模仿水面波浪起伏形态的装饰纹样，以连续起伏的弧线或曲线构成，表现水的流动感和韵律感。水波纹是中国最古老的装饰纹样之一，新石器时代彩陶上已见雏形，历代广泛应用于陶瓷、织物、建筑和金银器。水波纹形态多样，有单层波浪、双层波浪、多层叠浪、漩涡浪等，可单独使用，也可与龙纹、鱼纹、莲花纹等组合，寓意江河湖海、福泽绵长。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/mYjo2RitQr", "caption": "清代海水江崖纹刺绣"}, {"url": "https://aka.doubaocdn.com/s/i1h5LjVy98", "caption": "清代嘉庆石青缎海水纹刺绣"}, {"url": "https://aka.doubaocdn.com/s/cFdrgg9QjV", "caption": "清代刺绣补子海水纹官服"}, {"url": "https://aka.doubaocdn.com/s/sz43MBdLC6", "caption": "明清缂丝海水江崖纹龙袍"}, {"url": "https://aka.doubaocdn.com/s/hU58EL7G9M", "caption": "清代海水纹织锦"}, {"url": "https://aka.doubaocdn.com/s/ahcWMD57Bu", "caption": "清代海水纹刺绣局部"}], "线稿图": [], "复原设计图": [], "对应文物": ["月白色缂丝彩云蓝龙袷龙袍", "明黄缎绣云龙纹吉服袍", "宝蓝缎彩绣平金云龙纹朝袍"], "朝代脉络": [{"period": "新石器时代", "desc": "水波纹雏形见于马家窑文化彩陶，以连续弧线表现水波流动。"}, {"period": "汉代", "desc": "水波纹在漆器和画像石上广泛应用，常与云纹组合表现云海翻腾。"}, {"period": "唐代", "desc": "水波纹在金银器和陶瓷上流行，唐代银器中常见錾刻水波纹，与鱼纹、龙纹组合。"}, {"period": "宋代", "desc": "水波纹在定窑、景德镇窑瓷器上常见，刻花和印花水波纹工艺精湛。"}, {"period": "明清", "desc": "水波纹在青花瓷上达到高峰，“海水江崖纹”成为龙袍和官服的固定纹样，象征江山永固。"}], "寓意分条": ["水波纹雏形见于马家窑文化彩陶，以连续弧线表现水波流动。", "水波纹在漆器和画像石上广泛应用，常与云纹组合表现云海翻腾。", "水波纹在金银器和陶瓷上流行，唐代银器中常见錾刻水波纹，与鱼纹、龙纹组合。", "水波纹在定窑、景德镇窑瓷器上常见，刻花和印花水波纹工艺精湛。", "水波纹在青花瓷上达到高峰，“海水江崖纹”成为龙袍和官服的固定纹样，象征江山永固。", "单层连续起伏的波浪线。", "双层波浪线交错排列。", "多层波浪叠加，表现巨浪翻腾。", "以螺旋线表现水流漩涡。", "水波纹与山崖组合，象征江山永固。", "水象征福泽，波浪连绵寓意福泽绵长、世代永续。", "水象征财富，波浪起伏寓意财源滚滚、生生不息。", "水波纹象征广阔水域，寓意胸怀宽广、包容万物。", "海水江崖纹象征江山社稷稳固、万世传承。", "水虽柔却能穿石，寓意柔韧不屈、以柔克刚。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩、斗彩；织物中蓝、绿、白为主。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也广泛用于瓷器、建筑彩画、金银器。", "适用衣物": "龙袍、官服、裙料、袍料。", "应用部位": "器物底部装饰带、衣摆边缘、建筑台基装饰、器物腹部。", "使用场景": "宫廷服饰、礼仪服饰、陈设器物、建筑装饰。"}, "常见搭配": ["龙纹", "鱼纹", "莲花纹", "云纹", "山崖纹", "海兽纹。"]}, {"编号": 25, "类别": "几何抽象", "类别内序号": 25, "纹样名称": "玛瑙纹", "盛行朝代": "唐宋—清", "文化寓意": "玛瑙纹是模仿天然玛瑙石纹理的装饰纹样，以流动变幻的层叠色带、晕染渐变和半透明质感为特征。天然玛瑙因二氧化硅胶体逐层沉淀形成同心圆状、带状或云雾状纹理，色彩丰富，有红、黄、白、灰、绿、蓝等多种色调。玛瑙纹在器物装饰中常以仿玛瑙釉色或彩绘形式呈现，追求天然石材的温润质感和色彩层次，宋元明清时期在陶瓷、漆器和家具上广泛应用。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/7H7RroUU2K", "caption": "明沉香地玛瑙锦"}, {"url": "https://aka.doubaocdn.com/s/MD3D28V9pG", "caption": "明代半袖织金锦袍"}, {"url": "https://aka.doubaocdn.com/s/sU8dfvjUWk", "caption": "明织锦缎"}, {"url": "https://aka.doubaocdn.com/s/HIcUnEQPO9", "caption": "清代大红织锦缎"}, {"url": "https://aka.doubaocdn.com/s/VEJcnmJCkn", "caption": "明代锦缎"}, {"url": "https://aka.doubaocdn.com/s/40VU32X0iW", "caption": "明万历缎面袍服"}], "线稿图": [], "复原设计图": [], "对应文物": ["玛瑙纹织锦", "玛瑙纹地锦", "玛瑙纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "玛瑙纹的雏形可见于唐代金银器和玉器，仿玛瑙色泽的器物已有出现。"}, {"period": "宋代", "desc": "宋代陶瓷中仿玛瑙釉色达到高峰，汝窑、官窑等名窑常以玛瑙入釉，追求温润如玉的质感。宋代漆器中也有仿玛瑙纹理的装饰。"}, {"period": "元代", "desc": "元代陶瓷继续发展仿玛瑙釉色，青花和釉里红中偶见玛瑙纹理的晕染效果。"}, {"period": "明清", "desc": "明清时期玛瑙纹在陶瓷、漆器和家具上广泛应用，清代宫廷器物中常见仿玛瑙釉色的瓶、碗、盘等，工艺精湛。"}], "寓意分条": ["玛瑙自古被视为宝石，象征富贵和吉祥。", "佛教七宝之一，寓意健康长寿、辟邪护身。", "层叠色带象征和谐有序、美满如意。", "玛瑙质感温润，寓意君子品格、温和敦厚。", "多色层叠象征人生丰富多彩、层次分明。"], "属性": {"常用颜色": "红、黄、白、灰、绿、蓝等多色层叠，以晕染渐变表现天然质感。", "常用布料": "较少用于织物，主要用于陶瓷釉色、漆器、家具镶嵌、玉石雕刻。", "适用衣物": "一般不用于衣物，偶见于服饰配饰如玉佩、带板。", "应用部位": "器物通体装饰、家具镶嵌面板、漆器表面。", "使用场景": "陈设器物、文房用品、宫廷御用、宗教法器。"}, "常见搭配": ["云纹", "卷草纹", "如意纹", "蝙蝠纹", "寿字纹。"]}, {"编号": 22, "类别": "几何抽象", "类别内序号": 22, "纹样名称": "球路纹", "盛行朝代": "宋—明", "文化寓意": "球路纹（又称”毬路纹”“球露纹”）是一类以圆形为基础元素、通过圆圆相切相交构成四方连续骨架的几何纹样，并非单一固定纹样，而是一类纹样结构的统称。《营造法式》中对其结构有明确记载：只构一单独圆形称”盘毬纹”，四圆相交称”簇四毬纹”，六圆相交称”簇六毬纹”，中间饰花称”填花毬纹”，饰雪花称”簇六雪华”。球路纹结构精密、循环不息，宋元时期在织锦、瓷器、建筑和金银器上广泛流行，是传统几何纹样中最具代表性的骨架纹样之一。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/AmaXEk9hIc", "caption": "清代花卉球路纹藏式锦袍"}, {"url": "https://aka.doubaocdn.com/s/uAzHQRdO2G", "caption": "清代花卉球路纹藏式锦袍"}, {"url": "https://aka.doubaocdn.com/s/ByP8h2UMoi", "caption": "清代花卉球路纹藏式锦袍"}, {"url": "https://aka.doubaocdn.com/s/Z3jRqdfiNG", "caption": "清·地皮球花刺绣"}, {"url": "https://aka.doubaocdn.com/s/9zhSa2fUUx", "caption": "清·缂丝刺绣皮球花纹缎面"}, {"url": "https://aka.doubaocdn.com/s/6c2BOgsogg", "caption": "清晚期·蓝地皮球花蝶纹锦缎女袄"}], "线稿图": [], "复原设计图": [], "对应文物": ["球路纹织锦", "球路纹地锦", "球路纹边饰缎（唐代/宋代织物可补充）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "球路纹随丝绸之路文化交流传入中原，联珠纹和团窠纹为其雏形。"}, {"period": "唐代", "desc": "球路纹在织锦和金银器上盛行，唐代丝绸图案常采用团窠形式，球路纹的圆形骨架已具规模。"}, {"period": "宋代", "desc": "球路纹达到高峰，《营造法式》对其结构有系统记载。北宋灵鹫毬路纹锦袍（出土于新疆阿拉尔）是典型实物，大圆内填灵鹫和花树，小圆内填四鸟纹，结构精美。宋代球路锦常用于书画装裱和高官章服，“毬路金带”为两府顶级章服。"}, {"period": "元代", "desc": "球路纹继续用于织金锦和器物装饰，元代尚衣局专门织造毬路锦用于御服和赏赐。"}, {"period": "明清", "desc": "球路纹在仿宋织锦中作为基础骨架使用，清代演变为”皮球花”，大小相套、圆转不绝。"}], "寓意分条": ["圆圆相交、循环不息的结构寓意福运相连、世代永续。", "圆形象征圆满，多圆组合寓意富贵团圆、和和美美。", "“转官毬路”特指南宋官场祈愿升迁的吉祥纹样。", "连续排列的球路纹寓意福泽广布、绵延不绝。", "圆形骨架暗合天圆地方的宇宙观，象征天地有序。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄、白多色妆花；瓷器青花蓝白、五彩、粉彩、斗彩；金银器本色或鎏金。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、蜀锦；也广泛用于瓷器、建筑格眼、金银器、石刻。", "适用衣物": "袍料、裙料、靠垫织物、被面、帐幔、霞帔坠。", "应用部位": "满地地纹、衣身团窠中心、器物腹部装饰带、建筑格眼、金银器装饰。", "使用场景": "宫廷服饰、高官章服、书画装裱、婚嫁器物、建筑装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "鸟兽纹", "龟背纹", "联珠纹"]}, {"编号": 23, "类别": "几何抽象", "类别内序号": 23, "纹样名称": "盘球纹", "盛行朝代": "唐宋", "文化寓意": "盘球纹是球路纹的一种基础类型，指单独圆形构成的球路纹单元。“盘”意为盘旋、盘绕，“球”指圆形轮廓，盘球纹即以单个圆形为核心，圆形内填充花卉、鸟兽或几何纹样，多个盘球纹单元连续排列形成满地纹。它结构简洁、构图饱满，是球路纹体系中最基本的构成单元，唐宋时期在织锦和瓷器上广泛应用。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/jUX87p8KzJ", "caption": "明代粉红地双狮球路纹宋锦"}, {"url": "https://aka.doubaocdn.com/s/PQp5CPEZxq", "caption": "宋代灵鹫纹锦袍"}, {"url": "https://aka.doubaocdn.com/s/MCGKqM1VKi", "caption": "宋代灵鹫纹锦袍"}, {"url": "https://aka.doubaocdn.com/s/2vCk2wmu3y", "caption": "宋代球路纹锦袍"}, {"url": "https://aka.doubaocdn.com/s/IoAXBcqd8x", "caption": "明代浅绿色地莲花夔龙球路纹双层锦"}, {"url": "https://aka.doubaocdn.com/s/28YlCAUhVe", "caption": "明代夔龙球路纹锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["盘球纹织锦", "盘球纹地锦", "盘球纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "盘球纹的雏形可见于唐代团窠纹，圆形内填宝相花或对鸟纹的构图已具规模。"}, {"period": "宋代", "desc": "《营造法式》明确记载”只构一单独圆形则称盘毬纹”，盘球纹成为球路纹体系的基础单元。宋代织锦中盘球纹常与簇四、簇六球纹组合使用。"}, {"period": "元明清", "desc": "盘球纹继续作为球路纹的基本单元使用，明清时期逐渐融入皮球花体系，大小圆相套、圆转不绝。"}], "寓意分条": ["圆形象征圆满、周全、无缺。", "圆盘寓意家庭团圆、和和美美。", "连续排列的盘球纹寓意周而复始、生生不息。", "圆形内填各种纹样，寓意包容万象、海纳百川。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、金银器。", "适用衣物": "袍料、裙料、靠垫织物、被面。", "应用部位": "满地地纹、衣身团窠中心、器物腹部装饰。", "使用场景": "宫廷服饰、日常服饰、陈设织物。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "鸟兽纹", "云纹。"]}, {"编号": 10, "类别": "几何抽象", "类别内序号": 10, "纹样名称": "盘绦纹", "盛行朝代": "北朝—清", "文化寓意": "盘绦纹是以绦带交织环扣构成的连环式几何骨架纹样。它常由多条花绦相互穿插，形成六边形、方形或菱形框架，框架内再填朵花、折枝、宝相花等主纹，交叠处常嵌以古钱、锁子、龟背、方胜等细小几何纹。盘绦纹是宋式锦中的经典纹样，构图均衡、层次丰富，既有绦带连绵不断之意，又适合作为织锦地纹骨架。", "服饰应用部位": "衣身地纹、装裱边饰", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/VajUWr9va0", "caption": "故宫博物院藏·清康熙米黄彩织花卉盘绦锦裱片"}, {"url": "https://aka.doubaocdn.com/s/JWobNrIZ0y", "caption": "北朝·盘绦狩猎纹锦"}, {"url": "https://aka.doubaocdn.com/s/R3f32KqQeb", "caption": "苏州博物馆藏·宋锦盘绦纹锦"}, {"url": "https://aka.doubaocdn.com/s/kbOEDX1pCp", "caption": "明晚期·加金盘绦朵花锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["北朝盘绦狩猎纹锦残片（新疆博物馆藏）", "苏州博物馆藏宋锦盘绦纹锦", "故宫博物院藏清康熙米黄彩织花卉盘绦锦裱片"], "朝代脉络": [{"period": "宋代", "desc": "盘绦纹在宋锦中已十分成熟，故宫藏”柿红盘绦朵花宋锦”即以盘绦构成六边形框架，心内填朵花，交叠处再织龟背、锁子、古钱、方胜、卍字等小花纹。"}, {"period": "元代", "desc": "继承宋式锦构图，盘绦骨架继续用于织锦和器物装饰，连环结构更趋规整。"}, {"period": "明代", "desc": "盘绦纹仍见于织锦和服饰装饰，常与朵花、折枝花组合，层次细腻。"}, {"period": "清代", "desc": "延续宋锦传统，盘绦纹多用于高档织锦、袍料和器物边饰，寓意吉祥绵长。"}], "寓意分条": ["绦带交织成六边形连环框架。", "框架内填朵花、折枝花、宝相花等。", "交叠处嵌古钱、锁子、龟背、方胜、卍字等小花纹。", "以盘绦为骨架的织锦组织。", "绦带连绵不断，象征福气不绝。", "环扣结构寓意人际和合、事业连贯。", "内填花卉与杂宝时，强化富贵吉祥之意。"], "属性": {"常用颜色": "宋锦常见红、绿、蓝、金、白等多色搭配，艳而不火。", "常用布料": "宋锦、妆花缎、织金锦、缂丝。", "适用衣物": "袍料、披肩、被面、包首、陈设织物。", "应用部位": "衣身满地纹、边饰、器物装饰带。", "使用场景": "宫廷服饰、文人书房陈设、礼仪器物、高档织物。"}, "常见搭配": ["朵花", "折枝花", "宝相花", "古钱纹", "锁子纹", "龟背纹"]}, {"编号": 24, "类别": "几何抽象", "类别内序号": 24, "纹样名称": "簇六球纹", "盛行朝代": "宋—清", "文化寓意": "簇六球纹是球路纹中最具代表性的一种，由六个圆形围绕一个中心圆形相交相切构成，共七个圆形组成一个基本单元，向四周连续延伸形成四方连续纹样。《营造法式》记载”六圆相交称簇六毬纹”，是球路纹体系中结构最为经典、应用最为广泛的类型。簇六球纹结构精密、对称均衡，七个圆的组合在东西方文化中都有特殊意义——西方称其为”生命之花”，中国传统文化中”七”象征圆满。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/tpg3PxqF6K", "caption": "明代宋式锦簇六球路纹"}, {"url": "https://aka.doubaocdn.com/s/GezwUHa44o", "caption": "明代粉红地双狮球路纹宋锦"}, {"url": "https://aka.doubaocdn.com/s/rFE0AZ4Vto", "caption": "宋式锦"}, {"url": "https://aka.doubaocdn.com/s/KiYfpswG9T", "caption": "灵鹫球路纹锦"}, {"url": "https://aka.doubaocdn.com/s/KF4s2kU5Ko", "caption": "宋代球路纹锦袍"}, {"url": "https://aka.doubaocdn.com/s/VkFlEUXaR0", "caption": "明代宋锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["簇六球纹织锦", "簇六球纹地锦", "簇六球纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "簇六球纹的雏形可见于唐代织锦的六圆组合构图，圆形骨架已具规模。"}, {"period": "宋代", "desc": "簇六球纹在宋锦中高度成熟，《营造法式》明确记载其结构。北宋灵鹫毬路纹锦袍中的小团窠即为簇六球纹变体，大圆周围六小圆排列精密。宋代瓷器上也常见簇六球纹装饰。"}, {"period": "元代", "desc": "簇六球纹继续用于织金锦和器物装饰，结构保持六圆组合特征，填充纹样更加丰富。"}, {"period": "明清", "desc": "簇六球纹在织锦和建筑装饰中仍有使用，清代演变为皮球花体系中的簇六形式，故宫太和门前铜狮脚下的绣球即为簇六球纹。"}], "寓意分条": ["七个圆形组合象征圆满、完整、周而复始。", "六圆围绕中心，契合”六六大顺”的吉祥观念。", "六圆围绕中心圆，寓意众望所归、核心稳固。", "连续排列的结构寓意福运相连、世代永续。", "与”生命之花”同构，象征生命力旺盛、生生不息。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄、白多色妆花；瓷器青花蓝白、五彩、粉彩、斗彩；金银器本色或鎏金。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、蜀锦；也广泛用于瓷器、建筑格眼、金银器、石刻。", "适用衣物": "袍料、裙料、靠垫织物、被面、帐幔。", "应用部位": "满地地纹、衣身团窠中心、器物腹部装饰带、建筑格眼。", "使用场景": "宫廷服饰、礼仪服饰、陈设织物、建筑装饰。"}, "常见搭配": ["宝相花纹", "团花纹", "缠枝纹", "鸟兽纹", "龟背纹", "联珠纹"]}, {"编号": 34, "类别": "几何抽象", "类别内序号": 34, "纹样名称": "线纹", "盛行朝代": "先秦—清", "文化寓意": "线纹是以线条为基本元素构成的装饰纹样，包括直线、曲线、折线等多种形态。线纹是最基础、最原始的装饰元素，新石器时代彩陶上已见雏形。线纹可单独使用形成简洁的装饰效果，也可作为骨架或边饰与其他纹样组合。线纹在中国传统装饰中无处不在，是构成所有纹样的基础元素，历代广泛应用于织物、陶瓷、建筑和金银器。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/QV8Ve5ZpLI", "caption": "唐代条纹提花锦"}, {"url": "https://aka.doubaocdn.com/s/uTz32pNJsq", "caption": "唐代三色条纹绫"}, {"url": "https://aka.doubaocdn.com/s/tGVmsTS796", "caption": "唐代三色条纹绫"}, {"url": "https://aka.doubaocdn.com/s/q3t3yQq6iU", "caption": "唐代条纹提花锦"}, {"url": "https://aka.doubaocdn.com/s/V1l7SEHz9z", "caption": "唐代织锦"}, {"url": "https://aka.doubaocdn.com/s/Vgv8UFoJqo", "caption": "唐代锦半臂"}], "线稿图": [], "复原设计图": [], "对应文物": ["长沙马王堆汉墓出土素纱襌衣（湖南博物院藏）", "南宋褐色罗印花褶裥裙（福建省博物馆藏）", "清代月白色暗花线纹绸女袍（故宫博物院藏）"], "朝代脉络": [{"period": "新石器时代", "desc": "线纹雏形见于仰韶文化、马家窑文化彩陶，以刻划或彩绘线条构成装饰。"}, {"period": "商周", "desc": "线纹在青铜器上作为辅助纹样出现，常以云雷纹、弦纹等形式呈现。"}, {"period": "汉代", "desc": "线纹在织锦和漆器上广泛应用，常作为边饰或骨架。"}, {"period": "唐宋", "desc": "线纹在织锦和瓷器上继续发展，宋代定窑、景德镇窑瓷器中常见刻花线纹。"}, {"period": "明清", "desc": "线纹在织锦和建筑彩画上仍有使用，多作为辅助纹样出现在边饰中。"}], "寓意分条": ["线纹简洁大方，寓意返璞归真、纯粹自然。", "线条连续不断，寓意绵延不绝、世代永续。", "直线刚劲、曲线柔和，寓意刚柔并济、张弛有度。", "线条有明确方向，寓意目标明确、勇往直前。", "线纹是纹样基础，寓意根基稳固、基础扎实。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑彩绘多色。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、边饰。", "应用部位": "边饰、器物口沿或底部装饰带、建筑彩画边饰。", "使用场景": "日常服饰、礼仪服饰、陈设器物、建筑装饰。"}, "常见搭配": ["云纹", "卷草纹", "几何纹", "花卉纹。"]}, {"编号": 5, "类别": "几何抽象", "类别内序号": 5, "纹样名称": "联珠团窠纹", "盛行朝代": "隋—唐", "文化寓意": "联珠团窠纹是以联珠圈围合团窠、圈内填主纹的复合纹样。它由联珠纹与团窠结构组合而成，珠圈作为外框，圈内常填宝相花、对鸟、对兽、狩猎纹等主纹，形成”圈中套花”的经典构图。隋唐时期最为盛行，是唐代织锦、金银器和铜镜中最具代表性的团窠纹样之一，兼具几何骨架与主题装饰双重功能。", "服饰应用部位": "胸前、背后、肩部的团纹位置", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/UZMHoCVGhk", "caption": "中国丝绸博物馆藏·唐团窠联珠对鹿纹锦"}, {"url": "https://aka.doubaocdn.com/s/9UOuoQutDY", "caption": "甘肃省博物馆藏·唐联珠团窠对鹿纹锦特写"}, {"url": "https://aka.doubaocdn.com/s/Pzlr2lOg16", "caption": "唐联珠团窠骑士狩猎纹锦"}], "线稿图": [], "复原设计图": [], "对应文物": ["团窠对兽纹夹联珠对鸟纹半臂（成都博物馆藏）", "团窠联珠对孔雀纹锦残片（中国丝绸博物馆藏）", "团窠对羊纹锦（中国丝绸博物馆藏）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "联珠圈与团窠结构开始结合，见于早期织锦和金银器。"}, {"period": "隋唐", "desc": "联珠团窠纹高度成熟，唐代纬锦中大量出现，珠圈内填对鸟、对兽、宝相花、狩猎纹等，构图饱满、色彩华丽。吐鲁番阿斯塔那出土唐代织锦中可见多例。"}, {"period": "宋元", "desc": "逐渐被缠枝团花、云肩团花取代，联珠圈退居边饰或辅助纹样。"}, {"period": "明清", "desc": "多用于瓷器、织锦和建筑彩画，形态趋于细小规整，常作满地纹或边饰。"}], "寓意分条": ["圆珠围合象征圆满，团窠主纹多为富贵花卉或瑞兽。", "联珠圈源自西亚，团窠主纹多为中国传统题材，体现丝路文化交流。", "圈内主纹多呈对称布局，象征礼制秩序与和谐安定。"], "属性": {"常用颜色": "唐代织锦常见红、黄、绿、蓝、白多色；瓷器中青花蓝白、五彩皆有。", "常用布料": "纬锦、经锦、妆花缎、缂丝；也用于金银器、铜镜、瓷器装饰。", "适用衣物": "袍料、半臂锦、被锦、披肩。", "应用部位": "衣身团窠中心、满地纹、器物腹部装饰带。", "使用场景": "宫廷服饰、随葬织物、日常陈设、礼仪器物。"}, "常见搭配": ["联珠纹", "宝相花纹", "对鸟纹", "对兽纹", "卷草纹", "缠枝纹"]}, {"编号": 4, "类别": "几何抽象", "类别内序号": 4, "纹样名称": "联珠纹", "盛行朝代": "南北朝—唐", "文化寓意": "联珠纹是以大小相近的圆珠连续排列成圈、成带或成网格的几何纹样。圆珠可围成圆形团窠，也可排成二方连续边饰，或纵横交织构成满地骨架。它既是最基础的点状几何纹，也是团窠类纹样的重要外框结构。隋唐时期尤为盛行，常见于织锦、金银器、铜镜和石窟装饰，常与对鸟、对兽、宝相花、狩猎纹等组合，形成”珠圈内主纹”的经典构图。", "服饰应用部位": "衣身边饰带、围合主纹的联珠圈", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/zGLcnGJYO3", "caption": "新疆博物馆藏·唐联珠鸾鸟纹锦（阿斯塔那墓出土）"}, {"url": "https://aka.doubaocdn.com/s/M8ivAueMVV", "caption": "美国克利夫兰艺术博物馆藏·唐联珠对鸟纹锦"}, {"url": "https://aka.doubaocdn.com/s/caMrADVqnI", "caption": "成都蜀锦织绣博物馆藏·唐红地联珠团窠立猪纹锦"}, {"url": "https://aka.doubaocdn.com/s/Z5WPW15AKb", "caption": "新疆吐鲁番出土·唐联珠骑士纹锦残片"}], "线稿图": [], "复原设计图": [], "对应文物": ["联珠对鸟对狮“同”字纹锦（新疆维吾尔自治区博物馆藏，阿斯塔那墓出土）", "联珠对孔雀“贵”字纹锦（新疆维吾尔自治区博物馆藏）", "北朝联珠纹锦残片（新疆尼雅遗址出土）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "随丝路贸易传入，早期见于织锦和金银器，圆珠排列尚较自由。"}, {"period": "隋唐", "desc": "联珠纹高度成熟， , "卷草纹", "如意纹。"]}, {"编号": 8, "类别": "几何抽象", "类别内序号": 8, "纹样名称": "菱格纹", "盛行朝代": "新石器时代—清", "文化寓意": "菱格纹是以菱形连续排列构成的几何纹样，菱形格可单独作满地纹，也可在格内填花卉、瑞兽、文字等主纹，形成”菱格套花”的复合构图。它结构稳定、延展性强，新石器时代陶器上已见雏形，后世广泛用于织锦、瓷器、家具和建筑装饰，寓意吉祥稳固、富贵连绵。", "服饰应用部位": "衣身地纹、团纹填充", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/ImdbEKM6Ov", "caption": "辽代·菱形斜纹纬锦局部特写"}, {"url": "https://aka.doubaocdn.com/s/XjHvKZ6RnP", "caption": "湖南省博物馆藏·明菱格龙纹缎特写"}], "线稿图": [], "复原设计图": [], "对应文物": ["马家窑文化彩陶菱格纹陶壶（中国国家博物馆藏）", "新疆克孜尔石窟菱格本生故事壁画", "河北隆化鸽子洞出土元菱格卍字龙纹花绫"], "朝代脉络": [{"period": "宋代", "desc": "菱花、菱格类纹样大量进入格子门格心，成为建筑小木作的重要装饰题材，常与龟背纹、万字纹、球纹等组合。"}, {"period": "元代", "desc": "菱形骨架继续用于织锦和瓷器装饰，菱形开光在宋以后瓷器中逐渐流行，用来突出内部主纹。"}, {"period": "明代", "desc": "菱花、菱格纹在门窗格扇、家具棂条和瓷器开光中更常见，形态更规整，也常与缠枝、团花组合。"}, {"period": "清代", "desc": "菱花纹成为宫殿建筑高等级窗格的重要样式，如故宫的三交六椀菱花、双交四椀菱花等，等级区分明显；瓷器中也常见菱形、菱花形开光。"}], "寓意分条": ["菱花、菱格类纹样大量进入格子门格心，成为建筑小木作的重要装饰题材，常与龟背纹、万字纹、球纹等组合。", "菱形骨架继续用于织锦和瓷器装饰，菱形开光在宋以后瓷器中逐渐流行，用来突出内部主纹。", "菱花、菱格纹在门窗格扇、家具棂条和瓷器开光中更常见，形态更规整，也常与缠枝、团花组合。", "菱花纹成为宫殿建筑高等级窗格的重要样式，如故宫的三交六椀菱花、双交四椀菱花等，等级区分明显；瓷器中也常见菱形、菱花形开光。", "菱形连续排列，无内填主纹。", "菱形格内填折枝花、团花、宝相花等。", "菱形格内填卍字，寓意万福万寿。", "菱格纹作满地纹的织锦组织。", "菱形结构稳定，象征家宅稳固、基业长青。", "连续延展的网格结构寓意福运连绵、子孙相继。", "格内填瑞兽或吉祥纹样时，强化辟邪纳福之意。"], "属性": {"常用颜色": "青花蓝白、五彩、粉彩；织物中红、金、蓝、绿多色。", "常用布料": "妆花缎、织金缎、缂丝、锦；也用于木雕、砖雕、瓷器、建筑窗棂。", "适用衣物": "袍料、裙料、披肩、帐幔、椅披。", "应用部位": "满地纹、窗棂格心、家具雕花、建筑彩画边饰。", "使用场景": "宫廷陈设、寿庆、婚嫁、日常服饰、建筑装饰。"}, "常见搭配": ["折枝花纹", "团花纹", "卍字纹", "盘长纹", "云纹", "瑞兽纹。"]}, {"编号": 29, "类别": "几何抽象", "类别内序号": 29, "纹样名称": "蜂窝纹", "盛行朝代": "唐宋—清", "文化寓意": "蜂窝纹是模仿蜂巢六边形结构的装饰纹样，以规整的六边形单元连续排列构成，形成精密的几何网格。蜂窝纹结构稳定、排列有序，是自然界中最具效率的几何结构之一。中国传统装饰中蜂窝纹应用广泛，唐宋时期在织锦、陶瓷和建筑格眼上流行，常作为骨架纹样填充花卉、鸟兽或其他装饰，形成规矩而丰富的装饰效果。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/rimMWQhR0z", "caption": "清代黄底金丝织锦花缎上衣"}, {"url": "https://aka.doubaocdn.com/s/uPSRDutuEp", "caption": "清代藏族金丝织锦花缎上衣"}, {"url": "https://aka.doubaocdn.com/s/yiA69PNtQH", "caption": "清代丝绸织锦缎"}, {"url": "https://aka.doubaocdn.com/s/w7bk874Igd", "caption": "清代金丝织锦花缎夹袍"}, {"url": "https://aka.doubaocdn.com/s/qMOPOdaiCC", "caption": "清代织锦缎"}, {"url": "https://aka.doubaocdn.com/s/ZOHVNdrNIL", "caption": "清代黄底金丝织锦花缎上衣"}], "线稿图": [], "复原设计图": [], "对应文物": ["蜂窝纹织锦", "蜂窝纹地锦", "蜂窝纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "唐代", "desc": "蜂窝纹在织锦和金银器上初见规模，六边形骨架已具规整排列特征。"}, {"period": "宋代", "desc": "蜂窝纹在宋锦和建筑格眼上广泛应用，《营造法式》中记载的”六边形格眼”即为蜂窝纹结构。宋代瓷器上也常见蜂窝纹装饰。"}, {"period": "元代", "desc": "蜂窝纹继续用于织金锦和建筑装饰，结构保持六边形排列特征。"}, {"period": "明清", "desc": "蜂窝纹在织锦和建筑格眼上仍有使用，常作为辅助性骨架纹样，填充花卉或几何纹样。"}], "寓意分条": ["蜂巢象征蜜蜂勤劳团结，寓意勤劳致富、团结协作。", "六边形结构稳定，寓意根基稳固、坚不可摧。", "规整排列象征秩序井然、有条不紊。", "蜂巢是自然界最高效的结构，寓意高效节约、物尽其用。", "蜂巢象征家庭，寓意家庭和睦、子孙繁盛。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑木构本色或彩绘。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑格眼、金银器。", "适用衣物": "袍料、裙料、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰带、建筑格眼。", "使用场景": "日常服饰、陈设织物、建筑装饰。"}, "常见搭配": ["花卉纹", "鸟兽纹", "几何纹", "云纹", "卷草纹。"]}, {"编号": 39, "类别": "几何抽象", "类别内序号": 39, "纹样名称": "象眼纹", "盛行朝代": "宋—明", "文化寓意": "象眼纹是模仿大象眼睛形态的装饰纹样，以菱形或椭圆形为基本单元，内部常填充十字、米字或其他几何纹样。象眼纹虽以”象眼”命名，但形态已高度几何化，是传统装饰中常见的几何骨架纹样。象眼纹在唐宋时期在织锦和建筑格眼上流行，常作为骨架填充花卉、鸟兽或其他装饰，形成规矩而丰富的装饰效果。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/FYQGhgWhZM", "caption": "壮族菱形纹织锦"}, {"url": "https://aka.doubaocdn.com/s/ZZIalKgta8", "caption": "明代万字菱格螭虎纹绸对襟上衣"}, {"url": "https://aka.doubaocdn.com/s/9NLngIvb2u", "caption": "明代万历菱格螭虎纹绸对襟上衣"}, {"url": "https://aka.doubaocdn.com/s/LNgGPInUhk", "caption": "明万历万字菱格螭虎纹绸对襟上衣"}, {"url": "https://aka.doubaocdn.com/s/KgifjhwkOM", "caption": "明代菱格螭纹绸裤"}, {"url": "https://aka.doubaocdn.com/s/IG3Vp6BEZe", "caption": "明代万字菱格纹袍服"}], "线稿图": [], "复原设计图": [], "对应文物": ["明代壮锦象眼纹被面（广西民族博物馆藏）", "清代傣锦象眼纹佛幡（云南民族博物馆藏）", "清代侗锦象眼纹围裙（湖南博物馆藏）"], "朝代脉络": [{"period": "唐代", "desc": "象眼纹在织锦和金银器上初见规模，菱形骨架内填十字或米字纹。"}, {"period": "宋代", "desc": "象眼纹在宋锦和建筑格眼上广泛应用，《营造法式》中记载的”象眼格眼”即为象眼纹结构。"}, {"period": "元代", "desc": "象眼纹在织金锦和建筑装饰上继续发展，骨架保持菱形或椭圆形。"}, {"period": "明清", "desc": "象眼纹在织锦和建筑格眼上仍有使用，常作为辅助性骨架纹样，填充花卉或吉祥纹样。"}], "寓意分条": ["“象”谐音”祥”，寓意吉祥如意、吉祥安康。", "象象征太平盛世，寓意天下太平、国泰民安。", "大象力大稳固，寓意根基稳固、力量强大。", "大象聪慧，寓意智慧聪慧、聪明伶俐。", "象眼纹常填充吉祥纹样，寓意富贵吉祥、福寿绵长。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩；建筑木构本色或彩绘。", "常用布料": "妆花缎、织金缎、缂丝、宋锦；也用于瓷器、建筑格眼、金银器。", "适用衣物": "袍料、裙料、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰带、建筑格眼。", "使用场景": "日常服饰、陈设织物、建筑装饰。"}, "常见搭配": ["花卉纹", "鸟兽纹", "云纹", "卷草纹", "几何纹。"]}, {"编号": 17, "类别": "几何抽象", "类别内序号": 17, "纹样名称": "金钱纹", "盛行朝代": "唐宋—明清", "文化寓意": "金钱纹是以古代铜钱（圆形方孔或圆形圆孔）为原型抽象而成的几何纹样，可单独排列，也可连续延展成满地纹。铜钱自古即为财富和权力的象征，金钱纹因此成为传统装饰中最受欢迎的吉祥纹样之一。它多用于织锦、瓷器、家具、建筑窗棂和金银器，常与蝙蝠（“福在眼前”）、元宝、聚宝盆等组合，寓意招财进宝、财源广进、富贵盈门。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/u3YyO1Ew0E", "caption": "传统铜钱纹服饰刺绣"}, {"url": "https://aka.doubaocdn.com/s/2cer27Kywh", "caption": "明代连钱银锭纹织金襕裙"}, {"url": "https://aka.doubaocdn.com/s/vkpa2pgL4X", "caption": "明代金锦纹样"}, {"url": "https://aka.doubaocdn.com/s/Kpg8owM0dI", "caption": "清代织锦匹段"}, {"url": "https://aka.doubaocdn.com/s/f84nV2dZCI", "caption": "清代织金铜钱纹缎"}, {"url": "https://aka.doubaocdn.com/s/vlVzl1fgQi", "caption": "传统铜钱纹织绣"}], "线稿图": [], "复原设计图": [], "对应文物": ["唐代金钱纹锦残片（阿斯塔那墓出土，新疆维吾尔自治区博物馆藏）", "明代金钱纹暗花缎袍（孔子博物馆藏）", "清代织金金钱纹女袍（故宫博物院藏）"], "朝代脉络": [{"period": "汉代", "desc": "铜钱作为流通货币已十分成熟，金钱纹的雏形可能见于汉代织物和铜器装饰，但尚未形成独立纹样体系。"}, {"period": "唐宋", "desc": "随着商品经济繁荣，金钱纹开始独立出现于织锦和瓷器上，唐代金银器上可见钱纹装饰，宋代织锦中金钱地纹更为普遍。"}, {"period": "元代", "desc": "织金锦中金钱纹大量使用，常与元宝、蝙蝠、珊瑚等组合，反映元代商业发达和财富崇拜。"}, {"period": "明代", "desc": "金钱纹高度程式化，成为织锦、瓷器、家具的常用纹样，明锦中金钱地纹常与缠枝、花卉组合，民间织物中更是随处可见。"}, {"period": "清代", "desc": "金钱纹应用达到顶峰，常与蝙蝠（福在眼前）、元宝（招财进宝）、寿字（金钱寿字）等组合，吉祥寓意更加丰富多元；建筑窗棂、家具雕花中亦大量使用金钱纹。"}], "寓意分条": ["铜钱作为流通货币已十分成熟，金钱纹的雏形可能见于汉代织物和铜器装饰，但尚未形成独立纹样体系。", "随着商品经济繁荣，金钱纹开始独立出现于织锦和瓷器上，唐代金银器上可见钱纹装饰，宋代织锦中金钱地纹更为普遍。", "织金锦中金钱纹大量使用，常与元宝、蝙蝠、珊瑚等组合，反映元代商业发达和财富崇拜。", "金钱纹高度程式化，成为织锦、瓷器、家具的常用纹样，明锦中金钱地纹常与缠枝、花卉组合，民间织物中更是随处可见。", "金钱纹应用达到顶峰，常与蝙蝠（福在眼前）、元宝（招财进宝）、寿字（金钱寿字）等组合，吉祥寓意更加丰富多元；建筑窗棂、家具雕花中亦大量使用金钱纹。", "单个铜钱图案独立排列。", "铜钱二方或四方连续排列，形成满地金钱锦。", "模拟圆形方孔铜钱，最经典的金钱纹形态。", "模拟圆形圆孔铜钱，形态略有差异。", "铜钱中间有穿绳贯穿，形成”串钱”效果。", "金钱与蝙蝠、元宝、珊瑚、灵芝等组合成复合吉祥图案。", "铜钱直接象征财富，金钱纹是最直白的求财纹样。", "连续排列的金钱纹寓意财源滚滚、源源不断。", "金钱与蝙蝠组合为”福在眼前”，与元宝组合为”招财进宝”。", "铜钱外圆内方，象征天圆地方、千秋万代永续。", "铜钱与官印组合寓意”马上封侯”“加官进爵”。", "铜钱自古有辟邪功能，金钱纹亦带镇宅护院之意。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿、黄多色妆花，以金色和红色最为常见；瓷器中青花蓝白、五彩、粉彩、斗彩皆有；家具多为描金或木雕贴金。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、锦；也广泛用于瓷器、漆器、家具、建筑窗棂、金银器、铜器。", "适用衣物": "袍料、裙料、被面、荷包、钱包、帐幔。", "应用部位": "满地地纹、边饰、开光中心、器物腹部、窗棂格心、家具雕花。", "使用场景": "宫廷服饰、商人服饰、婚嫁织物、寿庆陈设、商业场所装饰、日常家居。"}, "常见搭配": ["蝙蝠纹", "元宝纹", "珊瑚纹", "灵芝纹", "缠枝纹", "宝相花纹"]}, {"编号": 15, "类别": "几何抽象", "类别内序号": 15, "纹样名称": "锁子纹", "盛行朝代": "唐—明清", "文化寓意": "锁子纹是以环环相扣的圆环或方环连续交织构成的几何纹样，模拟古代锁子甲（环甲）的编织结构。每一环穿过相邻三环或四环，形成紧密而富有弹性的网状骨架。锁子纹结构精密、秩序感极强，自西域传入后在中国织物、瓷器、建筑和金属工艺中广泛流行，既可作为满地地纹，也可作为边饰和开光骨架，寓意坚不可摧、连绵不绝。", "服饰应用部位": "", "实物文物图": [], "对应文物": ["唐代锁子纹锦残片（阿斯塔那墓出土，新疆博物馆藏）", "宋代军戎锁子纹战袍残片（福建博物馆藏）", "清代织金锁子纹武将补服（故宫博物院藏）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "锁子甲随骑兵战术和西域文化交流传入中原，锁子甲的环环相扣结构开始被抽象为装饰纹样，见于石窟装饰和金银器。"}, {"period": "隋唐", "desc": "锁子纹大量出现在织锦和金银器上，唐代纬锦中常见锁子地纹上织宝相花或对鸟纹，锁子甲本身也是军中常见甲胄类型。"}, {"period": "宋元", "desc": "锁子纹在宋锦中地位显著提升，成为重要的锦地骨架，常与盘绦、方胜、卍字等组合构成复杂的地纹体系；元代织金锦中锁子地纹更为细密。"}, {"period": "明代", "desc": "锁子纹广泛用于织锦、瓷器、家具和建筑彩画，明锦中锁子地纹常作为袍料和靠垫的底层组织，瓷器上则多用于口沿和足部的装饰带。"}, {"period": "清代", "desc": "锁子纹继续用于高档织锦和器物装饰，但逐渐被更繁复的锦地纹样取代，多作为辅助性地纹使用。"}], "寓意分条": ["锁子甲随骑兵战术和西域文化交流传入中原，锁子甲的环环相扣结构开始被抽象为装饰纹样，见于石窟装饰和金银器。", "锁子纹大量出现在织锦和金银器上，唐代纬锦中常见锁子地纹上织宝相花或对鸟纹，锁子甲本身也是军中常见甲胄类型。", "锁子纹在宋锦中地位显著提升，成为重要的锦地骨架，常与盘绦、方胜、卍字等组合构成复杂的地纹体系；元代织金锦中锁子地纹更为细密。", "锁子纹广泛用于织锦、瓷器、家具和建筑彩画，明锦中锁子地纹常作为袍料和靠垫的底层组织，瓷器上则多用于口沿和足部的装饰带。", "锁子纹继续用于高档织锦和器物装饰，但逐渐被更繁复的锦地纹样取代，多作为辅助性地纹使用。", "以圆环相扣为主，最接近真实锁子甲结构。", "以方环相扣，几何感更强，多见于织锦和建筑窗棂。", "锁子纹作为满地底纹，上方再织主纹。", "锁子网格内填花卉、瑞兽、文字等小纹样。", "锁子纹排成带状，作器物口沿、衣缘装饰。", "锁子甲本为防护甲胄，象征坚甲利兵、百毒不侵。", "环环相扣结构寓意福运相连、子孙相继、周而复始。", "环环紧扣象征人际和合、家族团结、众志成城。", "锁子甲有护体之意，锁子纹亦带辟邪护佑的吉祥意味。", "细密的锁子地纹多用于高档织物，本身也象征精致华贵的生活。"], "属性": {"常用颜色": "织锦中红、蓝、绿、金、白多色搭配；瓷器青花蓝白、五彩、粉彩皆有；金属器以铜、银本色为主。", "常用布料": "妆花缎、织金缎、宋锦、缂丝、暗花缎；也广泛用于瓷器、漆器、木雕、建筑窗棂、金属工艺。", "适用衣物": "袍料、裙料、披肩、靠垫织物、帐幔、佛事织物。", "应用部位": "满地地纹、边饰、开光骨架、器物腹部装饰带、窗棂格心。", "使用场景": "宫廷服饰、军装装饰、日常服饰、陈设织物、建筑装饰。"}, "常见搭配": ["宝相花纹", "缠枝纹", "团花纹", "盘绦纹", "方胜纹", "卍字纹"], "线稿图": []}, {"编号": 16, "类别": "几何抽象", "类别内序号": 16, "纹样名称": "锁甲纹", "盛行朝代": "唐宋—明清", "文化寓意": "锁甲纹与锁子纹同源，均以古代锁子甲（环甲）的编织结构为原型，由环环相扣的金属环连续交织构成几何骨架。二者在实物中常混用，但”锁甲纹”更强调甲胄本身的防护意象，纹样中环的形态有时更偏椭圆或水滴形，模拟甲片的层叠效果。锁甲纹多用于织锦、瓷器、建筑和金属工艺，寓意坚甲利兵、护身平安。", "服饰应用部位": "", "实物文物图": [], "对应文物": ["唐代铠甲甲片纹锦残片（阿斯塔那墓出土，新疆维吾尔自治区博物馆藏）", "明代锁甲纹武将朝服补子（孔子博物馆藏）", "清代织金锁甲纹武将马褂（故宫博物院藏）"], "朝代脉络": [{"period": "魏晋南北朝", "desc": "锁子甲随西域军事技术传入，其甲片层叠结构被抽象为装饰纹样，初见于金铜器和石窟装饰。"}, {"period": "隋唐", "desc": "锁甲纹见于织锦和金银器，唐代军制兴盛，锁子甲为常见甲胄类型，其纹样也随之流行，常与宝相花、联珠纹组合。"}, {"period": "宋元", "desc": "锁甲纹在宋锦中作为锦地骨架使用，元代织金织物中锁甲地纹与龙凤、花卉组合，层次丰富。"}, {"period": "明清", "desc": "锁甲纹继续用于织锦和器物装饰，但逐渐与锁子纹混用不分，多作为辅助性地纹或边饰出现。"}], "寓意分条": ["锁子甲随西域军事技术传入，其甲片层叠结构被抽象为装饰纹样，初见于金铜器和石窟装饰。", "锁甲纹见于织锦和金银器，唐代军制兴盛，锁子甲为常见甲胄类型，其纹样也随之流行，常与宝相花、联珠纹组合。", "锁甲纹在宋锦中作为锦地骨架使用，元代织金织物中锁甲地纹与龙凤、花卉组合，层次丰富。", "锁甲纹继续用于织锦和器物装饰，但逐渐与锁子纹混用不分，多作为辅助性地纹或边饰出现。", "以椭圆环相扣，模拟真实甲片层叠效果。", "环呈水滴形，尖头朝下层叠排列，更具流动感。", "锁甲纹作满地底纹，上方再织主纹。", "甲片网格内填花卉、瑞兽等小纹样。", "锁甲本为战甲，象征武艺高强、百战不殆。", "甲胄护体之意延伸为吉祥护佑、灾厄不侵。", "甲片层层叠叠，寓意富贵叠加、福泽深厚。", "环环相扣结构象征福运不断、世代相传。"], "属性": {"常用颜色": "织锦中红、金、蓝、绿多色；瓷器青花、五彩、粉彩；金属器本色或鎏金。", "常用布料": "妆花缎、织金缎、宋锦、缂丝；也用于瓷器、漆器、木雕、金属工艺。", "适用衣物": "袍料、裙料、披肩、靠垫织物。", "应用部位": "满地地纹、边饰、器物装饰带。", "使用场景": "宫廷服饰、军装装饰、日常服饰、陈设织物。"}, "常见搭配": ["宝相花纹", "缠枝纹", "团花纹", "云纹", "蝙蝠纹", "卍字纹。"], "线稿图": []}, {"编号": 13, "类别": "几何抽象", "类别内序号": 13, "纹样名称": "雷纹", "盛行朝代": "商周—明清", "文化寓意": "雷纹是云雷纹体系中方折回旋的部分，模拟春雷震动的方折线条，是商周青铜器上和云纹配套的核心地纹。雷纹象征春雷发动、万物复苏，也代表上天威严惩戒之力，从青铜礼器延伸到服饰，一直沿用至明清仿古织物中。", "服饰应用部位": "", "实物文物图": [], "对应文物": ["商代雷纹青铜方鼎（殷墟博物馆藏）", "汉代雷纹锦残片（新疆尼雅遗址出土）", "清代雷纹边饰缎（故宫博物院藏）"], "朝代脉络": [{"period": "商周起源", "desc": "商周青铜器上雷纹作为云雷纹体系的方折部分，和圆形云纹配合，构成兽面纹的地纹骨架。"}, {"period": "汉代服饰转化", "desc": "新疆尼雅遗址出土汉代织锦中，雷纹从青铜礼器延伸到织物，作为衣缘边饰使用。"}, {"period": "唐宋仿古沿用", "desc": "宋代仿古织物中雷纹作为复古纹样，多用于祭祀类礼仪服饰。"}, {"period": "明清收尾", "desc": "明清仿古缎中雷纹作为礼服边饰使用，不再作为日常主流纹样。"}], "寓意分条": ["春雷发动：雷纹对应春雷惊醒蛰伏万物，寓意生机勃发、万物复苏", "天威震慑：雷为上天惩戒之力，象征庄重威严、行事刚正", "方正规整：方折线条平直转折，寓意行事方正、规矩有度"], "属性": {"常用颜色": "青铜褐、石青、赭石色，仿古庄重配色", "常用布料": "商周青铜器线刻
