": 46, "类别": "天象云水", "类别内序号": 7, "纹样名称": "行云纹", "盛行朝代": "", "文化寓意": "行云纹是以”云行天际”为意象的装饰纹样，云形舒展飘逸、线条流畅动感，常以连续方式排列，表现云气在天际缓缓流动、行进的动态美感。行云纹与流云纹极为相似，都强调云的流动与行进感，但在细分体系中，行云纹更侧重”行”的方向性和行进感，云形往往带有明确的走向。行云纹历代广泛应用于织物、陶瓷、建筑和金银器。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["清代蓝地行云纹织锦（故宫博物院藏）", "清代石青行云纹补服边饰（故宫博物院藏）"], "朝代脉络": [{"period": "战国至汉代", "desc": "行云纹的源头来自云气纹，汉代云气纹中已出现具有明确行进方向的流动云形，广泛用于漆器、织锦和瓦当。"}, {"period": "魏晋南北朝", "desc": "行云纹继续发展，常与佛教装饰、植物纹结合，形态逐渐抽象化。"}, {"period": "隋唐时期", "desc": "行云纹形态更加丰满，线条流畅，常与花卉、鸟兽组合，在织锦和金银器上广泛应用。"}, {"period": "宋元时期", "desc": "行云纹更趋典雅，线条细腻，广泛用于织锦和瓷器，宋代定窑、景德镇窑瓷器中常见刻花行云纹。"}, {"period": "明清时期", "desc": "行云纹程式化增强，常与龙纹、凤纹组合，形成云龙纹、云凤纹等复合纹样，在宫廷织绣和官窑瓷器中大量使用。"}], "寓意分条": ["行云源自云纹体系，象征祥瑞和吉庆，寓意好运随行。", "行云线条舒展连贯，象征行事自然洒脱、气韵通畅、毫不滞涩。", "云居高天，行云纹也含仕途顺遂、青云直上之意。", "行云连绵不断，象征福泽延续、事业不绝、生命不止。", "行云无拘无束、自在飘行，象征心境开阔、超然物外。"], "属性": {"常用颜色": "织锦中金、红、蓝、绿、黄多色；瓷器青花蓝白、五彩、粉彩、斗彩；建筑彩绘青绿、金红。", "常用布料": "妆花缎、织金缎、缂丝、宋锦、云锦；也用于瓷器、建筑彩画、金银器。", "适用衣物": "袍料、裙料、披肩、靠垫织物。", "应用部位": "满地地纹、边饰、器物腹部装饰、建筑梁枋彩画。", "使用场景": "日常服饰、礼仪服饰、宫廷陈设、建筑装饰。"}, "常见搭配": ["龙纹", "凤纹", "花卉纹", "蝙蝠纹", "卷草纹", "八宝纹。"]}, {"编号": 67, "类别": "天象云水", "类别内序号": 28, "纹样名称": "雪纹", "盛行朝代": "", "文化寓意": "雪纹是以雪花飘落为主要构图的装饰纹样，雪花轻盈洁白、形态优美，常以连续方式排列形成装饰带。雪纹是中国传统纹样中较为雅致的天象纹样，历代主要应用于陶瓷、织锦和书画，象征纯洁高雅、瑞雪兆丰年。雪纹常与梅花、竹子组合使用，构成”岁寒三友”或”梅雪”意象，深受文人雅士喜爱。雪花形态多样，有六角星形、点状、片状等多种表现方式。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "对应文物": ["雪纹织锦", "雪纹地锦", "雪纹边饰缎（明清织物可补充）"], "朝代脉络": [{"period": "宋代", "desc": "雪纹在瓷器和绘画上开始流行，以密集的点状或星形表现雪花飘落，形态生动自然，深受文人审美影响。宋代文人画中风雪题材盛行，雪纹随之成为独立装饰纹样。"}, {"period": "元代", "desc": "雪纹在青花瓷上继续发展，常与梅花、竹子组合，构成”梅雪”意象，文人趣味浓厚。"}, {"period": "明代", "desc": "雪纹在织锦和瓷器上广泛使用，构图更加丰富多样，常与梅花、竹子、松树组合，构成”岁寒三友”意象，象征君子品格。"}, {"period": "清代", "desc": "雪纹在宫廷织绣和官窑瓷器中继续发展，形态更加精致规范，常作为辅助纹样或地纹使用，也见于剪纸、年画等民间艺术。"}], "寓意分条": ["雪花洁白无瑕，象征品格纯洁、高雅脱俗、不染尘俗。", "雪能滋润土地、冻死害虫，雪纹寓意瑞雪兆丰年、丰收吉祥、来年好光景。", "雪中梅花、竹子、松树不畏严寒，象征坚韧不拔、品格高洁、逆境不屈。", "雪与梅、竹、松组合，象征君子品格、坚贞不屈、四季长青。", "白雪覆盖万物，象征涤荡旧垢、焕然一新、新的开始。"], "属性": {"常用颜色": "织锦中白、蓝、绿多色为主，间以淡粉淡紫；瓷器青花蓝白、五彩、粉彩。", "常用布料": "妆花缎、织金缎、缂丝、云锦；也用于陶瓷、书画。", "适用衣物": "袍料、裙料、披肩。", "应用部位": "衣身主体纹样、器物腹部、书画背景、织锦地纹。", "使用场景": "文人服饰、日常陈设、书画装饰、文人书房装饰。"}, "常见搭配": ["梅花纹", "竹纹", "松纹", "云纹", "鸟纹", "花卉纹。"]}, {"编号": 261, "类别": "宗教祥瑞", "类别内序号": 5, "纹样名称": "七星纹", "盛行朝代": "唐—清，盛于宋元明清", "文化寓意": "七星纹以北斗七星为核心图案，最典型的应用是纳西族“披星戴月”七星羊皮披肩。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/5ufxhX68vK", "caption": "清末道教八卦北斗七星绣衣"}, {"url": "https://aka.doubaocdn.com/s/rKcEDbYUIN", "caption": "明清织绣服饰"}, {"url": "https://aka.doubaocdn.com/s/b0WaMQ28QV", "caption": "清代织锦刺绣龙袍"}, {"url": "https://aka.doubaocdn.com/s/ioWcGAJazk", "caption": "清末道教八卦北斗七星绣衣"}, {"url": "https://aka.doubaocdn.com/s/kVeJw9J4HV", "caption": "古代织锦纹样"}, {"url": "https://aka.doubaocdn.com/s/gCkcVF9EWm", "caption": "清代刺绣绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "纳西族传统", "desc": "七星羊皮披肩是纳西族妇女的传统服饰，上方下圆，七个彩绣圆形布盘代表北斗七星。"}, {"period": "明清至近现代", "desc": "七星披肩形制延续。"}], "寓意分条": ["勤劳美德：象征纳西族妇女早出晚归、披星戴月。", "天人合一：肩挑日月、背负七星。", "护身符性质：七星披肩兼具护身符的功能。"], "属性": {"常用颜色": "披肩以黑色羊皮为地，七个圆盘用金线或彩线绣制。", "常用布料": "羊皮、毛呢、织锦。", "适用衣物": "纳西族妇女披肩、传统织锦服饰面料。", "应用部位": "披肩背部主体、面料通身纹样。", "使用场合": "纳西族日常劳作、节庆活动。"}, "常见搭配": ["日月纹", "山川纹", "万寿纹"]}, {"编号": 263, "类别": "宗教祥瑞", "类别内序号": 7, "纹样名称": "五常纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "五常纹指以儒家“仁、义、礼、智、信”五常伦理观念为核心元素的服饰装饰纹样。冕服十二章纹中，宗彝取其忠孝，均与儒家伦理相关。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/bUUUn1gEAL", "caption": "清代蜀锦服饰"}, {"url": "https://aka.doubaocdn.com/s/ZzORJB6LiO", "caption": "清代晚期文字锦"}, {"url": "https://aka.doubaocdn.com/s/PzjplpIGhX", "caption": "清代织锦文官补六品"}, {"url": "https://aka.doubaocdn.com/s/BpEAwOJ9rx", "caption": "清代金黄色织锦缎长褂"}, {"url": "https://aka.doubaocdn.com/s/wfUxvWIU5w", "caption": "清代五品文官织锦补子"}, {"url": "https://aka.doubaocdn.com/s/RqosqikV2U", "caption": "汉代五星出东方利中国锦护臂"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "周代", "desc": "冕服十二章纹制度确立。"}, {"period": "明清", "desc": "官服补子制度中，文官用禽、武官用兽，禽兽的选择均与儒家德性观念相关。"}], "寓意分条": ["德行修养：五常纹体现穿着者对儒家伦理的认同与修养。", "等级标识：不同纹样对应不同等级。", "教化功能：通过服饰纹样传递儒家伦理观念。"], "属性": {"常用颜色": "宗彝纹以青、赤为主色。", "常用布料": "冕服以玄衣纁裳为主，官服补子用妆花缎、缂丝。", "适用衣物": "冕服、官服补子、礼服。", "应用部位": "冕服上衣下裳、官服前胸后背补子。", "使用场合": "祭祀大典、朝会礼仪。"}, "常见搭配": ["日纹", "月纹", "星辰纹", "山纹", "龙纹"]}, {"编号": 259, "类别": "宗教祥瑞", "类别内序号": 3, "纹样名称": "仙鹤纹", "盛行朝代": "", "文化寓意": "仙鹤纹以丹顶鹤为核心形象，是中国传统服饰中地位最高的祥瑞禽鸟纹样之一。明代一品文官的官服补子纹样即为仙鹤。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "金代", "desc": "罗地丝绣云鹤纹氅衣通体绣104只仙鹤。"}, {"period": "元代", "desc": "夹衫通绣99组图案，最大的图案位于两肩，为一飞一立一对仙鹤。"}, {"period": "明代", "desc": "仙鹤纹成为一品文官补子纹样。"}, {"period": "清代", "desc": "仙鹤纹继续用于官服补子和宫廷服饰。"}], "寓意分条": ["一品高官：明代一品文官补子为仙鹤。", "长寿延年：仙鹤与松树组合为“松鹤延年”。", "仙风道骨：仙鹤与道教神仙信仰相关。"], "属性": {"常用颜色": "补子仙鹤纹以蓝、青、石青为底色，仙鹤以白色为主。", "常用布料": "妆花纱、罗、缎、缂丝。", "适用衣物": "文官补服、氅衣、坎肩、戏服。", "应用部位": "前胸后背方补、氅衣通体、坎肩通身。", "使用场合": "官员朝服、宫廷礼仪、寿庆吉庆。"}, "常见搭配": ["云纹", "松纹", "灵芝纹", "海水江崖纹"]}, {"编号": 257, "类别": "宗教祥瑞", "类别内序号": 1, "纹样名称": "八卦纹", "盛行朝代": "宋—清，盛于明清道教服饰与瓷器", "文化寓意": "八卦纹源于《周易》八卦符号体系，以乾、坤、震、巽、坎、离、艮、兑八种卦象为核心元素。八卦纹在传统服饰中的出现与道教文化密切相关，常与太极图组合使用，形成“太极八卦”的固定图式。八卦衣是道教法服和戏曲服装中的经典形制。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/IcOz7zu5dI", "caption": "清·白缎彩绣八卦衣戏服道袍"}, {"url": "https://aka.doubaocdn.com/s/qrfW9tULRn", "caption": "清·红地绣蝶恋花八宝纹马面"}, {"url": "https://aka.doubaocdn.com/s/W5vaHbBKcH", "caption": "清晚期·紫缎地暗八仙纹刺绣镶边女马褂"}, {"url": "https://aka.doubaocdn.com/s/zIVA2LjMor", "caption": "清代·宝蓝色缎暗八仙云鹤纹女衣"}, {"url": "https://aka.doubaocdn.com/s/NVLXlMyEiv", "caption": "清代白地八卦蝶恋花纹刺绣肚兜"}, {"url": "https://aka.doubaocdn.com/s/BkUsJjbyHy", "caption": "清代暗八仙章绒褂"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋元", "desc": "八卦纹开始出现在道教法服和民间服饰中，元代回纹地滴珠太极纹织金锦风帽以滴珠太极纹样为结构单元。"}, {"period": "明清", "desc": "八卦衣形制定型，成为道教法服和戏曲舞台上的固定服饰。民间肚兜、风帽等也大量使用八卦纹用于辟邪。"}, {"period": "近现代", "desc": "八卦纹在戏曲服装中延续使用，京剧诸葛亮等角色身穿八卦衣。"}], "寓意分条": ["辟邪护身：八卦纹被认为可以辟邪，民间常用于儿童肚兜、风帽等贴身衣物。", "通晓天地：八卦衣寓意穿着者上知天文、下晓地理，神机妙算。", "阴阳调和：八卦符号代表阴阳变化与自然规律，象征天地和谐。"], "属性": {"常用颜色": "道教法服以天青色、黑紫色、宝蓝色为主；民间肚兜以白地或黑地为主。", "常用布料": "大缎、织金锦、棉布。", "适用衣物": "道教法衣、戏曲八卦衣、民间肚兜、风帽。", "应用部位": "法衣左右两侧、腰梁、下摆、袖口；肚兜领缘；风帽背面中央。", "使用场合": "道教法事、戏曲演出、民间育儿辟邪。"}, "常见搭配": ["太极纹", "卷草纹", "回纹", "云纹"]}, {"编号": 268, "类别": "宗教祥瑞", "类别内序号": 12, "纹样名称": "八吉祥纹", "盛行朝代": "元—清（明清鼎盛）", "文化寓意": "八吉祥纹又称佛八宝、八瑞相，源于藏传佛教，元代传入中原，明清广泛流行。它由轮、螺、伞、盖、花、瓶、鱼、盘长八种佛教吉祥器物组成，可单独使用，也可与缠枝、团寿、莲花等组合。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/iDG5pl2mQ2", "caption": "清初·蓝缎地蹙金绣八宝纹"}, {"url": "https://aka.doubaocdn.com/s/xjCZY9GgeY", "caption": "清雍正·明黄缎绣八吉祥龙纹靠背"}, {"url": "https://aka.doubaocdn.com/s/ryiy20vZ1D", "caption": "清·明黄色八吉祥纹花缎龙袍"}, {"url": "https://aka.doubaocdn.com/s/e2YrQDW4uA", "caption": "清·御制明黄缎绣七政八吉祥纹桌围"}, {"url": "https://aka.doubaocdn.com/s/ULIv6hJj1m", "caption": "清嘉庆·红地八仙八吉祥云蝠纹织金绸"}, {"url": "https://aka.doubaocdn.com/s/1nkRzKGLlt", "caption": "清嘉庆—道光·蓝地刺绣八吉祥纹吉服"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "元代", "desc": "首次较明确见于龙泉窑青瓷、景德镇窑卵白釉瓷，多用于佛教供器，排序尚未完全固定。"}, {"period": "明代", "desc": "成为宫廷与宗教器物常见纹样，宣德以后广泛用于瓷器、织锦；出现缠枝莲托八宝、结带八宝等形式。"}, {"period": "清代", "desc": "程式化程度更高，常与缠枝莲、团寿、云纹组合。故宫藏清代织绣、瓷器中可见大量八吉祥纹应用。"}], "寓意分条": ["宗教祈福：最初用于佛教供器、法器，表达清净、圆满、吉祥。", "世俗祝寿：明清与团寿、缠枝结合后，逐渐转向福寿、平安、富贵等世俗祝愿。", "皇家威仪：宫廷器物中常与龙纹、云纹、海水纹并用，兼具神圣性与礼制感。", "婚姻与家宅：民间织物、瓷器中常寓意百无禁忌、家宅安宁、子孙绵长。", "法脉不断：盘长、法轮、法螺都有“连续不断”的视觉特征，象征佛法传承不绝。"], "属性": {"常用颜色": "青花蓝白、五彩、斗彩、粉彩、珐琅多色；织物中常见金地、红地、蓝地配彩绒。", "常用布料": "妆花缎、织金缎、缂丝、锦、绫。", "适用衣物": "吉服、袍料、披肩、帐幔、供器套、佛事织物。", "应用部位": "衣身团花、袖口、领缘、下摆、开光内、边饰带。", "使用场合": "宫廷陈设、佛事供奉、寿庆、婚嫁、日常陈设器。"}, "常见搭配": ["缠枝莲纹", "团寿字纹", "云纹", "海水江崖纹", "莲花纹", "卍字佛印纹", "如意云纹"], "体系组成": "轮：法轮，象征大法圆转、福运不息。螺：法螺，象征妙音吉祥、声名远扬。伞：宝伞，象征护佑众生、遮灾避祸。盖：白盖，象征庄严清净、福泽绵长。花：莲花，象征出离尘垢、圣洁圆满。瓶：宝瓶，象征福智圆满、富贵安康。鱼：金鱼，象征活泼坚固、解脱自在。盘长：盘长结，象征回环贯通、福寿绵长。", "相似纹样说明": "八吉祥纹常与杂宝纹混淆。杂宝纹包括珊瑚、犀角、方胜、银锭、宝珠等，来源更杂；八吉祥纹则固定为佛教八种器物，宗教属性更强。"}, {"编号": 266, "类别": "宗教祥瑞", "类别内序号": 10, "纹样名称": "卍字佛印纹", "盛行朝代": "", "文化寓意": "卍字佛印纹以“卍”字符为核心元素，是佛教传入中国后形成的传统服饰装饰纹样。“卍”字在佛教中象征佛的智慧与慈悲。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "卍字纹随佛教传入。"}, {"period": "明清", "desc": "卍字纹在服饰中广泛流行。"}, {"period": "清末民初", "desc": "卍字纹在民间服饰中屡见不鲜。"}], "寓意分条": ["吉祥万德：卍字在佛教中象征佛的智慧与功德。", "子孙万代：卍字与葫芦、藤蔓、双喜组合。", "绵延不断：卍字纹的连续排列象征福气绵延不断。"], "属性": {"常用颜色": "以金色卍字为主。", "常用布料": "织金绸、织金缎、提花缎、缂丝。", "适用衣物": "吉服袍、龙袍、坎肩、女衫。", "应用部位": "衣身通身纹饰、领襟缘边、袖口。", "使用场合": "吉庆场合、祝寿、婚嫁。"}, "常见搭配": ["盘长纹", "葫芦纹", "双喜纹", "龙纹", "云纹"]}, {"编号": 258, "类别": "宗教祥瑞", "类别内序号": 2, "纹样名称": "太极纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "太极纹以黑白阴阳鱼互相环绕成圆为核心图形，是中国本土宗教道教的标志性符号。贡布里希称太极图为“一副完美无缺的图案”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/irjDpvOvXw", "caption": "清代白缎彩绣八卦衣"}, {"url": "https://aka.doubaocdn.com/s/c13nWxhiIK", "caption": "清代太极八卦图道袍"}, {"url": "https://aka.doubaocdn.com/s/x7VoehYBKU", "caption": "清代太极八卦刺绣摆件"}, {"url": "https://aka.doubaocdn.com/s/pcyoqfKBHk", "caption": "清代太极八卦刺绣摆件"}, {"url": "https://aka.doubaocdn.com/s/4hS2Cz6zZJ", "caption": "清代太极八卦手工绣品"}, {"url": "https://aka.doubaocdn.com/s/qFgK3wYTSn", "caption": "清代阴阳八卦绣布"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋元", "desc": "太极纹开始出现在织物中。元代回纹地滴珠太极纹织金锦风帽以滴珠太极纹样为结构单元。"}, {"period": "明清", "desc": "太极纹在道教法服中固定使用，八卦衣腰梁上缀绣太极图。"}], "寓意分条": ["驱灾辟邪：在民间，太极图成为驱灾辟邪的镇宅宝物。", "阴阳平衡：黑白阴阳鱼象征对立统一、动态平衡的哲学观念。", "道教标志：太极图是道教文化的核心符号。"], "属性": {"常用颜色": "以黑白两色为核心，织物中常以金线织出太极纹。", "常用布料": "织金锦、大缎、棉布。", "适用衣物": "道教法衣、风帽、肚兜、戏曲服装。", "应用部位": "法衣腰梁、风帽背面中央、肚兜中心或领缘。", "使用场合": "道教法事、戏曲演出、民间辟邪护身。"}, "常见搭配": ["八卦纹", "回纹", "卷草纹"]}, {"编号": 264, "类别": "宗教祥瑞", "类别内序号": 8, "纹样名称": "忠孝纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "忠孝纹指以“忠”与“孝”伦理观念为核心的服饰装饰纹样。晚清时期汉族女装中大量出现二十四孝情境纹样，已成为一种“孝文化符号”。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/UREB3ua18k", "caption": "清代宫廷刺绣二十四孝"}, {"url": "https://aka.doubaocdn.com/s/YKC3xm2fNC", "caption": "清代红色缎绣二十四孝纹女袄"}, {"url": "https://aka.doubaocdn.com/s/5xbTvUPBbH", "caption": "清代二十四孝刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/gizPhulw2S", "caption": "清代红色缎纹二十四孝纹女袄"}, {"url": "https://aka.doubaocdn.com/s/TEpvjPx8be", "caption": "清代蓝缎地二十四孝团花人物纹女袍"}, {"url": "https://aka.doubaocdn.com/s/zD9tU58xVV", "caption": "清代二十四孝绣品"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋元", "desc": "二十四孝故事在民间流传。"}, {"period": "明清", "desc": "忠孝纹在服饰中大量出现，尤其晚清汉族女装中。"}], "寓意分条": ["孝道教化：二十四孝纹样是对女德教化的物质形态。", "忠君爱国：忠孝纹体现对君主和国家的忠诚。", "家族伦理：通过服饰纹样强化家族伦理秩序。"], "属性": {"常用颜色": "二十四孝纹服饰以蓝、青、黑为底色。", "常用布料": "绸缎、棉布、妆花缎。", "适用衣物": "汉族女装、戏曲服装、满族刺绣云肩。", "应用部位": "衣身主体、云肩通身、缘边装饰。", "使用场合": "日常穿着、节庆吉庆、戏曲演出。"}, "常见搭配": ["戏曲人物纹", "花卉纹", "云纹"]}, {"编号": 262, "类别": "宗教祥瑞", "类别内序号": 6, "纹样名称": "符箓纹", "盛行朝代": "汉—清，盛于宋元明清", "文化寓意": "符箓纹指以道教符箓为核心元素的服饰装饰纹样。符箓是道教法事中使用的神秘符号，被认为具有召神驱鬼、镇邪护身的灵力。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/xjm7nudb4R", "caption": "清代刺绣道袍法衣"}, {"url": "https://aka.doubaocdn.com/s/UVoGV3x1tq", "caption": "清代道袍降衣"}, {"url": "https://aka.doubaocdn.com/s/hlADwFiSYi", "caption": "清代道教法衣"}, {"url": "https://aka.doubaocdn.com/s/sQlzUo3nDJ", "caption": "清代道袍降衣"}, {"url": "https://aka.doubaocdn.com/s/mAKF2iwPHh", "caption": "道教道袍"}, {"url": "https://aka.doubaocdn.com/s/F7Q3tJUJpF", "caption": "清代月色缎盘金彩绣团鹤萧台八卦纹道袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "道教法服制度逐渐完善。"}, {"period": "明清", "desc": "道教法衣纹样体系成熟，符箓纹与八卦、太极、仙鹤等组合使用。"}], "寓意分条": ["镇邪辟鬼：符箓被认为具有召神驱鬼的灵力。", "身份标识：符箓纹是道士法衣的标识。", "护法佑身：法衣上的符箓纹具有护佑穿着者的功能。"], "属性": {"常用颜色": "道教法衣以青色、黑色、紫色为主，符箓纹多用朱红、金色绣制。", "常用布料": "绸缎、绢、绫。", "适用衣物": "道教法衣、道士常服。", "应用部位": "法衣前襟、后背、剑带、下摆。", "使用场合": "道教法事、斋醮科仪。"}, "常见搭配": ["八卦纹", "太极纹", "龙纹", "虎纹"]}, {"编号": 265, "类别": "宗教祥瑞", "类别内序号": 9, "纹样名称": "节义纹", "盛行朝代": "宋—清，盛于明清", "文化寓意": "节义纹指以“节”与“义”伦理观念为核心的服饰装饰纹样。武梁祠画像石中的列女图像从“贞顺”与“节义”中选取。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/EihIArtth2", "caption": "清代石青缎地刺绣对襟女褂"}, {"url": "https://aka.doubaocdn.com/s/EvTr28tFij", "caption": "清代节妇服饰"}, {"url": "https://aka.doubaocdn.com/s/A5kplrGS2h", "caption": "清代汉族女性服饰"}, {"url": "https://aka.doubaocdn.com/s/5NxKXNUtJ1", "caption": "清代刺绣服饰"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "列女传图像已在画像石中出现。"}, {"period": "明清", "desc": "节义纹在戏曲人物图案中延续，晚清女装中节义题材与忠孝题材常同时出现。"}], "寓意分条": ["气节操守：节义纹体现对气节与道义的坚守。", "女德教化：节义纹与忠孝纹共同构成女德教化的图像体系。", "家族荣誉：通过服饰纹样彰显家族女性的德行。"], "属性": {"常用颜色": "以蓝、青、黑为底色。", "常用布料": "绸缎、棉布、刺绣云肩。", "适用衣物": "汉族女装、满族刺绣云肩、戏曲服装。", "应用部位": "衣身主体、云肩、缘边。", "使用场合": "日常穿着、戏曲演出。"}, "常见搭配": ["忠孝纹", "戏曲人物纹", "花卉纹"]}, {"编号": 260, "类别": "宗教祥瑞", "类别内序号": 4, "纹样名称": "蟠桃纹", "盛行朝代": "", "文化寓意": "蟠桃纹又称寿桃纹，是描绘成熟桃子的传统吉祥纹样。我国是桃的原产国，自古以来人们将桃视为长寿的象征。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "蟠桃纹在服饰中广泛使用。云肩常见“福寿双全”纹样。"}], "寓意分条": ["长寿安康：桃象征长生不老。", "福寿双全：桃与蝙蝠组合。", "驱鬼辟邪：桃木在传统文化中有辟邪功能。"], "属性": {"常用颜色": "桃纹以粉红、大红为主色。", "常用布料": "织锦、绸缎、妆花缎。", "适用衣物": "寿庆礼服、云肩、袄裙、戏服。", "应用部位": "衣身主纹、云肩纹饰、缘边装饰。", "使用场合": "寿诞吉庆、婚嫁吉庆。"}, "常见搭配": ["蝙蝠纹", "佛手纹", "石榴纹", "仙鹤纹", "松纹"]}, {"编号": 267, "类别": "宗教祥瑞", "类别内序号": 11, "纹样名称": "金刚杵纹", "盛行朝代": "", "文化寓意": "金刚杵纹以佛教法器金刚杵为核心形象，象征坚固不摧的智慧与力量。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "金刚杵作为密宗法器随佛教传入。"}, {"period": "元明清", "desc": "金刚杵纹在佛教法衣中广泛使用。"}], "寓意分条": ["坚固不摧：金刚杵象征坚固不摧的智慧与力量。", "护持正法：宝杵纹寓意护持正法、斩除邪魔。", "智慧庇护：金刚杵纹样象征智慧与庇护。"], "属性": {"常用颜色": "佛衣以缎地本色为底，金刚杵以金线或彩线绣制。", "常用布料": "缎、绸。", "适用衣物": "佛教法衣、藏传佛教羌姆围裙、藏装。", "应用部位": "佛衣袖筒、衣身；羌姆围裙边饰。", "使用场合": "佛教法会、密宗仪式。"}, "常见搭配": ["莲花纹", "璎珞纹", "祥云纹", "双鱼纹"]}, {"编号": 320, "类别": "帝王礼服体系", "类别内序号": 1, "纹样名称": "十二章纹", "盛行朝代": "", "文化寓意": "十二章纹是中国古代帝王礼服上的十二种专用纹样：日、月、星辰、山、龙、华虫、宗彝、藻、火、粉米、黼、黻。它不是普通装饰，而是礼制符号，用来表示天子“法天象地、统御万物”的身份。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "最早见于《尚书·益稷》，记载舜禹时期“观古人之象，作服”，成为后世帝王礼服纹样的理论源头。"}, {"period": "周代", "desc": "礼制逐渐完备，十二章纹开始与冕服制度结合。"}, {"period": "汉唐", "desc": "随儒家礼制深化，十二章纹逐渐固定为皇帝衮服专属，等级性增强。"}, {"period": "明代", "desc": "《大明会典》明确皇帝冕服用十二章，排列、位置更规范。"}, {"period": "清代", "desc": "沿袭明制，《大清会典》规定朝服、吉服、衮服上的十二章分布。故宫藏清代帝后服饰实物可见其制度化应用。"}], "体系组成": "日、月、星辰：天象类，象征光明普照、天命所归。山：山川类，象征国土稳固、社稷长久。龙：变化类，象征帝王应时而动、统御四方。华虫：雉鸟类，象征文采礼乐、文德昭著。宗彝：祭祀礼器，象征尊祖敬宗、忠孝有本。藻：水草，象征品行洁净、清廉自守。火：光明类，象征文明照耀、政令昭明。粉米：谷物类，象征养育万民、衣食充足。黼：斧形纹，象征决断果敢。黻：相背纹，象征明辨善恶、取舍有度。", "寓意分条": ["天命所归：日月星辰绣于高位，表示帝王承天受命，照临万方。", "江山稳固：山纹象征厚重安定，寓意统治根基不可动摇。", "文德教化：龙、华虫象征变化无穷与文采礼乐，强调以文德治天下。", "清正滋养：藻、火、粉米分别象征品行高洁、文明光明、养育万民。", "政治裁断：黼为斧形，取决断之义；黻为相背纹，取明辨善恶之义。", "等级秩序：皇帝用十二章，太子、亲王以下递减，强化君臣礼制。"], "属性": {"常用颜色": "五色体系为主，常见青、赤、黄、白、黑，配合绣线或织金显花。", "常用布料": "缎、锦、缂丝、妆花缎、织金缎、绫等高等级织物。", "适用衣物": "皇帝冕服、朝服、衮服、吉服；太子、亲王等礼服依等级减章。", "应用部位": "衣身前后、肩部、袖端、裳幅、下摆、补子边缘等。", "使用场合": "登基、祭祀、朝会、大婚、册封、元旦朝贺等最高礼制场合。"}, "常见搭配": ["龙纹", "云纹", "海水江崖纹", "八吉祥纹", "卍字纹", "团寿字纹", "缠枝纹"], "相似纹样说明": "十二章纹与一般龙纹、云纹不同，它有固定十二种组成和礼制含义，不能随意增减。团龙纹、海水江崖纹只是服饰装饰，十二章纹则属于帝王礼服的等级符号。"}, {"编号": 156, "类别": "植物花果", "类别内序号": 29, "纹样名称": "万年青纹", "盛行朝代": "", "文化寓意": "万年青纹是以万年青为核心的装饰纹样。万年青四季常青，果实殷红，象征长寿、吉祥。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "万年青纹在服饰中广泛使用。"}], "体系组成": "万年青单独纹：万年青独立呈现。万年青配寿字纹：万年青与寿字组合。万年青配灵芝纹：万年青与灵芝组合，寓意万事如意。", "寓意分条": ["万年长青：万年青四季常青。", "长寿安康：万年青象征长寿安康。", "万事如意：万年青和灵芝组合寓意万事如意。"], "属性": {"常用颜色": "以绿、红、蓝等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服。", "应用部位": "衣身通身纹饰。", "使用场合": "寿诞吉庆。"}, "常见搭配": ["团寿字纹", "灵芝纹", "花卉纹", "祥云纹"], "相似纹样说明": "宽叶红果为万年青，针叶为松柏。"}, {"编号": 180, "类别": "植物花果", "类别内序号": 53, "纹样名称": "三多纹", "盛行朝代": "", "文化寓意": "三多纹属于传统组合吉祥花果纹样，由佛手、寿桃、石榴三种果实共同构成，取多福、多寿、多子的美好寓意，是明清时期十分经典的吉祥纹样。纹样将三种果实搭配枝叶组合在一起，果实形态写实饱满，构图和谐丰富，常作为整体装饰单元。服饰中三多纹可做主纹，多用于寿庆、家庭祈福类服饰，刺绣织物中使用较多。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "佛手、桃、石榴各自的纹样单独流行，尚未组合成套。"}, {"period": "元代", "desc": "三种果实开始出现在同一画面，三多组合雏形形成。"}, {"period": "明清", "desc": "三多纹成熟并广泛流行，织物、刺绣大量使用，成为祝寿祈福的代表性纹样。"}], "寓意分条": ["多福：佛手谐音福，象征福气满满，福运常伴。", "多寿：寿桃为长寿象征，寓意身体健康，福寿绵长。", "多子：石榴籽粒繁多，寓意子孙兴旺，家族绵延繁盛。"], "属性": {"常用颜色": "佛手淡黄，寿桃淡红，石榴大红，叶片青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "寿庆盛装、家庭祈福吉庆服饰。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型纹样。", "使用场景": "寿诞吉庆、家庭祈福活动。"}, "常见搭配": ["云纹", "蝙蝠纹", "山石纹", "蝴蝶纹"]}, {"编号": 167, "类别": "植物花果", "类别内序号": 40, "纹样名称": "串枝花纹", "盛行朝代": "", "文化寓意": "串枝花纹，是以细长枝梗串联多朵花果，花朵依次相连、前后接续的连续花卉纹样。纹样依靠枝梗将多组花果串联成一条长带，花朵有序排布，整体连贯流畅，介于折枝与缠枝之间。服饰中串枝花纹可做主纹或辅纹，适合做衣缘、镶边或者面料散点装饰，在织锦中应用广泛。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南北朝", "desc": "串枝纹样雏形出现，枝梗串联小花，多见于织锦与壁画装饰。"}, {"period": "唐代", "desc": "串枝花纹成熟流行，花果串联排布，线条流畅，大量用于锦缎面料。"}, {"period": "宋元明清", "desc": "串枝花纹延续使用，题材丰富，常用来做边缘带状装饰。"}], "寓意分条": ["连绵相继：花果以枝梗串联，寓意好事接连而至，福运接续不断。", "繁盛不绝：一梗接连数花，象征家族兴旺，代代相继，生生绵延。", "和美有序：花果排布整齐有序，寓意生活安稳和顺，万事有条不紊。"], "属性": {"常用颜色": "配色随花卉种类变化，华丽锦缎常用金线勾边，底色常用暗红、米白、藏青。", "常用布料": "高端面料选用唐锦、妆花缎；普通面料多用绫、暗花绸。", "适用衣物": "礼服、贵族袄裙襦裙，多用于领口、袖口、下摆镶边装饰。", "应用部位": "衣缘、袖口、裙摆镶边，也可在衣身横向排布作为主纹。", "使用场景": "婚嫁、寿庆、宫廷礼仪等各类吉庆场合。"}, "常见搭配": ["鸟纹", "卷草纹", "云纹", "山石纹"]}, {"编号": 165, "类别": "植物花果", "类别内序号": 38, "纹样名称": "五谷纹", "盛行朝代": "", "文化寓意": "五谷纹，是以稻、黍、稷、麦、菽五种谷物为主体组合而成的复合纹样，属于农耕文明经典吉祥纹样。纹样将五种禾谷搭配排布，形态质朴写实，汇聚多种禾穗形象，体现五谷齐备的意象。服饰中五谷纹可做主纹也可作辅纹，多用于祭祀、丰收相关服饰，承载祈求五谷丰登的美好愿望。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "祭祀礼器上出现五谷相关纹饰，谷物崇拜盛行。"}, {"period": "唐代", "desc": "织物上五谷组合纹样成型，多种禾穗共同组合的图案开始出现。"}, {"period": "宋元明清", "desc": "五谷纹广泛流行，祭祀、民俗织物大量使用，象征国泰民安、仓廪充盈。"}], "寓意分条": ["五谷丰登：五种谷物齐全，祈求风调雨顺，庄稼丰收，粮食充盈。", "国泰民安：五谷代表农耕根基，寓意天下安定，百姓衣食无忧。", "生生永续：谷物年年播种收获，象征生机不绝，家运绵长兴旺。"], "属性": {"常用颜色": "谷穗多用金黄、土黄，禾叶为青绿色。精致锦缎可用金线勾边，底色常选用米白、浅棕。", "常用布料": "高端面料选用妆花缎、织金锦；普通面料多用绫、暗花绸。", "适用衣物": "祭祀礼服、丰收民俗盛装、农耕主题传统服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可作为衣缘辅纹装饰。", "使用场景": "丰收祭祀、社稷相关礼仪。"}, "常见搭配": ["稻穗纹", "麦穗纹", "云纹", "嘉禾纹"]}, {"编号": 140, "类别": "植物花果", "类别内序号": 13, "纹样名称": "佛手纹", "盛行朝代": "明—清", "文化寓意": "佛手纹以佛手柑果实和枝叶为原型，果实形态奇特，果瓣分裂张开，形似手掌，造型极具辨识度。纹样大多搭配舒展枝叶，多采用折枝构图，是明清时期十分流行的吉祥果实纹样。服饰中佛手纹可做主纹也可作辅纹，常和其他吉祥果品组合，多用于喜庆祝寿类盛装面料。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/6OpIgiHKV7", "caption": "清中期绿色缎绣佛手团花纹女袍"}, {"url": "https://aka.doubaocdn.com/s/NeHjfoMhVf", "caption": "清代打籽绣佛手"}, {"url": "https://aka.doubaocdn.com/s/73uVzDqDXq", "caption": "清中期绿色缎绣佛手团花纹女袍"}, {"url": "https://aka.doubaocdn.com/s/v6VELYs89X", "caption": "清中期绿色缎绣佛手团花纹女袍"}, {"url": "https://aka.doubaocdn.com/s/DA1xaZQb0S", "caption": "清代刺绣佛手"}, {"url": "https://aka.doubaocdn.com/s/OLMx4a5YBC", "caption": "清代佛手纹绣花云肩"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋元", "desc": "织物上佛手纹样开始出现，造型概括简约，服饰上使用较少，尚未普及。"}, {"period": "明代", "desc": "佛手纹逐步流行，果实刻画细致，线条稳重，常和桃、石榴组合在贵族织物之上。"}, {"period": "清代", "desc": "佛手纹大范围普及，三多题材盛行，宫廷与民间祝寿衣衫大量使用佛手纹样。"}], "寓意分条": ["多福吉祥：“佛”谐音“福”，佛手象征福气。祝寿服饰使用佛手纹，祈愿福气临门，福运绵长。", "平安顺遂：佛手形态如手，古人认为有护持守护之意，保佑穿戴者远离灾祸，岁岁平安。", "喜乐圆满：佛手造型舒展优雅，寄托生活和美，万事称心，家中吉祥不断的美好愿望。"], "属性": {"常用颜色": "果实多用淡黄色、浅橙，叶片搭配深绿色。精致礼服会用金线勾勒轮廓，底色常选用暗红、藏青色。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间喜庆衣衫多用绸、绫、普通缎面。", "适用衣物": "祝寿礼服、女子袄裙、各类吉祥主题盛装。", "应用部位": "衣身、裙摆为主，常和桃、石榴一起组合排布，也可单独作为辅纹点缀。", "使用场景": "长辈寿庆、民间喜庆仪式。"}, "常见搭配": ["寿桃纹", "石榴纹", "云纹", "蝙蝠纹"]}, {"编号": 145, "类别": "植物花果", "类别内序号": 18, "纹样名称": "兰纹", "盛行朝代": "", "文化寓意": "兰纹以兰花的花与叶片为原型，叶片细长柔韧，花朵小巧含蓄，是典型文人清雅花卉纹样。纹样多为折枝构图，花叶疏朗简约，线条柔和内敛，自带幽淡含蓄的气质。服饰中兰纹既可做主纹，也能作为辅纹点缀面料，多用于文人主题与雅致女子盛装。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "文人审美盛行，兰纹大量出现在丝织品，造型简约空灵，多用于贵族清雅衣衫面料。"}, {"period": "元代", "desc": "纹样延续宋代简约风格，折枝兰花构图流行，线条简练，民间织物逐步开始使用。"}, {"period": "明清", "desc": "兰纹广为流传，常搭配梅竹菊组成四君子，宫廷与民间雅致服饰都经常使用。"}], "寓意分条": ["高洁典雅：兰花生于幽谷，香气淡雅，象征君子德行。穿戴带有兰纹的衣物，比喻品性高洁不流于俗。", "坚贞自持：兰花幽香内敛，不因无人欣赏而减香，寓意坚守本心，保持自身美好的品格。", "祥和如意：兰花幽香温润，寄托生活安宁和顺，万事称心，家中常有吉庆相伴的愿望。"], "属性": {"常用颜色": "花瓣多用淡紫、白色，叶片选用深青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅灰。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间雅致衣衫多用绫、绸、暗花缎。", "适用衣物": "文人主题盛装、贵族女子清雅袄裙、雅集礼仪服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配梅菊作为辅纹点缀衣缘。", "使用场景": "文人雅集、小型正式礼仪。"}, "常见搭配": ["梅纹", "竹纹", "菊纹", "山石纹", "云纹"]}, {"编号": 172, "类别": "植物花果", "类别内序号": 45, "纹样名称": "冰梅纹", "盛行朝代": "", "文化寓意": "冰梅纹，又称冰裂梅花纹，是以冰裂纹作为底纹，在碎裂如冰的纹路之上点缀梅花花朵、花苞的复合装饰纹样。纹样底层是交错不规则的冰裂纹，上层散落梅花，冰碎纹理衬托繁花，冷硬的裂纹与柔美的梅花相互对比，构图雅致精巧，是清代极具特色的纹样。服饰中冰梅纹可做主纹，多用于清雅风格袄裙，在织物与刺绣装饰中多见。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "冰裂纹在器物上兴起，梅花纹样盛行，但二者尚未组合。"}, {"period": "明代", "desc": "冰梅组合雏形出现，纹样造型趋于细腻。"}, {"period": "清代", "desc": "冰梅纹走向兴盛，广泛用于瓷器、织物、刺绣，成为经典纹样。"}], "寓意分条": ["破冰迎春：冰裂纹代表寒冬，梅花破冰而出，寓意冲破困境、迎来生机与希望。", "傲骨高洁：梅花傲雪开放，象征坚贞不屈、清雅自持的君子品格。", "岁岁平安：冰有纯净安宁之意，梅报春信，寓意祥瑞将至，万事顺遂。"], "属性": {"常用颜色": "冰裂纹多为浅灰、浅青，梅花选用素白、淡粉，枝干棕褐。精致织物可用金线勾边，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "文人雅集盛装、女子素雅襦裙袄裙。", "应用部位": "衣身、裙摆为主，做主纹满铺或散点排布，也可用于领、袖镶边。", "使用场景": "文人雅集、家庭吉庆。"}, "常见搭配": ["竹纹", "山石纹", "云纹"]}, {"编号": 133, "类别": "植物花果", "类别内序号": 6, "纹样名称": "卷草纹", "盛行朝代": "汉—唐（唐代鼎盛）", "文化寓意": "卷草纹以婉转卷曲的枝叶构成连续纹样，由魏晋忍冬纹发展演变而来，是经典曲线类植物纹样。纹样枝蔓回旋舒展，叶片连绵流动，花朵细小或省略，着重表现枝叶优美的曲线。服饰中卷草纹常作为底纹或衣缘边饰，也可作为辅助纹样衬托主花，适用性很强。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/2UZyXJXDwO", "caption": "清乾隆·蓝色蔓草花纹锦男帔"}, {"url": "https://aka.doubaocdn.com/s/nUknZC5DMP", "caption": "清·蓝色蔓草花纹锦男帔"}, {"url": "https://aka.doubaocdn.com/s/6B58Slpl1T", "caption": "清·橙色绒地彩纬织金缠枝莲纹对襟长褂"}, {"url": "https://aka.doubaocdn.com/s/X5PHGna2nz", "caption": "唐·立凤卷草纹绣"}, {"url": "https://aka.doubaocdn.com/s/xjyeOp3z2C", "caption": "清·百花织锦女褂"}, {"url": "https://aka.doubaocdn.com/s/YiPUPuRNcA", "caption": "清·藕荷色缎彩绣折枝藤萝纹女袷袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "魏晋南北朝", "desc": "纹样从忍冬纹演变，叶片尖瘦修长，曲线简单，多用于丝织品镶边装饰。"}, {"period": "唐代", "desc": "卷草纹发展至鼎盛，花叶饱满舒展，曲线华丽奔放，大量应用在各类高级锦缎。"}, {"period": "宋代", "desc": "线条变得纤细柔和，花叶简化，风格秀气内敛，常作为辅助纹样搭配主花卉。"}, {"period": "元明清", "desc": "独立做主纹的情况减少，大多作为辅纹，搭配各类主花共同装饰服饰面料。"}], "寓意分条": ["生生不息：枝蔓无限回旋、连绵不绝，象征生命循环永续，长久不衰。", "绵延兴旺：枝叶不断向外生长延展，寓意家族世代延续，家业兴旺长久。", "祥和安稳：流畅柔和的曲线自带安宁之感，寄托生活和顺、岁岁平安的祈愿。"], "属性": {"常用颜色": "枝叶以绿色为主，搭配红色点缀小花。宫廷织物多用石青底色，搭配五彩配色，金线勾勒轮廓。", "常用布料": "高端面料选用唐锦、妆花缎；普通面料多用绫、罗、绸缎、刺绣。", "适用衣物": "礼仪礼服、披帛、袄裙，多用于镶边装饰。", "应用部位": "衣缘、袖口、下摆镶边，也可铺满面料作为底层辅纹衬托主纹样。", "使用场景": "礼仪服饰、佛事盛装、贵族喜庆服饰。"}, "常见搭配": ["宝相花纹", "莲花纹", "云纹", "回纹"]}, {"编号": 153, "类别": "植物花果", "类别内序号": 26, "纹样名称": "合欢纹", "盛行朝代": "", "文化寓意": "合欢纹以合欢树的花叶为原型，合欢叶昼开夜合，花丝纤细蓬松，花簇轻盈柔美，是传统温情类花木纹样。纹样多采用折枝构图，刻画羽状复叶与绒球状合欢花，线条柔和雅致，自带温柔安宁的气质。服饰中合欢纹可做主纹也可作辅纹，多用于女子雅致衣衫，象征和合美满。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "合欢意象兴起，织物上初见合欢纹样雏形，造型简约，多用于贵族丝织品点缀。"}, {"period": "唐代", "desc": "合欢纹造型趋于丰富，花叶刻画细腻，常用来装饰女子襦裙。"}, {"period": "宋元明清", "desc": "合欢纹持续沿用，侧重夫妻和合之意，婚嫁相关织物多有使用。"}], "寓意分条": ["和合美满：合欢花叶夜晚相合，象征夫妻同心，家庭和睦，亲人团聚，万事和谐。", "喜乐安宁：合欢花开轻柔秀丽，寄托生活安稳和顺，少纷争、常存喜乐。", "团圆相聚：昼开夜合的特性，寓意离别之人终将重逢，亲人团聚，情谊长久不变。"], "属性": {"常用颜色": "花朵多用淡粉、浅红，叶片选用青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子襦裙、袄裙、婚嫁辅助主题盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配鸳鸯作为辅纹点缀衣缘。", "使用场景": "家庭吉庆、婚嫁相关仪式，雅集可搭配使用。"}, "常见搭配": ["鸳鸯纹", "山石纹", "云纹", "蝴蝶纹"]}, {"编号": 174, "类别": "植物花果", "类别内序号": 47, "纹样名称": "同心莲纹", "盛行朝代": "", "文化寓意": "同心莲纹属于莲花衍生吉祥纹样，描绘花心相依、根茎相连的莲花形象，取同心相守之意，常用来表达情意相合。纹样刻画莲花花叶相依，花与花根茎相连，侧重表现同心的意象，柔美温婉，多用于婚嫁主题装饰。服饰中同心莲纹可做主纹，大量应用于婚嫁相关刺绣、织锦面料，象征同心相守。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南北朝", "desc": "佛教艺术与诗文之中，同心莲意象兴起，器物纹饰初见雏形。"}, {"period": "唐代", "desc": "同心莲纹样造型成熟，诗文广为传颂，织物上开始使用该纹样。"}, {"period": "宋元明清", "desc": "同心莲持续流行，常与并蒂莲搭配，作为婚恋吉祥纹样广泛使用。"}], "寓意分条": ["两心相契：根茎相连、花心相依，象征爱人同心，心意相通，不离不弃。", "姻缘和美：多用于婚嫁，祝愿夫妻情意相融，家庭和睦，相守长久。", "纯净忠贞：莲花品性洁净，寓意情感纯粹，坚守本心，忠贞不变。"], "属性": {"常用颜色": "花瓣素白、淡粉，荷叶青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "婚嫁主题襦裙、袄裙、吉庆盛装。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型纹样。", "使用场景": "婚嫁大典、家庭吉庆。"}, "常见搭配": ["并蒂莲纹", "鸳鸯纹", "同心结纹", "云纹"]}, {"编号": 181, "类别": "植物花果", "类别内序号": 54, "纹样名称": "四季花纹", "盛行朝代": "", "文化寓意": "四季花纹，又称四时花卉纹，是将代表春夏秋冬四季的四种代表性花卉组合而成的复合花卉纹样。传统选取春兰、夏荷、秋菊、冬梅，四种花枝共同构成一组纹样，象征四时流转、四季安好。纹样把四种折枝花组合排布，每一种花对应一季，花叶姿态各有特色，构图层次丰富，兼具雅致诗意与吉祥内涵。服饰中四季花纹可做主纹，多用于雅集、家庭吉庆类服饰，刺绣与织锦中较为常见。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "四季花卉各自流行，开始出现四时花卉同幅的雏形。"}, {"period": "宋代", "desc": "文人审美兴盛，四季花组合纹样成型，织物装饰逐步增多。"}, {"period": "元明清", "desc": "四季花纹广泛流行，成为织物、刺绣经典组合纹样，应用十分普遍。"}], "寓意分条": ["四时平安：四季花卉齐全，寓意一年四季平安顺遂，四时皆吉祥。", "品格长青：兰、荷、菊、梅四种花皆为君子之花，象征品性高洁，坚守本心。", "岁岁常安：四时循环往复，寓意福运连绵，年年喜乐无忧。"], "属性": {"常用颜色": "兰花素白淡紫，荷花粉白，菊花黄白，梅花淡粉，叶片青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "文人雅集盛装、家庭吉庆主题袄裙襦裙。", "应用部位": "衣身、裙摆为主，做主纹散点或组团排布，领口袖口也可使用小型四季花单元。", "使用场景": "文人雅集、家庭各类吉庆活动。"}, "常见搭配": ["蝴蝶纹", "雀纹", "山石纹", "云纹"]}, {"编号": 131, "类别": "植物花果", "类别内序号": 4, "纹样名称": "团花纹", "盛行朝代": "", "文化寓意": "团花纹是将花鸟瑞兽等纹样收纳在圆形轮廓内的构图类纹样，并非单一固定花卉。圆形饱满规整，包容性强，内部可填充牡丹、莲花、宝相花等各类吉祥图案。服饰中团花多做主纹，可散点分布，也能满铺面料，是传统礼服十分经典的装饰形式。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南北朝", "desc": "团窠雏形出现，多以联珠环绕花卉，造型古朴，用于上层贵族丝织品。"}, {"period": "唐代", "desc": "团花走向兴盛，唐锦大量使用大尺寸团窠花卉，饱满大气，贵族袍服十分流行。"}, {"period": "宋代", "desc": "团花尺寸缩小，风格清雅秀气，常散点排布，多用于女子罗衫、褙子。"}, {"period": "元明清", "desc": "题材更加丰富，花鸟瑞兽皆可入团花，制式规范，官服、贵妇礼服广泛使用。"}], "寓意分条": ["圆满团圆：整体为圆形构图，圆象征圆满。婚嫁服饰使用团花，寓意家庭团圆，万事周全。", "福运汇聚：各类祥瑞纹样收纳于圆内，代表吉祥汇聚一身，祈求福运集中相伴。", "和谐安定：圆形构图均衡稳定，象征和睦有序，在礼仪服饰上寄托家国安宁的美好愿望。"], "属性": {"常用颜色": "主体纹样多用大红、石青，搭配五彩。宫廷礼服常辅以金线勾边，凸显华贵感。", "常用布料": "高端礼服选用唐锦、妆花缎、缂丝；普通贵族与民间盛装多用绫罗、花缎、刺绣面料。", "适用衣物": "官员袍服、霞帔、贵妇袄裙、婚嫁礼服。", "应用部位": "衣身胸背、下摆为主，大团花一般放在视觉中心，小团花散点铺满衣料。", "使用场景": "宫廷礼仪、婚嫁大典、寿庆盛装。"}, "常见搭配": ["云纹", "回纹边饰", "缠枝纹", "折枝花纹"]}, {"编号": 130, "类别": "植物花果", "类别内序号": 3, "纹样名称": "宝相花纹", "盛行朝代": "东汉—唐（唐代鼎盛）", "文化寓意": "宝相花纹是艺术化合成的理想花卉纹样，融合莲花、牡丹与卷草的特征，现实中并无此原生花卉。纹样花瓣对称规整，层次繁复华丽，自带庄严大气的气质，诞生后多用于古代高级丝织面料。服饰中宝相花一般作为主纹，常做成团花样式，在宗教礼服与宫廷礼仪服饰中尤为多见。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/JawUZb3TYM", "caption": "唐·红地宝相花刺绣靴袜"}, {"url": "https://aka.doubaocdn.com/s/ZpDoYloQTG", "caption": "清·紫色宝相花杂宝纹妆花缎匹料"}, {"url": "https://aka.doubaocdn.com/s/KsHZVqZf25", "caption": "明·红地织金宝相花纹"}, {"url": "https://aka.doubaocdn.com/s/zEXhkrUmbz", "caption": "清中期·红地龟背纹宝相花织锦"}, {"url": "https://aka.doubaocdn.com/s/IthBsPUTU4", "caption": "清·黄地宝相花织锦"}, {"url": "https://aka.doubaocdn.com/s/ocAgwmQVGe", "caption": "清早期·刺绣宝相花四季花卉挂屏"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "魏晋", "desc": "纹样雏形出现，以莲瓣为基础进行组合加工，造型简单质朴。"}, {"period": "唐代", "desc": "宝相花纹发展至鼎盛，花瓣饱满对称，大量织入高端锦缎，富丽庄重。"}, {"period": "宋代", "desc": "纹样造型简化，体量缩小，线条柔和，多应用于贵族女子盛装面料。"}, {"period": "元明清", "desc": "延续前代形制，常搭配云纹、八宝，依旧是高等级礼服的经典纹样。"}], "寓意分条": ["圣洁庄严：宝相本是佛教词汇，代表庄严功德。佛事礼服使用宝相花，象征品性圣洁，清净无染。", "富贵圆满：花叶繁复对称，视觉华丽饱满，寓意万事圆满，家业兴旺繁荣。", "吉祥恒久：规整连续的花瓣结构，象征福运长久，平安吉祥，多用于重大礼仪服饰。"], "属性": {"常用颜色": "纹样多用大红、石青搭配五彩配色，高级织物会使用金线勾勒花瓣轮廓，凸显庄重华贵。", "常用布料": "顶级面料选用唐锦、妆花缎、缂丝；次一级贵族面料多用织金锦、暗花绫缎。", "适用衣物": "宫廷祭祀礼服、僧衣袈裟、贵妇重大场合盛装。", "应用部位": "衣身主体、披领、下摆，大多作为核心主纹，极少用作细窄边饰。", "使用场景": "祭祀大典、佛事仪轨、宫廷正式宴会。"}, "常见搭配": ["云纹", "八吉祥纹", "卷草纹", "联珠纹"]}, {"编号": 173, "类别": "植物花果", "类别内序号": 46, "纹样名称": "并蒂莲纹", "盛行朝代": "", "文化寓意": "并蒂莲纹，又称并头莲纹，一茎之上生出两朵莲花，花叶同根，是经典的莲花变体吉祥纹样。纹样刻画一支花葶顶端共生两朵莲花，花叶相伴，造型对称秀美，寓意美好，常作为婚嫁主题纹样。服饰中并蒂莲纹可做主纹，多用于婚嫁盛装，刺绣织物上尤为常见。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南北朝", "desc": "佛教艺术中出现并蒂莲雏形，器物纹饰初见。"}, {"period": "唐代", "desc": "并蒂莲纹样造型成熟，在壁画、丝织品中逐步增多。"}, {"period": "宋元明清", "desc": "并蒂莲广泛流行，成为婚嫁爱情主题标志性纹样，刺绣应用极多。"}], "寓意分条": ["同心连理：一茎双花，象征夫妻同心、恩爱不离，是婚嫁经典纹样。", "美满团圆：同根共生，代表二人相伴相依，家庭和睦，相守长久。", "纯洁忠贞：莲花品性洁净，象征爱情纯粹坚贞，相守不渝。"], "属性": {"常用颜色": "花瓣素白、淡粉，荷叶青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "婚嫁主题袄裙襦裙、吉庆盛装。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型纹样。", "使用场景": "婚嫁大典、家庭吉庆。"}, "常见搭配": ["鸳鸯纹", "同心结纹", "莲纹", "云纹"]}, {"编号": 134, "类别": "植物花果", "类别内序号": 7, "纹样名称": "忍冬纹", "盛行朝代": "东汉—唐（鼎盛：南北朝）", "文化寓意": "忍冬纹以忍冬，也就是金银花的叶片为原型塑造，叶片两端尖细、中部略宽，呈对生卷曲形态。纹样随佛教文化在魏晋时期传入中原，多设计成连续二方连续样式，装饰感古朴柔和。服饰里忍冬纹大多作为边饰使用，极少大面积做主纹，多见于早期丝绸织物。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/uqHxomngUP", "caption": "汉晋·尼雅遗址忍冬纹织物残片"}, {"url": "https://aka.doubaocdn.com/s/6CPgdFaZ32", "caption": "南北朝·忍冬纹织锦"}, {"url": "https://aka.doubaocdn.com/s/XhvHFARVn0", "caption": "隋·莫高窟429窟佛衣忍冬纹"}, {"url": "https://aka.doubaocdn.com/s/RcZWaf1Z0w", "caption": "金·齐国王墓忍冬夔龙纹金锦"}, {"url": "https://aka.doubaocdn.com/s/ddC5GdZJXj", "caption": "民国·南京博物院红地如意常春纹宋式锦"}, {"url": "https://aka.doubaocdn.com/s/FD9xjozDZk", "caption": "唐·缂丝异兽忍冬莲花纹"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "魏晋南北朝", "desc": "纹样广泛流行，叶片尖瘦利落，多为长条连续样式，大量用在僧衣、贵族披帛面料。"}, {"period": "唐代", "desc": "忍冬纹逐步改良，慢慢演化为卷草纹，单独使用忍冬纹样的织物不断减少。"}, {"period": "宋及以后", "desc": "独立忍冬纹十分少见，大多融合进卷草纹样，不再单独作为服饰装饰纹样。"}], "寓意分条": ["坚韧长青：忍冬寒冬时节花叶不凋，象征坚韧不屈，契合佛教永生轮回的思想内涵。", "清净永续：成对连绵的叶片，代表生命循环不息，僧衣使用寄托求得恒常清净的愿望。", "吉祥护佑：古朴的连续纹样，古人相信可以驱邪纳吉，护佑穿戴者平安顺遂。"], "属性": {"常用颜色": "纹样主体多用红、绿配色，辅以赭石色勾勒轮廓。魏晋时期织物底色偏古朴，配色不会过于艳丽，色彩沉稳厚重。", "常用布料": "以绮、古锦、绫这类早期丝织品为主，多应用在薄质披帛面料。", "适用衣物": "僧衣、贵族襦裙、披帛。", "应用部位": "衣缘、袖口、下摆镶边，以长条辅纹为主，很少铺满衣身。", "使用场景": "佛事相关服饰、魏晋南北朝贵族礼仪盛装。"}, "常见搭配": ["莲花纹", "联珠纹", "云纹"]}, {"编号": 171, "类别": "植物花果", "类别内序号": 44, "纹样名称": "折枝梅纹", "盛行朝代": "", "文化寓意": "折枝梅纹是以截取一段梅花花枝形成的独立装饰纹样，选取梅枝局部，绘枝干、花朵与花苞，属于折枝花体系经典纹样。纹样枝干苍劲简约，花朵疏落清雅，构图留白较多，凸显梅花傲雪的文人意境，一枝自成画面，不与其他花枝相连。服饰中折枝梅纹可做主纹，多用于文人、清雅主题衣衫，是宋元以来非常流行的花卉纹样。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "文人推崇梅花品格，折枝梅纹样兴起，造型简约疏朗，丝绸织物开始大量使用。"}, {"period": "元代", "desc": "折枝梅造型苍劲古拙，枝干的质感刻画突出，刺绣、织锦广泛应用。"}, {"period": "明清", "desc": "折枝梅持续流行，衍生多种变体，常作为清雅主题服饰装饰纹样。"}], "寓意分条": ["傲骨坚贞：梅花寒冬绽放，象征君子不畏艰难、高洁不屈的品格。", "迎春报喜：梅花先于百花开放，寓意春信将至，喜事临门。", "清雅吉祥：梅谐音眉，衍生喜上眉梢，代表好运将至。"], "属性": {"常用颜色": "花瓣素白、淡粉，枝干棕褐色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "文人雅集盛装、女子素雅襦裙袄裙。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可用小型折枝梅。", "使用场景": "文人雅集、家庭小型吉庆。"}, "常见搭配": ["雀纹", "山石纹", "竹纹", "兰纹"]}, {"编号": 166, "类别": "植物花果", "类别内序号": 39, "纹样名称": "折枝花纹", "盛行朝代": "", "文化寓意": "折枝花纹，简称折枝花，选取花草的一枝一段，截取花枝局部，脱离植株本体单独作为装饰单元的花卉纹样。纹样截取单支花果，花枝姿态自然灵动，构图独立完整，一花或数花生于一枝，留白充足。服饰中折枝花纹可做主纹，在历代服饰面料广泛使用，是传统服饰最基础的花卉构图形式之一。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "折枝花雏形兴起，织物、壁画中出现截取单枝花卉的纹样。"}, {"period": "宋代", "desc": "折枝花纹走向鼎盛，造型清雅写实，姿态灵动，大量应用于丝绸面料。"}, {"period": "元明清", "desc": "折枝花纹持续发展，题材丰富，牡丹、梅、菊、莲都常做成折枝样式。"}], "寓意分条": ["芳华美好：截取最美的花枝，象征美好事物常驻，喜乐常伴。", "灵动自在：花枝姿态自然无拘束，寓意洒脱安然，保有本心。", "吉祥雅致：不同折枝花搭配自带对应花果寓意，纳福迎祥。"], "属性": {"常用颜色": "配色随花卉题材变化，色彩丰富。高级锦缎常用金线勾边，底色多用米白、浅杏、藏青。", "常用布料": "高端面料选用妆花缎、刺绣锦；普通面料多用绫、暗花绸。", "适用衣物": "贵族礼服、女子襦裙袄裙、文人雅集盛装，应用范围极广。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型折枝花。", "使用场景": "雅集、婚嫁、寿庆各类吉庆场合，适用性强。"}, "常见搭配": ["鸟纹", "蝴蝶纹", "山石纹", "云纹"]}, {"编号": 150, "类别": "植物花果", "类别内序号": 23, "纹样名称": "月季纹", "盛行朝代": "明—清", "文化寓意": "月季纹是以月季花为核心的装饰纹样。月季四季开花，象征四季平安、长春。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/aVFPfB08U6", "caption": "深藕荷色月季花纹织金缎小坎肩"}, {"url": "https://aka.doubaocdn.com/s/6q2wYV2QtS", "caption": "清代刺绣花卉纹衣服"}, {"url": "https://aka.doubaocdn.com/s/kg2NVTGhqm", "caption": "清织绣花卉纹女服"}, {"url": "https://aka.doubaocdn.com/s/r5u3vQjPtM", "caption": "清代真丝绸缎老绣衣"}, {"url": "https://aka.doubaocdn.com/s/JEUyKdbYQU", "caption": "清代绣花旗袍"}, {"url": "https://aka.doubaocdn.com/s/mbZOH2DY7J", "caption": "清代红地织彩花卉纹袍"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "月季纹在服饰中广泛使用。"}], "体系组成": "月季单独纹：月季独立呈现。月季配花卉纹：月季与牡丹、菊花等组合。月季配鸟纹：月季与鸟组合。", "寓意分条": ["四季平安：月季四季开花。", "长春不老：月季象征长春不老。"], "属性": {"常用颜色": "以红、粉、绿等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服、女褂、马面裙。", "应用部位": "衣身通身纹饰、裙身。", "使用场合": "日常穿着。"}, "常见搭配": ["牡丹纹", "菊花纹", "鸟纹"], "相似纹样说明": "四季开花为月季，花朵硕大为牡丹。"}, {"编号": 179, "类别": "植物花果", "类别内序号": 52, "纹样名称": "松柏长青纹", "盛行朝代": "", "文化寓意": "松柏长青纹是以松树和柏树组合为核心的装饰纹样。松柏四季常青，象征长寿、坚贞。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "松柏长青纹在服饰中广泛使用。"}], "体系组成": "松柏单独纹：松树与柏树组合。松柏配寿字纹：松柏与寿字组合。松柏配鹤纹：松柏与鹤组合，寓意松鹤延年。", "寓意分条": ["长寿安康：松柏四季常青。", "坚贞不屈：松柏象征坚贞不屈。"], "属性": {"常用颜色": "以绿、青、蓝等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "袍服。", "应用部位": "衣身通身纹饰。", "使用场合": "寿诞吉庆。"}, "常见搭配": ["团寿字纹", "仙鹤纹", "祥云纹", "绶带鸟纹"], "相似纹样说明": "针叶为松柏，宽叶红果为万年青。"}, {"编号": 142, "类别": "植物花果", "类别内序号": 15, "纹样名称": "松纹", "盛行朝代": "明—清", "文化寓意": "松纹以松树枝干与松针为原型，松树苍劲挺拔、四季常青，是传统经典树木类服饰纹样。纹样可刻画整枝松干，也可单独提取松针松皮纹理，风格沉稳大气。服饰中松纹既可做主纹，也常作为辅纹搭配鹤、梅等纹样，多用于祝寿、君子主题的盛装面料。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/fUiQkaBNiT", "caption": "清·白色真丝缎地孔雀松树纹挽袖"}, {"url": "https://aka.doubaocdn.com/s/hnfNvdSav4", "caption": "清咸丰·吉服褂松树纹"}, {"url": "https://aka.doubaocdn.com/s/C3n52qpHyQ", "caption": "清·土黄地孔雀松鹤纹刺绣挽袖"}, {"url": "https://aka.doubaocdn.com/s/vReM2WvjKv", "caption": "清嘉庆·石青缎山水松树纹团花"}, {"url": "https://aka.doubaocdn.com/s/P4OJHwVcPn", "caption": "明嘉靖·松竹梅绸大袖衫"}, {"url": "https://aka.doubaocdn.com/s/W8VpxCvJEu", "caption": "明末清初·酱色真丝织锦上衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "织物上松纹开始出现，造型简练概括，多用于贵族服饰上的点缀装饰。"}, {"period": "宋代", "desc": "文人审美盛行，松纹气质清雅，线条利落，常搭配竹梅，出现在文人相关服饰面料。"}, {"period": "元明清", "desc": "松纹广泛流行，松鹤延年题材盛行，大量用在寿庆礼服，宫廷民间都普遍使用。"}], "寓意分条": ["长寿长青：松树寒冬不凋，象征生命力持久。寿庆服饰使用松纹，祝愿长辈福寿绵长，健康不老。", "坚贞不屈：古人以松树比喻君子品格，穿戴带有松纹衣物，象征品性高洁，坚守本心。", "吉祥恒远：四季常青的特征，寓意福运长久不衰，平安顺遂，长久护佑家人。"], "属性": {"常用颜色": "枝干以深褐、墨灰为主，松针选用墨绿。精致礼服会使用金线勾勒枝干轮廓，底色多选用藏青、深咖。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间寿庆衣衫多用绸、绫、普通缎面。", "适用衣物": "祝寿礼服、文人主题盛装、中老年喜庆袄裙。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配仙鹤、梅花作为辅纹点缀。", "使用场景": "长辈寿宴、雅集礼仪。"}, "常见搭配": ["鹤纹", "梅纹", "竹纹", "山石纹", "云纹"]}, {"编号": 160, "类别": "植物花果", "类别内序号": 33, "纹样名称": "柳纹", "盛行朝代": "", "文化寓意": "柳纹以柳树的枝条、柳叶为原型，枝条柔长下垂，叶片纤细狭长，是经典的春日树木纹样。纹样多为折枝构图，刻画柔长垂枝，线条轻盈婉转，自带春风依依的诗意氛围。服饰中柳纹可做主纹也可作辅纹，多用于春日主题衣衫，常表达惜春、离别、生机的意象。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "器物上出现柳树形象，织物纹样雏形初现。"}, {"period": "唐代", "desc": "柳纹走向成熟，垂柳纹样线条柔美，大量用于春日题材的丝织面料。"}, {"period": "宋元明清", "desc": "柳纹广为流行，常搭配燕子，成为表现春光的经典花鸟组合纹样。"}], "寓意分条": ["春意新生：柳树逢春发芽，象征生机萌发、万物更新，代表美好希望。", "惜别怀远：古人折柳赠别，寄托思念之情，蕴含不舍、期盼重逢之意。", "和顺绵长：柳枝柔韧绵长，寓意生活安稳柔和，日子绵延顺遂。"], "属性": {"常用颜色": "叶片选用嫩青、浅绿色，枝干棕褐色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "春日主题襦裙、袄裙、文人雅集盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配燕子作为辅纹点缀衣缘。", "使用场景": "春日雅集、家庭小型吉庆。"}, "常见搭配": ["燕子纹", "山石纹", "云纹", "桃花纹"]}, {"纹样名称": "桂纹", "分类": "植物花果", "文化寓意": "桂花纹以桂花花枝与簇生小花为原型，细碎小花聚生于枝间，枝叶小巧秀气，是传统秋日吉祥花卉纹样。纹样多为折枝构图，花枝简洁舒展，细碎繁花点缀枝上，自带清雅香甜的意境。服饰中桂花纹既可做主纹，也常作为辅纹搭配其他纹样，女子秋装与喜庆织物中较为多见。", "朝代脉络": [{"period": "宋代", "desc": "织物上桂花纹样开始出现，造型简约秀气，折枝构图为主，少量用于贵族女子衣衫。"}, {"period": "元代", "desc": "纹样线条更加流畅，簇花的刻画更加细腻，民间面料逐步开始使用桂花纹样。"}, {"period": "元明清", "desc": "桂花纹广为流行，“桂”谐音“贵”，常搭配芙蓉、月亮，蟾宫折桂题材盛行。"}], "寓意分条": ["贵气吉祥：“桂”谐音“贵”，象征尊贵吉庆，寄托富贵临门、身份显贵的美好期盼。", "前程似锦：蟾宫折桂的典故，寓意学业有成、仕途顺遂，事业步步高升。", "美满芬芳：桂花香气馥郁 开百子纹", "分类": "植物花果", "文化寓意": "榴开百子纹属于果实类吉祥纹样，以石榴果皮绽开、露出饱满籽粒为核心形态。石榴西汉时经丝绸之路传入中国，因“千房同膜，千子如一”的构造，自六朝起被赋予多子多福之意，北齐“妃母献石榴”典故更使其成为婚嫁祈子的象征。服饰中常用于婚嫁吉服、童服，以“榴开见子”的瞬间传递子孙绵延的祝愿。", "朝代脉络": [{"period": "汉晋南北朝", "desc": "石榴纹始见于东汉织锦，以石榴树为中轴；南北朝已有“石榴裙”记载。"}, {"period": "唐代", "desc": "石榴纹在织绣上繁荣，石榴红裙盛行，纹样渐与宝相花、莲花组合。"}, {"period": "宋代", "desc": "受婴戏图影响，出现婴戏石榴纹，童子与石榴同现，寓意多子。"}, {"period": "明清", "desc": "石榴纹达鼎盛，常与佛手、寿桃组成“三多纹”，婚嫁吉服与童服广泛使用。"}], "寓意分条": ["多子多福：石榴籽粒繁密，“籽”谐音“子”，象征子孙众多。", "家族兴旺：“千子如一”，寓意家族同心、人丁繁盛。", "婚嫁吉庆：婚服绣石榴，祈愿新人早生贵子、子孙绵延。", "生活红火：石榴花红艳如火，象征日子红火、富贵吉祥。"], "属性": {"常用颜色": "石榴多用大红、朱红，籽粒以深红、粉红表现晶莹感；叶片青绿，枝干赭褐或金线勾描。底色常用大红、暗红、石青、米白。", "常用布料": "高端用妆花缎、织金锦、漳绒、缂丝；普通用绫、暗花绸、缎地绣花。童服肚兜常用红布地贴绣。", "适用衣物": "婚嫁吉服、百子衣、寿庆礼服、贵族袄裙、肚兜、童服、马面裙。", "应用部位": "婚服衣身、裙摆做主纹或散点分布；童服绣于肚兜正中、鞋面、帽檐；袄裙作团花或散点置于衣身、袖口。", "使用场景": "婚嫁大典、寿诞吉庆、新生儿庆贺、端午节童服装饰。"}, "常见搭配": ["蝴蝶纹", "蝙蝠纹", "佛手纹", "寿桃纹", "莲花纹", "童子纹", "杂宝纹"], "线稿图": []}, {"编号": 147, "类别": "植物花果", "类别内序号": 20, "纹样名称": "水仙纹", "盛行朝代": "明—清", "文化寓意": "水仙纹以水仙花、花叶为原型，叶片修长挺直，花朵素雅洁净，是传统清雅的观赏花卉纹样。纹样多采用折枝构图，花朵简约秀气，自带干净脱俗的气质，文人十分喜爱。服饰中水仙纹可以作为主纹，也能当作辅纹点缀面料，多用于清雅风格的贵族女子盛装。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/9XDyNzeKZ2", "caption": "清光绪·品月色缎平金银绣水仙团寿字纹单氅衣"}, {"url": "https://aka.doubaocdn.com/s/UG0U83PLNu", "caption": "清光绪·品月色缎平金银绣水仙团寿字纹单氅衣"}, {"url": "https://aka.doubaocdn.com/s/VSw1gtYcO3", "caption": "清·雪灰地刺绣水仙团寿"}, {"url": "https://aka.doubaocdn.com/s/JP4lEWwT9H", "caption": "清·品月色缎平金银绣水仙团寿字纹单氅衣"}, {"url": "https://aka.doubaocdn.com/s/qKbvtUWZSn", "caption": "清·雪灰色缎绣水仙金寿字纹袷衣"}, {"url": "https://aka.doubaocdn.com/s/bybWkAEhHu", "caption": "清代刺绣水仙纹女式衫"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "水仙纹样开始出现在织物之上，造型简约素雅，线条干净，少量用于上层女子衣衫。"}, {"period": "元代", "desc": "纹样造型进一步丰富，折枝水仙构图流行，花叶比例协调，装饰感更强。"}, {"period": "明清", "desc": "水仙纹广泛流行，常搭配山石，寓意清雅吉祥，雅致服饰与文人题材织物多有使用。"}], "寓意分条": ["清雅高洁：水仙清水养植，不染尘土，象征品性纯净脱俗。穿戴水仙纹样衣物，寄托不慕浮华的品格追求。", "吉祥平安：水仙花开于冬末春初，象征新春将至，祈愿新年万事顺遂，阖家平安喜乐。", "团圆吉祥：水仙一簇多花，古人将其视作团圆的象征，用于女子盛装，祝愿家庭和睦美满。"], "属性": {"常用颜色": "花瓣以白色为主，点缀淡黄花蕊，叶片选用青绿色。精致礼服可用细金线勾勒轮廓，底色多选用米白、浅青。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间雅致衣衫多用绫、绸、暗花缎。", "适用衣物": "贵族女子清雅袄裙、文人主题盛装、雅集礼仪服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配山石、兰草作为辅纹点缀衣缘。", "使用场景": "文人雅集、小型正式礼仪。"}, "常见搭配": ["山石纹", "兰纹", "云纹", "梅纹"]}, {"编号": 149, "类别": "植物花果", "类别内序号": 22, "纹样名称": "海棠纹", "盛行朝代": "明清", "文化寓意": "海棠纹以海棠花枝、花朵为原型，花瓣柔美娇嫩，花型圆润温婉，是古代经典的女子花卉纹样。纹样多为折枝构图，花枝轻盈柔美，气质温婉秀丽，很有春日氛围感。服饰中海棠纹可做主纹或辅纹，多用于女子雅致衣衫，是传统花鸟纹样里十分常见的一类。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/5DW3VyGYiS", "caption": "清光绪·青色缎绣海棠纹女坎肩"}, {"url": "https://aka.doubaocdn.com/s/YHekHPNGeg", "caption": "清晚期·蓝色缎绣海棠团万字寿蝙蝠纹夹氅衣"}, {"url": "https://aka.doubaocdn.com/s/DwH3NUfjci", "caption": "清晚期·蓝色缎绣海棠团万字寿蝙蝠纹夹氅衣"}, {"url": "https://aka.doubaocdn.com/s/PIiy2zxZzF", "caption": "清晚期·湖色缎绣折枝海棠蝴蝶纹衬衣"}, {"url": "https://aka.doubaocdn.com/s/RgPhg4g21u", "caption": "清晚期·湖色缎绣折枝海棠蝴蝶纹衬衣"}, {"url": "https://aka.doubaocdn.com/s/ECysHZ4jwk", "caption": "清晚期·湖色缎绣折枝海棠蝴蝶纹衬衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "海棠纹样大量出现在丝织品，造型柔美灵动，折枝样式流行，多用于贵族女子襦裙。"}, {"period": "元代", "desc": "纹样延续宋代柔美风格，线条简练，花叶简化，民间织物开始逐步使用。"}, {"period": "明清", "desc": "海棠纹广为流行，常搭配玉兰、牡丹，寓意玉堂富贵，宫廷民间女子衣衫普遍使用。"}], "寓意分条": ["富贵吉祥：海棠花开繁茂艳丽，象征富贵美好，女子衣衫绣海棠，祈愿生活富足和美。", "温婉和顺：花姿柔美娇嫩，比喻女子品性温柔娴静，容貌美好，气质端庄。", "满堂喜乐：“棠”谐音“堂”，寓意满堂春色，阖家欢乐，家中常有喜事相伴。"], "属性": {"常用颜色": "花瓣多用淡粉、玫红，叶片选用嫩绿色。精致礼服可用细金线勾勒花瓣轮廓，底色常选用米白、浅粉。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子襦裙、袄裙、春日主题雅致盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配玉兰作为辅纹点缀衣缘。", "使用场景": "春日雅集、家庭喜庆盛装。"}, "常见搭配": ["玉兰纹", "牡丹纹", "蝴蝶纹", "山石纹", "云纹"]}, {"编号": 141, "类别": "植物花果", "类别内序号": 14, "纹样名称": "灵芝纹", "盛行朝代": "明—清", "文化寓意": "灵芝纹以灵芝菌盖与菌柄为原型，菌盖轮廓圆润卷曲，形态古朴灵动，是传统经典瑞草纹样。纹样可写实刻画，也可以做装饰化变形，常搭配枝叶、云气，充满仙气。服饰中灵芝纹多作为辅纹，偶尔做主纹，在祝寿、吉祥类服饰面料中广泛应用。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/9BDst5JFnK", "caption": "明黄缎绣灵芝天竹宝相花迎手"}, {"url": "https://aka.doubaocdn.com/s/AFfmMCu34v", "caption": "清代灵芝如意纹服饰"}, {"url": "https://aka.doubaocdn.com/s/PJnuhW4VE4", "caption": "清蓝缎彩绣灵芝蝙蝠衬衣"}, {"url": "https://aka.doubaocdn.com/s/es5B7z31UO", "caption": "明黄缎绣灵芝天竹宝相花迎手"}, {"url": "https://aka.doubaocdn.com/s/kjb9Je2dE8", "caption": "明代织金凤穿灵芝牡丹纹袍"}, {"url": "https://aka.doubaocdn.com/s/DWj9Vp6MD2", "caption": "清代墨地织金灵芝鹤寿花缎"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "织物上出现灵芝纹样雏形，造型简约古朴，多用于贵族丝织品的点缀装饰。"}, {"period": "宋代", "desc": "灵芝纹样线条柔和雅致，造型简化，常搭配山石云纹，点缀在女子衣衫之上。"}, {"period": "元明清", "desc": "灵芝纹流行，常与寿桃、蝙蝠组合，大量用于寿庆相关的礼服与袄裙面料。"}], "寓意分条": ["长寿延年：古人将灵芝视作仙草，象征长生。寿庆服饰绣灵芝，祝愿长辈身体康健，延年益寿。", "吉祥如意：灵芝卷曲的外形近似如意，寄托万事顺心，所求之事皆能如愿的美好期盼。", "祥瑞护佑：灵芝自古被视为瑞草，穿戴带有灵芝纹样的衣物，寓意驱邪纳祥，平安相伴。"], "属性": {"常用颜色": "菌盖多用棕红、黄褐色，菌柄选用深绿色。精致礼服会辅以金线勾勒轮廓，底色多用藏青、酒红。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间寿庆衣衫多用绸、绫、普通缎面。", "适用衣物": "祝寿礼服、女子袄裙、吉祥主题盛装。", "应用部位": "衣身、裙摆，多作为辅纹搭配其他吉祥纹样，很少单独铺满衣身。", "使用场景": "长辈寿宴、民间喜庆活动。"}, "常见搭配": ["寿桃纹", "蝙蝠纹", "云纹", "山石纹"]}, {"编号": 128, "类别": "植物花果", "类别内序号": 1, "纹样名称": "牡丹纹", "盛行朝代": "唐—清（明清鼎盛）", "文化寓意": "牡丹纹以牡丹花为原型，花瓣层叠饱满，花型雍容富丽。纹样兴起于唐代丝织品，历经演变，有写实与装饰化两种风格。服饰中牡丹多作为主纹，可做折枝、缠枝或团花构图。多用于贵族与上层女子盛装，是传统花卉纹样里最具代表性的纹样。它视觉华丽，适合礼服，是古代表达富贵吉祥最经典的装饰符号。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/dh3D9qIzUH", "caption": "明·牡丹纹织金妆花缎"}, {"url": "https://aka.doubaocdn.com/s/pYOHFWhUT1", "caption": "明·红地牡丹加银锦"}, {"url": "https://aka.doubaocdn.com/s/a6zxnwssFC", "caption": "明·青地牡丹加金锦"}, {"url": "https://aka.doubaocdn.com/s/yX9nzhVVWm", "caption": "明·缠枝牡丹纹锦"}, {"url": "https://aka.doubaocdn.com/s/aRZiGn1203", "caption": "明·牡丹纹加金锦"}, {"url": "https://aka.doubaocdn.com/s/S3M2qiWNPy", "caption": "明·明黄地缠枝牡丹绣片"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "崇尚丰腴审美，服饰牡丹花瓣肥厚圆润，多为折枝样式，织绘在贵族锦袍、绢帛之上，尽显盛唐华贵气质。"}, {"period": "宋代", "desc": "审美趋于清雅，花头缩小，花瓣简化柔和，线条秀气，多用在女子罗衫褙子，构图简约含蓄。"}, {"period": "元代", "desc": "织金锦流行，花叶造型简练概括，枝干硬朗，常配连续枝蔓，色彩对比强烈。"}, {"period": "明代", "desc": "纹样繁复立体，团牡丹盛行，妆花缎礼服常用金线勾边，多用于命妇礼服，等级感强。"}, {"period": "清代", "desc": "偏向写实，常搭配蝙蝠、寿石等吉祥辅纹，宫廷民间都大量使用，构图灵活多变。"}], "寓意分条": ["富贵荣华：牡丹被称为花中之王，唐代之后象征富贵昌盛。贵族礼服使用牡丹，代表身份尊贵。婚嫁服饰上使用，寄托新人生活富足美满的愿望。", "吉祥美满：牡丹花开繁盛，花团锦簇，象征家庭兴旺和睦。女子盛装绣牡丹，祈愿阖家安康，家中福气汇聚。", "繁荣兴旺：牡丹盛放生机盎然，寓意家业蒸蒸日上。古人喜爱在寿庆服饰选用牡丹，祝愿家族长久兴旺。"], "属性": {"常用颜色": "主花多用大红、玫粉，搭配绿色花叶。宫廷织物常以石青为底，搭配五彩，并用金线勾边，凸显华贵质感。", "常用布料": "高端礼服采用妆花缎、织金锦、缂丝；普通贵族与民间盛装多用绫罗、花缎与刺绣面料。", "适用衣物": "命妇礼服、贵妇袄裙、霞帔、婚嫁袍料。", "应用部位": "衣身胸口、裙摆为主，霞帔也常使用，领口袖口少量作为辅纹点缀。", "使用场景": "宫廷吉礼、婚嫁大典、寿庆宴会。"}, "常见搭配": ["云纹", "蝙蝠纹", "寿桃纹", "山石纹", "缠枝莲纹"]}, {"编号": 148, "类别": "植物花果", "类别内序号": 21, "纹样名称": "玉兰纹", "盛行朝代": "明—清", "文化寓意": "玉兰纹以玉兰花枝与花朵为原型，花型硕大饱满，花瓣厚实素雅，是传统经典花木纹样。纹样多为折枝构图，花朵亭亭而立，气质洁净端庄，自带清雅华贵之感。服饰中玉兰纹可做主纹也可作辅纹，常与海棠、牡丹搭配，多用于女子雅致盛装面料。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/HWJSLulUBt", "caption": "清光绪·品月色缎绣玉兰飞蝶纹夹氅衣"}, {"url": "https://aka.doubaocdn.com/s/ODUMiCqCMX", "caption": "清光绪·品月色缎绣玉兰飞蝶纹氅衣局部"}, {"url": "https://aka.doubaocdn.com/s/Jz3LmFROaM", "caption": "清光绪·品月色缎绣玉兰飞蝶纹氅衣局部"}, {"url": "https://aka.doubaocdn.com/s/Rf0e2vFHaC", "caption": "清同治·灰地缂丝玉兰花纹女衬衣"}, {"url": "https://aka.doubaocdn.com/s/4JdBBpgaSU", "caption": "清光绪·品月色缎绣玉兰蝶夹氅衣"}, {"url": "https://aka.doubaocdn.com/s/5VA77TIW7k", "caption": "清光绪·月白色缎绣折枝玉兰蝶纹夹衬衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "织物上玉兰纹样出现，造型简洁大气，线条干净，少量用于贵族女子衣衫。"}, {"period": "元代", "desc": "纹样造型更加丰富，折枝玉兰构图成熟，花叶比例协调，装饰性提升。"}, {"period": "明清", "desc": "玉兰纹广泛流行，搭配海棠构成“玉堂富贵”，宫廷与民间女子服饰大量使用。"}], "寓意分条": ["金玉满堂：“玉”取自玉兰之名，象征金玉，寓意家财丰盈，福气满堂，生活富足和美。", "高洁端庄：玉兰花开于初春，花开时无叶片相伴，象征品性纯净，端庄自持。", "吉祥顺遂：玉兰花朵硕大饱满，代表美好圆满，祈愿万事称心，喜事临门。"], "属性": {"常用颜色": "花瓣多用素白、浅淡粉紫色，枝干选用棕褐色。精致礼服可用细金线勾勒花瓣轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子襦裙、袄裙、春日主题礼仪盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配海棠作为辅纹点缀衣缘。", "使用场景": "春日雅集、家庭喜庆盛装。"}, "常见搭配": ["海棠纹", "牡丹纹", "山石纹", "云纹"]}, {"编号": 138, "类别": "植物花果", "类别内序号": 11, "纹样名称": "瓜纹", "盛行朝代": "", "文化寓意": "瓜纹以各类瓜果为原型，纹样刻画圆润饱满的瓜果形态，搭配舒展的枝叶，属于传统吉祥植物纹样。纹样构图自然柔和，常以折枝形式呈现，也可搭配绵长藤蔓，富有生机感。服饰中瓜纹可作为主纹或者辅纹，在民间婚嫁织物中十分常见，宫廷礼服较少大面积使用。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "织物上出现瓜果纹样雏形，造型简单概括，样式质朴，应用不多。"}, {"period": "宋元", "desc": "瓜纹造型逐步丰富，线条柔和，折枝瓜果样式流行于民间女子衣衫面料。"}, {"period": "明清", "desc": "瓜瓞绵绵题材盛行，绵长藤蔓搭配大小瓜果，广泛用于婚嫁类服饰面料。"}], "寓意分条": ["子孙绵延：也就是瓜瓞绵绵，大瓜旁边伴随小瓜，比喻家族人丁不断繁衍，代代相传。婚嫁服饰绣瓜纹，祈愿新人子孙兴旺。", "丰收富足：瓜果饱满丰硕，象征五谷丰登，寄托家庭衣食无忧、家业富足的美好愿望。", "生生不息：藤蔓持续生长蔓延，寓意生命力旺盛，家族福运长久延续，不会中断。"], "属性": {"常用颜色": "瓜果多用浅黄、淡绿，叶片选用深绿色。少数精致织物会用细金线勾边，底色多选用暗红、米白。", "常用布料": "精致款选用刺绣缎、妆花绸；民间日常喜庆衣衫多用绸、绫、暗花缎。", "适用衣物": "民间女子袄裙、婚嫁盛装、吉祥主题衣衫。", "应用部位": "衣身、裙摆为主，可做主纹，也能搭配其他花果纹样作为辅纹点缀。", "使用场景": "民间婚嫁、家庭喜庆活动。"}, "常见搭配": ["蝴蝶纹", "葫芦纹", "云纹"]}, {"编号": 154, "类别": "植物花果", "类别内序号": 27, "纹样名称": "百合纹", "盛行朝代": "", "文化寓意": "百合纹以百合花与茎叶为原型，花型舒展优雅，花瓣洁白舒展，气质纯净端庄，是传统经典草本花卉纹样。纹样多为折枝构图，花姿亭亭，线条干净柔和，素雅大气。服饰中百合纹可做主纹也可作辅纹，女子雅致盛装、婚嫁织物中使用较多，寓意美好。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "织物上百合纹样初现，造型简约干净，少量点缀贵族女子丝质衣衫。"}, {"period": "宋代", "desc": "百合纹线条清雅简练，折枝构图流行，多用于女子襦裙面料。"}, {"period": "元明清", "desc": "百合纹广为流传，“百合”取百年好合之意，大量用于婚嫁相关服饰面料。"}], "寓意分条": ["百年好合：“百合”谐音百年好合，是婚嫁经典纹样，祝愿夫妻相守、和睦长久。", "纯净高洁：花瓣素净素雅，象征品性纯粹端庄，保有美好本心。", "吉祥安康：百合生命力强健，寓意阖家平安顺遂，生活和美喜乐。"], "属性": {"常用颜色": "花瓣多用素白、淡粉，叶片选用青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子襦裙、袄裙、婚嫁主题盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配山石作为辅纹点缀衣缘。", "使用场景": "家庭吉庆、婚嫁礼仪、文人雅集。"}, "常见搭配": ["山石纹", "蝴蝶纹", "云纹", "萱草纹"]}, {"编号": 182, "类别": "植物花果", "类别内序号": 55, "纹样名称": "百花纹", "盛行朝代": "", "文化寓意": "百花纹，又称满花、百花不落地纹，是以多种花卉枝叶错落交织、布满整个画面形成的满花装饰纹样。纹样常汇集牡丹、菊、莲、梅、兰、秋海棠等多种花卉，花朵繁密而不杂乱，几乎不见底色，故称百花不落地。花团锦簇、富丽华美，是传统经典的吉祥纹样。服饰中百花纹可作为主纹，大面积使用于礼服、婚嫁盛装，明清时期织锦、刺绣应用尤多。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "折枝、缠枝花卉大量流行，多种花卉同幅组合的雏形出现。"}, {"period": "明代", "desc": "百花纹样逐渐成型，花种繁多，构图趋于繁密饱满，织物使用增多。"}, {"period": "清代", "desc": "百花纹达到鼎盛，百花不落地成为宫廷、民间吉庆服饰经典纹样。"}], "寓意分条": ["百花齐放：多种花卉齐聚一堂，象征盛世繁华，万般美好尽收。", "富贵荣华：牡丹等名花荟萃，寓意家族兴旺，福禄绵长，生活富足。", "圆满吉庆：花色繁盛、满而不空，代表喜事连连，万事如意。"], "属性": {"常用颜色": "各色花卉色彩丰富绚丽，牡丹大红、菊黄、莲粉、梅白等并存，叶片青绿。高级织锦常以金线勾边，底色常选用米白、藏青、暗红。", "常用布料": "高端面料选用妆花缎、织金锦；普通面料多用绫、暗花绸。", "适用衣物": "礼服、婚嫁盛装、贵族袄裙，常用于重大吉庆服饰。", "应用部位": "衣身、裙摆大面积满铺做主纹，较少用于衣缘小面积镶边。", "使用场景": "婚嫁大典、寿诞吉庆、宫廷礼仪，是重大吉庆场合高频纹样。"}, "常见搭配": ["蝴蝶纹", "蝙蝠纹", "缠枝牡丹纹", "云纹"]}, {"编号": 176, "类别": "植物花果", "类别内序号": 49, "纹样名称": "石榴多子纹", "盛行朝代": "", "文化寓意": "石榴多子纹，以饱满开裂的石榴果实搭配枝叶为主体的花果纹样。果实开裂，露出密集籽粒，是传统经典多子吉祥纹样。纹样刻画石榴果、枝叶，常绘果皮绽开，内部籽粒累累，画面饱满生动，寓意多子多福。服饰中石榴多子纹可做主纹，多用于婚嫁、祈愿人丁兴旺主题服饰，刺绣织物十分常见。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "魏晋", "desc": "石榴由西域传入，器物上出现石榴纹样雏形。"}, {"period": "唐代", "desc": "石榴纹样造型丰满写实，织物装饰逐步增多。"}, {"period": "宋元明清", "desc": "石榴多子纹广泛流行，婚嫁题材织物高频使用，是民间经典吉祥纹样。"}], "寓意分条": ["多子多福：石榴内部籽粒繁多，象征家族子孙繁盛，人丁兴旺。", "兴旺绵延：硕果饱满，寓意家业兴旺，福气代代相传。", "红火吉祥：石榴果皮红艳，寓意日子红火，阖家喜乐平安。"], "属性": {"常用颜色": "果皮为大红、橘红色，籽粒淡红，叶片青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "婚嫁主题袄裙襦裙、祈福吉庆盛装。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型纹样。", "使用场景": "婚嫁大典、家庭祈福吉庆。"}, "常见搭配": ["佛手纹", "寿桃纹", "云纹", "蝴蝶纹"]}, {"编号": 136, "类别": "植物花果", "类别内序号": 9, "纹样名称": "石榴纹", "盛行朝代": "明—清", "文化寓意": "石榴纹以石榴果实与枝叶为原型，纹样常描绘成熟果实开裂、籽粒外露的形象，视觉辨识度很高。石榴经由古丝绸之路传入中原，逐渐发展成传统服饰经典吉祥花果纹样，流传久远。服饰中石榴纹常作为主纹或辅纹，多以折枝形式呈现，在婚嫁相关织物中最为多见。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/xp0wGFUKIe", "caption": "清·老绣五彩打籽石榴蝴蝶刺绣衣"}, {"url": "https://aka.doubaocdn.com/s/NUQhSHPfOR", "caption": "清·榴开百子纹刺绣"}, {"url": "https://aka.doubaocdn.com/s/O3vaBXICs7", "caption": "明清·红地织金石榴纹袍服"}, {"url": "https://aka.doubaocdn.com/s/PK2y7TagAn", "caption": "清·盘锦绣石榴纹帽子"}, {"url": "https://aka.doubaocdn.com/s/ZxaUGtstMA", "caption": "清·盘锦绣石榴纹帽子"}, {"url": "https://aka.doubaocdn.com/s/pYrUHB7Voe", "caption": "清·盘锦绣多子石榴葡萄纹孩童棉帽"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "南北朝", "desc": "石榴纹样传入中原，造型简约古朴，服饰面料上使用较少。"}, {"period": "唐代", "desc": "丝织品上石榴纹样慢慢增多，果实造型饱满，花叶舒展大气。"}, {"period": "宋代", "desc": "纹样线条趋于秀气柔和，多绘制在女子罗裙面料，风格清雅含蓄。"}, {"period": "明清", "desc": "石榴多子题材广泛流行，裂果露籽的样式盛行，大量用于婚嫁服饰。"}], "寓意分条": ["多子多福：石榴内部包含大量籽粒，是子孙满堂最经典的象征。婚嫁服饰绣石榴，祈愿新婚夫妇子嗣兴旺。", "家族兴旺：果实饱满丰硕，寓意家庭人丁繁盛，家族枝繁叶茂，代代延续。", "红火吉祥：石榴外皮颜色红艳，象征日子红红火火，生活喜乐顺遂。"], "属性": {"常用颜色": "果实主体以 .com/s/aI0K89UTVH", "caption": "清末·月白缂丝竹石紧身"}, {"url": "https://aka.doubaocdn.com/s/qP9MUR97tZ", "caption": "清·织绣竹纹女服饰"}, {"url": "https://aka.doubaocdn.com/s/4WlwHX6b4y", "caption": "清·石青地金竹兰褂襕样"}, {"url": "https://aka.doubaocdn.com/s/b7sqN7T9Hq", "caption": "清光绪·女式刺绣紫竹纹上衣"}, {"url": "https://aka.doubaocdn.com/s/aPDI7S5Agu", "caption": "清·月白色竹子纹织金缎小坎肩"}, {"url": "https://aka.doubaocdn.com/s/1OR8Lp1VqD", "caption": "清光绪·紫竹纹上衣背面"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "织物上竹纹初见，造型简单概括，多作为点缀纹样出现在贵族衣衫面料。"}, {"period": "宋代", "desc": "文人文化兴盛，竹纹广泛流行，线条干净利落，清雅简约，多用于士人及贵族女子服饰。"}, {"period": "元明清", "desc": "竹纹持续沿用，常和梅、兰、松组合，宫廷与民间雅致盛装都大量使用。"}], "寓意分条": ["高洁有节：竹竿生有竹节，古人比喻气节。服饰绣竹纹，象征穿戴之人坚守操守，品性高洁不屈。", "虚心自持：竹竿中空，代表谦逊虚心。文人服饰选用竹纹，寄托为人谦卑、自省自持的美好品德。", "平安顺遂：竹子生命力顽强，生长旺盛，寓意生活安稳平和，万事平安，福运常伴。"], "属性": {"常用颜色": "竹竿多用浅绿、青灰色，竹叶选用深绿色。精致礼服会以细金线勾勒轮廓，底色常选用米白、藏青。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间雅致衣衫多用绫、绸、暗花缎。", "适用衣物": "文人主题盛装、贵族女子雅致袄裙、礼仪雅集服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配梅兰纹样作为辅纹点缀衣缘。", "使用场景": "文人雅集、正式礼仪。"}, "常见搭配": ["梅纹", "兰纹", "菊纹", "山石纹", "云纹"]}, {"编号": 168, "类别": "植物花果", "类别内序号": 41, "纹样名称": "缠枝牡丹纹", "盛行朝代": "", "文化寓意": "缠枝牡丹纹属于缠枝花卉纹样，以连绵回旋的藤蔓作为骨架，枝蔓间点缀多朵牡丹花，花叶缠绕连绵，是传统经典装饰纹样。纹样藤蔓婉转回旋，牡丹花朵穿插其间，花叶繁而不乱，兼具柔美与华贵，属于连续图案，可无限延展铺满面料。服饰中缠枝牡丹纹常作为主纹，大面积使用于礼服、婚嫁盛装面料，应用十分广泛。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "缠枝骨架兴起，开始出现缠枝牡丹雏形，造型饱满丰腴。"}, {"period": "宋代", "desc": "缠枝牡丹纹样走向清雅写实，牡丹姿态灵动，丝绸织物大量使用。"}, {"period": "元明清", "desc": "缠枝牡丹达到鼎盛，应用遍布织锦、刺绣，婚嫁吉庆服饰最常用。"}], "寓意分条": ["富贵绵延：牡丹象征荣华富贵，缠枝藤蔓连绵不断，寓意富贵代代相传、绵延不绝。", "繁荣昌盛：花叶繁茂，象征家族兴旺，福气源源不断。", "圆满吉庆：花型饱满，代表生活和美，喜事常临。"], "属性": {"常用颜色": "牡丹多用大红、玫粉，叶片青绿色，高级织锦常以金线勾边。底色常用暗红、米白、藏青。", "常用布料": "高端面料选用妆花缎、织金锦；普通面料多用绫、暗花绸。", "适用衣物": "婚嫁盛装、寿庆礼服、贵族袄裙。", "应用部位": "衣身、裙摆大面积做主纹，也可用于领、袖镶边。", "使用场景": "婚嫁大典、寿诞吉庆、宫廷礼仪，是重大吉庆场合高频纹样。"}, "常见搭配": ["蝴蝶纹", "云纹", "卷草纹", "寿石纹"]}, {"编号": 132, "类别": "植物花果", "类别内序号": 5, "纹样名称": "缠枝纹", "盛行朝代": "", "文化寓意": "缠枝纹又称缠枝花，依靠婉转连绵的藤蔓串联起多朵花卉，属于四方连续的装饰纹样。藤蔓曲线柔和回旋，花叶交替延展，可搭配牡丹、莲花、菊花等各类花朵组  ["鱼纹", "莲蓬纹", "卷草纹", "云纹"]}, {"编号": 170, "类别": "植物花果", "类别内序号": 43, "纹样名称": "缠枝菊纹", "盛行朝代": "", "文化寓意": "缠枝菊纹属于缠枝花卉纹样，以婉转回旋的藤蔓作为骨架，枝蔓间穿插菊花花朵与叶片，是传统连续装饰纹样。藤蔓连绵缠绕，菊花错落生于枝蔓之上，构图循环往复，可无限延展铺满面料，兼具清雅高洁的文人气质。服饰中缠枝菊纹可作为主纹，多用于文人雅集、寿庆类服饰面料，宋元明清十分流行。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "菊花文人意象盛行，缠枝菊纹样成型，线条细腻清秀，丝绸织物大量使用。"}, {"period": "元代", "desc": "缠枝菊延续发展，花叶造型趋于饱满，在织锦、刺绣中广泛出现。"}, {"period": "明清", "desc": "缠枝菊持续传承，题材丰富，常作为寿庆、清雅主题面料纹样。"}], "寓意分条": ["高洁坚贞：菊花凌霜开放，象征君子坚贞不屈、淡泊高洁的品格。", "长寿安康：菊花自古关联延寿寓意，祈愿身体健康，福寿绵长。", "绵延不绝：藤蔓缠绕相连，寓意福气绵延不断，家运长久兴旺。"], "属性": {"常用颜色": "菊花多用鹅黄、白色，叶片青绿色。高端锦缎可用金线勾边，底色常选用米白、浅褐、藏青。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；普通面料多用绫、暗花绸。", "适用衣物": "文人雅集盛装、寿庆袄裙、清雅风格传统服饰。", "应用部位": "衣身、裙摆可大面积做主纹，也可用于领、袖镶边辅饰。", "使用场景": "文人雅集、寿诞吉庆。"}, "常见搭配": ["蝴蝶纹", "云纹", "卷草纹", "山石纹"]}, {"编号": 158, "类别": "植物花果", "类别内序号": 31, "纹样名称": "艾草纹", "盛行朝代": "", "文化寓意": "艾草纹以艾草茎叶为原型，叶片细碎多裂，形态质朴自然，是带有民俗驱邪寓意的传统草本纹样。纹样多采用折枝、丛生构图，枝叶朴素简练，充满乡土民俗气息。服饰中艾草纹多作为辅纹，常搭配菖蒲，多用于端午时令主题衣物，承载驱邪纳吉的民俗内涵。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "艾草的祭祀、驱邪习俗已经盛行，器物上出现艾草形象。"}, {"period": "唐代", "desc": "织物上艾草纹样成型，造型质朴简约，常和菖蒲成对出现，用于端午织物装饰。"}, {"period": "宋元明清", "desc": "艾草纹广泛流传，端午民俗相关织物持续使用，民间服饰较为多见。"}], "寓意分条": ["驱瘟避邪：古人认为艾草能祛除毒虫、疫病与邪气，祈愿远离病害，阖家平安健康。", "安康护佑：艾草是药用草本，象征守护身体安康，减少病痛，岁岁安稳。", "生机无恙：艾草野外极易生长，代表顽强生命力，寓意家宅兴旺，万事平安。"], "属性": {"常用颜色": "叶片多用深浅青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅土黄。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "端午时令主题盛装、民俗礼仪服饰。", "应用部位": "衣身、裙摆、衣缘镶边，多为辅纹，也可小面积做主纹。", "使用场景": "端午民俗活动、小型祭祀。"}, "常见搭配": ["菖蒲纹", "山石纹", "云纹"]}, {"编号": 151, "类别": "植物花果", "类别内序号": 24, "纹样名称": "芙蓉纹", "盛行朝代": "明—清", "文化寓意": "芙蓉纹以木芙蓉的花枝、花朵为原型，花瓣层叠饱满，花容艳丽温润，是传统经典秋日花卉纹样。纹样多采用折枝构图，花型丰盈大气，花叶舒展，气质雍容而不失秀美。服饰中芙蓉纹可做主纹或辅纹，多用于女子盛装，常表现秋日繁花的雅致美感。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/9qpV6vCNgL", "caption": "明·绿地芙蓉纹织金纱经面"}, {"url": "https://aka.doubaocdn.com/s/jfYZYInWvB", "caption": "清·绛色绸绣八团有水芙蓉花袍料"}, {"url": "https://aka.doubaocdn.com/s/34m2UhF0dF", "caption": "清·青缎刺绣芙蓉等花卉纹补子"}, {"url": "https://aka.doubaocdn.com/s/2gdIopIvdX", "caption": "清·大红绣花旗服"}, {"url": "https://aka.doubaocdn.com/s/ZuAmfoVVDX", "caption": "清同治·月白色绸绣芙蓉花纹女对襟夹小坎肩"}, {"url": "https://aka.doubaocdn.com/s/lAPuNcQuK5", "caption": "清·紫色芙蓉花缎女衫"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "织物上芙蓉纹样兴起，造型饱满艳丽，线条丰腴，多见于贵族女子丝质襦裙。"}, {"period": "宋代", "desc": "纹样风格转为清雅内敛，折枝芙蓉构图流行，花叶简化，素雅感更强。"}, {"period": "元明清", "desc": "芙蓉纹持续沿用，常搭配桂花、山石，宫廷与民间女子衣衫都广泛使用。"}], "寓意分条": ["荣华富贵：芙蓉又名拒霜花，“芙”谐音“富”，象征荣华显贵，生活富足安乐。", "坚韧不屈：木芙蓉秋日寒霜开放，不畏冷露，寓意品性坚韧，遇困境依旧保有美好姿态。", "富贵安康：花朵硕大丰盈，象征生活和美圆满，护佑穿戴者喜乐安稳，福运绵长。"], "属性": {"常用颜色": "花瓣多用淡红、粉白，叶片选用深绿色。精致礼服可用细金线勾勒花瓣轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子襦裙、袄裙、秋日主题喜庆盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配山石、桂花作为辅纹点缀衣缘。", "使用场景": "秋日雅集、家庭喜庆活动，可用于婚嫁辅助纹样。"}, "常见搭配": ["桂花纹", "山石纹", "蝴蝶纹", "云纹"]}, {"编号": 162, "类别": "植物花果", "类别内序号": 35, "纹样名称": "芦苇纹", "盛行朝代": "", "文化寓意": "芦苇纹以芦苇茎叶、芦花为原型，茎秆修长轻盈，顶端生蓬松芦花，是传统水景草木纹样。纹样多丛生构图，成片芦苇随风摇曳，意境简淡空灵，带有水乡诗意。服饰中芦苇纹多作为辅纹，少数可做主纹，多用于文人、水乡诗意主题衣衫。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "魏晋", "desc": "山水题材兴起，器物绘画出现芦苇形象，织物少量点缀。"}, {"period": "宋代", "desc": "芦苇纹样趋于成熟，线条简约疏淡，常在织物上搭配水禽，营造秋江景色。"}, {"period": "宋元明清", "desc": "芦苇纹持续沿用，常与雁、鹭鸟组合，秋景题材织物较为多见。"}], "寓意分条": ["淡泊自在：芦苇生于江湖水岸，随风俯仰，象征淡泊名利、自在闲适的心境。", "坚韧不屈：芦苇秆柔韧，风大而不易折断，寓意外表柔和，内里坚韧。", "秋安和顺：芦花秋日盛放，寓意岁月安稳，世事平和，岁岁无忧。"], "属性": {"常用颜色": "茎叶为青绿色，芦花多用米白、浅灰。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "文人雅集盛装、素雅襦裙、水乡秋景主题服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配水鸟作为辅纹点缀衣缘。", "使用场景": "文人雅集、家庭小型吉庆。"}, "常见搭配": ["雁纹", "鹭鸶纹", "水波纹", "山石纹"]}, {"编号": 161, "类别": "植物花果", "类别内序号": 34, "纹样名称": "芭蕉纹", "盛行朝代": "", "文化寓意": "芭蕉纹以芭蕉的宽大长卵形叶片为原型，叶片舒展阔大，叶脉清晰，是传统古典园林题材植物纹样。纹样多采用折枝、丛株构图，大叶舒展洒脱，充满清雅闲适的庭院意境。服饰中芭蕉纹可做主纹也可作辅纹，多用于文人雅致衣衫，常表现庭院、雨景诗意画面。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "绘画、壁画中多见芭蕉形象，织物纹样开始出现芭蕉雏形。"}, {"period": "宋代", "desc": "芭蕉纹样造型简练，大叶特征突出，在文人相关织物中逐渐流行。"}, {"period": "宋元明清", "desc": "芭蕉纹广为流传，常搭配山石、竹、兰，是文人画题材常用纹样。"}], "寓意分条": ["闲适安然：芭蕉常生于庭院，象征悠然自在，远离烦扰，生活清净安逸。", "常青坚韧：芭蕉四季常青，叶片顽强舒展，寓意生命力旺盛，岁岁平安。", "清雅淡泊：芭蕉自带文人诗意，比喻品性淡然超脱，保有平和之心。"], "属性": {"常用颜色": "叶片多用深浅青绿色，叶脉线条颜色略深。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅青。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "文人雅集盛装、素雅襦裙、庭院诗意主题服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配山石作为辅纹点缀衣缘。", "使用场景": "文人雅集、家庭小型吉庆。"}, "常见搭配": ["竹纹", "山石纹", "兰纹", "云纹"]}, {"编号": 175, "类别": "植物花果", "类别内序号": 48, "纹样名称": "莲生贵子纹", "盛行朝代": "", "文化寓意": "莲生贵子纹是传统复合型吉祥花卉纹样，以莲花、莲蓬搭配孩童形象组合而成，也可简化只用莲蓬与莲花来表意。纹样将莲花饱满莲蓬、盛开莲花相结合，莲蓬多籽，借莲与连、子与子嗣的谐音，寓意连生贵子。服饰中莲生贵子纹可做主纹，多用于婚嫁、求子相关吉庆服饰，刺绣面料使用尤多。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "莲纹与子嗣意象结合，器物上初见莲生贵子雏形。"}, {"period": "明代", "desc": "莲生贵子纹样走向成熟，莲、莲蓬、童子组合成型，织物刺绣大量应用。"}, {"period": "清代", "desc": "该纹样广为流行，是民间婚嫁、祈愿子嗣兴旺的经典纹样。"}], "寓意分条": ["连生贵子：莲谐音连，莲蓬多籽，寓意接连诞下贵子，子嗣绵延兴旺。", "子孙贤良：莲花品性高洁，寓意后代品行端正、聪慧贤良。", "阖家兴旺：象征家族人丁繁盛，香火永续，家庭美满和顺。"], "属性": {"常用颜色": "花瓣素白、淡粉，莲蓬、荷叶青绿色，童子服饰配色丰富。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅杏。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "婚嫁主题袄裙襦裙、求子祈福类吉庆盛装。", "应用部位": "衣身、裙摆为主，做主纹散点排布，领口袖口也可使用小型纹样。", "使用场景": "婚嫁大典、家庭祈福吉庆。"}, "常见搭配": ["鸳鸯纹", "石榴多子纹", "云纹", "蝴蝶纹"]}, {"编号": 129, "类别": "植物花果", "类别内序号": 2, "纹样名称": "莲花纹", "盛行朝代": "新石器—清", "文化寓意": "莲花纹以莲花、荷叶、莲蓬为原型，是起源很早的传统服饰植物纹样。魏晋佛教传入后，莲花纹样在丝织品中广泛流行。纹样可写实描绘花朵，也可简化提炼花瓣形态。服饰里莲花既能做主纹大面积呈现，也可作为边饰点缀衣缘。僧衣、宫廷礼服、民间女子裙衫都可使用，跨越宗教与世俗，适用性极强。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/RxQQV8tSyN", "caption": "清·莲纹刺绣缎面（V&A博物馆藏）"}, {"url": "https://aka.doubaocdn.com/s/ngFM2nszq8", "caption": "明·缠枝莲暗花缎绣花枕顶"}, {"url": "https://aka.doubaocdn.com/s/LrqUXFVeN2", "caption": "清中期·杏黄色织金妆花绒缠枝莲纹夹服"}, {"url": "https://aka.doubaocdn.com/s/uVjWsFWAZd", "caption": "清乾隆·蓝色缎平金绣缠枝莲纹坐垫面"}, {"url": "https://aka.doubaocdn.com/s/hRPWaFVtef", "caption": "明永乐·织锦缠枝莲纹佛纹镜芯"}, {"url": "https://aka.doubaocdn.com/s/NueMHQzWMr", "caption": "清·石青缎地彩绣莲花团花"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "织物上仅有简单花瓣轮廓，造型抽象，还没有形成完整成熟的莲花纹样样式。"}, {"period": "魏晋南北朝", "desc": "受佛教影响，莲花大量出现在丝绸面料，花瓣尖瘦质朴，多用于披帛、僧衣。"}, {"period": "唐代", "desc": "莲花花瓣变得饱满圆润，常搭配卷草枝叶，高级锦缎广泛使用，风格华丽大气。"}, {"period": "宋代", "desc": "审美转向清雅，线条柔和简约，多为折枝造型，大量用于女子襦裙面料。"}, {"period": "元明清", "desc": "衍生出并蒂莲、莲生贵子等题材，样式丰富，宫廷民间织物均普遍使用。"}], "寓意分条": ["清净高洁：莲花出淤泥而不染，随佛教文化深入人心。僧衣使用莲花，象征心性纯净，不受俗世污染。", "子孙绵延：莲蓬内含众多莲子，“莲”谐音连。婚嫁服饰运用此纹样，祈愿家族子嗣绵延不绝。", "圣洁吉祥：莲花在佛教中为圣洁之花，世俗使用时，也寓意平安顺遂，福气常伴身旁。"], "属性": {"常用颜色": "花朵多用白色、红色，荷叶选用绿色。宫廷织物常以石青为底色，搭配五彩，金线勾边轮廓。", "常用布料": "高端面料选用缂丝、妆花锦缎；普通服饰多用绫、罗、绸、刺绣面料。", "适用衣物": "袈裟、宫廷礼服、女子襦裙、披帛。", "应用部位": "衣身、下摆为主，领缘、袖口、披领常用莲瓣纹做镶边辅纹。", "使用场景": "佛事法会、婚嫁盛装、各类礼仪吉服。"}, "常见搭配": ["卷草纹", "宝相花纹", "莲蓬纹", "童子纹", "云纹"]}, {"编号": 146, "类别": "植物花果", "类别内序号": 19, "纹样名称": "菊纹", "盛行朝代": "", "文化寓意": "菊纹以菊花花朵与枝叶为原型，花瓣细密层叠，花型雅致，是传统文人花卉纹样的代表之一。纹样可绘制繁花满枝，也可取少量花枝做简约折枝构图，风格沉静素雅。服饰当中菊纹既能作为主纹，也可充当辅纹，文人雅致服饰使用较多，内涵丰富。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "文人画风气盛行，菊纹开始大量出现在丝织品上，造型简约秀气，多用于贵族清雅衣衫。"}, {"period": "元代", "desc": "纹样延续宋代审美，线条简练柔和，折枝菊花构图流行，民间面料逐步开始使用。"}, {"period": "明清", "desc": "菊纹广为流传，常与梅兰竹搭配组成四君子纹样，宫廷与民间雅致服饰都十分常见。"}], "寓意分条": ["高洁淡泊：菊花于秋霜中绽放，不与春花争艳。衣物绣菊纹，象征穿戴者品性高洁，淡泊名利。", "长寿安康：古人视菊花为延寿之花，寿庆服饰选用菊纹，寄托身体健康、延年长久的祝愿。", "坚贞自持：秋寒时节菊花依旧盛放，代表不畏寒凉，寓意坚守本心，保持自身品格不变。"], "属性": {"常用颜色": "花瓣多用淡黄、白色，叶片选用深绿色。精致礼服会使用细金线勾勒花瓣边缘，底色常选用藏青、米黄。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间雅致衣衫多用绫、绸、暗花缎。", "适用衣物": "文人主题盛装、贵族女子清雅袄裙、雅集礼仪服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配梅兰竹作为辅纹点缀衣缘位置。", "使用场景": "文人雅集、小型正式礼仪。"}, "常见搭配": ["梅纹", "兰纹", "竹纹", "山石纹", "云纹"]}, {"编号": 157, "类别": "植物花果", "类别内序号": 30, "纹样名称": "菖蒲纹", "盛行朝代": "", "文化寓意": "菖蒲纹是以菖蒲为核心的装饰纹样。端午有“天中五瑞”之说，菖蒲、艾草、石榴花、蒜头和龙船花，可以对抗瘟疫。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "菖蒲纹在端午应景服饰中广泛使用。定陵出土明代艾虎五毒纹方补。"}], "体系组成": "菖蒲单独纹：菖蒲独立呈现。菖蒲配艾草纹：菖蒲与艾草组合。菖蒲配五毒纹：菖蒲与五毒组合。", "寓意分条": ["驱邪辟秽：菖蒲为端午节物。", "吉祥平安：菖蒲纹寓意吉祥平安。", "端午安康：菖蒲纹寓意端午安康。"], "属性": {"常用颜色": "以绿、蓝、白等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "端午应景服饰、肚兜。", "应用部位": "衣身通身纹饰、肚兜围腹部分。", "使用场合": "端午节庆。"}, "常见搭配": ["艾草纹", "五毒纹", "虎纹"], "相似纹样说明": "叶片如剑为菖蒲，羽状分裂为艾草。"}, {"编号": 155, "类别": "植物花果", "类别内序号": 28, "纹样名称": "萱草纹", "盛行朝代": "宋—清", "文化寓意": "萱草纹以萱草花叶为原型，叶片细长飘逸，花朵舒展硕大，又称忘忧草，是传统女性题材植物纹样。纹样常采用折枝构图，花叶舒展自然，气质柔和温婉，饱含温情的人文内涵。服饰里萱草纹可做主纹或辅纹，多用于女子衣衫，寄托母亲安康、忘忧喜乐的美好祝愿。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/fFzpAVdP7v", "caption": "清代湘绣蓝缎地绶带萱草纹枕套"}, {"url": "https://aka.doubaocdn.com/s/0c77KduTJf", "caption": "清代萱草纹刺绣"}, {"url": "https://aka.doubaocdn.com/s/kgiHT3vDw7", "caption": "清代黄地刺绣萱草芦雁"}, {"url": "https://aka.doubaocdn.com/s/CZdXalKONM", "caption": "萱草纹纹样"}, {"url": "https://aka.doubaocdn.com/s/yvmzO8Mgge", "caption": "浅黄色缎绣芦雁萱草纹袷便袍"}, {"url": "https://aka.doubaocdn.com/s/l8mMYYXbav", "caption": "清代红绸地彩绣枝花对襟女褂"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "织物上萱草纹样出现，造型柔和舒展，少量点缀在贵族女子丝质衣衫面料。"}, {"period": "宋代", "desc": "萱草纹逐步流行，线条简约秀气，折枝样式多见，常用来装饰女子襦裙。"}, {"period": "元明清", "desc": "萱草纹广泛使用，作为母亲、忘忧的象征，大量出现在女子日常与喜庆盛装。"}], "寓意分条": ["忘忧消愁：古人认为萱草可使人忘却烦忧。女子衣衫使用萱草纹，祈愿远离愁苦，常保喜乐安宁。", "感念亲恩：萱草又被称为母亲花，代表对母亲的敬爱。穿戴此纹样，祝愿母亲身体康健平安。", "生机和顺：萱草生命力旺盛，花叶蓬勃生长，寓意家庭和睦顺遂，日子安稳无忧。"], "属性": {"常用颜色": "花朵多用橘黄、浅橙，叶片选用青绿色。精致礼服会使用细金线勾勒轮廓，底色常选用米白、浅杏色。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间女子衣衫多用绫、绸、暗花缎。", "适用衣物": "女子袄裙、襦裙、温婉风格的喜庆盛装。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配其他花草作为辅纹点缀衣缘。", "使用场景": "女子日常盛装、家庭吉庆场合。"}, "常见搭配": ["山石纹", "兰纹", "云纹", "蝴蝶纹"]}, {"编号": 177, "类别": "植物花果", "类别内序号": 50, "纹样名称": "葡萄多子纹", "盛行朝代": "", "文化寓意": "葡萄多子纹是以葡萄为核心的装饰纹样。葡萄果实成串，籽粒繁多，象征多子多福。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉魏", "desc": "葡萄纹经丝绸之路传入中国。"}, {"period": "唐代", "desc": "葡萄纹在织物中广泛使用。"}, {"period": "明清", "desc": "明黄色绸绣葡萄夹氅衣为典型实例。"}], "体系组成": "葡萄单独纹：葡萄独立呈现。葡萄配松鼠纹：葡萄与松鼠组合，寓意多子多福。葡萄配藤蔓纹：葡萄与藤蔓组合。", "寓意分条": ["多子多福：葡萄果实成串，籽粒繁多。", "子孙昌盛：葡萄多子纹寓意子孙昌盛。"], "属性": {"常用颜色": "以紫、绿、蓝等色为主。", "常用布料": "缎、绸、刺绣、绫。", "适用衣物": "袍服、氅衣、夹裤。", "应用部位": "衣身通身纹饰。", "使用场合": "婚嫁吉庆。"}, "常见搭配": ["松鼠纹", "藤蔓纹", "花卉纹", "蝴蝶纹"], "相似纹样说明": "成串葡萄为葡萄多子纹，绽开石榴为榴开百子纹。"}, {"编号": 135, "类别": "植物花果", "类别内序号": 8, "纹样名称": "葡萄纹", "盛行朝代": "唐", "文化寓意": "葡萄纹以葡萄果串与缠绕藤蔓为原型，自汉代通过丝绸之路传入中原，在唐代丝织品上盛行。纹样刻画颗粒饱满的果串，搭配交错缠绕的枝蔓，构图充满生机与层次感。服饰中葡萄纹可作为主纹使用，既可以独立折枝，也能做成缠枝样式，多用于贵族盛装面料。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/lJZSex4tl4", "caption": "清·缎地彩绣葡萄纹罗汉衣"}, {"url": "https://aka.doubaocdn.com/s/o8pH8NRTFa", "caption": "清代盘锦绣葡萄纹绣片"}, {"url": "https://aka.doubaocdn.com/s/0qKTL0NTV9", "caption": "清光绪·明黄色绸绣葡萄夹氅衣"}, {"url": "https://aka.doubaocdn.com/s/1AHGNm7O4b", "caption": "清末·宝蓝大提花葡萄纹琵琶襟坎肩"}, {"url": "https://aka.doubaocdn.com/s/jcJThB0Ryw", "caption": "清光绪·明黄色绸绣紫葡萄纹夹氅衣局部"}, {"url": "https://aka.doubaocdn.com/s/gsps3VZ2ua", "caption": "清光绪·明黄色缎绣葡萄蝴蝶纹衬衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "纹样刚刚传入国内，造型抽象简单，服饰织物上出现少量雏形。"}, {"period": "唐代", "desc": "葡萄纹达到流行高峰，果串饱满立体，藤蔓婉转，大量织入高级锦袍面料。"}, {"period": "宋元", "desc": "纹样造型趋于简约写实，体量缩小，多作为装饰纹样点缀在衣衫之上。"}, {"period": "明清", "desc": "大多作为吉祥辅纹，很少单独做主纹，常和其他花果纹样组合搭配。"}], "寓意分条": ["多子多福：葡萄一串结有众多果实，古人以此象征子孙繁盛，家族人丁兴旺。婚嫁服饰选用葡萄纹，祈愿新人多子多孙。", "富足丰收：一串串果实饱满充盈，代表物产丰饶，寄托衣食无忧、生活富足的美好期盼。", "生生绵延：藤蔓不断延伸生长，寓意家族世代延续，福运代代相传永不中断。"], "属性": {"常用颜色": "果实多用紫色，枝叶搭配绿色；古代织物也常用红色表现果穗。宫廷织物常以石青做底色，搭配五彩配色，辅以金线勾边。", "常用布料": "高端面料选用唐锦、妆花缎；普通贵族服饰多用绫、罗、刺绣缎面。", "适用衣物": "贵族锦袍、女子裙衫、喜庆盛装。", "应用部位": "衣身、下摆为主，可做主纹，也可作为辅纹点缀边角区域。", "使用场景": "贵族正式盛装、婚嫁喜庆服饰。"}, "常见搭配": ["卷草纹", "石榴纹", "云纹"]}, {"编号": 137, "类别": "植物花果", "类别内序号": 10, "纹样名称": "葫芦纹", "盛行朝代": "明—清", "文化寓意": "葫芦纹以葫芦果实与枝蔓为原型，果实造型独特，呈上小下大的双腹形态，是流传久远的民俗类植物纹样。纹样既可单独绘制果实，也可搭配连绵藤蔓，构图灵动自然，民俗吉祥内涵浓厚。服饰中葫芦纹主辅纹都可胜任，民间织物使用广泛，多用于喜庆、祝寿类的盛装面料。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/RorKyrFfUx", "caption": "清·刺绣葫芦纹女式夏季长袍"}, {"url": "https://aka.doubaocdn.com/s/8FVbHHsTYj", "caption": "清·刺绣葫芦纹女式夏季长袍局部"}, {"url": "https://aka.doubaocdn.com/s/uCEHuN76UT", "caption": "清·刺绣葫芦纹女式夏季长袍局部"}, {"url": "https://aka.doubaocdn.com/s/kFdpaisUEQ", "caption": "清同治·黄色葫芦双喜纹织金绸绵衣"}, {"url": "https://aka.doubaocdn.com/s/aQcKquShRt", "caption": "19世纪晚期·红地葫芦纹单氅衣"}, {"url": "https://aka.doubaocdn.com/s/XykJ4zwb6U", "caption": "清代·大吉葫芦童子太平云锦刺绣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "汉代", "desc": "织物上出现葫芦纹样雏形，造型简单抽象，使用数量不多。"}, {"period": "宋元", "desc": "服饰面料葫芦纹逐步增多，线条简洁，多为折枝单果样式。"}, {"period": "明清", "desc": "葫芦纹大范围流行，缠枝葫芦题材盛行，谐音“福禄”的寓意广为传播。"}], "寓意分条": ["福禄吉祥：葫芦谐音“福禄”，是最核心寓意。寿庆服饰使用葫芦纹，祈愿福气与禄运双双降临。", "子孙绵延：藤蔓不断蔓延生长，代表家族代代接续，人丁兴旺，血脉绵延不绝。", "平安护佑：古人认为葫芦有纳吉辟邪之意，穿戴带有葫芦纹样的衣物，祈求平安无灾。"], "属性": {"常用颜色": "果实多用黄绿配色，藤蔓叶片为深绿色。高级织物可用金线勾勒轮廓，底色常选用藏青、暗红。", "常用布料": "高端面料选用妆花缎、刺绣缎；民间多用绸、绫、普通缎面。", "适用衣物": "民间袄裙、寿庆礼服、吉祥喜庆类衣衫。", "应用部位": "衣身、下摆、衣缘镶边，可做主纹，也能作为辅纹搭配其他吉祥花果。", "使用场景": "祝寿仪式、民间婚嫁、日常吉祥盛装。"}, "常见搭配": ["蝙蝠纹", "寿桃纹", "云纹"]}, {"编号": 164, "类别": "植物花果", "类别内序号": 37, "纹样名称": "麦穗纹", "盛行朝代": "", "文化寓意": "麦穗纹以成熟麦秆、麦穗为原型，穗粒紧实排列，麦芒挺立，是代表丰收的传统谷物纹样。纹样多为折枝、丛生构图，麦穗饱满厚重，带着质朴的田园气息。服饰中麦穗纹可做主纹也可作辅纹，多用于五谷丰收主题织物，象征富足吉祥。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "先秦", "desc": "谷物崇拜流行，器物上出现麦穗雏形，织物少量点缀禾穗形象。"}, {"period": "唐代", "desc": "麦穗纹样刻画写实，麦芒、颗粒清晰，在织物装饰中逐步增多。"}, {"period": "宋元明清", "desc": "麦穗纹持续传承，常搭配稻穗等谷物，作为五谷丰登题材纹样广泛使用。"}], "寓意分条": ["丰收富足：麦穗颗粒饱满，象征庄稼丰收，仓廪充盈，衣食丰足。", "岁岁安康：麦谐音脉，寓意血脉绵延，家族兴旺，日子安稳无忧。", "勤勉有成：麦子春种秋收，代表耕耘必有收获，劳有所得，万事顺遂。"], "属性": {"常用颜色": "成熟麦穗以金黄、土黄色为主，麦叶选用青绿色。精致礼服可用细金线勾勒轮廓，底色常选用米白、浅棕。", "常用布料": "高端面料选用妆花缎、刺绣锦缎；民间衣衫多用绫、绸、暗花缎。", "适用衣物": "丰收主题盛装、民俗祭祀服饰、田园题材传统服饰。", "应用部位": "衣身、裙摆为主，可做主纹，也可搭配稻穗作为辅纹点缀衣缘。", "使用场景": "丰收祭祀、民俗吉庆活动。"}, "常见搭配": ["稻穗纹", "五谷纹", "云纹", "山石纹"]}, {"编号": 283, "类别": "组合吉祥", "类别内序号": 15, "纹样名称": "一路连科纹", "盛行朝代": "明—清", "文化寓意": "一路连科纹是以鹭鸟和莲花组合为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。最流行的纹饰叫“一路连科”，这是一种鹭纹加莲纹（有时还加上芦苇纹）的组合纹样，取“鹭”与“路”、“莲”与“连”的谐音，寓意科场得意，金榜题名，仕途顺利。“一路连科”的纹样一般是由鹭鸟（路/禄）和莲花（连）组成，有的则用芦苇代替或兼而有之。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/mfqaw1C9nk", "caption": "清代粤绣一鹭莲科"}, {"url": "https://aka.doubaocdn.com/s/OtDUFHnkVl", "caption": "清代红缎地一路连科纹刺绣遮眉勒"}, {"url": "https://aka.doubaocdn.com/s/1U1vTWTmS8", "caption": "清代一路连科绣荷包"}, {"url": "https://aka.doubaocdn.com/s/4sEskRHWUD", "caption": "清代文官六品鹭鸶纹补子"}, {"url": "https://aka.doubaocdn.com/s/WXxTYQmBpk", "caption": "清代文官六品鹭鸶纹缂丝补子"}, {"url": "https://aka.doubaocdn.com/s/NGdXcWn6Bs", "caption": "清代一路连科图案"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋辽", "desc": "一路连科纹开始出现在百姓生活器物上。"}, {"period": "元代", "desc": "至元代广泛流传。"}, {"period": "明清", "desc": "一路连科纹广泛流传，成为玉器、瓷器、绘画、服饰等生活与艺术的流行题材。清代文官六品补子沿用鹭鸶纹，并发展出“鹭鸶莲纹”、“荷花鹭鸶纹”等变体，寓意“一路连科”。"}], "寓意分条": ["科举顺利：一路连科寓意科举顺利、仕途通达。", "金榜题名：取“鹭”与“路”、“莲”与“连”的谐音，寓意科场得意，金榜题名。", "官运亨通：如果是已经做官的人，也可以用“一路连科”祝他官运亨通。"], "属性": {"常用颜色": "以蓝、绿、白等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "补子、荷包、凉登盖。", "应用部位": "补子主体、荷包袋面、凉登盖主体。", "使用场景": "科举吉庆、日常穿着。"}, "常见搭配": ["芦苇纹", "莲花纹", "芙蓉纹"]}, {"编号": 281, "类别": "组合吉祥", "类别内序号": 13, "纹样名称": "三阳开泰纹", "盛行朝代": "明—清", "文化寓意": "三阳开泰纹是以三只羊为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。三阳开泰本为易学用的吉祥话，后衍生为中国独有的一类传统纹样。正月为泰卦，三阳生于下，象征冬去春来，阴消阳长，万事吉祥。因此，“三阳开泰”被用来称颂岁首或用作吉祥之辞。《宋史·乐志》中便有“三阳交泰”。民间传说中把“三阳”附会成青阳、红阳和白阳，分别代表过去、现在和将来。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/EXZlgA8125", "caption": "清三羊开泰缂丝绣片"}, {"url": "https://aka.doubaocdn.com/s/GO0MpbYjFc", "caption": "清白缎地广绣三阳开泰挂屏"}, {"url": "https://aka.doubaocdn.com/s/nOFitEUop4", "caption": "清代刺绣三阳开泰"}, {"url": "https://aka.doubaocdn.com/s/vKq0WaZK86", "caption": "清代刺绣三阳开泰"}, {"url": "https://aka.doubaocdn.com/s/j8sdCOyDyV", "caption": "明红缎地绣龙纹三羊开泰帐料"}, {"url": "https://aka.doubaocdn.com/s/vW6OEiwUBE", "caption": "龙凤三阳开泰织锦"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐代", "desc": "日本正仓院藏有唐代三羊开泰纹样织布，显示此图案于唐代已传播至东亚汉字文化圈。"}, {"period": "明代", "desc": "三羊开泰图在明代绘画中已有表现。大都会艺术博物馆藏明代《三阳开泰图》中，三只山羊在一起，这一母题重复三次，因此引出“三阳开泰”的短语，这是取自《易经》的新年祝福。"}, {"period": "明清", "desc": "三阳开泰是明、清两代瓷器纹饰之一。画面主要绘三只羊，“羊”和“阳”同音，“三羊图”寓美好吉祥的愿望。"}], "寓意分条": ["冬去春来：正月为泰卦，三阳生于下，象征冬去春来，阴消阳长，万事吉祥。", "岁首吉祥：三阳开泰被用来称颂岁首或用作吉祥之辞。", "万象更新：呈现岁首迎新、万象更新的寓意。"], "属性": {"常用颜色": "以青、绿、白等色为主。", "常用布料": "缎、绸、织锦。", "适用衣物": "袍服、织物挂屏。", "应用部位": "衣身通身纹饰、织物主体。", "使用场景": "岁首吉庆、冬至节庆。"}, "常见搭配": ["松竹梅纹", "喜鹊纹", "梅花纹"]}, {"编号": 270, "类别": "组合吉祥", "类别内序号": 2, "纹样名称": "丹凤朝阳纹", "盛行朝代": "明—清", "文化寓意": "丹凤朝阳纹是以凤凰面向太阳为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。丹凤朝阳寓意天下太平的吉兆，也比喻高才遇良机、福星高照，将要飞黄腾达。在古人的艺术创作中，凤凰从最初的鸟形纹饰到后来的“百鸟朝凤”、“龙凤呈祥”、“丹凤朝阳”等多种主题，并在发展过程中进一步与动物图案、花卉图案相结合，运用到不同品类的艺术作品中。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/HNQhQ855RM", "caption": "清晚期凤穿牡丹纹衬衣"}, {"url": "https://aka.doubaocdn.com/s/62TK4eF1zs", "caption": "清代凤穿牡丹纹"}, {"url": "https://aka.doubaocdn.com/s/vyXEH5WwrK", "caption": "清代锦地打籽绣凤穿牡丹"}, {"url": "https://aka.doubaocdn.com/s/RDLjkWfxwA", "caption": "清石青色缎绣八团凤穿牡丹纹云肩汉女袄"}, {"url": "https://aka.doubaocdn.com/s/wWIWC3UHU2", "caption": "清代刺绣凤穿牡丹"}, {"url": "https://aka.doubaocdn.com/s/mUXFO4EUsu", "caption": "红地绣凤穿牡丹纹马面"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "唐宋", "desc": "凤凰纹样与牡丹、梧桐、祥云等结合的图案大量出现，丹凤朝阳为其中一种。"}, {"period": "明清", "desc": "丹凤朝阳纹在戏曲服装和吉庆服饰中广泛使用。浅黄缎彩绣丹凤朝阳女帔为典型实例，色彩象征皇妃地位和身份尊贵。"}, {"period": "近现代", "desc": "丹凤朝阳纹在传统服饰和工艺品中延续使用。"}], "寓意分条": ["天下太平：丹凤朝阳寓意天下太平的吉兆。", "飞黄腾达：比喻高才遇良机，福星高照，将要飞黄腾达。", "身份尊贵：浅黄缎彩绣丹凤朝阳女帔色彩象征皇妃地位和身份尊贵。"], "属性": {"常用颜色": "以浅黄、红、金等色为主。浅黄缎彩绣丹凤朝阳女帔以浅黄色为地，彩绣丹凤、太阳、祥云等纹样，色彩明快。", "常用布料": "缎、绸、刺绣。浅黄缎彩绣丹凤朝阳女帔以缎为地，采用平针、套针、钉线等刺绣针法，绣工精细。", "适用衣物": "女帔、袍服、吉服。", "应用部位": "衣身通身纹饰、团花单元。多用于女帔的前胸、后背，形成团花或通身布局。", "使用场景": "宫廷庆典、吉庆典礼、戏曲演出。"}, "常见搭配": ["牡丹纹", "祥云纹", "梧桐纹"]}, {"编号": 280, "类别": "组合吉祥", "类别内序号": 12, "纹样名称": "二甲传胪纹", "盛行朝代": "明—清", "文化寓意": "二甲传胪纹是以两只螃蟹和芦苇组合为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。其图案主绘两只螃蟹配以芦苇，谐音“二甲传胪”，寓意科举高中、金榜题名。传胪为唱名之意，在科举制度中，唱名就是殿试以后由皇帝宣布登第进士名次的典礼。明代，传胪成为人才的代称。清代，传胪专指殿试二甲第一名。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/dr9imN1gwR", "caption": "清纳纱绣二甲传胪挽袖"}, {"url": "https://aka.doubaocdn.com/s/DHUfhznl28", "caption": "清代蓝地织锦蟒袍"}, {"url": "https://aka.doubaocdn.com/s/7diPynqtN5", "caption": "明清织绣服饰"}, {"url": "https://aka.doubaocdn.com/s/yRc3UUUFZj", "caption": "清代官员织锦刺绣蟒袍"}, {"url": "https://aka.doubaocdn.com/s/HwSNvTtI03", "caption": "明制二甲传胪织银缎补服"}, {"url": "https://aka.doubaocdn.com/s/HG6YIUOSFc", "caption": "明制二甲传胪妆花短袄"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "宋代", "desc": "唱名之制始于宋代。"}, {"period": "明代", "desc": "殿试的第二甲、第三甲的第一名都称为“传胪”。"}, {"period": "清代", "desc": "传胪专指第二甲的第一名，仅次于一甲的状元、榜眼和探花，位列殿试的第四名。"}], "寓意分条": ["科举高中：二甲传胪寓意科举高中、金榜题名。", "金榜题名：含有金榜题名的美好祝愿。", "仕途顺利：祝愿科举考生门门过、场场过。"], "属性": {"常用颜色": "以青、绿、褐等色为主。", "常用布料": "缎、绸、刺绣。", "适用衣物": "荷包、挽袖、围腰。", "应用部位": "荷包袋面、挽袖主体、围腰主体。", "使用场景": "科举吉庆、日常穿着。"}, "常见搭配": ["芦苇纹", "花卉纹", "水波纹"]}, {"编号": 277, "类别": "组合吉祥", "类别内序号": 9, "纹样名称": "五福捧寿纹", "盛行朝代": "明—清", "文化寓意": "五福捧寿纹是以五只蝙蝠环绕寿字或寿桃为核心构图的装饰纹样，属于组合吉祥纹样中的祥禽瑞兽类。蝙蝠的“蝠”与“幸福”、“福气”的“福”字谐音，五福捧寿则寓意“多福多寿”、“五福临门”。五福指“一曰福，二曰寿，三曰康宁，四曰攸好德，五曰考终命”的五种福气。这种形式的图案在明末清初特别流行，不仅在服装上使用，在其他的器皿及建筑装饰上也大量反映。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/YosVVbcHbF", "caption": "清代石青色五福捧寿纹提花缎长袖马褂"}, {"url": "https://aka.doubaocdn.com/s/HynPFudxGb", "caption": "清代老刺绣官服编锦绣老绣片五福捧寿"}, {"url": "https://aka.doubaocdn.com/s/eU43wsukTj", "caption": "清代老刺绣官服编锦绣老绣片五福捧寿"}, {"url": "https://aka.doubaocdn.com/s/UepCzVotUh", "caption": "清代老刺绣官服编锦绣老绣片五福捧寿"}, {"url": "https://aka.doubaocdn.com/s/VYwjVcMHtf", "caption": "清代老刺绣官服编锦绣老绣片五福捧寿"}, {"url": "https://aka.doubaocdn.com/s/vsJ2RqRSyv", "caption": "浅蓝色地五福捧寿纹织锦衬衣"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明末清初", "desc": "五福捧寿纹特别流行，袍衫上的纹样多寓有吉祥之意，比较常见的团云和蝙蝠中间嵌一团型“寿”字，意为“五蝠捧寿”。"}, {"period": "清代", "desc": "五福捧寿纹广泛应用于吉服袍。此件吉服袍在绿色绸地上绣制八团五蝠捧寿勾莲地景纹，从纹样装饰寓意上可知，此袍应为圣寿、万寿和千秋节时使用，用于祝寿。"}], "寓意分条": ["多福多寿：五福捧寿寓意“多福多寿”、“五福临门”。", "五福临门：五福指福、寿、康宁、攸好德、考终命五种福气。", "江山万代：万字纹与山石组合而成“江山万代”纹饰。"], "属性": {"常用颜色": "以绿、蓝、红、金等色为主。", "常用布料": "绸、缎、漳绒。", "适用衣物": "吉服袍、吉服褂、大襟袍。", "应用部位": "衣身团花单元、通身纹饰。", "使用场景": "圣寿、万寿、千秋节祝寿。"}, "常见搭配": ["寿字纹", "万字纹", "勾莲纹", "祥云纹"]}, {"编号": 302, "类别": "组合吉祥", "类别内序号": 34, "纹样名称": "五谷丰登纹", "盛行朝代": "明清（盛行于清）", "文化寓意": "五谷丰登纹是以谷物和灯笼组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。“五谷丰登”指年成好，粮食丰收。灯笼纹常与谷穗、蜜蜂组合，“蜂”谐“丰”，“灯”谐“登”，寓意五谷丰登。“天下乐”被列为明代十样锦纹样之一，寓意五谷丰登、风调雨顺、张灯结彩、普天欢庆。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/VfGpuVU0Aq", "caption": "清同治蓝色缎绣五谷丰登挂饰"}, {"url": "https://aka.doubaocdn.com/s/bQ3kU9frLH", "caption": "清同治蓝色缎绣五谷丰登挂饰"}, {"url": "https://aka.doubaocdn.com/s/nRoBTGyAwM", "caption": "清代丝织锦五谷丰登龙纹挂幅"}, {"url": "https://aka.doubaocdn.com/s/JfubahB8QS", "caption": "清代黄绸彩绣万福双喜五谷丰登彩悦"}, {"url": "https://aka.doubaocdn.com/s/1RoWKoNg6b", "caption": "清代宋锦五谷丰登福寿龙纹图"}, {"url": "https://aka.doubaocdn.com/s/kK11EOV5zj", "caption": "五谷丰登吉祥图案"}], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明清", "desc": "五谷丰登纹在服饰中广泛使用。灯笼纹有了长足发展，延展出腊梅花朵形、荷塘莲花形、银锭元宝形等多种造型，广泛应用于各种纺织品、服饰和配饰中。"}], "寓意分条": ["五谷丰登：灯笼纹常与谷穗、蜜蜂组合，“灯”谐音“登”，寓意五谷丰登。", "风调雨顺：五谷丰登纹寓意风调雨顺、年成好。", "天下喜乐：“天下乐”寓意五谷丰登、风调雨顺、张灯结彩、普天欢庆。"], "属性": {"常用颜色": "以红、绿、蓝等色为主。", "常用布料": "缎、绸、织锦。", "适用衣物": "吉服袍、袍服。", "应用部位": "衣身通身纹饰、团花单元。", "使用场景": "元宵节庆、吉庆典礼。"}, "常见搭配": ["灯笼纹", "蜜蜂纹", "谷穗纹"]}, {"编号": 295, "类别": "组合吉祥", "类别内序号": 27, "纹样名称": "八仙庆寿纹", "盛行朝代": "", "文化寓意": "八仙庆寿纹是以道教八仙人物庆寿场景为核心构图的装饰纹样，属于组合吉祥纹样中的神仙人物类。织物八仙纹是清代盛行的吉祥纹样之一，表达了人们对长寿、福乐安康的祈求与希望。八仙题材似乎到清代才出现在丝绸图案中。除八仙祝寿图一般以刺绣、缠丝或挂毯的技法制成、而且画面上为人物形象之外，大量的普通织物上采用的八仙是以暗八仙的形象出现的。", "服饰应用部位": "", "实物文物图": [], "线稿图": [], "复原设计图": [], "朝代脉络": [{"period": "明代", "desc": "明代尤其是嘉靖年间，因皇帝崇信道教，八仙祝寿题材的纹饰极为流行，广泛应用于官窑与民窑瓷器，并扩展至丝织品、建筑装饰等领域。"}, {"period": "清代", "desc": "八仙庆寿纹成为清代盛行的吉祥纹样之一。清宫升平署八仙衣为纯手工缝制，共八件，是清朝皇宫内唱庆寿戏时的专用戏服。"}], "寓意分条": ["长寿福乐：八仙庆寿纹表达了人们对长寿、福乐安康的祈求与希望。", "祈福消灾：暗八仙纹不仅具有祈福消灾的宗教作用，更寓意着健康长寿。", "一品高官：八仙中红袍者身前有仙鹤补，绿袍者胸前为麒麟补，同来庆寿。"], "属性": {"常用颜色": "以红、绿、蓝、金等色为主。", "常用布料": "缂丝、刺绣、缎。", "适用衣物": "戏服、吉服袍、寿幛。", "应用部位": "衣身通身纹饰、寿幛幛眉。", "使用场景": "寿诞吉庆、宫廷庆典、戏曲演出。"}, "常见搭配": ["暗八仙纹", "福禄寿三星纹", "云鹤纹", "祥云纹"]}, {"编号": 293, "类别": "组合吉祥", "类别内序号": 25, "纹样名称": "兰桂齐芳纹", "盛行朝代": "明清（盛行于清）", "文化寓意": "兰桂齐芳纹是以兰花和桂花组合为核心构图的装饰纹样，属于组合吉祥纹样中的植物花卉类。兰花、桂花组合，因二者皆有异香，常以比喻美才盛德或君子贤人；或以“兰桂齐芳”比喻子孙兴旺。人们也常常将兰花纹样与桂花纹样组合使用——“兰桂齐芳”。女子服饰中的兰花纹形态多变，这是因为兰花众苗拔出多杆箭开花，皆出自同根，蕴含着祝愿夫妻同心的美好寓意。", "服饰应用部位": "", "实物文物图": [{"url": "https://aka.doubaocdn.com/s/vUGTx4efz3", "caption": "清白缎彩绣兰花图挽袖"}, {"url": "https://aka.doubaocdn.com/s/3rBENMaXqo", "caption": "清代整枝兰花女夹袄"}, {"url": "https://aka.doubaocdn.com/s/sxzfpHT3if", "caption": "蓝色缠枝四季
