# ===== 虚拟试穿 sidecar（tryon_service）限流区 =====
# 本文件被 include 进 http{} 上下文，所以 limit_req_zone 只能写在这里（server{} 之外）。
limit_req_zone $binary_remote_addr zone=tryon:10m rate=20r/m;

server {
    listen 80;
    server_name 47.93.14.11;
    root /www/wwwroot/yisu/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    # ===== 虚拟试穿 sidecar（127.0.0.1:8000）=====
    # 试穿接口：CPU 推理一次吃满 1–2 核，必须按 IP 限流，否则几个人同时点「一键试穿」就能把整机拖死
    location /api/v1/ {
        limit_req zone=tryon burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HD 画质 + 大请求体，比平台默认的 120s 再宽一点
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 试穿素材图 / 示例图：由 sidecar 挂载，只读，可以长缓存
    location /tryon-assets/ {
        proxy_pass http://127.0.0.1:8000/tryon-assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 结果图不在这里：systemd unit 把 YISU_RESULTS_ROOT 指到 backend/uploads/tryon，
    # 直接复用下面既有的 /uploads/ 规则，生产不必新增 location。
    # 若让 sidecar 自己挂结果图（本机默认形态），再放开：
    # location /tryon-results/ { proxy_pass http://127.0.0.1:8000/tryon-results/; }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 上传图片静态文件
    location /uploads/ {
        alias /www/wwwroot/yisu/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
