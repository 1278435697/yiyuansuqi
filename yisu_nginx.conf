# ⚠ 本文件是线上 /www/server/panel/vhost/nginx/yisu.conf 的「实况镜像」，由 scripts/cloud_sync_nginx.py 回拉生成。
# 不要把它当模板推回服务器：服务器上那份还包含本仓从未写过的 location（如 /museum/api/），
# 部署脚本 cloud_deploy_tryon.py 的 nginx 阶段用的是「备份 + 锚点插入」，从不整体覆盖。
# 改完线上记得重跑本脚本，否则这份参照就会继续漂移。
server {
    listen 80;
    server_name 47.93.14.11;
    root /www/wwwroot/yisu/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    # API 反向代理到后端
    # ===== 虚拟试穿 sidecar（tryon_service，127.0.0.1:8010）=====
    # 前缀比下面的 /api/ 更长，nginx 取最长匹配，所以平台接口不受影响。
    # CPU 推理一次吃满 1–2 核，必须按 IP 限流，否则几个人同时点「一键试穿」就能把整机拖死。
    # 出箱图片：Aidge 这类云端试衣只认公网图片 URL，我们本机的一次性短时效图由厂商服务器
    # 主动来取。若它落进下面 /api/v1/ 那条 location，会吃 tryon 区的 20r/m —— 那个限流按
    # $binary_remote_addr 分桶，此处的 remote_addr 是厂商出口 IP（量不可控），被 503 掉就是
    # 「URL 给了但厂商没取到」，白烧一张额度还查不出来。本前缀更长，nginx 取最长匹配先命中。
    location /api/v1/outbox/ {
        limit_req zone=tryon_outbox burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010/api/v1/outbox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 读后即删的一次性令牌，任何中间层都不该缓存
        add_header Cache-Control "no-store";
        expires -1;
    }

    location /api/v1/ {
        limit_req zone=tryon burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HD 画质 + 大请求体 + 2 核机器排队，比平台的 120s 再宽一点
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 素材图 / 示例图由 sidecar 自己挂载（只暴露 garments 与 samples 两个目录），可长缓存
    location /tryon-assets/ {
        proxy_pass http://127.0.0.1:8010/tryon-assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 上传图片静态文件
    location /uploads/ {
        alias /www/wwwroot/yisu/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 博物馆 API 反向代理（独立服务于 8000 端口）
    location /museum/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 博物馆子路径：补全尾斜杠，保证相对资源路径解析正确
    location = /museum {
        return 301 /museum/$is_args$args;
    }

    # 博物馆入口 index.html 不缓存：旧 index.html 会引用已被替换的哈希资源，导致仍显示旧版本
    location = /museum/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files /museum/index.html =404;
    }

    location = /museum/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 博物馆子应用所有子路径（/museum/tryon 等）统一落到子应用入口
    location /museum/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files /museum/index.html =404;
    }

    # 博物馆子应用静态资源：内容变更时文件名不变（产物直改），必须协商缓存，避免旧版本残留
    location /museum/assets/ {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # index.html 不缓存，避免升级后仍加载旧 JS
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
